.pf-overview-tip{position:absolute;transform:translate(-50%,-112%);background:var(--carbon);color:#fff;padding:8px 11px;border-radius:12px;box-shadow:var(--shadow-lg);pointer-events:none;z-index:3;display:flex;flex-direction:column;gap:4px;min-width:150px;}
.pf-overview-tip-month{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.58);letter-spacing:.03em;text-transform:uppercase;}
.pf-overview-tip-row{display:flex;align-items:center;gap:7px;font-size:12.5px;white-space:nowrap;}
.pf-overview-tip-dot{width:8px;height:8px;border-radius:999px;flex-shrink:0;}
.pf-overview-tip-lbl{color:rgba(255,255,255,.72);font-weight:600;}
.pf-overview-tip-val{margin-left:auto;font-weight:700;letter-spacing:-.01em;}
.pf-overview-tip-arrow{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%) rotate(45deg);width:8px;height:8px;background:var(--carbon);border-radius:1px;}
/* Variação percentual */
.pf-overview-foot{margin-top:12px;}
.pf-overview-var{font-size:34px;font-weight:800;letter-spacing:-.035em;line-height:1;}
.pf-overview-var.up{color:var(--green);}
.pf-overview-var.down{color:var(--red);}
.pf-overview-var.neutral{color:var(--text-muted);font-weight:700;}
.pf-overview-var-cap{font-size:12.5px;color:var(--text-muted);margin-top:7px;max-width:34ch;line-height:1.4;}
.pf-overview-legend{display:flex;align-items:center;gap:16px;flex-shrink:0;}
.pf-overview-legend span{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--text-secondary);}
.pf-overview-legend i{width:9px;height:9px;border-radius:3px;display:inline-block;flex-shrink:0;}
.pf-overview-sum-hd{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);}
.pf-overview-sum-lbl{font-size:12px;font-weight:600;color:var(--text-secondary);margin-top:14px;}
.pf-overview-sum-val{font-size:34px;font-weight:800;letter-spacing:-.035em;line-height:1.1;color:var(--text-primary);margin-top:5px;word-break:break-word;}
.pf-overview-sum-cents{color:var(--text-muted);font-weight:700;}
.pf-overview-badge{display:inline-flex;align-items:center;gap:7px;margin-top:11px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;background:var(--ink-100);color:var(--text-secondary);align-self:flex-start;}
.pf-overview-badge.up{background:var(--green-light);color:var(--green-dim);}
.pf-overview-badge.down{background:var(--red-light);color:var(--red-dim);}
.pf-overview-badge .sep{font-weight:500;opacity:.7;}
.pf-overview-expense-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;}
.pf-overview-expense-card{background:var(--surface-2);border:1px solid var(--border);border-radius:13px;padding:13px 14px;min-width:0;}
.pf-overview-expense-ico{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:9px;}
.pf-overview-expense-ico svg{width:15px;height:15px;}
.pf-overview-expense-ico.b{background:var(--pfov-blue-soft);color:var(--pfov-blue);}
.pf-overview-expense-ico.r{background:var(--pfov-red-soft);color:var(--pfov-red);}
.pf-overview-expense-ico.a{background:var(--amber-light);color:var(--amber-dim);}
.pf-overview-expense-ico.p{background:var(--petronas-soft);color:var(--petronas-dark);}
.pf-overview-expense-lbl{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);line-height:1.3;}
.pf-overview-expense-val{font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--text-primary);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pf-overview-total{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:13px;border-top:1px solid var(--border);}
.pf-overview-total-lbl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);}
.pf-overview-total-val{font-size:16px;font-weight:800;letter-spacing:-.02em;color:var(--pfov-red);}
/* Notebook — mantém 60/40 lado a lado, comprime ritmo interno */
@media(max-width:1280px){
  .pf-overview-grid{gap:13px;}
  .pf-overview-chart-panel,.pf-overview-summary-panel{padding:18px 18px;}
  .pf-overview-sum-val{font-size:29px;}
  .pf-overview-title{font-size:22px;}
  .pf-overview-var{font-size:30px;}
}
/* Tablet e telas estreitas — empilha: gráfico primeiro, resumo depois */
@media(max-width:1024px){
  .pf-overview-grid{grid-template-columns:1fr;}
}
/* Mobile — subcards em coluna única */
@media(max-width:560px){
  .pf-overview-expense-grid{grid-template-columns:1fr;}
  .pf-overview-sum-val{font-size:26px;}
  .pf-overview-title{font-size:20px;}
  .pf-overview-title-ico{width:32px;height:32px;border-radius:9px;}
  .pf-overview-var{font-size:28px;}
  .pf-overview-var-cap{max-width:none;}
  .pf-overview-legend{gap:14px;}
  .pf-overview-tip{min-width:0;padding:7px 9px;}
  .pf-overview-tip-row{font-size:11.5px;}
}

/* ══════════════════════════════════════════════════════
   ABA PROJEÇÃO — FLUXO DE CAIXA CONSOLIDADO — CSS ISOLADO
   Prefixo exclusivo prx-proj-. Nenhum seletor global.
   ══════════════════════════════════════════════════════ */
.prx-proj-wrap{display:flex;flex-direction:column;gap:14px;}
.prx-proj-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.prx-proj-title{font-size:24px;font-weight:800;letter-spacing:-.03em;color:var(--text-primary);margin:0;line-height:1.1;}
.prx-proj-sub{font-size:12.5px;color:var(--text-muted);margin:5px 0 0;line-height:1.45;}
.prx-proj-horizonte{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px;flex-shrink:0;}
.prx-proj-horizonte button{font-family:inherit;font-size:12px;font-weight:700;color:var(--text-muted);background:transparent;border:none;border-radius:999px;padding:7px 15px;cursor:pointer;transition:background .15s,color .15s;}
.prx-proj-horizonte button.on{background:var(--carbon);color:#fff;}
.prx-proj-horizonte button:focus-visible{outline:2px solid var(--carbon);outline-offset:2px;}

.prx-proj-vazio{background:var(--surface);border:1px dashed var(--border);border-radius:16px;padding:34px 22px;text-align:center;font-size:13px;color:var(--text-muted);}
.prx-proj-vazio.erro{border-color:#fca5a5;color:var(--red-dim);background:var(--red-light);}
.prx-proj-vazio.aviso{border-color:var(--amber);color:var(--amber-dim);background:var(--amber-light);}

.prx-proj-saldo-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;box-shadow:var(--shadow-xs);}
.prx-proj-saldo-box.vazio{border-color:rgba(232,118,10,.35);background:var(--papaya-soft);}
.prx-proj-saldo-txt{min-width:220px;flex:1;}
.prx-proj-saldo-txt strong{display:block;font-size:13.5px;font-weight:700;color:var(--text-primary);}
.prx-proj-saldo-txt span{display:block;font-size:11.5px;color:var(--text-muted);margin-top:3px;line-height:1.45;max-width:56ch;}
.prx-proj-saldo-form{display:flex;align-items:flex-end;gap:9px;flex-wrap:wrap;}
.prx-proj-saldo-form label{display:flex;flex-direction:column;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);}
.prx-proj-saldo-form input{font-family:inherit;font-size:13px;font-weight:600;color:var(--text-primary);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;outline:none;min-width:150px;}
.prx-proj-saldo-form input:focus{border-color:var(--carbon);box-shadow:0 0 0 3px rgba(18,18,20,.08);}
.prx-proj-btn{font-family:inherit;font-size:12.5px;font-weight:700;color:#fff;background:var(--carbon);border:1px solid var(--carbon);border-radius:8px;padding:9px 18px;cursor:pointer;transition:opacity .15s;}
.prx-proj-btn:hover{opacity:.88;}
.prx-proj-btn:disabled{opacity:.5;cursor:not-allowed;}
.prx-proj-btn.ghost{background:transparent;color:var(--text-secondary);border-color:var(--border);}
.prx-proj-link{font-family:inherit;font-size:inherit;font-weight:700;color:var(--papaya-dark);background:none;border:none;padding:0;cursor:pointer;text-decoration:underline;}
.prx-proj-aviso{font-size:12px;font-weight:600;border-radius:10px;padding:9px 13px;}
.prx-proj-aviso.ok{background:var(--green-light);color:var(--green-dim);}
.prx-proj-aviso.erro{background:var(--red-light);color:var(--red-dim);}
.prx-proj-aviso.ro{background:var(--amber-light);color:var(--amber-dim);}

/* HERO */
.prx-proj-hero{display:flex;align-items:stretch;justify-content:space-between;gap:22px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px 26px;box-shadow:0 14px 44px rgba(18,18,20,.06),0 2px 8px rgba(18,18,20,.03);border-left:5px solid var(--ink-300);}
.prx-proj-hero.ok{border-left-color:var(--green);}
.prx-proj-hero.warn{border-left-color:var(--amber);}
.prx-proj-hero.danger{border-left-color:var(--red);}
.prx-proj-hero-main{min-width:0;flex:1;}
.prx-proj-hero-vered{font-size:16px;font-weight:700;color:var(--text-primary);letter-spacing:-.015em;line-height:1.3;}
.prx-proj-hero-num{font-size:42px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin-top:8px;color:var(--text-primary);}
.prx-proj-hero.ok .prx-proj-hero-num{color:var(--green-dim);}
.prx-proj-hero.warn .prx-proj-hero-num{color:var(--amber-dim);}
.prx-proj-hero.danger .prx-proj-hero-num{color:var(--red);}
.prx-proj-hero-cap{font-size:12.5px;color:var(--text-muted);margin-top:7px;}
.prx-proj-hero-side{display:flex;flex-direction:column;gap:9px;min-width:180px;padding-left:20px;border-left:1px solid var(--border);}
.prx-proj-hero-side>div{display:flex;flex-direction:column;gap:1px;}
.prx-proj-hero-side span{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);}
.prx-proj-hero-side strong{font-size:14px;font-weight:700;color:var(--text-primary);text-transform:capitalize;}
.prx-proj-hero-motivo{font-size:11px;color:var(--text-muted);line-height:1.45;margin-top:2px;}

/* HOJE */
.prx-proj-hoje{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow-xs);}
.prx-proj-hoje-hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
.prx-proj-hoje-hd strong{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-primary);}
.prx-proj-hoje-hd span{font-size:11.5px;color:var(--text-muted);}
.prx-proj-hoje-hd span.velho{color:var(--amber-dim);font-weight:600;}
.prx-proj-hoje-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.prx-proj-hoje-grid>div{display:flex;flex-direction:column;gap:3px;min-width:0;}
.prx-proj-hoje-grid span{font-size:10.5px;font-weight:600;color:var(--text-muted);}
.prx-proj-hoje-grid strong{font-size:18px;font-weight:800;letter-spacing:-.025em;color:var(--text-primary);}
.prx-proj-hoje-grid strong.g{color:var(--green-dim);}
.prx-proj-hoje-grid strong.r{color:var(--red);}
.prx-proj-nota{font-size:11px;color:var(--text-muted);margin-top:11px;line-height:1.45;}
.prx-proj-nota.alerta{color:var(--amber-dim);background:var(--amber-light);border-radius:8px;padding:9px 12px;}

/* CARDS DO HORIZONTE */
.prx-proj-cards{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;}
.prx-proj-cards>div{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 14px;min-width:0;box-shadow:var(--shadow-xs);}
.prx-proj-cards span{display:block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);line-height:1.3;}
.prx-proj-cards strong{display:block;font-size:16px;font-weight:800;letter-spacing:-.025em;color:var(--text-primary);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.prx-proj-cards strong.g{color:var(--green-dim);}
.prx-proj-cards strong.r{color:var(--red);}
.prx-proj-cards strong.muted{color:var(--text-muted);font-weight:600;}

/* CURVA */
.prx-proj-chart-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow-xs);}
.prx-proj-chart-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
.prx-proj-chart-hd strong{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-primary);}
.prx-proj-legend{display:flex;gap:16px;}
.prx-proj-legend span{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--text-secondary);}
.prx-proj-legend i{width:18px;height:0;display:inline-block;flex-shrink:0;}
.prx-proj-legend i.solida{border-top:2.4px solid var(--carbon);}
.prx-proj-legend i.tracejada{border-top:2px dashed var(--green);}
.prx-proj-chart{position:relative;height:250px;width:100%;}

/* CENÁRIOS */
.prx-proj-cenarios{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.prx-proj-cenarios>div{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:15px 17px;box-shadow:var(--shadow-xs);}
.prx-proj-cenarios>div.off{background:var(--surface-2);opacity:.85;}
.prx-proj-cenarios strong{font-size:13px;font-weight:800;color:var(--text-primary);}
.prx-proj-cenarios p{font-size:11.5px;color:var(--text-muted);line-height:1.5;margin:5px 0 10px;}
.prx-proj-cenarios span{font-size:21px;font-weight:800;letter-spacing:-.03em;display:block;}
.prx-proj-cenarios span.g{color:var(--green-dim);}
.prx-proj-cenarios span.r{color:var(--red);}
.prx-proj-cenarios em{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);font-style:normal;}

/* DETALHES */
.prx-proj-detalhes{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-xs);overflow:hidden;}
.prx-proj-detalhes-tog{width:100%;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--text-secondary);background:transparent;border:none;padding:14px 18px;cursor:pointer;text-align:left;}
.prx-proj-detalhes-tog:hover{background:var(--ink-50);}
.prx-proj-detalhes-body{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;padding:4px 18px 18px;border-top:1px solid var(--border);}
.prx-proj-detalhes-body>div{min-width:0;}
.prx-proj-detalhes-body strong{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);margin:12px 0 8px;}
.prx-proj-detalhes-body ul{list-style:none;margin:0;padding:0;}
.prx-proj-detalhes-body li{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:12.5px;padding:5px 0;border-bottom:1px solid rgba(18,18,20,.04);}
.prx-proj-detalhes-body li:last-child{border-bottom:none;}
.prx-proj-detalhes-body li span{color:var(--text-secondary);}
.prx-proj-detalhes-body li em{font-style:normal;font-size:10px;font-weight:700;color:var(--text-muted);margin-left:5px;}
.prx-proj-detalhes-body li strong{margin:0;font-size:12.5px;text-transform:none;letter-spacing:0;color:var(--text-primary);}
.prx-proj-detalhes-body p{font-size:11.5px;color:var(--text-muted);line-height:1.5;margin:0;}
.prx-proj-detalhes-body p.vazio{margin-top:8px;}

/* AGENDA */
.prx-proj-agenda{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-xs);overflow:hidden;}
.prx-proj-agenda-hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);}
.prx-proj-agenda-hd strong{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-primary);}
.prx-proj-agenda-hd span{font-size:11.5px;color:var(--text-muted);}
.prx-proj-agenda-scroll{max-height:420px;overflow-y:auto;overflow-x:auto;}
.prx-proj-tabela{width:100%;border-collapse:collapse;min-width:560px;}
.prx-proj-tabela th{position:sticky;top:0;background:var(--surface-2);font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);text-align:right;padding:9px 14px;border-bottom:1px solid var(--border);}
.prx-proj-tabela th:first-child{text-align:left;}
.prx-proj-tabela td{font-size:12.5px;text-align:right;padding:9px 14px;border-bottom:1px solid rgba(18,18,20,.04);white-space:nowrap;color:var(--text-secondary);}
.prx-proj-tabela td:first-child{text-align:left;font-weight:600;}
.prx-proj-tabela td.muted{color:var(--text-muted);}
.prx-proj-tabela td strong.r{color:var(--red);}
.prx-proj-tabela tr.neg td{background:var(--red-light);}
.prx-proj-tabela tr.menor td{background:var(--amber-light);}

/* PRECISA DE VOCÊ */
.prx-proj-acoes{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--papaya);border-radius:14px;padding:15px 18px;box-shadow:var(--shadow-xs);}
.prx-proj-acoes strong{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin-bottom:9px;}
.prx-proj-acoes ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;}
.prx-proj-acoes li{font-size:12.5px;color:var(--text-secondary);line-height:1.5;padding-left:16px;position:relative;}
.prx-proj-acoes li::before{content:'';position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:var(--papaya);}

@media(max-width:1180px){
  .prx-proj-cards{grid-template-columns:repeat(3,1fr);}
}
@media(max-width:900px){
  .prx-proj-hero-side{padding-left:0;border-left:none;border-top:1px solid var(--border);padding-top:14px;width:100%;}
  .prx-proj-hoje-grid{grid-template-columns:repeat(2,1fr);}
  .prx-proj-cenarios{grid-template-columns:1fr;}
  .prx-proj-detalhes-body{grid-template-columns:1fr;}
}
@media(max-width:600px){
  .prx-proj-title{font-size:20px;}
  .prx-proj-hero{padding:18px;}
  .prx-proj-hero-num{font-size:32px;}
  .prx-proj-cards{grid-template-columns:repeat(2,1fr);}
  .prx-proj-horizonte button{padding:6px 11px;font-size:11.5px;}
  .prx-proj-saldo-form input{min-width:0;width:100%;}
  .prx-proj-saldo-form label{flex:1;min-width:130px;}
  .prx-proj-chart{height:210px;}
  .prx-proj-agenda-scroll{max-height:none;}
}

/* ══════════════════════════════════════════════════════
   PROJEÇÃO — CAMADA 1: CAPITAL DE GIRO + MURAL CONSULTIVO
   Prefixo exclusivo prx-cg-. Off-white + grafite/preto + papaya.
   Nenhum seletor global; nenhuma classe da Projeção existente é tocada.
   ══════════════════════════════════════════════════════ */
.prx-cg-layer{display:grid;grid-template-columns:minmax(0,9fr) minmax(280px,11fr);gap:16px;margin-bottom:22px;align-items:start;}

.prx-cg-main{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow-md);display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:16px;min-width:0;}
.prx-cg-info{display:flex;flex-direction:column;gap:2px;min-width:0;}
.prx-cg-head{display:flex;flex-direction:column;gap:2px;margin-bottom:2px;}
.prx-cg-label{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--carbon);}
.prx-cg-sub{font-size:11px;color:var(--text-muted);}
.prx-cg-carregando,.prx-cg-erro{font-size:13px;color:var(--text-muted);padding:10px 0;}
.prx-cg-erro{color:var(--red-dim);}
.prx-cg-value{font-size:28px;font-weight:800;letter-spacing:-.02em;color:var(--carbon);line-height:1.1;word-break:break-word;margin-top:2px;}
.prx-cg-metrics{display:flex;gap:18px;margin-top:8px;flex-wrap:wrap;}
.prx-cg-metrics div{display:flex;flex-direction:column;gap:1px;}
.prx-cg-metrics span{font-size:10px;font-weight:600;color:var(--text-muted);letter-spacing:.02em;}
.prx-cg-metrics strong{font-size:13px;font-weight:700;color:var(--carbon);}
.prx-cg-metrics strong.papaya{color:var(--papaya-dark);}
.prx-cg-feedback{margin-top:6px;font-size:11px;font-weight:600;color:var(--green-dim);}
.prx-cg-erro-inline{margin-top:6px;font-size:11px;font-weight:600;color:var(--red-dim);}
.prx-cg-actions{display:flex;flex-direction:column;gap:8px;flex-shrink:0;}

.prx-cg-action{font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.02em;padding:9px 18px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:opacity .15s,background .15s;white-space:nowrap;}
.prx-cg-action:hover{opacity:.9;}
.prx-cg-action.primary{background:var(--green-light);color:#14532d;border-color:rgba(22,163,74,.28);}
.prx-cg-action.dark{background:var(--red-light);color:#7f1d1d;border-color:rgba(220,38,38,.28);}

.prx-cg-modal-tipo{display:flex;gap:8px;margin-bottom:14px;}
.prx-cg-modal-tipo button{flex:1;font-family:inherit;font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-secondary);cursor:pointer;transition:all .15s;}
.prx-cg-modal-tipo button.on{background:var(--green-light);color:#14532d;border-color:rgba(22,163,74,.35);}

/* ── PAINEL "EM CONTA" (ocupa a coluna do antigo Mural de avisos, dentro de .prx-cg-layer).
   Prefixo exclusivo prx-acc-. Painel externo branco + card interno chumbo vitrificado com
   detalhes papaya + histórico claro. Não toca .prx-cg-main nem nenhum seletor global. ── */
.prx-acc-panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px;box-shadow:var(--shadow-md);display:flex;flex-direction:column;gap:11px;min-width:0;}

/* VIDRO FUMÊ — superfície do card interno, translucidez alta.
   Alfa .20–.30 (70% a 80% de transparência): o branco do painel externo atravessa amplamente a
   superfície, que por isso compõe em cinza claro — é o efeito pretendido, não um desvio, e a
   aparência chumbo antiga foi deliberadamente abandonada. Com esse nível de transparência o
   backdrop-filter contribui de fato. Reflexos especulares e rim light por cima. */
.prx-acc-card{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(30,33,40,.24) 0%,rgba(20,23,29,.20) 55%,rgba(13,16,22,.30) 100%);backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);border:1px solid rgba(255,255,255,.24);border-top-color:rgba(255,255,255,.38);border-radius:14px;padding:13px 16px;box-shadow:0 10px 26px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.10);}
/* Reflexo especular — luz incidindo no canto superior esquerdo da placa translúcida. */
.prx-acc-card::before{content:'';position:absolute;inset:0;z-index:0;border-radius:inherit;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.24) 0%,rgba(255,255,255,.13) 16%,rgba(255,255,255,.045) 31%,transparent 50%);}
/* Lâmina de luz — faixa discreta atravessando a superfície. */
.prx-acc-card::after{content:'';position:absolute;inset:0;z-index:0;border-radius:inherit;pointer-events:none;background:linear-gradient(105deg,transparent 0%,transparent 48%,rgba(255,255,255,.05) 53%,rgba(255,255,255,.12) 58%,rgba(255,255,255,.03) 63%,transparent 70%);}
/* Conteúdo sempre acima das camadas de vidro — 100% opaco, sem filtro, cor/nitidez inalteradas. */
.prx-acc-card>*{position:relative;z-index:1;}
.prx-acc-card-hd{display:flex;align-items:center;gap:7px;margin-bottom:7px;}
.prx-acc-dot{width:7px;height:7px;border-radius:50%;background:var(--papaya);box-shadow:0 0 0 3px rgba(232,118,10,.18);flex-shrink:0;}
.prx-acc-card-label{font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:rgba(240,239,235,.60);}
.prx-acc-card-value{font-size:27px;font-weight:800;letter-spacing:-.025em;line-height:1.12;color:#fff;word-break:break-word;}
.prx-acc-card-value.muted{font-size:15px;font-weight:600;letter-spacing:0;color:rgba(240,239,235,.55);}
.prx-acc-card-value.neg{color:#F98A8A;}
.prx-acc-card-foot{margin-top:4px;font-size:11px;color:rgba(240,239,235,.48);}
/* Ação de editar o saldo — herdada do card "Em Conta" inferior, que deixou de ser renderizado.
   É o único ponto de entrada do modal de saldo (abrirEditorSaldo → salvarSaldo). */
.prx-acc-edit{position:absolute;top:12px;right:12px;z-index:2;width:26px;height:26px;border-radius:8px;border:1px solid rgba(27,28,32,.16);background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--carbon);font-size:12px;line-height:1;padding:0;transition:background .15s,border-color .15s;}
.prx-acc-edit:hover{background:rgba(255,255,255,.85);border-color:rgba(232,118,10,.45);}

.prx-acc-hist-hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.prx-acc-hist-title{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted);}
.prx-acc-hist-cnt{font-size:10.5px;color:var(--text-muted);white-space:nowrap;}
/* Estado vazio reserva a mesma área das 4 linhas — o painel não encolhe sem registros. */
.prx-acc-vazio{font-size:12px;color:var(--text-muted);padding:12px 2px;height:192px;flex-shrink:0;}
/* Área fixa de 4 linhas. box-sizing é border-box, então min-height da linha já inclui padding e
   borda: 48px × 4 = 192px. Altura reservada mesmo com 0–3 registros; do 5º em diante a lista
   rola dentro da própria área, sem crescer o painel. */
.prx-acc-hist{display:flex;flex-direction:column;height:192px;max-height:192px;flex-shrink:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(15,23,42,.18) transparent;}
.prx-acc-hist:focus-visible{outline:2px solid var(--papaya);outline-offset:2px;border-radius:8px;}
.prx-acc-hist::-webkit-scrollbar{width:5px;}
.prx-acc-hist::-webkit-scrollbar-track{background:transparent;}
.prx-acc-hist::-webkit-scrollbar-thumb{background:rgba(15,23,42,.16);border-radius:3px;}
.prx-acc-hist::-webkit-scrollbar-thumb:hover{background:rgba(15,23,42,.30);}
/* min-height 48px é vinculante (o conteúdo da linha mede ~46,5px), tornando a altura da linha
   determinística — é isso que garante exatamente 4 linhas na área acima. */
.prx-acc-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:5px 2px;border-bottom:1px solid var(--border);}
.prx-acc-row:last-child{border-bottom:none;}
.prx-acc-row-l{display:flex;flex-direction:column;gap:1px;min-width:0;}
.prx-acc-row-data{font-size:12.5px;font-weight:700;letter-spacing:-.01em;color:var(--text-primary);}
.prx-acc-row-sub{font-size:10.5px;color:var(--text-muted);}
.prx-acc-row-val{font-size:13.5px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;}
.prx-acc-row-val.pos{color:var(--green-dim);}
.prx-acc-row-val.neg{color:var(--red-dim);}
.prx-acc-row-val.zero{color:var(--text-muted);}

.prx-cg-modal-info{font-size:12.5px;color:var(--text-muted);margin-bottom:12px;}
.prx-cg-modal-info strong{color:var(--text-primary);}

/* ── STACK "HOJE" — Entra/Sai/Sobra empilhados abaixo do Capital de Giro, dentro da MESMA
   coluna do grid .prx-cg-layer. Dimensionado a partir das medidas reais dos dois painéis
   âncora (CG termina em 175px, painel Em Conta em 380px → 205px disponíveis): 12px de gap +
   3 cards de 85px com overlap de 31px (3×85 − 2×31 = 193px) fecham exatamente 205px, então a
   base do 3º card encosta na base do Em Conta SEM alterar nenhuma das duas âncoras.
   Sobreposição só no eixo Y (margin-top negativo + z-index); zero deslocamento lateral. ── */
.prx-today-stack-col{display:flex;flex-direction:column;min-width:0;}
.prx-today-stack{display:flex;flex-direction:column;margin-top:12px;}
.prx-today-stack-card{position:relative;height:85px;padding:13px 18px;border-radius:16px;border:1px solid var(--border);background:var(--surface);box-shadow:0 6px 16px rgba(15,23,42,.07);display:flex;flex-direction:column;gap:2px;min-width:0;}
.prx-today-stack-card+.prx-today-stack-card{margin-top:-31px;}
.prx-today-stack-enter{z-index:1;}
.prx-today-stack-exit{z-index:2;}
/* Papaya SUAVE e SÓLIDO — fecha o stack sem dominar a coluna. Degradê do papaya claro ao branco,
   100% opaco (nenhum alpha, nenhum backdrop-filter): linguagem oposta à do painel Em Conta,
   que é o glass translúcido. */
.prx-today-stack-balance{z-index:3;background:linear-gradient(180deg,#FFD3AE 0%,#FFE7D3 48%,#FFFDFB 78%,#FFFFFF 100%);border-color:rgba(205,95,20,.35);box-shadow:0 8px 20px rgba(180,90,25,.16),inset 0 1px 0 rgba(255,255,255,.24);}
.prx-today-stack-label{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);}
.prx-today-stack-value{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.2;color:var(--carbon);word-break:break-word;}
.prx-today-stack-value.g{color:var(--green-dim);}
.prx-today-stack-value.r{color:var(--red);}
.prx-today-stack-value.neutro{color:var(--text-muted);}
/* Sobre o papaya sólido o verde cai para 1,9:1 e o vermelho para 2,5:1; o grafite sobe para
   6,5–9,5:1. A leitura semântica não se perde: o sinal +/− continua no próprio valor. */
.prx-today-stack-balance .prx-today-stack-value{color:var(--carbon);}
.prx-today-stack-balance .prx-today-stack-label{color:#5A3A18;}

@media(max-width:900px){
  .prx-cg-layer{grid-template-columns:1fr;}
}
@media(max-width:600px){
  .prx-cg-main{flex-direction:column;align-items:stretch;padding:16px 18px;gap:12px;}
  .prx-cg-actions{flex-direction:row;gap:8px;}
  .prx-cg-action{flex:1 1 0;padding:10px 14px;text-align:center;}
  .prx-acc-panel{padding:12px;}
  .prx-acc-card-value{font-size:24px;}
  .prx-today-stack-card{height:78px;padding:12px 16px;}
  .prx-today-stack-card+.prx-today-stack-card{margin-top:-24px;}
}

/* ══════════════════════════════════════════════════════
   PROJEÇÃO — CAMADA DE PREVISÃO 15/30/60 (valores + gráfico)
   Prefixo exclusivo prx-forecast-. Camada independente, inserida ABAIXO da
   estrutura já aprovada: não toca prx-cg-*, prx-acc-*, prx-today-* nem o grid
   superior. align-items:stretch iguala a altura dos dois painéis.
   ══════════════════════════════════════════════════════ */
/* Mesma declaração de colunas e mesmo gap de .prx-cg-layer — é o que faz as divisórias
   verticais desta camada coincidirem com as do bloco superior. */
.prx-forecast-layer{display:grid;grid-template-columns:minmax(0,9fr) minmax(280px,11fr);gap:16px;align-items:stretch;margin-bottom:22px;}
.prx-forecast-values,.prx-forecast-chart{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow-md);display:flex;flex-direction:column;min-width:0;}
.prx-forecast-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px;flex-wrap:wrap;}
.prx-forecast-title{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--carbon);}

.prx-forecast-value-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;min-height:0;}
.prx-forecast-value-card{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:14px 15px;display:flex;flex-direction:column;gap:5px;min-width:0;justify-content:center;}
.prx-forecast-value-card.destaque{background:linear-gradient(180deg,var(--papaya-soft),var(--surface-2) 70%);border-color:rgba(232,118,10,.24);}
.prx-forecast-value-label{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);line-height:1.3;}
.prx-forecast-value-num{font-size:19px;font-weight:800;letter-spacing:-.025em;line-height:1.15;color:var(--green-dim);word-break:break-word;}
.prx-forecast-value-num.neutro{color:var(--carbon);}
.prx-forecast-value-num.neg,.prx-forecast-value-num.saida{color:var(--red-dim);}
.prx-forecast-value-foot{font-size:10px;color:var(--text-muted);}

.prx-forecast-range{display:inline-flex;gap:3px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:2px;}
.prx-forecast-range>button{font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.01em;padding:5px 11px;border-radius:7px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;transition:background .15s,color .15s;white-space:nowrap;}
.prx-forecast-range>button:hover{color:var(--carbon);}
.prx-forecast-range>button.on{background:var(--surface);color:var(--carbon);box-shadow:var(--shadow-xs);}

.prx-forecast-legend{display:flex;gap:14px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
.prx-forecast-legend span{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text-secondary);}
.prx-forecast-legend i{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.prx-forecast-legend i.ent{background:#16A05D;}
.prx-forecast-legend i.sai{background:#E34242;}
.prx-forecast-canvas{position:relative;flex:1;min-height:244px;}
.prx-forecast-vazio{flex:1;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-muted);text-align:center;padding:20px 0;}

@media(max-width:900px){
  .prx-forecast-layer{grid-template-columns:1fr;}
  .prx-forecast-canvas{min-height:230px;}
}
@media(max-width:480px){
  .prx-forecast-value-grid{grid-template-columns:1fr;grid-template-rows:none;}
  .prx-forecast-values,.prx-forecast-chart{padding:14px;}
}

/* ══════════════════════════════════════════════════════
   PROJEÇÃO — CAMADA 2: "HOJE" (4 cards executivos)
   Prefixo exclusivo prx-today-. Off-white + grafite/preto + papaya (Em Conta) +
   verde/vermelho financeiro (Entra/Sai/Sobra). Nenhuma classe prx-cg-/prx-proj-
   é tocada; nenhum seletor global (.card/button/section/grid) é alterado.
   ══════════════════════════════════════════════════════ */
.prx-today-layer{margin-bottom:22px;}
.prx-today-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.prx-today-title{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--carbon);}
.prx-today-sub{font-size:12px;color:var(--text-muted);}
.prx-today-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:stretch;}
.prx-today-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px 22px 18px;box-shadow:var(--shadow-xs);display:flex;flex-direction:column;gap:8px;min-width:0;min-height:144px;justify-content:flex-start;}
.prx-today-card-account{background:linear-gradient(180deg,rgba(59,130,246,.16),var(--surface) 65%);border-color:rgba(59,130,246,.30);position:relative;}
.prx-today-edit{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);font-size:12px;line-height:1;padding:0;}
.prx-today-edit:hover{background:var(--papaya-soft);color:var(--carbon);}
.prx-today-label{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);}
.prx-today-value{font-size:22px;font-weight:800;letter-spacing:-.03em;color:var(--carbon);line-height:1.15;word-break:break-word;}
.prx-today-value.g{color:var(--green-dim);}
.prx-today-value.r{color:var(--red);}
.prx-today-value.neutro{color:var(--text-muted);}
.prx-today-value.muted{font-size:15px;font-weight:600;color:var(--text-muted);}
.prx-today-foot{font-size:11px;color:var(--text-muted);margin-top:auto;}

@media(max-width:1024px){
  .prx-today-grid{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:480px){
  .prx-today-grid{grid-template-columns:1fr;}
  .prx-today-card{padding:18px 18px 16px;min-height:128px;}
}

/* ══════════════════════════════════════════════════════
   PROJEÇÃO — REDESIGN (migração fiel de fluxo-caixa-projecao-redesign.html)
   Prefixo exclusivo prx-rdp-. TODOS os tokens são LOCAIS, declarados no escopo
   .prx-rdp: nenhum token global (:root) é alterado e nenhum seletor global
   (.card/.row/.label/.stat/.mini/table/button/svg) é criado. Os valores abaixo
   foram lidos diretamente do CSS do mockup, não aproximados.
   ══════════════════════════════════════════════════════ */
.prx-rdp{
  /* Superfícies — o mockup usa uma família levemente diferente da global
     (--surface-2 #f4f3ef / --border #dcdcd6); por isso tokens locais. */
  --rdp-surface:#ffffff;
  --rdp-surface-2:#f6f5f1;
  --rdp-border:#e4e2dc;
  --rdp-line:#efedE7;
  --rdp-line-2:#f4f2ec;
  /* Texto — idênticos aos globais --text-primary/-secondary/-muted */
  --rdp-ink:#0f172a;
  --rdp-ink-2:#475569;
  --rdp-ink-3:#94a3b8;
  /* Marca — idênticos a --carbon/--papaya/--papaya-dark; brand-soft é sólido
     no mockup (#fbe9d6), enquanto --papaya-soft global é rgba(.10). */
  --rdp-carbon:#1B1C20;
  --rdp-brand:#E8760A;
  --rdp-brand-dark:#CF6800;
  --rdp-brand-soft:#fbe9d6;
  /* Semânticas — pos/neg/warn idênticos aos globais; os *-soft do mockup são
     mais saturados que --green-light/--red-light/--amber-light. */
  --rdp-pos:#16a34a;
  --rdp-pos-soft:#eafaef;
  --rdp-pos-line:#cdeed7;
  --rdp-neg:#dc2626;
  --rdp-neg-soft:#fdeeee;
  --rdp-neg-line:#f6d5d5;
  --rdp-warn:#d97706;
  --rdp-warn-soft:#fef6e7;
  --rdp-warn-line:#f6e3bf;
  --rdp-radius:16px;
  --rdp-radius-sm:11px;
  --rdp-radius-xs:9px;
  --rdp-shadow-sm:0 1px 2px rgba(15,23,42,.04);
  --rdp-shadow:0 1px 2px rgba(15,23,42,.04),0 6px 16px rgba(15,23,42,.05);
  --rdp-shadow-lg:0 2px 4px rgba(15,23,42,.04),0 14px 34px rgba(15,23,42,.07);
  --rdp-gap:16px;
  /* .wrap do mockup — mantém as proporções originais dentro do shell real,
     que é fluido (.page-wrap não tem max-width). */
  max-width:1280px;margin:0 auto;color:var(--rdp-ink);
  /* O mockup roda sobre a métrica padrão do navegador (16px / line-height normal); o
     shell real declara body{font-size:14px;line-height:1.5}, que herdava para cá e
     inflava a altura de TODO bloco de texto (linhas da tabela, minis, títulos, pills).
     Restaurar as duas aqui — e só aqui — é o que faz as alturas baterem com a
     referência. Escopo fechado em .prx-rdp: nenhuma outra aba enxerga isso. */
  font-size:16px;line-height:normal;
}
.prx-rdp-num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}

/* ---------- Grid ---------- */
.prx-rdp-row{display:grid;gap:var(--rdp-gap);margin-bottom:var(--rdp-gap);}
.prx-rdp-r-hero{grid-template-columns:1.35fr 1fr 1fr;}
.prx-rdp-r-today{grid-template-columns:1fr 1fr 1fr;}
.prx-rdp-r-split{grid-template-columns:1fr 1.55fr;}

/* ---------- Card base ---------- */
.prx-rdp-card{
  background:var(--rdp-surface);border:1px solid var(--rdp-border);border-radius:var(--rdp-radius);
  box-shadow:var(--rdp-shadow);padding:22px;transition:box-shadow .2s,transform .2s;
  min-width:0;display:flex;flex-direction:column;
}
.prx-rdp-card:hover{box-shadow:var(--rdp-shadow-lg);transform:translateY(-1px);}
.prx-rdp-chead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.prx-rdp-label{
  font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--rdp-ink-3);
  display:flex;align-items:center;gap:9px;
}
.prx-rdp-ichip{
  width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;
  background:var(--rdp-surface-2);color:var(--rdp-ink-2);border:1px solid var(--rdp-border);
}
.prx-rdp-ichip.brand{background:var(--rdp-brand-soft);color:var(--rdp-brand-dark);border-color:#f4dcc3;}
.prx-rdp-ichip.pos{background:var(--rdp-pos-soft);color:var(--rdp-pos);border-color:var(--rdp-pos-line);}
.prx-rdp-ichip.neg{background:var(--rdp-neg-soft);color:var(--rdp-neg);border-color:var(--rdp-neg-line);}
.prx-rdp-ichip.warn{background:var(--rdp-warn-soft);color:var(--rdp-warn);border-color:var(--rdp-warn-line);}

/* trend chip */
.prx-rdp-trend{
  display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;
  padding:4px 9px;border-radius:999px;line-height:1;white-space:nowrap;
}
.prx-rdp-trend.pos{background:var(--rdp-pos-soft);color:var(--rdp-pos);}
.prx-rdp-trend.neg{background:var(--rdp-neg-soft);color:var(--rdp-neg);}
.prx-rdp-trend.flat{background:var(--rdp-surface-2);color:var(--rdp-ink-3);}
.prx-rdp-trend.on-brand{background:rgba(255,255,255,.16);color:#fff;}

/* ---------- Hero ---------- */
.prx-rdp-hero{position:relative;overflow:hidden;}
.prx-rdp-accent{
  background:
    radial-gradient(120% 140% at 100% 0%, #ff8a2b 0%, rgba(255,138,43,0) 55%),
    linear-gradient(150deg,var(--rdp-brand) 0%,var(--rdp-brand-dark) 100%);
  border-color:transparent;color:#fff;
  box-shadow:0 2px 4px rgba(207,104,0,.18),0 16px 36px rgba(232,118,10,.28);
}
.prx-rdp-accent:hover{box-shadow:0 2px 4px rgba(207,104,0,.22),0 20px 44px rgba(232,118,10,.34);}
.prx-rdp-accent .prx-rdp-label{color:rgba(255,255,255,.82);}
.prx-rdp-accent .prx-rdp-ichip{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.24);}
.prx-rdp-hero-tools{display:flex;align-items:center;gap:8px;position:relative;z-index:1;flex:none;}
.prx-rdp-hero-edit{
  width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;padding:0;
  border:1px solid rgba(255,255,255,.26);background:rgba(255,255,255,.16);color:#fff;
  font-size:12px;line-height:1;cursor:pointer;transition:background .15s,border-color .15s;
}
.prx-rdp-hero-edit:hover{background:rgba(255,255,255,.30);border-color:rgba(255,255,255,.45);}
.prx-rdp-hero-edit:focus-visible{outline:2px solid #fff;outline-offset:2px;}
.prx-rdp-hero-value{font-size:41px;font-weight:700;letter-spacing:-.025em;margin-top:14px;line-height:1;color:#fff;word-break:break-word;}
.prx-rdp-hero-value.muted{font-size:22px;font-weight:600;letter-spacing:-.01em;color:rgba(255,255,255,.80);}
.prx-rdp-hero-meta{font-size:12.5px;color:rgba(255,255,255,.85);margin-top:11px;display:flex;align-items:center;gap:8px;}
.prx-rdp-sheen{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0) 40%);}
.prx-rdp-hero>*:not(.prx-rdp-sheen){position:relative;z-index:1;}

/* ---------- Stat ---------- */
.prx-rdp-stat-value{font-size:27px;font-weight:700;letter-spacing:-.02em;margin-top:16px;line-height:1;word-break:break-word;}
.prx-rdp-stat-value.pos{color:var(--rdp-pos);}
.prx-rdp-stat-value.neg{color:var(--rdp-neg);}
.prx-rdp-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;}
.prx-rdp-meta{font-size:12px;color:var(--rdp-ink-3);font-weight:500;}
.prx-rdp-bar{height:6px;border-radius:6px;background:var(--rdp-line);margin-top:16px;overflow:hidden;display:flex;}
.prx-rdp-bar>span{display:block;height:100%;border-radius:6px;}

/* ---------- Capital de giro ---------- */
.prx-rdp-cg-value{font-size:27px;font-weight:700;letter-spacing:-.02em;margin-top:16px;word-break:break-word;}
.prx-rdp-cg-split{display:flex;gap:22px;margin-top:16px;padding-top:15px;border-top:1px solid var(--rdp-line);}
.prx-rdp-cg-split .n{font-size:10.5px;color:var(--rdp-ink-3);font-weight:600;letter-spacing:.03em;text-transform:uppercase;}
.prx-rdp-cg-split .v{font-size:15.5px;font-weight:700;margin-top:4px;}
.prx-rdp-cg-split .v.warn{color:var(--rdp-warn);}
.prx-rdp-cg-actions{display:flex;gap:7px;flex:none;align-items:center;}
/* Nota: com o 3º controle no cabeçalho, o rótulo "Capital de giro" passa a ocupar duas
   linhas em larguras intermediárias. Foi a alternativa de MENOR impacto: a altura do card
   (e da linha inteira do hero, que é um grid stretch) permanece exatamente a mesma e não há
   overflow. Deixar o rótulo em uma linha exigiria quebrar o cabeçalho em duas faixas, o que
   aumentava a altura de todos os três cards do bloco. */
/* Lápis do Capital de Giro — MESMA geometria, área clicável e interação do lápis do Hero
   (.prx-rdp-hero-edit): 26×26, radius 8, grid centrado, transição idêntica. Só a superfície
   muda, porque aqui o fundo é branco e não o papaya — o translúcido do Hero sumiria. Usa a
   mesma linguagem de hover dos chips vizinhos. Escopo exclusivo do card; o Hero não é tocado. */
.prx-rdp-cg-edit{
  width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;padding:0;
  border:1px solid var(--rdp-border);background:var(--rdp-surface-2);color:var(--rdp-ink-2);
  font-size:12px;line-height:1;cursor:pointer;transition:background .15s,border-color .15s,color .15s;
}
.prx-rdp-cg-edit:hover{border-color:#d9d7d0;color:var(--rdp-ink);}
.prx-rdp-cg-edit:focus-visible{outline:2px solid var(--rdp-carbon);outline-offset:2px;}
.prx-rdp-chip{
  display:inline-flex;gap:6px;align-items:center;font-family:inherit;font-size:12px;font-weight:600;
  padding:7px 12px;border-radius:9px;border:1px solid var(--rdp-border);cursor:pointer;
  background:var(--rdp-surface-2);color:var(--rdp-ink-2);transition:.15s;white-space:nowrap;
}
.prx-rdp-chip:hover{border-color:#d9d7d0;}
.prx-rdp-chip:focus-visible{outline:2px solid var(--rdp-carbon);outline-offset:2px;}
.prx-rdp-chip.pos{color:var(--rdp-pos);background:var(--rdp-pos-soft);border-color:var(--rdp-pos-line);}
.prx-rdp-chip.neg{color:var(--rdp-neg);background:var(--rdp-neg-soft);border-color:var(--rdp-neg-line);}
.prx-rdp-cg-state{font-size:13px;color:var(--rdp-ink-3);padding:16px 0 4px;}
.prx-rdp-cg-state.erro{color:var(--rdp-neg);}
.prx-rdp-cg-msg{margin-top:10px;font-size:11px;font-weight:600;}
.prx-rdp-cg-msg.ok{color:var(--rdp-pos);}
.prx-rdp-cg-msg.erro{color:var(--rdp-neg);}

/* ---------- Section title ---------- */
.prx-rdp-section{display:flex;align-items:center;gap:10px;margin:30px 4px 14px;}
.prx-rdp-section .tk{width:4px;height:15px;border-radius:3px;background:var(--rdp-brand);flex:none;}
.prx-rdp-section span.t{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--rdp-ink-2);}
.prx-rdp-section .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--rdp-border),transparent);}

/* ---------- Segmented ---------- */
.prx-rdp-seg{display:inline-flex;background:var(--rdp-surface-2);border:1px solid var(--rdp-border);border-radius:12px;padding:3px;flex:none;}
.prx-rdp-seg button{
  border:0;background:transparent;font-family:inherit;font-size:12px;font-weight:600;color:var(--rdp-ink-2);
  padding:6px 12px;border-radius:9px;cursor:pointer;transition:.18s;
}
.prx-rdp-seg button.on{background:var(--rdp-carbon);color:#fff;box-shadow:0 2px 6px rgba(27,28,32,.28);}
.prx-rdp-seg button:focus-visible{outline:2px solid var(--rdp-carbon);outline-offset:2px;}

/* ---------- Projeção ---------- */
.prx-rdp-proj-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.prx-rdp-proj-title{font-size:15px;font-weight:700;letter-spacing:-.01em;}
.prx-rdp-proj-sub{font-size:11.5px;color:var(--rdp-ink-3);margin-top:3px;font-weight:500;}
.prx-rdp-proj-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;}
.prx-rdp-mini{border:1px solid var(--rdp-border);border-radius:var(--rdp-radius-sm);padding:15px;background:var(--rdp-surface-2);position:relative;min-width:0;}
.prx-rdp-mini.accent-neg{background:var(--rdp-neg-soft);border-color:var(--rdp-neg-line);}
.prx-rdp-mini.accent-pos{background:var(--rdp-pos-soft);border-color:var(--rdp-pos-line);}
.prx-rdp-mini .mh{display:flex;align-items:center;gap:8px;}
.prx-rdp-mini .idot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;}
.prx-rdp-mini .idot.pos{background:var(--rdp-pos-soft);color:var(--rdp-pos);}
.prx-rdp-mini .idot.neg{background:var(--rdp-neg-soft);color:var(--rdp-neg);}
.prx-rdp-mini .idot.brand{background:var(--rdp-brand-soft);color:var(--rdp-brand-dark);}
.prx-rdp-mini .n{font-size:10.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--rdp-ink-3);}
.prx-rdp-mini .v{font-size:19px;font-weight:700;margin-top:12px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prx-rdp-mini .v.pos{color:var(--rdp-pos);}
.prx-rdp-mini .v.neg{color:var(--rdp-neg);}
.prx-rdp-mini .d{font-size:11px;color:var(--rdp-ink-3);margin-top:5px;font-weight:500;}

/* ---------- Chart ---------- */
.prx-rdp-chart-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.prx-rdp-chart-title{font-size:15px;font-weight:700;letter-spacing:-.01em;}
.prx-rdp-legend{display:flex;gap:18px;align-items:center;margin-top:10px;flex-wrap:wrap;}
.prx-rdp-legend .li{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--rdp-ink-3);font-weight:500;}
.prx-rdp-legend .li b{font-weight:700;color:var(--rdp-ink);font-size:13px;margin-left:2px;}
.prx-rdp-dot{width:8px;height:8px;border-radius:50%;flex:none;}
.prx-rdp-dot.pos{background:var(--rdp-pos);}
.prx-rdp-dot.neg{background:var(--rdp-neg);}
.prx-rdp-canvas{position:relative;width:100%;height:250px;flex:1;min-height:250px;}
.prx-rdp-chart-vazio{flex:1;display:flex;align-items:center;justify-content:center;min-height:250px;font-size:12px;color:var(--rdp-ink-3);text-align:center;}

/* ---------- Tabela (Resumo semanal) ---------- */
.prx-rdp-tablecard{padding:8px 6px 12px;}
.prx-rdp-tablewrap{overflow-x:auto;}
.prx-rdp-table{width:100%;border-collapse:collapse;min-width:620px;}
.prx-rdp-table thead th{
  font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--rdp-ink-3);
  text-align:right;padding:11px 16px;border-bottom:1px solid var(--rdp-border);white-space:nowrap;
}
.prx-rdp-table thead th:first-child{text-align:left;}
.prx-rdp-table tbody td{font-size:14px;padding:14px 16px;text-align:right;border-bottom:1px solid var(--rdp-line-2);font-weight:600;white-space:nowrap;}
.prx-rdp-table tbody td:first-child{text-align:left;}
.prx-rdp-table tbody tr{transition:background .15s;}
.prx-rdp-table tbody tr:hover{background:var(--rdp-surface-2);}
.prx-rdp-table tbody tr:last-child td{border-bottom:0;}
.prx-rdp-table tbody td.pos{color:var(--rdp-pos);}
.prx-rdp-table tbody td.neg{color:var(--rdp-neg);}
.prx-rdp-table tbody td.zero{color:var(--rdp-ink-3);}
.prx-rdp-week{display:flex;align-items:center;gap:11px;}
.prx-rdp-wk-ic{
  width:30px;height:30px;border-radius:9px;background:var(--rdp-surface-2);border:1px solid var(--rdp-border);
  display:grid;place-items:center;color:var(--rdp-ink-3);font-size:12px;font-weight:700;flex:none;
}
.prx-rdp-week .wn{font-weight:700;color:var(--rdp-ink);font-size:13.5px;}
.prx-rdp-week .wp{font-weight:500;color:var(--rdp-ink-3);font-size:11.5px;margin-top:1px;}
.prx-rdp-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:999px;}
.prx-rdp-pill.pos{background:var(--rdp-pos-soft);color:var(--rdp-pos);}
.prx-rdp-pill.neg{background:var(--rdp-neg-soft);color:var(--rdp-neg);}
.prx-rdp-pill.zero{background:var(--rdp-surface-2);color:var(--rdp-ink-3);}
.prx-rdp-pill .pd{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;}
.prx-rdp-table-vazio{font-size:12px;color:var(--rdp-ink-3);text-align:center;padding:26px 16px;}

/* ---------- Responsivo (o mockup é desktop-only; adaptado ao shell real) ---------- */
@media(max-width:1180px){
  .prx-rdp-r-split{grid-template-columns:1fr;}
}
@media(max-width:980px){
  .prx-rdp-r-hero{grid-template-columns:1fr 1fr;}
  .prx-rdp-r-hero>.prx-rdp-hero{grid-column:1/-1;}
  .prx-rdp-card{padding:20px;}
  .prx-rdp-hero-value{font-size:36px;}
}
@media(max-width:760px){
  .prx-rdp-r-hero,.prx-rdp-r-today{grid-template-columns:1fr;}
  .prx-rdp-proj-grid{grid-template-columns:1fr;}
  .prx-rdp-hero-value{font-size:32px;}
  .prx-rdp-stat-value,.prx-rdp-cg-value{font-size:24px;}
  .prx-rdp-canvas{height:220px;min-height:220px;}
  .prx-rdp-section{margin:24px 2px 12px;}
}

/* ══════════════════════════════════════════════════════
   PORTFÓLIO — REDESIGN EXECUTIVO (PRX)
   ══════════════════════════════════════════════════════ */
.pf-subtitle{font-size:12.5px;color:var(--text-muted);font-weight:500;margin:-6px 0 4px;}
.pf-subtitle strong{color:var(--text-secondary);font-weight:700;}

.pf-section-hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 12px;flex-wrap:wrap;}
.pf-section-title{font-size:12.5px;font-weight:700;color:var(--text-primary);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:9px;}
.pf-section-title::before{content:'';width:3px;height:14px;background:var(--papaya);border-radius:2px;}

/* — Visão Consolidada — composição assimétrica: 1 card principal + 3 auxiliares — */
.pf-consol{display:grid;grid-template-columns:1.7fr 1fr 1fr;gap:13px;align-items:stretch;}
.pf-kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden;display:flex;flex-direction:column;}
.pf-kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.pf-kpi.g::before{background:var(--green);}
.pf-kpi.r::before{background:var(--red);}
.pf-kpi.p::before{background:var(--papaya);}
.pf-kpi-head{display:flex;align-items:flex-start;gap:9px;margin-bottom:11px;}
.pf-kpi-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pf-kpi-ico svg{width:16px;height:16px;}
.pf-kpi-ico.g{background:var(--green-light);color:var(--green-dim);}
.pf-kpi-ico.r{background:var(--red-light);color:var(--red);}
.pf-kpi-ico.p{background:var(--papaya-soft);color:var(--papaya-dark);}
.pf-kpi-ico.a{background:var(--amber-light);color:var(--amber-dim);}
.pf-kpi-ico.gray{background:var(--ink-100);color:var(--text-muted);}
.pf-kpi-label{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);line-height:1.3;}
.pf-kpi-val{font-size:21px;font-weight:800;letter-spacing:-.035em;line-height:1.05;color:var(--carbon);white-space:nowrap;margin-top:auto;}
.pf-kpi-val.g{color:var(--green-dim);}
.pf-kpi-val.r{color:var(--red);}
.pf-kpi-val.p{color:var(--papaya-dark);}
.pf-kpi-sub{font-size:10.5px;color:var(--text-muted);font-weight:500;margin-top:8px;line-height:1.4;}
.pf-kpi-sub strong{color:var(--text-secondary);font-weight:700;}
.pf-mini-bar{height:5px;border-radius:3px;background:var(--ink-100);overflow:hidden;margin-top:9px;}
.pf-mini-bar>i{display:block;height:100%;border-radius:3px;}

/* Card principal — Saldo Projetado Consolidado (cor dinâmica) */
.pf-kpi-main{padding:18px 20px;}
.pf-kpi-main::before{height:4px;}
.pf-kpi-main.g{border-color:rgba(22,163,74,.35);}
.pf-kpi-main.g::before{background:var(--green);}
.pf-kpi-main.r{border-color:rgba(220,38,38,.35);}
.pf-kpi-main.r::before{background:var(--red);}
.pf-kpi-main.a{border-color:rgba(217,119,6,.38);}
.pf-kpi-main.a::before{background:var(--amber);}
.pf-kpi-main.gray{border-color:var(--border);}
.pf-kpi-main.gray::before{background:var(--ink-300);}
.pf-main-val{font-size:33px;font-weight:800;letter-spacing:-.04em;line-height:1;margin-top:2px;}
.pf-main-val.g{color:var(--green-dim);}
.pf-main-val.r{color:var(--red);}
.pf-main-val.a{color:var(--amber-dim);}
.pf-main-val.gray{color:var(--text-muted);}
.pf-comp{display:flex;align-items:center;gap:10px;margin-top:15px;}
.pf-comp-bar{flex:1;height:9px;border-radius:5px;overflow:hidden;display:flex;background:var(--ink-100);}
.pf-comp-bar>.ent{background:var(--green);height:100%;}
.pf-comp-bar>.sai{background:var(--red);height:100%;}
.pf-comp-legend{display:flex;gap:16px;margin-top:9px;font-size:10.5px;color:var(--text-muted);font-weight:600;}
.pf-comp-legend .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle;}

/* Status pill (usado em cards, tabela e consolidado) */
.pf-pill{display:inline-flex;align-items:center;gap:6px;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:20px;white-space:nowrap;}
.pf-pill .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.pf-pill.saudavel{background:var(--green-light);color:var(--green-dim);}
.pf-pill.saudavel .dot{background:var(--green);}
.pf-pill.atencao{background:var(--amber-light);color:var(--amber-dim);}
.pf-pill.atencao .dot{background:var(--amber);}
.pf-pill.critica{background:var(--red-light);color:var(--red-dim);}
.pf-pill.critica .dot{background:var(--red);}
.pf-pill.sem-mov{background:var(--ink-100);color:var(--text-muted);}
.pf-pill.sem-mov .dot{background:var(--ink-300);}

/* Insights discretos */
.pf-insights{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}
.pf-insight{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--text-secondary);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 13px;box-shadow:var(--shadow-xs);}
.pf-insight .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.pf-insight strong{color:var(--text-primary);font-weight:700;}
.pf-insight .v{color:var(--text-muted);font-weight:700;}

/* Controles da comparação */
.pf-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.pf-search{position:relative;display:flex;align-items:center;}
.pf-search input{padding:7px 11px 7px 30px;font-size:12.5px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);min-width:170px;font-family:inherit;}
.pf-search input:focus{border-color:var(--papaya);box-shadow:0 0 0 2px var(--papaya-soft);outline:none;}
.pf-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-muted);pointer-events:none;}
.pf-sel{padding:7px 10px;font-size:12px;font-weight:600;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text-secondary);cursor:pointer;font-family:inherit;}
.pf-toggle{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface);}
.pf-toggle button{padding:7px 13px;font-size:12px;font-weight:600;background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-family:inherit;}
.pf-toggle button.on{background:var(--papaya);color:#fff;}
.pf-chips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 14px;}
.pf-chip{font-size:11px;font-weight:600;padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s;}
.pf-chip:hover{background:var(--ink-50);}
.pf-chip.on{background:var(--carbon);color:#fff;border-color:var(--carbon);}
.pf-chip .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.pf-chip .cnt{font-size:10px;opacity:.65;font-weight:700;}
.pf-chip.on .cnt{opacity:.85;}

/* Grade responsiva de cards de unidade — escala de 1 a 100 unidades */
.pf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:13px;}
.pf-unit{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-xs);overflow:hidden;position:relative;cursor:pointer;transition:box-shadow .15s,border-color .15s;display:flex;flex-direction:column;}
.pf-unit:hover{box-shadow:var(--shadow-md);border-color:var(--ink-200);}
.pf-unit-side{position:absolute;left:0;top:0;bottom:0;width:4px;}
.pf-unit-side.saudavel{background:var(--green);}
.pf-unit-side.atencao{background:var(--amber);}
.pf-unit-side.critica{background:var(--red);}
.pf-unit-side.sem-mov{background:var(--ink-300);}
.pf-unit-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:13px 15px 11px 18px;border-bottom:1px solid var(--border);}
.pf-unit-name{font-size:13.5px;font-weight:700;color:var(--text-primary);line-height:1.25;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;}
.pf-unit-seg{font-size:10.5px;color:var(--text-muted);font-weight:500;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pf-unit-del{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:11px;padding:2px 5px;opacity:.5;border-radius:4px;line-height:1;flex-shrink:0;font-family:inherit;}
.pf-unit-del:hover{opacity:1;color:var(--red);background:var(--red-light);}
.pf-unit-edit{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:11px;padding:2px 5px;opacity:.5;border-radius:4px;line-height:1;flex-shrink:0;font-family:inherit;}
.pf-unit-edit:hover{opacity:1;color:var(--papaya-dark);background:var(--papaya-soft);}
.pf-unit-body{padding:12px 15px 13px 18px;display:flex;flex-direction:column;gap:11px;flex:1;}
.pf-metric-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:5px;}
.pf-metric-lbl{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);}
.pf-metric-val{font-size:13px;font-weight:700;letter-spacing:-.02em;color:var(--text-primary);white-space:nowrap;}
.pf-metric-val.g{color:var(--green-dim);}
.pf-metric-val.r{color:var(--red);}
.pf-metric-val.p{color:var(--papaya-dark);}
.pf-metric-val.muted{color:var(--text-muted);font-weight:600;}
.pf-bar{height:4px;border-radius:3px;background:var(--ink-100);overflow:hidden;}
.pf-bar>i{display:block;height:100%;border-radius:3px;}
.pf-bar>i.g{background:var(--green);}
.pf-bar>i.r{background:var(--red);}
.pf-bar>i.p{background:var(--papaya);}
.pf-unit-ft{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 15px 12px 18px;border-top:1px solid var(--border);background:var(--surface-2);}
.pf-saldo-lbl{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);margin-bottom:2px;}
.pf-saldo-val{font-size:16px;font-weight:800;letter-spacing:-.03em;line-height:1;}
.pf-saldo-val.g{color:var(--green-dim);}
.pf-saldo-val.r{color:var(--red);}
.pf-saldo-val.a{color:var(--amber-dim);}
.pf-saldo-val.gray{color:var(--text-muted);}
.pf-open{font-size:10.5px;font-weight:700;color:var(--papaya-dark);background:var(--papaya-soft);border:1px solid rgba(232,118,10,.22);border-radius:6px;padding:6px 12px;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0;transition:background .15s,color .15s;}
.pf-open:hover{background:var(--papaya);color:#fff;border-color:var(--papaya);}

/* Tabela de comparação (view alternativa) — valores à direita, unidade à esquerda */
.pf-table th,.pf-table td{text-align:right;}
.pf-table th:first-child,.pf-table td:first-child{text-align:left;}
.pf-empty{padding:40px 20px;text-align:center;color:var(--text-muted);font-size:13px;background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);}

.unit-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);overflow:hidden;cursor:pointer;transition:box-shadow .18s,transform .18s,border-color .18s;position:relative;}
.unit-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--papaya);}
.unit-card.active-unit{border-color:var(--papaya);box-shadow:0 0 0 2px var(--papaya),var(--shadow-lg);}
.unit-card.selected-unit{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue),var(--shadow-lg);}
.unit-card-hdr{display:flex;align-items:center;justify-content:space-between;padding:11px 14px 10px;border-bottom:1px solid var(--border);position:relative;}
.unit-card-hdr::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:0;}
.unit-card-hdr.status-ok::before{background:var(--green);}
.unit-card-hdr.status-warn::before{background:var(--amber);}
.unit-card-hdr.status-danger::before{background:var(--red);}
.unit-card-hdr.status-empty::before{background:var(--ink-300);}
.unit-card-name{font-size:13px;font-weight:700;color:var(--text-primary);letter-spacing:-.01em;padding-left:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.unit-card-status{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.unit-card-status.ok{background:var(--green-light);color:var(--green-dim);}
.unit-card-status.warn{background:var(--amber-light);color:var(--amber-dim);}
.unit-card-status.danger{background:var(--red-light);color:var(--red-dim);}
.unit-card-status.empty{background:var(--ink-100);color:var(--ink-400);}
.unit-kpis{display:grid;grid-template-columns:1fr 1fr;gap:0;}
.unit-kpi{padding:10px 13px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);min-width:0;}
.unit-kpis>.unit-kpi:nth-child(2n){border-right:none;}
.unit-kpis>.unit-kpi:nth-last-child(-n+2){border-bottom:none;}
.unit-kpi-lbl{font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.unit-kpi-val{font-size:14px;font-weight:700;letter-spacing:-.02em;color:var(--text-primary);line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.unit-kpi-val.g{color:var(--green);}
.unit-kpi-val.r{color:var(--red);}
.unit-kpi-val.a{color:var(--amber);}
.unit-kpi-sub{font-size:10px;color:var(--text-muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.unit-card-footer{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--surface-2);border-top:1px solid var(--border);}
.unit-card-footer-btn{font-size:10.5px;font-weight:600;color:var(--papaya-dark);background:none;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-family:'DM Sans',sans-serif;letter-spacing:.03em;padding:0;}
.unit-card-footer-btn:hover{color:var(--papaya);}
.unit-card-mes{font-size:10px;color:var(--text-muted);font-weight:500;}
.unit-card-add{background:var(--surface);border:2px dashed var(--border);border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:32px 20px;cursor:pointer;transition:border-color .15s,background .15s;min-height:220px;}
.unit-card-add:hover{border-color:var(--papaya);background:var(--papaya-soft);}
.unit-card-add-ico{font-size:24px;opacity:.5;}
.unit-card-add-label{font-size:13px;font-weight:600;color:var(--text-muted);}
.unit-card-add-sub{font-size:11px;color:var(--text-muted);opacity:.7;}
.unit-modal-form{display:flex;flex-direction:column;gap:13px;}
.unit-modal-form .fg{display:flex;flex-direction:column;gap:4px;}
.unit-modal-form label{font-size:12px;font-weight:600;color:var(--text-secondary);}

/* ══ PORTFÓLIO — Painel Comparativo entre Unidades ══ */
.comp-panel-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 12px;border-bottom:1px solid var(--border);}
.comp-panel-title{font-size:13px;font-weight:700;color:var(--text-primary);letter-spacing:-.01em;text-transform:uppercase;}
.comp-panel-periodo{font-size:11px;font-weight:500;color:var(--text-muted);letter-spacing:.02em;}
.comp-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.comp-table{width:100%;border-collapse:collapse;min-width:420px;}
.comp-table th,.comp-table td{padding:10px 14px;text-align:right;font-size:13px;white-space:nowrap;border-bottom:1px solid rgba(18,18,20,0.05);}
.comp-table th{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);background:var(--surface-2);position:sticky;top:0;border-bottom:1px solid var(--border);}
.comp-table th:first-child,.comp-table td:first-child{text-align:left;font-weight:600;color:var(--text-secondary);position:sticky;left:0;background:inherit;z-index:1;min-width:140px;}
.comp-table th:first-child{background:var(--surface-2);}
.comp-table td:first-child{background:var(--surface);}
.comp-table th.comp-col-active{color:var(--papaya-dark);}
.comp-table tbody tr:last-child td{border-bottom:none;}
.comp-table tbody tr:hover td{background:var(--ink-50);}
.comp-table tbody tr:hover td:first-child{background:var(--ink-50);}
.comp-cell{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.comp-val{font-weight:700;letter-spacing:-.02em;color:var(--text-primary);font-size:13px;}
.comp-val.is-max{color:var(--papaya-dark);}
.comp-bar-wrap{width:100%;max-width:110px;height:5px;background:var(--ink-100);border-radius:3px;overflow:hidden;}
.comp-bar{height:100%;border-radius:3px;transition:width .3s ease;}
.comp-bar.bar-ent{background:var(--papaya);}
.comp-bar.bar-sai{background:var(--ink-400);}
.comp-empty-state{padding:40px 20px;text-align:center;color:var(--text-muted);font-size:13px;}
/* ══ PORTFÓLIO — Seção Acessar Unidade ══ */
.access-section{margin-top:20px;margin-bottom:8px;}
.access-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;}
.access-btns{display:flex;flex-wrap:wrap;gap:10px;}
.access-btn{padding:11px 22px;font-size:13px;font-weight:600;letter-spacing:.02em;color:#fff;background:var(--papaya);border:2px solid var(--papaya);border-radius:var(--radius-sm);cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .15s,border-color .15s,box-shadow .15s;min-width:140px;text-align:center;}
.access-btn:hover{background:var(--papaya-dark);border-color:var(--papaya-dark);}
.access-btn:focus{outline:2px solid var(--papaya);outline-offset:2px;}
.access-btn.is-active{background:var(--papaya);border-color:var(--ink-900);box-shadow:0 0 0 1px var(--ink-900);color:#fff;}
@media(max-width:600px){.access-btn{flex:1 1 calc(50% - 10px);min-width:120px;}}

/* ══ TELAS DE AUTENTICAÇÃO (Login PRX e Seleção de Cliente) ══
   Classes exclusivas destas 2 telas — sem impacto em outros componentes.
   O painel é o elemento centralizado verticalmente; a logo fica posicionada
   acima dele via position:absolute, sem participar do cálculo de centralização.
   padding vertical simétrico (190px) reserva espaço suficiente para a logo (150px)
   + o espaçamento (20px) acima do painel; como é simétrico, não desloca a centralização
   quando o conteúdo cabe na tela. align-items:safe center (com fallback para center em
   navegadores sem suporte) garante que, se o painel for maior que o espaço disponível
   (tela baixa ou lista de clientes longa), ele nunca seja empurrado para fora da área
   visível — passa a alinhar pelo topo do espaço reservado em vez de ficar inacessível. */
.auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:190px 0;background-image:url('./imagem_login_fluxo.png');background-size:cover;background-position:center;background-repeat:no-repeat;}
.auth-screen{align-items:safe center;}
.auth-screen-logo{position:absolute;left:0;right:0;bottom:calc(100% + 20px);display:flex;justify-content:center;}
/* Ajuste mínimo indispensável: a imagem da logo é um canvas quadrado de 360px com grande
   espaço em branco embutido acima/abaixo da marca visível — sem reduzir a exibição aqui,
   o box da logo ficaria alto o suficiente para tornar a logo inacessível (fora da área
   visível, mesmo com rolagem) em praticamente qualquer notebook/desktop comum. */
.auth-screen-logo img{width:150px!important;}
/* Logo dentro do card de Login — exclusiva desta instância, não afeta .auth-screen-logo
   (usada pela tela de Seleção de Clientes, que permanece com a logo acima do painel). */
.login-panel-logo{display:flex;justify-content:center;margin-bottom:10px;}
.login-panel-logo img{width:90px!important;}
</style>
