<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ─────────────────────────────────────────────────────────────
// SECTION 1 — CONFIG (Supabase client + empresa context)
// ─────────────────────────────────────────────────────────────

const SUPABASE_URL = 'https://mnhbmipbiegialdsiyln.supabase.co';
const SUPABASE_ANON = 'sb_publishable_1X0TIJqFR-iG1JJkmlEE8A_9CW4fMIz';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
  auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: true },
});
let EMPRESA_ID = null; // set after auth; read by loadS / saveS

// ─────────────────────────────────────────────────────────────
// SECTION 2 — CONSTANTS
// ─────────────────────────────────────────────────────────────

// Storage keys (localStorage bridge keys + Supabase table map)
const KEYS = {
  entradas:  'zanon_entradas',
  contas:    'zanon_contas',
  dividas:   'zanon_dividas',
  retiradas: 'zanon_retiradas',
  config:    'zanon_config',
};

const TABELAS = {
  zanon_entradas:  'entradas',
  zanon_contas:    'contas',
  zanon_dividas:   'dividas',
  zanon_retiradas: 'retiradas',
  zanon_config:    'config',
};

const defaultConfig = {
  saldoInicial:             15000,
  retiradaIdeal:            8000,
  metaPagamentoPercentual:  85,
  metasManuaisPorMes:       {},
};

// Calendar / month labels
const MONTHS       = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MONTHS_SHORT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

// Bills — domain enums
const CATEGORIAS   = ['Fornecedores','Folha de Pagamento','Impostos','Aluguel','Energia','Água','Sistema','Contador','Jurídico','Manutenção','Marketing','Banco/Juros','Retirada dos Donos','Outros'];
const STATUS_LIST  = ['A vencer','Pago','Vencido','Renegociado'];
const TIPO_DESPESA = ['Fixa','Variável','Fornecedor','Financeira'];
// Normaliza variações antigas/alternativas do campo tipoDespesa para as 4 categorias canônicas,
// sem alterar o dado original armazenado — usado apenas para leitura/filtragem (Contas a Pagar).
const normTipoDespesa=t=>{
  const s=(t||'').toString().trim().toLowerCase();
  if(['fixa','fixas','despesa fixa','despesas fixas'].includes(s))return'Fixa';
  if(['variável','variavel','variáveis','variaveis','despesa variável','despesa variavel','despesas variáveis'].includes(s))return'Variável';
  if(['fornecedor','fornecedores'].includes(s))return'Fornecedor';
  if(['financeira','financeiras','despesa financeira','despesas financeiras'].includes(s))return'Financeira';
  return'Variável';
};
const CATEGORIAS_TIPO=['Todas',...TIPO_DESPESA];
const NOME_CAT_CHIP={Todas:'Todas',Fixa:'Fixas',Variável:'Variáveis',Fornecedor:'Fornecedores',Financeira:'Financeiras'};
const NOME_CAT_FULL={Todas:'Todas as Categorias',Fixa:'Despesas Fixas',Variável:'Despesas Variáveis',Fornecedor:'Fornecedores',Financeira:'Despesas Financeiras'};
const FORMAS_PAG   = ['PIX','Boleto','Dinheiro','Débito em conta','Cartão','Transferência','Cheque','Outro'];
const CONTAS_SAIDA = ['Banco principal','Banco secundário','Caixa físico','Conta pessoal do sócio','Outro'];
const SEGMENTOS    = ['Açougue','Padaria','Hortifruti','Bebidas','Mercearia Seca','Mercearia Salgada','Mercearia Doce','Lacticínios','Embalagens'];

// Debts — domain enums
const TIPOS_DIVIDA  = ['Capital de Giro','Cheque Especial','Empréstimo','Financiamento','Cartão','Antecipação','Renegociação','Fornecedor Renegociado','Outros'];
const STATUS_DIVIDA = ['Ativa','Quitada','Renegociada','Suspensa'];

// Receivables default settlement days by payment method
const DEFAULT_PRAZOS = { dinheiro: 0, pix: 0, debito: 1, credito: 30, voucher: 30, outros: 1 };

// ══════════════════════════════════════════════════════════════════════════
// IMPORTAÇÃO DE ENTRADAS VIA EXCEL (.xlsx) — helpers puros, sem I/O.
// Formato de referência: aba "Consolidado", colunas DATA | DÉBITO | CRÉDITO |
// VOUCHER | PIX | TOTAL, uma linha por dia e uma linha final "TOTAL GERAL".
// ══════════════════════════════════════════════════════════════════════════
const ENT_IMP_ABA='Consolidado';
const ENT_IMP_COLS=['DATA','DEBITO','CREDITO','VOUCHER','PIX','TOTAL'];
// Prazos oferecidos por modalidade na etapa "Regras de recebimento". São PRAZOS normais,
// nunca antecipação.
const ENT_IMP_PRAZOS={debito:[0,1,2],credito:[0,1,30],voucher:[0,1,30],pix:[0]};
const ENT_IMP_PADRAO={debito:1,credito:30,voucher:30,pix:0};

// Normaliza cabeçalho: sem acento, sem espaço nas pontas, maiúsculo.
const entImpNorm=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toUpperCase();

// Serial do Excel (base 1900) → 'YYYY-MM-DD'. Conversão inteiramente em UTC: usar Date local
// deslocaria o dia em fusos negativos como o do Brasil. Também aceita string dd/mm/aaaa ou
// já-ISO, para o caso de a planilha vir com a coluna formatada como texto.
const entImpData=v=>{
  if(typeof v==='number'&&Number.isFinite(v)){
    if(v<1||v>2958465)return null; // fora do intervalo de datas do Excel
    const d=new Date(Math.round((v-25569)*86400000));
    return isNaN(d.getTime())?null:d.toISOString().slice(0,10);
  }
  const s=String(v==null?'':v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  const br=s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(br)return `${br[3]}-${br[2]}-${br[1]}`;
  return null;
};

// Valor monetário de célula: número, ou string numérica (BR ou EN). Vazio = 0.
// Devolve null quando o conteúdo não é interpretável — a linha vira inválida.
const entImpValor=v=>{
  if(v==null||v==='')return 0;
  if(typeof v==='number')return Number.isFinite(v)?Math.round(v*100)/100:null;
  const s=String(v).trim();
  if(!s)return 0;
  if(!/[\d]/.test(s))return null;
  if(!/^-?\s*(R\$)?\s*[\d.,]+$/.test(s))return null;
  const n=parseCurrencyBR(s);
  return Number.isFinite(n)?Math.round(n*100)/100:null;
};

// Detecta a linha de fechamento do arquivo (não é uma Entrada diária).
const entImpEhTotalGeral=v=>/^TOTAL\s*GERAL$/.test(entImpNorm(v));

// ── PARSER ──
// Recebe a matriz (array de arrays) da aba e devolve diagnóstico + linhas classificadas.
// Não decide persistência; só interpreta e valida.
const entImpParse=(aoa,datasExistentes)=>{
  const res={erroFatal:null,cabecalho:null,linhas:[],totalGeral:null};
  const linhasBrutas=(aoa||[]).filter(r=>Array.isArray(r));
  if(!linhasBrutas.length){res.erroFatal='A aba está vazia.';return res;}
  const head=linhasBrutas[0].map(entImpNorm);
  const faltando=ENT_IMP_COLS.filter(c=>!head.includes(c));
  if(faltando.length){
    res.erroFatal=`Cabeçalho incompatível. Não encontrei: ${faltando.join(', ')}. Esperado: ${ENT_IMP_COLS.join(' | ')}.`;
    return res;
  }
  res.cabecalho=head;
  const ix={};ENT_IMP_COLS.forEach(c=>{ix[c]=head.indexOf(c);});
  const jaVistas=new Set();
  const existentes=new Set(datasExistentes||[]);

  linhasBrutas.slice(1).forEach((r,i)=>{
    const nLinha=i+2; // 1-based, contando o cabeçalho
    const vazia=r.every(c=>c==null||String(c).trim()==='');
    if(vazia)return;
    const bruta=r[ix.DATA];
    // TOTAL GERAL — conferência do arquivo, jamais um lançamento
    if(entImpEhTotalGeral(bruta)){
      res.totalGeral={
        debito:entImpValor(r[ix.DEBITO]),credito:entImpValor(r[ix.CREDITO]),
        voucher:entImpValor(r[ix.VOUCHER]),pix:entImpValor(r[ix.PIX]),
        total:entImpValor(r[ix.TOTAL]),linha:nLinha,
      };
      return;
    }
    const data=entImpData(bruta);
    if(!data){res.linhas.push({linha:nLinha,status:'invalida',motivo:'Data inválida ou não reconhecida.',dataBruta:String(bruta==null?'':bruta)});return;}
    const debito=entImpValor(r[ix.DEBITO]),credito=entImpValor(r[ix.CREDITO]);
    const voucher=entImpValor(r[ix.VOUCHER]),pix=entImpValor(r[ix.PIX]);
    const totalArq=entImpValor(r[ix.TOTAL]);
    if([debito,credito,voucher,pix].some(v=>v===null)){
      res.linhas.push({linha:nLinha,data,status:'invalida',motivo:'Há valor não numérico entre as modalidades.'});return;
    }
    if([debito,credito,voucher,pix].some(v=>v<0)){
      res.linhas.push({linha:nLinha,data,status:'invalida',motivo:'Valor negativo não é aceito.'});return;
    }
    // O valor da Entrada vem SEMPRE das modalidades; a coluna TOTAL só confere.
    const total=Math.round((debito+credito+voucher+pix)*100)/100;
    if(totalArq!==null&&Math.abs(total-totalArq)>0.01){
      res.linhas.push({linha:nLinha,data,debito,credito,voucher,pix,total,totalArq,status:'invalida',
        motivo:`TOTAL divergente: planilha ${fmt(totalArq)} × soma das modalidades ${fmt(total)}.`});return;
    }
    if(total<=0){res.linhas.push({linha:nLinha,data,status:'invalida',motivo:'Linha sem valor (total zero).'});return;}
    if(jaVistas.has(data)){res.linhas.push({linha:nLinha,data,status:'invalida',motivo:'Data repetida dentro do próprio arquivo.'});return;}
    jaVistas.add(data);
    if(existentes.has(data)){
      res.linhas.push({linha:nLinha,data,debito,credito,voucher,pix,total,status:'existente',
        motivo:'Já existe um lançamento desta data nesta unidade.'});return;
    }
    res.linhas.push({linha:nLinha,data,debito,credito,voucher,pix,total,status:'valida'});
  });
  return res;
};

// Agrega a prévia a partir do resultado do parser.
const entImpResumo=res=>{
  const validas=res.linhas.filter(l=>l.status==='valida');
  const existentes=res.linhas.filter(l=>l.status==='existente');

};

// Currency — parse
// Accepts: 14210 / "14.210,00" / "14210,00" / "R$ 14.210,00"
const parseCurrencyBR = v => {
  if (v === null || v === undefined || v === '') return 0;
  let s = v.toString().trim().replace(/\s/g, '').replace(/R\$\s*/gi, '');
  const lastComma = s.lastIndexOf(',');
  const lastDot   = s.lastIndexOf('.');
  if (lastComma > lastDot) {
    s = s.replace(/\./g, '').replace(',', '.'); // BR format: dots=thousands, comma=decimal
  } else {
    s = s.replace(/,/g, '');                    // EN format or plain integer
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
};

// Currency — format
function formatCurrency(value) {
  const number = Number(value || 0);

  return number.toLocaleString('pt-BR', {
    style: 'currency',
    currency: 'BRL'
  });
}
// Percent — parse: accepts "1,43" / "1.43" / "1,43%" → stores as 1.43
const parsePercentBR = v => {
  if (v === null || v === undefined || v === '') return 0;
  const s = v.toString().trim().replace('%', '').replace(',', '.');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
};

const formatCurrencyBR = value => {
  const number = Number(value || 0);

  return number.toLocaleString('pt-BR', {
    style: 'currency',
    currency: 'BRL'
  });
};

// Percent — format
const formatPercentBR = n => {
  if (n === null || n === undefined || isNaN(n)) return '0,00%';
  return n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';
};

const fmtFull  = formatCurrencyBR; // semantic alias (full currency label)

  mon.setDate(dt.getDate() - (day === 0 ? 6 : day - 1));

};
const monthStart  = (y, m) => `${y}-${String(m + 1).padStart(2, '0')}-01`;
const monthEnd    = (y, m) => new Date(y, m + 1, 0).toISOString().split('T')[0];
const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
const addDays     = (d, n) => { const dt = new Date(d); dt.setDate(dt.getDate() + n); return dt.toISOString().split('T')[0]; };
const monthOf     = d => d ? d.substring(0, 7) : ''; // "2026-06" from any ISO date

// Competência key: "2026-06" for June 2026
const chaveCompetencia = (year, month) => `${year}-${String(month + 1).padStart(2, '0')}`;

// Returns the effective daily payment goal for a given month.
// A manually set goal (config.metasManuaisPorMes) takes priority over the automatic one.
const getMetaDiariaEfetiva = (mediaDiariaEnt, metaPercentual, config, year, month) => {
  const chaveMes = chaveCompetencia(year, month);
  const mapa     = (config && config.metasManuaisPorMes) || {};
  const manual   = mapa[chaveMes];
  if (typeof manual === 'number' && manual > 0) {
    return { valor: manual, isManual: true, chaveMes };
  }
  return { valor: mediaDiariaEnt * (metaPercentual / 100), isManual: false, chaveMes };
};

// ══════════════════════════════════════════════════════════════════════════
// CALENDÁRIO INTELIGENTE (Painel do Dono) — motor diário de CAIXA.
// Helpers puros, sem I/O. Não substituem nenhum motor existente: a conversão
// venda → caixa das vendas REAIS continua sendo feita por projDataRecebimento.
// ══════════════════════════════════════════════════════════════════════════

const CAL_WD_NOMES=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];

// Ocorrência ordinal de uma data: "2ª quinta" = {weekday:4, ordinal:2}.
// T12:00:00 evita a virada de dia por fuso (mesmo padrão de projDow).
const calOrdinalDe=iso=>{
  const d=new Date(iso+'T12:00:00');
  return{weekday:d.getDay(),ordinal:Math.ceil(d.getDate()/7)};
};

// Referência histórica do MÊS ANTERIOR ao mês (ano,mes) informado, indexada por
// (dia da semana × ocorrência ordinal) — nunca pelo número da data.
// Também acumula a média por dia da semana, usada como fallback quando o mês
// anterior não tem a n-ésima ocorrência (ex.: 5ª sexta contra um mês de 4 sextas).
// Modalidades que admitem projeção histórica. Dinheiro e Outros NUNCA são projetados
// (regra aprovada): só aparecem quando há venda real.
const CAL_MOD_PROJETADAS=['debito','pix','credito','voucher'];

const calRefAnterior=(entradas,ano,mes)=>{
  const py=mes===0?ano-1:ano,pm=mes===0?11:mes-1;
  const ini=monthStart(py,pm),fim=monthEnd(py,pm);
  const porOrd={},porWd={};
  (entradas||[]).forEach(e=>{
    if(!e||!projDataValida(e.data)||e.data<ini||e.data>fim)return;
    const{weekday,ordinal}=calOrdinalDe(e.data);
    const chave=weekday+'-'+ordinal;
    if(!porOrd[chave])porOrd[chave]={};
    if(!porWd[weekday])porWd[weekday]={n:0};
    CAL_MOD_PROJETADAS.forEach(f=>{
      const v=projNum(e[f]);
      porOrd[chave][f]=(porOrd[chave][f]||0)+v;
      porWd[weekday][f]=(porWd[weekday][f]||0)+v;
    });
    porWd[weekday].n+=1;
  });
  return{porOrd,porWd};
};

// Venda projetada para uma data futura, pela ocorrência ordinal equivalente do mês
// anterior. Fallback aprovado: média das ocorrências daquele MESMO dia da semana no mês
// anterior. Devolve a VENDA — a conversão em caixa (D+X) é feita por quem chama.
const calVendaProjetada=(ref,iso)=>{
  const{weekday,ordinal}=calOrdinalDe(iso);
  const exata=ref.porOrd[weekday+'-'+ordinal];
  const out={fallback:false};
  if(exata){
    CAL_MOD_PROJETADAS.forEach(f=>{out[f]=projNum(exata[f]);});
    return out;
  }
  const m=ref.porWd[weekday];
  if(m&&m.n>0){
    out.fallback=true;
    CAL_MOD_PROJETADAS.forEach(f=>{out[f]=projNum(m[f])/m.n;});
    return out;
  }
  CAL_MOD_PROJETADAS.forEach(f=>{out[f]=0;});
  return out;
};

// ══════════════════════════════════════════════════════════════════════════
// SÉRIE ÚNICA DE ENTRADA DE CAIXA DO MÊS — fonte de verdade do Placar E do
// Calendário. Não é um segundo motor: a conversão venda → caixa das vendas REAIS
// continua sendo feita por projDataRecebimento, e a projeção reusa os helpers
// ordinais acima. Nada aqui é persistido.
//
// Precedência: VENDA REAL > VENDA PROJETADA, decidida pela DATA DA VENDA.
//
// Janela de origem: recua o maior prazo configurado entre as modalidades projetadas,
// porque uma venda projetada do mês anterior pode virar caixa dentro deste mês
// (ex.: crédito D+30 vendido em 20/07 entra em 19/08). Sem esse recuo o mês
// apareceria truncado. A referência ordinal é sempre a do mês ANTERIOR ao da própria
// venda — por isso o cache por competência, e não uma referência única.
// ══════════════════════════════════════════════════════════════════════════
const buildCaixaProjetadoMes=({entradas,ano,mes,prazos,hoje})=>{
  const ini=monthStart(ano,mes),fim=monthEnd(ano,mes);
  const porDia={};
  for(let d=ini;d<=fim;d=addDays(d,1))porDia[d]={data:d,real:0,projetado:0,entra:0};
  const dentro=iso=>Object.prototype.hasOwnProperty.call(porDia,iso);

  // 1) Vendas REAIS → caixa, pelo motor existente (antecipação › prazo congelado › global).
  const datasReais=new Set();
  (entradas||[]).forEach(e=>{
    if(!e||!projDataValida(e.data))return;
    datasReais.add(e.data);
    PROJ_MODALIDADES.forEach(forma=>{
      const v=projNum(e[forma]);
      if(v<=0)return;
      const dr=projDataRecebimento(e,forma,prazos);
      if(projDataValida(dr)&&dentro(dr)){porDia[dr].real+=v;porDia[dr].entra+=v;}
    });
  });

  // 2) Vendas PROJETADAS para dias FUTUROS sem venda real, convertidas em caixa pelo
  //    prazo ATUAL da modalidade (projeção não tem prazo congelado).
  const refs={};
  const refDe=iso=>{
    const y=Number(iso.slice(0,4)),m=Number(iso.slice(5,7))-1,k=y+'-'+m;
    if(!refs[k])refs[k]=calRefAnterior(entradas,y,m);
    return refs[k];
  };
  const prazoDe=f=>Math.max(0,projNum(prazos&&prazos[f]));
  const maxPrazo=Math.max(0,...CAL_MOD_PROJETADAS.map(prazoDe));
  for(let s=addDays(ini,-maxPrazo);s<=fim;s=addDays(s,1)){
    if(s<=hoje)continue;        // só dia estritamente futuro é projetável
    if(datasReais.has(s))continue; // REAL prevalece — nunca sobrepor venda registrada
    const vp=calVendaProjetada(refDe(s),s);
    CAL_MOD_PROJETADAS.forEach(f=>{
      const v=projNum(vp[f]);
      if(v<=0)return;
      const alvo=addDays(s,prazoDe(f));
      if(dentro(alvo)){porDia[alvo].projetado+=v;porDia[alvo].entra+=v;}
    });
  }

  let total=0;
  Object.keys(porDia).forEach(k=>{
    porDia[k].real=projCents(porDia[k].real);
    porDia[k].projetado=projCents(porDia[k].projetado);
    porDia[k].entra=projCents(porDia[k].entra);
    total+=porDia[k].entra;
  });
  return{porDia,total:projCents(total)};
};

// Synchronous localStorage — only for keys not backed by Supabase (e.g. zanon_prazos)
const loadLocalS = k    => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } };
const saveLocalS = (k, d) => { try { localStorage.setItem(k, JSON.stringify(d)); } catch {} };

// Busca TODAS as páginas de uma consulta Supabase via .range(), contornando o limite padrão
// de linhas por resposta da API (ex.: 1000) — sem isso, tabelas que crescem além desse limite
// teriam parte dos registros silenciosamente ausente do array carregado em memória.
// queryFactory(from,to) deve retornar uma NOVA query (com .range(from,to) já aplicado) a cada
// chamada — um query builder do Supabase é de uso único e não pode ser reaproveitado entre páginas.
// ORDENAÇÃO ESTÁVEL (obrigatória): .range() vira LIMIT/OFFSET no PostgreSQL, que NÃO garante
// ordem entre execuções sem ORDER BY. Sem isso, a página 2 pode repetir linhas já vistas na
// página 1 e omitir outras (um UPDATE realoca fisicamente a tupla no heap). Cada queryFactory
// abaixo aplica .order('id',{ascending:true}) ANTES de .range(from,to) — a ordenação precisa
// estar DENTRO da factory porque cada página monta uma query nova.
const SUPABASE_PAGE_SIZE = 1000;
const fetchAllPages = async (queryFactory, contexto) => {
  let all = [];
  let from = 0;
  let paginas = 0;
  while (true) {
    const to = from + SUPABASE_PAGE_SIZE - 1;
    const { data, error } = await queryFactory(from, to);
    if (error) throw error;
    paginas++;
    const rows = data || [];
    all = all.concat(rows);
    if (rows.length < SUPABASE_PAGE_SIZE) break; // última página (veio incompleta ou vazia)
    from += SUPABASE_PAGE_SIZE;
  }
  // DEDUPLICAÇÃO DEFENSIVA por id — rede de segurança para o caso de a ordenação não cobrir
  // alguma fronteira de página. Preserva a PRIMEIRA ocorrência e a ordem original; não toca nos
  // objetos; registros sem id passam intactos (nunca deduplicados por composição de campos).
  const seen = new Set();
  const unique = all.filter(row => {
    if (!row || !row.id) return true;
    if (seen.has(row.id)) return false;
    seen.add(row.id);
    return true;
  });
  if (typeof window !== 'undefined' && window.__PRX_AUDIT__) {
    console.log('PRX_AUDIT_11 — Paginação', JSON.stringify({
      contexto: contexto || '(sem contexto)',
      paginas,
      totalBruto: all.length,
      totalAposDedup: unique.length,
      duplicadosRemovidos: all.length - unique.length,
    }));
  }
  return unique;
};

// ═══════════════════════════════════════════════════════════════════════════
// AUDITORIA FORENSE TEMPORÁRIA (PRX_AUDIT) — remover ao final da investigação.
// Só produz efeito (logs) quando window.__PRX_AUDIT__===true é setado manualmente
// no console do navegador. Nenhuma função abaixo altera cálculo, filtro, query,
// reducer, estado React ou JSX — apenas observa e compara dados já produzidos
// pelo sistema. Com a flag desligada (padrão), estas definições ficam inertes.
// ═══════════════════════════════════════════════════════════════════════════
if (typeof window !== 'undefined') {
  window.__prxAuditStore = window.__prxAuditStore || { A: {}, B: {} };
  window.__prxAuditSeq = window.__prxAuditSeq || 0;
  window.__prxAuditMaxSeqFinished = window.__prxAuditMaxSeqFinished || 0;
}
// Chave estável por registro — usa o id real quando disponível; para sintéticos
// sem id confiável, cai para uma composição empresa+origem+vencimento+valor.
const __prxAuditKey = r => {
  if (r && r.id) return `id:${r.id}`;
  if (!r) return 'null';
  const origem = r.dividaVinculadaId ? `divida:${r.dividaVinculadaId}` : `desc:${r.descricao||''}`;
  return `auto:${r.empresa_id||''}:${origem}:${r.vencimento}:${r.valor}`;
};
const __prxAuditDupCount = arr => {
  const seen = new Map();
  arr.forEach(r => { const k = __prxAuditKey(r); seen.set(k, (seen.get(k)||0)+1); });
  return [...seen.entries()].filter(([,c]) => c > 1).map(([k,c]) => ({ key: k, ocorrencias: c }));
};
const __prxAuditFields = r => ({
  id: r.id, empresa_id: r.empresa_id, descricao: r.descricao, tipoDespesa: r.tipoDespesa,
  vencimento: r.vencimento, status: r.status, valor: r.valor,
  dividaVinculadaId: r.dividaVinculadaId || '', _autoGerado: !!r._autoGerado,
});
const __prxAuditCompare = (empresaId, mesKey, listA, listB) => {
  const mapA = new Map(listA.map(r => [__prxAuditKey(r), r]));
  const mapB = new Map(listB.map(r => [__prxAuditKey(r), r]));
  const apenasA = [...mapA.keys()].filter(k => !mapB.has(k)).map(k => mapA.get(k));
  const apenasB = [...mapB.keys()].filter(k => !mapA.has(k)).map(k => mapB.get(k));
  const valoresDiferentes = [], datasDiferentes = [], statusDiferentes = [];
  mapA.forEach((ra, k) => {
    const rb = mapB.get(k);
    if (!rb) return;
    if (ra.valor !== rb.valor) valoresDiferentes.push({ key: k, painel: ra.valor, portfolio: rb.valor });
    if (ra.vencimento !== rb.vencimento) datasDiferentes.push({ key: k, painel: ra.vencimento, portfolio: rb.vencimento });
    if ((ra.status||'') !== (rb.status||'')) statusDiferentes.push({ key: k, painel: ra.status, portfolio: rb.status });
  });
  console.log('PRX_AUDIT_07 — Diferenças de registros', JSON.stringify({
    empresaId, mesKey,
    qtdA: listA.length, totalA: listA.reduce((s,r)=>s+(r.valor||0),0),
    qtdB: listB.length, totalB: listB.reduce((s,r)=>s+(r.valor||0),0),
    apenasNoPainel: apenasA.map(__prxAuditFields),
    apenasNoPortfolio: apenasB.map(__prxAuditFields),
    duplicadosEmA: __prxAuditDupCount(listA),
    duplicadosEmB: __prxAuditDupCount(listB),
    valoresDiferentes, datasDiferentes, statusDiferentes,
  }));
};
// Registra o conjunto A ou B para uma empresa+mês; quando o par completo existir, compara.
const __prxAuditRegister = (side, empresaId, mesKey, list) => {
  if (typeof window === 'undefined') return;
  const chave = empresaId + '|' + mesKey;
  window.__prxAuditStore[side][chave] = list;
  const outro = side === 'A' ? 'B' : 'A';
  const contraparte = window.__prxAuditStore[outro][chave];
  if (contraparte) {
    __prxAuditCompare(empresaId, mesKey, side === 'A' ? list : contraparte, side === 'A' ? contraparte : list);
  }
};

// Async load: Supabase for registered TABELAS keys, localStorage for everything else
const loadS = async chave => {
  const tabela = TABELAS[chave];
  if (!tabela)          return loadLocalS(chave);
  if (!EMPRESA_ID)      return null;
  if (tabela === 'config') {
    const { data, error } = await supabase.from('config').select('*').eq('empresa_id', EMPRESA_ID).maybeSingle();
    if (error) throw error;
    return data || null;
  }
  // Captura a empresa ativa ANTES do carregamento paginado (múltiplos awaits em sequência),
  // garantindo que uma eventual troca de empresa durante o carregamento não misture registros.
  const empresaIdCapturada = EMPRESA_ID;
  return await fetchAllPages((from, to) => supabase.from(tabela).select('*').eq('empresa_id', empresaIdCapturada).order('id', { ascending: true }).range(from, to), 'loadS:' + tabela);
};

// Async save: upsert for config, DELETE + INSERT for array tables (full replacement per company)
const saveS = async (chave, dados) => {
  const tabela = TABELAS[chave];
  if (!tabela)     { saveLocalS(chave, dados); return; }
  if (!EMPRESA_ID) return;
  if (tabela === 'config') {
    // UPSERT config — erro indica RLS bloqueando escrita ou constraint violada.
    // Causa mais comum: policy empresa_propria não cobre o EMPRESA_ID ativo (ex: PRX sem policy).
    const { error: upsertErr } = await supabase.from('config').upsert({ ...dados, empresa_id: EMPRESA_ID });
    if (upsertErr) { console.error('SUPABASE ERROR [upsert config]:', upsertErr); throw upsertErr; }
    return;
  }
  // DELETE — apaga todos os rows da empresa antes de reinserir (substituição completa).
  // Erro aqui indica RLS bloqueando DELETE ou problema de permissão na tabela.
  const { error: deleteErr } = await supabase.from(tabela).delete().eq('empresa_id', EMPRESA_ID);
  if (deleteErr) { console.error('SUPABASE ERROR [delete ' + tabela + ']:', deleteErr); throw deleteErr; }
  if (Array.isArray(dados) && dados.length > 0) {
    const rows = dados.map(d => {
      const row = { empresa_id: EMPRESA_ID };
      Object.entries(d).forEach(([k, v]) => { if (!k.startsWith('_')) row[k] = v; });
      return row;
    });
    // INSERT — grava os novos rows com empresa_id do contexto ativo.
    // Erro aqui indica RLS bloqueando INSERT, constraint violada ou empresa_id inválido.
    const { error: insertErr } = await supabase.from(tabela).insert(rows);
    if (insertErr) { console.error('SUPABASE ERROR [insert ' + tabela + ']:', insertErr); throw insertErr; }
  }
};

// ─── Entrada operations — INSERT incremental para o importador ────────────────
// NUNCA usar saveS aqui: saveS apaga todas as Entradas da empresa e reinsere o array inteiro,
// o que destruiria o histórico a cada importação. Este caminho só ACRESCENTA linhas novas.
const sanitizeEntradaForSupabase=(e,empresaId)=>{
  const row={empresa_id:empresaId};
  Object.entries(e).forEach(([k,v])=>{if(!k.startsWith('_')&&v!==undefined)row[k]=v;});
  return row;
};
// AUTORIDADE FINAL no banco: o índice único entradas_empresa_data_uidx (empresa_id, data).
// `ignoreDuplicates:true` emite INSERT ... ON CONFLICT DO NOTHING — a linha em conflito é
// IGNORADA, nunca sobrescrita nem atualizada, e nada é apagado. O .select() devolve SOMENTE
// as linhas efetivamente inseridas, o que permite reportar números reais mesmo se outra
// sessão gravar a mesma data enquanto a importação era preparada.
const insertEntradasBatch=async(lista,empresaId)=>{
  if(!lista||!lista.length)return[];
  const rows=lista.map(e=>sanitizeEntradaForSupabase(e,empresaId));
  const{data,error}=await supabase.from('entradas')
    .upsert(rows,{onConflict:'empresa_id,data',ignoreDuplicates:true})
    .select('id,data');
  if(error)throw error;
  return data||[];
};

    if (!ref.current) return;
    const existing = Chart.getChart(ref.current);
    if (existing) existing.destroy();

}

// ── MODAL ──
function Modal({title,onClose,children}){
  return(
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="flex items-center justify-between" style={{marginBottom:13}}>
          <div style={{fontSize:14,fontWeight:700}}>{title}</div>
          <button className="btn btn-secondary btn-sm" onClick={onClose}>✕ Fechar</button>
        </div>
        {children}
      </div>
    </div>
  );
}

// ── PAGE HEADER ──
function PageHeader({icon,title,sub,actions,leftExtras}){
  return(
    <div className="page-hdr">
      <div className="page-hdr-l">
        <div className="page-hdr-ico">{icon}</div>
        <div>
          <div className="page-hdr-title">{title}</div>
          {sub&&<div className="page-hdr-sub">{sub}</div>}
        </div>
        {leftExtras}
      </div>
      {actions&&<div className="page-hdr-r">{actions}</div>}
    </div>
  );
}

// ── COMP GROUP ──
function CompGroup({label,color,total,totalGeral,items,expand,setExpand,emptyMsg}){
  const pctVal=totalGeral>0?pct(total,totalGeral):0;
  return(
    <div className="comp-group">
      <div className="comp-group-header">
        <div className="comp-group-name">
          <div className="comp-group-dot" style={{background:color}}></div>
          {label}
          <span className="comp-group-pct">{pctVal}%</span>
        </div>
        <div className="comp-group-total">{fmtFull(total)}</div>
      </div>
      <div className="comp-prog-bg">
        <div className="comp-prog" style={{width:pctVal+'%',background:color}}></div>
      </div>
      {(expand?items:items.slice(0,5)).map(([n,v],i)=>(
        <div key={i} className="comp-item">
          <div className="comp-item-name" title={n}>{n}</div>
          <div className="comp-item-val">{fmt(v)}</div>
        </div>
      ))}
      {items.length>5&&<button className="comp-expand" onClick={()=>setExpand(!expand)}>{expand?'▲ menos':'▼ +'+(items.length-5)+' itens'}</button>}
      {items.length===0&&<div style={{fontSize:10,color:'var(--text-muted)',paddingTop:2}}>{emptyMsg}</div>}
    </div>
  );
}

// SUGESTÃO AUTOMÁTICA DE REDISTRIBUIÇÃO
// ══════════════════════════════════
function SugestaoRedistribuicao({contas,mediaDiariaEnt,metaPercentual,metaDiariaPagamento,metaIsManual,mesLabel}){
  const todayStr=today();
  const todayDate=new Date(todayStr+'T12:00:00');
  const dayOfWeek=todayDate.getDay(); // 0=Dom, 6=Sáb

  // Meta diária EFETIVA recebida do Painel (manual se cadastrada; senão automática)
  // Fallback defensivo: se não vier por props, recalcula como antes.
  if(typeof metaDiariaPagamento!=='number'){
    metaDiariaPagamento=mediaDiariaEnt*(metaPercentual/100);
    metaIsManual=false;
  }

  // Pagamentos do dia de hoje (não pagos)
  const pagHoje=contas.filter(c=>c.vencimento===todayStr&&c.status!=='Pago');
  const totalPagHoje=pagHoje.reduce((s,c)=>s+c.valor,0);

  // É fim de semana?
  const isFimDeSemana=dayOfWeek===0||dayOfWeek===6;
  const dateLabel=todayDate.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});

  let msgContent=null;

  if(isFimDeSemana){
    msgContent=<p className="rd-msg neutro">Hoje é <strong>{dayOfWeek===6?'sábado':'domingo'}</strong> — dia sem pagamentos operacionais. O caixa descansa.</p>;
  } else if(mediaDiariaEnt===0&&!metaIsManual){
    msgContent=<p className="rd-msg neutro">Registre as entradas do mês para ativar a análise de meta diária de pagamento.</p>;
  } else if(metaDiariaPagamento<=0){
    msgContent=<p className="rd-msg neutro">Defina uma meta diária (automática ou manual) para ativar a análise de redistribuição.</p>;
  } else if(totalPagHoje===0){
    msgContent=<p className="rd-msg ok">Hoje não há necessidade de redistribuição. O dia está livre de vencimentos.</p>;
  } else {
    const diferenca=totalPagHoje-metaDiariaPagamento;
    if(diferenca>0){
      msgContent=(
        <>
          <p className="rd-msg" style={{color:'#78350f'}}>Hoje estamos <strong>acima da meta diária</strong> em <strong>{fmtFull(diferenca)}</strong>.</p>
          <p className="rd-msg" style={{color:'#92400e',marginTop:5}}>Considere redistribuir parte dos vencimentos para outro dia, aliviando a pressão sobre o caixa de hoje.</p>
        </>
      );
    } else {
      const folga=Math.abs(diferenca);
      msgContent=(
        <>
          <p className="rd-msg ok">O dia está <strong>dentro da meta diária de pagamento</strong>.</p>
          <p className="rd-msg ok" style={{marginTop:5}}>Há folga saudável de <strong>{fmtFull(folga)}</strong> em relação à meta diária.</p>
        </>
      );
    }
  }

  return(
    <div className="redistribuicao">
      <div className="rd-top">
        <div>
          <div className="rd-title-row"><span style={{fontSize:12}}>📋</span><span className="rd-title">Sugestão de Redistribuição</span></div>
          <div className="rd-date">{dateLabel}</div>
        </div>
        {!isFimDeSemana&&totalPagHoje>0&&(
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:15,fontWeight:700,color:'#b91c1c',letterSpacing:'-.03em',lineHeight:1}}>{fmtFull(totalPagHoje)}</div>
            <div style={{fontSize:9,color:'#b45309',marginTop:1}}>previsto hoje</div>
          </div>
        )}
      </div>
      <div className="rd-divider"></div>
      {msgContent}
      {metaDiariaPagamento>0&&(
        <div className="rd-cap-note">
          💡 Meta diária: <strong style={{marginLeft:3}}>{fmtFull(metaDiariaPagamento)}</strong>
          <span style={{color:'rgba(180,83,9,.6)',marginLeft:4}}>· {metaIsManual?`manual${mesLabel?` para ${mesLabel}`:''}`:`${metaPercentual}% da média diária`}</span>
        </div>
      )}
    </div>
  );
}

const SEG_CORES=['#00A19B','#2563eb','#d97706','#7c3aed','#16a34a','#dc2626','#0891b2','#ea580c','#4f46e5','#92400e'];

function geraInsight(segArr,totalMes,topSeg,topPct,selMonth,selYear){
  if(!topSeg)return null;
  const mesNome=MONTHS[selMonth]+'/'+selYear;
  const nSegs=segArr.length;
  const top2val=segArr.slice(0,2).reduce((s,x)=>s+x.valor,0);
  const top2pct=totalMes>0?Math.round(top2val/totalMes*100):0;
  if(topPct>=50){
    return React.createElement(React.Fragment,null,
      React.createElement('strong',null,topSeg.nome),
      ' responde por ',
      React.createElement('strong',null,topPct+'%'),
      ' das compras. Concentração elevada: avaliar diversificação ou negociação por volume.'
    );
  }
  if(top2pct>=70){
    return React.createElement(React.Fragment,null,
      'Os dois maiores setores concentram ',
      React.createElement('strong',null,top2pct+'%'),
      ' do custo de compras em '+mesNome+'. Base de fornecimento pouco diversificada.'
    );
  }
  if(nSegs>=5&&topPct<30){
    return React.createElement(React.Fragment,null,
      'Compras distribuídas em ',
      React.createElement('strong',null,nSegs+' setores'),
      ', nenhum acima de ',
      React.createElement('strong',null,topPct+'%'),
      '. Boa diversificação. Oportunidade de consolidar pedidos para ganhar desconto.'
    );
  }
  return React.createElement(React.Fragment,null,
    React.createElement('strong',null,topSeg.nome),
    ' lidera com ',
    React.createElement('strong',null,formatCurrencyBR(topSeg.valor)),
    ' ('+topPct+'% do total) em '+mesNome+'.'
  );
}

function CustoSegmentos({contas,selYear,selMonth}){
  const chartRef=useRef(null);
  const mStart=monthStart(selYear,selMonth);
  const mEnd=monthEnd(selYear,selMonth);
  const prevYear=selMonth===0?selYear-1:selYear;
  const prevMonth=selMonth===0?11:selMonth-1;
  const mStartPrev=monthStart(prevYear,prevMonth);
  const mEndPrev=monthEnd(prevYear,prevMonth);

  const fornMes=contas.filter(c=>c.tipoDespesa==='Fornecedor'&&c.vencimento>=mStart&&c.vencimento<=mEnd);
  const fornPrev=contas.filter(c=>c.tipoDespesa==='Fornecedor'&&c.vencimento>=mStartPrev&&c.vencimento<=mEndPrev);

  const agrSeg=lista=>{
    const m={};
    lista.forEach(c=>{
      const key=(c.segmento&&c.segmento.trim())||(c.categoria&&c.categoria.trim())||'Sem segmento';
      if(!m[key])m[key]={nome:key,valor:0,qtd:0};
      m[key].valor+=c.valor;m[key].qtd+=1;
    });
    return Object.values(m).sort((a,b)=>b.valor-a.valor);
  };

  const segArr=agrSeg(fornMes);
  const segPrev=agrSeg(fornPrev);
  const prevMap=Object.fromEntries(segPrev.map(s=>[s.nome,s.valor]));
  const totalMes=segArr.reduce((s,x)=>s+x.valor,0);
  const totalPrevMes=segPrev.reduce((s,x)=>s+x.valor,0);
  const nSegs=segArr.length;
  const topSeg=segArr[0]||null;
  const topPct=topSeg&&totalMes>0?Math.round(topSeg.valor/totalMes*100):0;
  const deltaTotalPct=totalPrevMes>0?((totalMes-totalPrevMes)/totalPrevMes*100):null;

  const top6=segArr.slice(0,6);
  useChart(chartRef,top6.length>0?{
    type:'bar',
    data:{
      labels:top6.map(s=>s.nome.length>14?s.nome.slice(0,12)+'…':s.nome),
      datasets:[{
        data:top6.map(s=>s.valor),
        backgroundColor:top6.map((_,i)=>SEG_CORES[i%SEG_CORES.length]+'22'),
        borderColor:top6.map((_,i)=>SEG_CORES[i%SEG_CORES.length]),
        borderWidth:1.5,borderRadius:3,borderSkipped:false,
      }]
    },
    options:{
      indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{
          title:items=>top6[items[0].dataIndex].nome,
          label:ctx=>' '+formatCurrencyBR(ctx.parsed.x)+' ('+Math.round(ctx.parsed.x/totalMes*100)+'%)',
        }}
      },
      scales:{
        x:{ticks:{callback:v=>v>=1000?(v/1000).toFixed(0)+'k':v,font:{size:9},color:'#94a3b8',maxTicksLimit:4},grid:{color:'rgba(15,23,42,0.04)'},border:{display:false}},
        y:{ticks:{font:{size:10,weight:'600'},color:'#475569'},grid:{display:false},border:{display:false}}
      },
      layout:{padding:{top:2,right:14,bottom:0,left:0}},
    }
  }:null);

  const mesLabel=MONTHS[selMonth]+' '+selYear;
  const prevLabel=MONTHS[prevMonth]+' '+prevYear;

  if(segArr.length===0){
    return(
      <div className="seg-panel">
        <div className="seg-hdr">
          <div className="seg-hdr-meta">
            <div className="seg-hdr-title">Custo por Segmento</div>
            <div className="seg-hdr-period">{mesLabel}</div>
          </div>
        </div>
        <div className="seg-empty">
          Nenhum boleto de fornecedor em {mesLabel}.<br/>
          Cadastre contas com tipo <strong>Fornecedor</strong>.
        </div>
      </div>
    );
  }

  const insight=geraInsight(segArr,totalMes,topSeg,topPct,selMonth,selYear);

  return(
    <div className="seg-panel">
      <div className="seg-hdr">
        <div className="seg-hdr-meta">
          <div className="seg-hdr-title">Custo por Segmento</div>
          <div className="seg-hdr-period">{mesLabel}</div>
        </div>
        <div className="seg-hdr-kpis">
          <div className="seg-hdr-kpi">
            <div className="seg-hdr-kpi-lbl">Total comprado</div>
            <div className="seg-hdr-kpi-val">{formatCurrencyBR(totalMes)}</div>
            <div className="seg-hdr-kpi-sub">
              {deltaTotalPct!==null?(
                <span style={{color:deltaTotalPct>0?'var(--red-dim)':'var(--green-dim)',fontWeight:700}}>
                  {deltaTotalPct>0?'+':''}{deltaTotalPct.toFixed(0)}% vs {prevLabel}
                </span>
              ):(nSegs+' setor'+(nSegs===1?'':'es'))}
            </div>
          </div>
          {deltaTotalPct!==null&&<div className="seg-hdr-div"/>}
          {deltaTotalPct!==null&&(
            <div className="seg-hdr-kpi">
              <div className="seg-hdr-kpi-lbl">Setores</div>
              <div className="seg-hdr-kpi-val">{nSegs}</div>
              <div className="seg-hdr-kpi-sub">{nSegs===1?'categoria':'categorias'}</div>
            </div>
          )}
        </div>
      </div>
      <div className="seg-chart-area">
        <div className="seg-chart-canvas"><canvas ref={chartRef}></canvas></div>
      </div>
      {insight&&<div className="seg-insight">{insight}</div>}
      <div className="seg-list">
        {segArr.map((s,i)=>{
          const p=totalMes>0?Math.round(s.valor/totalMes*100):0;
          const prev=prevMap[s.nome]||0;
          const delta=prev>0?((s.valor-prev)/prev*100):null;
          const dClass=delta===null?'eq':delta>5?'up':delta<-5?'down':'eq';
          const dLabel=delta===null?'—':(delta>0?'+':'')+delta.toFixed(0)+'%';
          return(
            <div className="seg-row" key={i}>
              <span className="seg-rank">{i+1}</span>
              <div className="seg-name-wrap">
                <span className="seg-dot" style={{background:SEG_CORES[i%SEG_CORES.length]}}></span>
                <span className="seg-name" title={s.nome}>{s.nome}</span>
              </div>
              <div className="seg-val-wrap">
                <span className="seg-val">{formatCurrencyBR(s.valor)} <span className="seg-val-pct">· {p}%</span></span>
                <span className={'seg-delta '+dClass}>{dLabel} vs {MONTHS_SHORT[prevMonth]}</span>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Painel({entradas,contas,dividas,retiradas,config,setConfig,selectedYear,setSelectedYear,selectedMonth,setSelectedMonth,header,nomeUnidadeAtiva}){
  const now=new Date();
  // Alias locais para manter o código existente legível — sem useState próprio.
  const selYear=selectedYear;
  const selMonth=selectedMonth;
  const setSelYear=setSelectedYear;
  const setSelMonth=setSelectedMonth;
  // Calendário Financeiro acompanha o mês global (sem estado independente).
  const calYear=selectedYear;
  const calMonth=selectedMonth;
  const[expF,setExpF]=useState(false);
  const[expV,setExpV]=useState(false);
  const[expForn,setExpForn]=useState(false);
  const[expFin,setExpFin]=useState(false);
  const[showMeta,setShowMeta]=useState(false);
  // Seleção por clique-arrasto do mouse no calendário
  const[diasSelecionados,setDiasSelecionados]=useState(()=>new Set());
  const[isArrastando,setIsArrastando]=useState(false);
  const[metaInput,setMetaInput]=useState('');
  // Popover de meta manual (financeira) por mês — fica no card "Meta Diária de Pagamento"
  const[showMetaManual,setShowMetaManual]=useState(false);
  const[metaManualInput,setMetaManualInput]=useState('');
  const todayStr=today();
  const mStart=monthStart(selYear,selMonth);
  const mEnd=monthEnd(selYear,selMonth);
  const entMes=entradas.filter(e=>e.data>=mStart&&e.data<=mEnd);
  const totalEnt=entMes.reduce((s,e)=>s+e.total,0);
  const diasEnt=new Set(entMes.map(e=>e.data)).size;
  // Média diária = total / dias CORRIDOS do período (o mercado vende 7 dias/semana)
  // - mês atual: dias corridos do mês até hoje
  // - mês anterior fechado: total de dias do mês
  // - mês futuro/sem dados: total de dias do mês (fallback seguro)
  const totalDiasMes=daysInMonth(selYear,selMonth);
  const isMesAtual=now.getFullYear()===selYear&&now.getMonth()===selMonth;
  const isMesFuturo=(selYear>now.getFullYear())||(selYear===now.getFullYear()&&selMonth>now.getMonth());
  let diasCorridosBase;
  if(isMesAtual){diasCorridosBase=now.getDate();}
  else if(isMesFuturo){diasCorridosBase=totalDiasMes;}
  else{diasCorridosBase=totalDiasMes;}
  const mediaDiariaEnt=(totalEnt>0&&diasCorridosBase>0)?totalEnt/diasCorridosBase:0;
  const contasMes=contas.filter(c=>c.vencimento>=mStart&&c.vencimento<=mEnd);
  // PRX_AUDIT_01 — Carregamento do Painel (auditoria temporária, ver window.__PRX_AUDIT__).
  if(typeof window!=='undefined'&&window.__PRX_AUDIT__){
    const __mesKey=`${selYear}-${String(selMonth+1).padStart(2,'0')}`;
    console.log('PRX_AUDIT_01 — Carregamento do Painel',JSON.stringify({empresa_id:EMPRESA_ID,mesKey:__mesKey,mStart,mEnd,timestamp:Date.now(),totalRegistrosContasComParcelas:contas.length,qtd:contasMes.length,total:contasMes.reduce((s,c)=>s+c.valor,0)}));
    console.log('PRX_AUDIT_01 — Registros (Painel)',JSON.stringify(contasMes.map(c=>({id:c.id,empresa_id:c.empresa_id,descricao:c.descricao,tipoDespesa:c.tipoDespesa,vencimento:c.vencimento,status:c.status,valor:c.valor,dividaVinculadaId:c.dividaVinculadaId||'',_autoGerado:!!c._autoGerado}))));
    if(typeof __prxAuditRegister==='function')__prxAuditRegister('A',EMPRESA_ID,__mesKey,contasMes);
  }
  const totalSaiMes=contasMes.reduce((s,c)=>s+c.valor,0);
  const totalSaidoAteAgora=contasMes.filter(c=>c.status==='Pago').reduce((s,c)=>s+c.valor,0);
  const contasFaltaPagar=contasMes.filter(c=>c.status!=='Pago'&&c.vencimento>=todayStr);
  const totalFaltaPagar=contasFaltaPagar.reduce((s,c)=>s+c.valor,0);
  const pctPago=totalSaiMes>0?pct(totalSaidoAteAgora,totalSaiMes):0;
  const contasPend=contasMes.filter(c=>c.status!=='Pago');
  // Média diária de SAÍDA também por dias corridos do período (mesma régua)
  const mediaDiariaSai=(totalSaiMes>0&&diasCorridosBase>0)?totalSaiMes/diasCorridosBase:0;

  // Meta diária de pagamento
  //  • Automática (padrão): mediaDiariaEnt × percentual configurado (85%).
  //  • Manual por mês: se o usuário cadastrou uma meta financeira manual para
  //    este mês/ano (config.metasManuaisPorMes["YYYY-MM"]), ela tem prioridade.
  //    Permite simular meses futuros antes de existir entrada cadastrada.
  const metaPercentual=typeof config.metaPagamentoPercentual==='number'?config.metaPagamentoPercentual:85;
  const metaInfo=getMetaDiariaEfetiva(mediaDiariaEnt,metaPercentual,config,selYear,selMonth);
  const metaDiariaPagamento=metaInfo.valor;
  const metaIsManual=metaInfo.isManual;
  const chaveMesAtual=metaInfo.chaveMes;
  const mesLabel=`${MONTHS[selMonth]}/${selYear}`;

  // ── PLACAR DO MÊS — Entrada de caixa projetada ──
  // É o que efetivamente CAI NO CAIXA dentro do mês selecionado, não o faturamento por data
  // de venda (`totalEnt`). Reutiliza projDataRecebimento, o MESMO motor da Projeção e da aba
  // Entradas: cobre PIX, débito, crédito, voucher e outros, respeitando antecipações e o
  // prazo congelado em `prazos_recebimento`. Nenhum segundo motor de recebimento.
  // Varre TODAS as entradas da unidade (o prop traz o histórico completo, sem filtro de data)
  // porque uma venda de julho no crédito D+30 é caixa de agosto.
  const prazosPlacar=React.useMemo(()=>({...DEFAULT_PRAZOS,...(loadLocalS('zanon_prazos')||{})}),[]);
  // SÉRIE ÚNICA — mesma fonte para o Placar e para o Calendário Inteligente. Antes o Placar
  // somava só recebíveis de vendas JÁ realizadas, enquanto o Calendário também projetava o
  // futuro: duas respostas para a mesma pergunta. Agora existe uma série só.
  const caixaProjMes=React.useMemo(()=>buildCaixaProjetadoMes({
    entradas,ano:selYear,mes:selMonth,prazos:prazosPlacar,hoje:todayStr,
  }),[entradas,selYear,selMonth,prazosPlacar,todayStr]);
  const entradaCaixaProjetadaMes=caixaProjMes.total;
  // ── FATIA COMPROMETÍVEL — fonte ÚNICA do percentual de Meta ──
  // Nasce de config.metaPagamentoPercentual (mesmo fallback 85). Durante o arraste vive em
  // estado local para dar feedback imediato; a gravação acontece uma única vez, no fim da
  // interação (onChange/onPointerUp), reutilizando o setConfig existente. Sem localStorage,
  // sem campo novo, sem configuração paralela.
  const[fatiaPct,setFatiaPct]=useState(metaPercentual);
  useEffect(()=>{setFatiaPct(metaPercentual);},[metaPercentual]);
  const persistirFatia=()=>{
    if(fatiaPct===metaPercentual)return;
    setConfig({...config,metaPagamentoPercentual:fatiaPct});
  };
  const fatia=fatiaPct/100;

  // Meta mensal = entrada projetada × fatia comprometível (a MESMA que rege o calendário).
  // Não usa mediaDiariaEnt, não usa metasManuaisPorMes e não cria configuração nova.
  const metaPagamentoMes=projCents(entradaCaixaProjetadaMes*fatia);

  const prevYear=selMonth===0?selYear-1:selYear;
  const prevMonth=selMonth===0?11:selMonth-1;
  const mStartPrev=monthStart(prevYear,prevMonth);
  const mEndPrev=monthEnd(prevYear,prevMonth);
  const entMesPrev=entradas.filter(e=>e.data>=mStartPrev&&e.data<=mEndPrev);
  const totalEntPrev=entMesPrev.reduce((s,e)=>s+e.total,0);
  const deltaEntPct=totalEntPrev>0?((totalEnt-totalEntPrev)/totalEntPrev*100):null;
  const saldoAtual=config.saldoInicial;
  const saldoProj=saldoAtual+totalEnt-totalSaiMes;
  const semaMap={};
  contasPend.forEach(c=>{const s=weekOf(c.vencimento);semaMap[s]=(semaMap[s]||0)+c.valor;});
  const semanas=Object.entries(semaMap).sort((a,b)=>b[1]-a[1]);
  const semanaMaiorP=semanas[0]||null;
  const caixaMin=semanaMaiorP?Math.round(semanaMaiorP[1]*1.15):0;

  // Composição 4 grupos
  const porTipo={Fixa:[],Variável:[],Fornecedor:[],Financeira:[]};
  contasMes.forEach(c=>{const t=c.tipoDespesa||'Variável';if(porTipo[t])porTipo[t].push(c);else porTipo['Variável'].push(c);});
  const totFixed=porTipo['Fixa'].reduce((s,c)=>s+c.valor,0);
  const totVar=porTipo['Variável'].reduce((s,c)=>s+c.valor,0);
  const totForn=porTipo['Fornecedor'].reduce((s,c)=>s+c.valor,0);
  const totFin=porTipo['Financeira'].reduce((s,c)=>s+c.valor,0);
  const agrNome=list=>{const m={};list.forEach(c=>{const k=c.descricao||c.categoria;m[k]=(m[k]||0)+c.valor;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);};
  const fixasAg=agrNome(porTipo['Fixa']);
  const varAg=agrNome(porTipo['Variável']);
  const fornAg=agrNome(porTipo['Fornecedor']);
  const finAg=agrNome(porTipo['Financeira']);
  // ── Pago a Fornecedores no Mês (mesma regra da aba Fornecedores) ──
  const fornMesArr=porTipo['Fornecedor'];
  const fornPagos=fornMesArr.filter(c=>c.status==='Pago');
  const totalPagoForn=fornPagos.reduce((s,c)=>s+c.valor,0);
  const qtdPagosForn=fornPagos.length;
  const qtdTotalFornBoletos=fornMesArr.length;
  const pctPagoForn=totForn>0?pct(totalPagoForn,totForn):0;
  const totalRestanteForn=Math.max(0,totForn-totalPagoForn);

  const concentMax=semanas[0]&&totalSaiMes>0?pct(semanas[0][1],totalSaiMes):0;
  const pctParcelas=pct(dividas.reduce((s,d)=>s+d.parcelaMensal,0),totalEnt);
  const leResumo=(()=>{
    if(totalEnt===0)return'Nenhuma entrada registrada para este mês. Cadastre as vendas para gerar a leitura.';
    if(saldoProj<0)return'O caixa projetado indica risco de falta de dinheiro dentro do mês, exigindo reorganização dos vencimentos ou reforço de capital.';
    if(concentMax>35)return'O mercado apresenta boa geração de caixa, porém os vencimentos estão concentrados em poucos dias, criando pressão artificial no caixa.';
    if(pctParcelas>20)return'As parcelas bancárias estão consumindo parte relevante das entradas do mês, indicando dependência de crédito.';
    return'O caixa do mês apresenta comportamento saudável, sem concentração crítica de vencimentos ou saldo projetado negativo.';
  })();
  const leBullets=[];
  if(concentMax>0)leBullets.push(`${concentMax}% das saídas concentradas na semana de maior pressão.`);
  if(pctParcelas>0)leBullets.push(`Parcelas bancárias consomem ${pctParcelas}% da entrada do mês.`);
  if(caixaMin>0)leBullets.push(`Caixa mínimo recomendado: ${fmtFull(caixaMin)}.`);
  if(leBullets.length===0)leBullets.push('Sem pontos críticos identificados no período.');

  // Fornecedores em Destaque (filtra contas do mês com tipoDespesa='Fornecedor')
  const contasForn=contasMes.filter(c=>c.tipoDespesa==='Fornecedor');
  const totalFornMes=contasForn.reduce((s,c)=>s+c.valor,0);
  // PRX_ZANON_AUDIT_PANEL — auditoria temporária (window.__PRX_AUDIT__=true), remover ao final.
  if(typeof window!=='undefined'&&window.__PRX_AUDIT__){
    const __mesKey=`${selYear}-${String(selMonth+1).padStart(2,'0')}`;
    console.log('PRX_ZANON_AUDIT_PANEL',JSON.stringify({
      empresa_id:EMPRESA_ID,mes:__mesKey,
      qtdContas:contasMes.length,totalGeral:totalSaiMes,
      qtdFornecedores:contasForn.length,totalFornecedores:totalFornMes,
      qtdFixas:porTipo['Fixa'].length,totalFixas:totFixed,
      qtdVariaveis:porTipo['Variável'].length,totalVariaveis:totVar,
      qtdFinanceiras:porTipo['Financeira'].length,totalFinanceiras:totFin,
      idsRegistros:contasMes.map(c=>c.id),
      idsFornecedores:contasForn.map(c=>c.id),
    }));
    if(typeof __prxZanonAuditRegister==='function')__prxZanonAuditRegister('PANEL',EMPRESA_ID,__mesKey,contasMes);
  }
  const fornNome=c=>(c.fornecedor&&c.fornecedor.trim())?c.fornecedor.trim():(c.descricao||'Sem identificação').trim();
  const fornMap={};
  contasForn.forEach(c=>{
    const nome=fornNome(c);
    if(!fornMap[nome])fornMap[nome]={nome,valor:0,qtd:0};
    fornMap[nome].valor+=c.valor;
    fornMap[nome].qtd+=1;
  });
  const fornArr=Object.values(fornMap);
  const topFornValor=[...fornArr].sort((a,b)=>b.valor-a.valor).slice(0,3);
  const topFornQtd=[...fornArr].sort((a,b)=>b.qtd-a.qtd||b.valor-a.valor).slice(0,3);

  // Cal — acompanha o mês global (selectedYear/selectedMonth). Navegação altera o mês global.
  const calMStart=monthStart(calYear,calMonth);
  const calMEnd=monthEnd(calYear,calMonth);
  const contasMesCal=contas.filter(c=>c.vencimento>=calMStart&&c.vencimento<=calMEnd);
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const totalDays=daysInMonth(calYear,calMonth);
  const offsetDays=firstDay===0?6:firstDay-1;
  const contasPorDia={};
  contasMesCal.forEach(c=>{const d=parseInt(c.vencimento.split('-')[2]);if(!contasPorDia[d])contasPorDia[d]=[];contasPorDia[d].push(c);});

  // ══ CALENDÁRIO INTELIGENTE — série diária de CAIXA do mês exibido ══
  // Regra aprovada, por dia:
  //   ENTRA = crédito/voucher REAIS já vendidos que caem naquele dia (projDataRecebimento)
  //         + demais modalidades REAIS convertidas pelo mesmo motor
  //         + débito/PIX PROJETADOS para dias sem venda registrada, pela ocorrência ordinal
  //           do mês anterior, deslocados pelo PRAZO ATUAL da unidade (débito D+X, PIX D+0).
  //   Dinheiro e Outros nunca são projetados; só aparecem quando reais.
  //   REAL prevalece: dia com lançamento real não recebe projeção.
  // Consome a SÉRIE ÚNICA (caixaProjMes) e apenas acrescenta despesas, meta, folga e badge.
  // Nenhuma regra de entrada é recalculada aqui — é a mesma fonte do Placar, o que garante
  // que a soma dos dias do calendário bate exatamente com a Entrada de Caixa Projetada.
  const calSerie=React.useMemo(()=>{
    const out={};
    for(let d=1;d<=totalDays;d++){
      const iso=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const base=caixaProjMes.porDia[iso]||{entra:0,real:0,projetado:0};
      const itens=contasPorDia[d]||[];
      const aPagar=projCents(itens.reduce((s,c)=>s+projNum(c.valor),0));
      const entra=projCents(base.entra);
      const meta=projCents(entra*fatia);
      out[d]={
        dia:d,iso,itens,
        entra,meta,aPagar,
        folga:projCents(entra-aPagar),
        // PROJ quando qualquer parcela do caixa daquele dia veio de venda projetada.
        projetado:base.projetado>0,
      };
    }
    return out;
  },[caixaProjMes,contasPorDia,calYear,calMonth,totalDays,fatia]);

  // Semanas iniciando no DOMINGO (ordem do mockup), com nulos nas bordas.
  const calSemanas=React.useMemo(()=>{
    const primeiro=new Date(calYear,calMonth,1).getDay(); // 0=Dom
    const semanas=[];let cur=[];
    for(let i=0;i<primeiro;i++)cur.push(null);
    for(let d=1;d<=totalDays;d++){cur.push(d);if(cur.length===7){semanas.push(cur);cur=[];}}
    if(cur.length){while(cur.length<7)cur.push(null);semanas.push(cur);}
    return semanas.map(dias=>{
      let entra=0,meta=0,aPagar=0;
      dias.forEach(d=>{if(d&&calSerie[d]){entra+=calSerie[d].entra;meta+=calSerie[d].meta;aPagar+=calSerie[d].aPagar;}});
      entra=projCents(entra);meta=projCents(meta);aPagar=projCents(aPagar);
      // weekOver = a SEMANA estoura sua meta — é o que decide amarelo × vermelho nos dias.
      return{dias,entra,meta,aPagar,folga:projCents(entra-aPagar),weekOver:aPagar>meta};
    });
  },[calSerie,calYear,calMonth,totalDays]);

  // Cor do dia — regra idêntica ao mockup: cabe → verde; estoura o dia mas a semana cobre →
  // amarelo; estoura o dia e a semana → vermelho.
  const calCorDia=(d,weekOver)=>{
    const c=calSerie[d];
    if(!c)return'g';
    if(c.aPagar<=c.meta)return'g';
    return weekOver?'r':'a';
  };
  const[calDiaAberto,setCalDiaAberto]=useState(null);
  // Semana de maior pressão recalculada para o mês do calendário (regra de cores funciona em qualquer mês)
  const semaMapCal={};
  contasMesCal.filter(c=>c.status!=='Pago').forEach(c=>{const s=weekOf(c.vencimento);semaMapCal[s]=(semaMapCal[s]||0)+c.valor;});
  const semanasCal=Object.entries(semaMapCal).sort((a,b)=>b[1]-a[1]);
  const semanaMaisP=semanasCal[0]?semanasCal[0][0]:null;

  // Classificação por dia — 3 estados baseados na meta diária de pagamento:
  //  • Verde    (cal-saudavel): total do dia <= meta
  //  • Amarelo  (cal-atencao):  meta < total <= meta + R$ 2.000
  //  • Vermelho (cal-critico):  total > meta + R$ 2.000
  // A meta vem do contexto do painel (mediaDiariaEnt × metaPercentual) — mesma régua p/ todos os meses.
  const FAIXA_ATENCAO=2000;
  const isDiaUtil=day=>{const dt=new Date(calYear,calMonth,day);const dw=dt.getDay();return dw!==0&&dw!==6;};

  const calInt=(t,day)=>{
    if(t===0)return'';
    if(metaDiariaPagamento<=0)return'cal-leve';
    if(t<=metaDiariaPagamento)return'cal-saudavel';
    if(t<=metaDiariaPagamento+FAIXA_ATENCAO)return'cal-atencao';
    return'cal-critico';
  };
  const isTodayCell=day=>`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`===todayStr;
  const isInSemP=day=>{if(!semanaMaisP)return false;return weekOf(`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`)===semanaMaisP;};
  // Botões de navegação do calendário alteram o MÊS GLOBAL (mantém o dashboard inteiro coerente)
  const calPrev=()=>{if(selMonth===0){setSelMonth(11);setSelYear(selYear-1);}else{setSelMonth(selMonth-1);}};
  const calNext=()=>{if(selMonth===11){setSelMonth(0);setSelYear(selYear+1);}else{setSelMonth(selMonth+1);}};
  const calHoje=()=>{setSelMonth(now.getMonth());setSelYear(now.getFullYear());};
  const calEhMesAtual=(calYear===now.getFullYear()&&calMonth===now.getMonth());

  return(
    <div>
      {/* ══ HERO — imagem do mercado + 4 KPIs sobrepostos ══ */}
      <div className="painel-hero-wrap">
        <div className="painel-hero">
          <img className="painel-hero-img" src={BANNER_SRC} alt="Corredor do Mercado Zanon"/>
          <div className="painel-hero-shade"></div>
          <div className="painel-hero-chip"><span className="dot"></span>{mesLabel}</div>
          <div className="painel-hero-prx" title="PRX — Gestão de recebíveis" aria-label="PRX">
            <img src={PRX_LOGO_SRC} alt="PRX"/>
          </div>
          <div className="painel-hero-body">
            <div className="painel-hero-eyebrow">{`${String(nomeUnidadeAtiva||'Unidade').toUpperCase()} · Visão do Dono`}</div>
            <div className="painel-hero-title">A saúde financeira do mês em <b>um só olhar</b></div>
            <div className="painel-hero-sub">Entradas, saídas, médias diárias e a meta de pagamento — tudo o que move o caixa, reunido no topo do painel.</div>
          </div>
        </div>

        <div className="painel-hero-kpis">
          {/* Entradas do Mês */}
          <div className="hk">
            <div className="hk-top">
              <div className="hk-label">Entradas do Mês</div>
              <div className="hk-ico g">↑</div>
            </div>
            <div className="hk-value g">{fmtFull(totalEnt)}</div>
            <div className="hk-sub">
              <span>{diasEnt} dias com venda</span>
              {deltaEntPct!==null&&(
                <span style={{fontSize:9.5,fontWeight:700,padding:'1px 5px',borderRadius:8,background:deltaEntPct>=0?'#f0fdf4':'#fef2f2',color:deltaEntPct>=0?'#15803d':'#b91c1c'}}>
                  {deltaEntPct>=0?'+':''}{deltaEntPct.toFixed(0)}% vs {MONTHS_SHORT[prevMonth]}
                </span>
              )}
            </div>
          </div>

          {/* Saídas do Mês */}
          <div className="hk">
            <div className="hk-top">
              <div className="hk-label">Saídas do Mês</div>
              <div className="hk-ico r">↓</div>
            </div>
            <div className="hk-value r">{fmtFull(totalSaiMes)}</div>
            <div className="hk-sub">{fmtFull(totalSaidoAteAgora)} já pagos no mês</div>
          </div>

          {/* Médias Diárias (entrada + saída) */}
          <div className="hk">
            <div className="hk-top">
              <div className="hk-label">Médias Diárias (dia)</div>
              <div className="hk-ico s">⇅</div>
            </div>
            <div className="hk-medias">
              <div className="hk-medias-col">
                <span className="hk-medias-lbl">Entrada</span>
                <span className="hk-medias-val g">{fmt(mediaDiariaEnt)}</span>
              </div>
              <div className="hk-medias-sep"></div>
              <div className="hk-medias-col">
                <span className="hk-medias-lbl">Saída</span>
                <span className="hk-medias-val r">{fmt(mediaDiariaSai)}</span>
              </div>
            </div>
            <div className="hk-sub">por dia corrido do mês</div>
          </div>

          {/* Meta Diária de Pagamento — DESTAQUE */}
          <div className="hk hk-meta">
            <div className="hk-top">

                {metaIsManual&&<span className="pc-meta-badge" title={`Meta manual para ${mesLabel}`}>Manual</span>}
              </div>
              <button

                className="pc-meta-btn"
                onClick={()=>{
                  const valorAtual=metaDiariaPagamento>0?formatCurrencyBR(metaDiariaPagamento).replace('R$ ',''):'';
                  setMetaManualInput(valorAtual);
                  setShowMetaManual(s=>!s);
                }}
                title={`Definir meta diária manual para ${mesLabel}`}
              >
                Manual
              </button>
            </div>
            <div className="hk-value">{fmtFull(metaDiariaPagamento)}</div>
            <div className="hk-sub">{metaIsManual?`Meta manual — ${mesLabel}`:`${metaPercentual}% da média diária`}</div>

          {showMetaManual&&(
            <div className="pc-meta-popover">
              <div className="pc-meta-popover-title">Meta manual — {mesLabel}</div>
              <div className="pc-meta-popover-row">
                <input

                  placeholder="R$ 0,00"
                  value={metaManualInput}
                  onChange={e=>setMetaManualInput(e.target.value)}
                  autoFocus
                />
              </div>
              <div className="pc-meta-popover-hint">
                Aceita R$ 18.000,00 · 18.000,00 · 18000.
                Use para simular meses futuros sem entradas cadastradas.
              </div>
              <div className="pc-meta-popover-actions">
                <button
                  type="button"
                  className="pc-meta-cancel"
                  onClick={()=>setShowMetaManual(false)}
                >Cancelar</button>
                {(config.metasManuaisPorMes&&typeof config.metasManuaisPorMes[chaveMesAtual]==='number')&&(
                  <button
                    type="button"

                      delete novoMapa[chaveMesAtual];
                      setConfig({...config,metasManuaisPorMes:novoMapa});
                      setShowMetaManual(false);

                  >Remover manual</button>

                <button

                  className="pc-meta-save"
                  onClick={()=>{
                    const valor=parseCurrencyBR(metaManualInput);
                    if(!(valor>0)){alert('Informe um valor financeiro válido (ex: 18.000,00).');return;}
                    const novoMapa={...(config.metasManuaisPorMes||{}),[chaveMesAtual]:valor};
                    setConfig({...config,metasManuaisPorMes:novoMapa});
                    setShowMetaManual(false);
                  }}
                >Salvar</button>
              </div>
            </div>
          )}
          </div>
        </div>
      </div>

      {/* Cabeçalho da aba — posicionado ABAIXO da imagem do banner */}
      {header}

      {/* COMPOSIÇÃO DAS DESPESAS — largura total, 4 colunas */}
      <div className="comp-panel painel-comp-full">
        <div className="comp-header">
          <div className="comp-header-label">Composição das Despesas</div>
          <div className="comp-header-right">
            <div className="comp-header-total">{fmtFull(totalSaiMes)}</div>
            <div className="comp-header-sub">{MONTHS[selMonth]} {selYear} · total do mês</div>
          </div>
        </div>
        <div className="comp-body comp-inner-4">
          <CompGroup label="Despesas Fixas" color="#16a34a" total={totFixed} totalGeral={totalSaiMes} items={fixasAg} expand={expF} setExpand={setExpF} emptyMsg="Nenhuma despesa fixa"/>
          <CompGroup label="Despesas Variáveis" color="#d97706" total={totVar} totalGeral={totalSaiMes} items={varAg} expand={expV} setExpand={setExpV} emptyMsg="Nenhuma despesa variável"/>

          <CompGroup label="Despesas Financeiras" color="#7c3aed" total={totFin} totalGeral={totalSaiMes} items={finAg} expand={expFin} setExpand={setExpFin} emptyMsg="Nenhuma despesa financeira"/>
        </div>

      {/* LAYOUT INFERIOR: Pago a Fornecedores (largura total) + Calendário (largura total) */}
      <div className="painel-layout-bottom">

        {/* ── PLACAR DO MÊS — substitui a barra "Pago a Fornecedores no Mês" neste espaço.

            dados reais já carregados. A navegação usa calPrev/calNext, que operam sobre o
            mês GLOBAL — sem estado paralelo. ── */}
        <div className="prx-owner-score">

          </div>

          </div>
          <div>
            <div className="prx-owner-score-lab">Meta de pagamento</div>
            <div className="prx-owner-score-val">{fmtFull(metaPagamentoMes)}</div>
          </div>
          <div>
            <div className="prx-owner-score-lab">A pagar (total)</div>
            {/* Mesma leitura do mockup: acima da meta = atenção, dentro dela = saudável. */}
            <div className={`prx-owner-score-val ${totalSaiMes>metaPagamentoMes?'warn':'ok'}`}>{fmtFull(totalSaiMes)}</div>

            comportamento são do mockup; todos os números vêm dos dados reais da unidade.
            O mês é o GLOBAL (calYear/calMonth) — a navegação vive no Placar, como no mockup. ── */}
        <div className="prx-owner-cal">

              <span className="prx-owner-cal-ratioval">{fatiaPct}%</span>

              {calSemanas.map((sem,wi)=>(

                        <div className="prx-owner-cal-barwrap">

                      </button>

                  <div className="prx-owner-cal-wkcard">
                    <div className="wt"><i className={`prx-owner-cal-dot ${sem.weekOver?'r':'g'}`}></i>Semana</div>
                    <div className="li"><span>Entra caixa</span><b>{rdpFmt0(sem.entra)}</b></div>
                    <div className="li"><span>Meta</span><b>{rdpFmt0(sem.meta)}</b></div>

                    <div className={`li folgaw ${sem.folga>=0?'ok':'bad'}`}>

            </div>

        </div>

        {/* ── DRAWER LATERAL DO DIA — dados reais do dia clicado ── */}
        {(()=>{
          const c=calDiaAberto!=null?calSerie[calDiaAberto]:null;
          const sem=c?calSemanas.find(s=>s.dias.indexOf(calDiaAberto)>=0):null;
          const col=c?calCorDia(calDiaAberto,sem?sem.weekOver:false):'g';

          const fechar=()=>setCalDiaAberto(null);
          return(
            <React.Fragment>
              <div className={`prx-owner-cal-overlay${c?' on':''}`} onClick={fechar}></div>
              <div className={`prx-owner-cal-panel${c?' on':''}`} role="dialog" aria-modal="true"

                onKeyDown={e=>{if(e.key==='Escape')fechar();}}>
                {c&&(<React.Fragment>
                  <div className="prx-owner-cal-ph">
