// ── DIAGNÓSTICO ──
function Diagnostico({entradas,contas,dividas,retiradas,config}){
  const hoje=today();const em30=addDays(hoje,30);
  const entMes=entradas.filter(e=>e.data>=addDays(hoje,-30));
  const totalEnt=entMes.reduce((s,e)=>s+e.total,0);
  const diasV=new Set(entMes.map(e=>e.data)).size;
  const media=diasV>0?totalEnt/diasV:0;
  const contasFut=contas.filter(c=>c.vencimento>=hoje&&c.vencimento<=em30&&c.status!=='Pago');
  const totalSai=contasFut.reduce((s,c)=>s+c.valor,0);
  const vencidas=contas.filter(c=>c.vencimento<hoje&&c.status!=='Pago');
  const totalVenc=vencidas.reduce((s,c)=>s+c.valor,0);
  const semaMap={};contasFut.forEach(c=>{const s=weekOf(c.vencimento);semaMap[s]=(semaMap[s]||0)+c.valor;});
  const semanas=Object.entries(semaMap).sort((a,b)=>b[1]-a[1]);
  const maxSemConc=semanas[0]?pct(semanas[0][1],totalSai):0;
  const totalParcelas=dividas.reduce((s,d)=>s+d.parcelaMensal,0);
  const pctDivEnt=pct(totalParcelas,totalEnt);
  const retiradaMes=retiradas.filter(r=>r.data>=addDays(hoje,-30)).reduce((s,r)=>s+r.valor,0);
  const pctRet=pct(retiradaMes,totalEnt);
  const saldoProj=config.saldoInicial+(media*30)-totalSai;
  const diagnosticos=[];const acoes=[];
  if(totalEnt===0){diagnosticos.push({icon:'📊',text:'Nenhuma entrada registrada. Cadastre as vendas para gerar o diagnóstico.',tipo:'blue'});}
  else{
    if(media>=8000)diagnosticos.push({icon:'✅',text:`Boa geração diária de caixa: ${fmtFull(media)}/dia em média.`,tipo:'green'});
    else if(media>=4000)diagnosticos.push({icon:'⚠️',text:`Média diária moderada: ${fmtFull(media)}/dia.`,tipo:'amber'});
    else diagnosticos.push({icon:'🔴',text:`Média diária baixa: ${fmtFull(media)}/dia.`,tipo:'red'});
    if(maxSemConc>35){diagnosticos.push({icon:'⚠️',text:`Concentração crítica: ${maxSemConc}% das saídas em uma semana.`,tipo:'amber'});acoes.push('Redistribuir vencimentos para semanas equilibradas');acoes.push('Negociar prazos com fornecedores estratégicos');}
    else diagnosticos.push({icon:'✅',text:`Concentração de vencimentos aceitável: ${maxSemConc}% na maior semana.`,tipo:'green'});
    if(saldoProj<0){diagnosticos.push({icon:'🔴',text:`Saldo projetado negativo em 30 dias: ${fmtFull(saldoProj)}.`,tipo:'red'});acoes.push('Renegociar vencimentos urgentemente para evitar déficit');}
    else diagnosticos.push({icon:'✅',text:`Saldo projetado positivo: ${fmtFull(saldoProj)}.`,tipo:'green'});
    if(totalVenc>0){diagnosticos.push({icon:'🔴',text:`${vencidas.length} conta(s) vencida(s): ${fmtFull(totalVenc)}.`,tipo:'red'});acoes.push('Quitar contas vencidas imediatamente');}
    if(pctDivEnt>10){diagnosticos.push({icon:'🏦',text:`Pressão bancária ${pctDivEnt>20?'crítica':'alta'}: ${pctDivEnt}% da entrada em parcelas.`,tipo:pctDivEnt>20?'red':'amber'});acoes.push('Renegociar ou consolidar dívidas');acoes.push('Eliminar cheque especial e antecipação');}
    if(pctRet>20){diagnosticos.push({icon:'👤',text:`Retiradas elevadas: ${pctRet}% da entrada (${fmtFull(retiradaMes)}).`,tipo:'amber'});acoes.push('Definir pró-labore fixo e padronizar retiradas');}
  }
  acoes.push('Criar reserva mínima equivalente ao pico semanal de vencimentos');
  acoes.push('Acompanhar semanalmente entradas e saídas');
  acoes.push('Separar despesas operacionais de despesas financeiras');
  acoes.push('Manter o sistema atualizado como ferramenta de gestão contínua');
  const exportCSV=()=>{
    const linhas=[['DIAGNÓSTICO MERCADO ZANON'],['Data',new Date().toLocaleDateString('pt-BR')],[],['INDICADORES'],['Média diária',fmtFull(media)],['Total entradas (30d)',fmtFull(totalEnt)],['Total saídas (30d)',fmtFull(totalSai)],['Saldo projetado',fmtFull(saldoProj)],['Total dívidas',fmtFull(dividas.reduce((s,d)=>s+d.valorUtilizado,0))],['Parcelas mensais',fmtFull(totalParcelas)],['% parcelas/entrada',pctDivEnt+'%'],['Retiradas (30d)',fmtFull(retiradaMes)]];
    const csv=linhas.map(l=>l.join(';')).join('\n');
    const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='diagnostico_zanon.csv';a.click();
  };
  return(
    <div>
      <div className="exec-reading">
        <div className="exec-reading-label">🔍 Diagnóstico Automático — Mercado Zanon</div>
        <div className="exec-reading-text">Análise gerada automaticamente com base nos dados cadastrados.</div>
      </div>
      <div style={{marginBottom:14}}>
        <div style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:7}}>Situação atual</div>
        {diagnosticos.map((d,i)=>(
          <div key={i} className="diag-item" style={{borderLeft:`3px solid ${d.tipo==='green'?'var(--green)':d.tipo==='red'?'var(--red)':d.tipo==='amber'?'var(--amber)':'var(--blue)'}`,background:d.tipo==='green'?'var(--green-light)':d.tipo==='red'?'var(--red-light)':d.tipo==='amber'?'var(--amber-light)':'var(--blue-light)'}}>
            <div style={{fontSize:14}}>{d.icon}</div><div>{d.text}</div>
          </div>
        ))}
      </div>
      <div>
        <div style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:7}}>Ações recomendadas</div>
        {acoes.map((a,i)=>(<div key={i} className="action-item"><div className="action-num">{i+1}</div><div>{a}</div></div>))}
      </div>
      <div style={{marginTop:14}}><button className="btn btn-secondary" onClick={exportCSV}>📥 Exportar CSV</button></div>
    </div>
  );
}

// ── GERAÇÃO AUTOMÁTICA DE PARCELAS DE DÍVIDAS ──
// Gera uma conta a pagar virtual a partir de uma dívida ativa com parcela
const dividaToContaId=d=>`auto_divida_${d.id}`;
// Helper: gera lista de vencimentos mensais a partir de uma data base, mantendo o mesmo dia,
// respeitando meses com menos dias (ex: dia 31 → último dia do mês).
const gerarVencimentosMensais=(base,qtdMeses)=>{
  const[by,bm,bd]=base.split('-').map(Number);
  const out=[];
  for(let i=0;i<qtdMeses;i++){
    const y=by,m=bm-1+i;
    const dt=new Date(y,m+1,0); // último dia do mês alvo
    const lastDay=dt.getDate();
    const day=Math.min(bd,lastDay);
    const yy=dt.getFullYear(),mm=dt.getMonth()+1;
    out.push(`${yy}-${String(mm).padStart(2,'0')}-${String(day).padStart(2,'0')}`);
  }
  return out;
};

// Gera TODAS as parcelas mensais recorrentes da dívida em janela ampla (24 meses à frente).
// As parcelas têm IDs distintos por vencimento e podem ser marcadas como pagas individualmente.
const gerarParcelasDivida=d=>{
  const __auditDescarte=motivo=>{if(typeof window!=='undefined'&&window.__PRX_AUDIT__)console.log('PRX_AUDIT_05 — Parcela descartada',JSON.stringify({dividaId:d.id,banco:d.banco,empresa_id:d.empresa_id,motivo,parcelaMensal:d.parcelaMensal,vencimento:d.vencimento,status:d.status,valorUtilizado:d.valorUtilizado}));};
  if(!d.parcelaMensal||d.parcelaMensal<=0){__auditDescarte('parcelaMensal ausente ou <= 0');return[];}
  if(!d.vencimento){__auditDescarte('vencimento ausente');return[];}
  // Dívida com quitada_em (quitada por corte de mês) continua gerando as parcelas dos meses
  // ANTERIORES ao corte, mesmo com status 'Quitada' — o corte é aplicado no final desta função.
  // Sem quitada_em, mantém a regra atual (apenas status 'Ativa' gera parcelas).
  if(d.status!=='Ativa'&&!d.quitada_em){__auditDescarte('status != "Ativa" (case-sensitive)');return[];}
  if((d.valorUtilizado||0)<=0){__auditDescarte('valorUtilizado <= 0');return[];}
  // Janela: do mês de início até 24 meses à frente
  const vencs=gerarVencimentosMensais(d.vencimento,24);
  const __geradas=vencs.map((venc,idx)=>({
    id:`${dividaToContaId(d)}__${venc}`,
    descricao:`Parcela ${d.banco}`,
    categoria:'Banco/Juros',
    tipoDespesa:'Financeira',
    valor:d.parcelaMensal,
    vencimento:venc,
    status:'A vencer',
    formaPag:'Débito em conta',
    contaSaida:'Banco principal',
    obs:`Gerado automaticamente — dívida: ${d.banco} (${d.tipo})`,
    dividaVinculadaId:d.id,
    _autoGerado:true,
    _parcelaSeq:idx+1,
  }));
  if(typeof window!=='undefined'&&window.__PRX_AUDIT__)console.log('PRX_AUDIT_05 — Parcelas geradas',JSON.stringify({dividaId:d.id,banco:d.banco,empresa_id:d.empresa_id,qtdGeradas:__geradas.length,janelaInicio:vencs[0],janelaFim:vencs[vencs.length-1],parcelaMensal:d.parcelaMensal}));
  // CORTE POR QUITAÇÃO (ponto central único) — a partir do mês de quitada_em, INCLUSIVE, a dívida
  // deixa de gerar parcelas. Como todo cálculo financeiro (Painel, Portfólio, Projeção, Contas)
  // consome parcelas por esta função, o corte propaga para todas as telas de uma só vez.
  // Comparação por chave 'YYYY-MM' (monthOf) — estável, sem conversão de Date nem fuso horário.
  if(d.quitada_em){
    const corteMes=monthOf(d.quitada_em);
    return __geradas.filter(p=>monthOf(p.vencimento)<corteMes);
  }
  return __geradas;
};

// Mantém compatibilidade com chamadas antigas (retorna 1ª parcela)
const gerarParcelaDivida=d=>{const ps=gerarParcelasDivida(d);return ps[0]||null;};

// Expande contas com tipoDespesa='Fixa' para meses seguintes (janela 24 meses),
// criando "instâncias virtuais" para cada mês posterior ao da conta original,
// sem duplicar nem sobrescrever contas manuais já existentes em outros meses.
const expandirFixasRecorrentes=contas=>{
  const fixas=contas.filter(c=>c.tipoDespesa==='Fixa'&&c.vencimento);
  if(fixas.length===0)return[];
  const result=[];
  const __auditLog=(evento,dados)=>{if(typeof window!=='undefined'&&window.__PRX_AUDIT__)console.log('PRX_AUDIT_06 — '+evento,JSON.stringify(dados));};
  fixas.forEach(f=>{
    const vencs=gerarVencimentosMensais(f.vencimento,24);
    let __geradas=0,__descartadas=0;
    // primeira posição é o próprio mês original — já está em "contas", pula
    for(let i=1;i<vencs.length;i++){
      const venc=vencs[i];
      // FIM DE VIGÊNCIA — a base só recorre enquanto `venc <= vigencia_ate`. `vigencia_ate`
      // NULL/ausente = sem fim, exatamente o comportamento anterior (é o estado de 100% das
      // linhas já existentes). `vencs` é crescente, então `break` encerra a série.
      if(f.vigencia_ate&&venc>f.vigencia_ate){
        __auditLog('Recorrência encerrada por vigência',{origemId:f.id,descricao:f.descricao,empresa_id:f.empresa_id,vigencia_ate:f.vigencia_ate,primeiroVencimentoDescartado:venc});
        break;
      }
      // Não duplica se já existir conta manual da mesma fixa neste mês
      const jaExiste=contas.find(c=>
        c.tipoDespesa==='Fixa'&&
        c.descricao===f.descricao&&
        monthOf(c.vencimento)===monthOf(venc)&&
        c.id!==f.id
      );
      if(jaExiste){
        __descartadas++;
        __auditLog('Recorrência descartada',{origemId:f.id,descricao:f.descricao,empresa_id:f.empresa_id,mesAlvo:monthOf(venc),vencimentoAlvo:venc,motivo:'já existe conta manual da mesma Fixa (mesma descrição) nesse mês',contaManualConflitante:jaExiste.id});
        continue;
      }
      __geradas++;
      result.push({
        ...f,
        id:`${f.id}__fixa_${venc}`,
        vencimento:venc,
        status:'A vencer',
        _autoGerado:true,
        _fixaRecorrenteOrigemId:f.id,
        obs:(f.obs||'')+(f.obs?' · ':'')+`Recorrência automática (mês ${monthOf(venc)})`,
      });
    }
    __auditLog('Recorrência processada',{origemId:f.id,descricao:f.descricao,empresa_id:f.empresa_id,vencimentoOrigem:f.vencimento,janelaMeses:vencs.length,geradas:__geradas,descartadas:__descartadas});
  });
  return result;
};

// ── DESPESAS FIXAS: edição/exclusão PROSPECTIVA ──
// Uma ocorrência auto-gerada de FIXA pode ser editada/excluída; uma parcela auto-gerada de
// DÍVIDA continua sem esses botões (só se altera pela aba Dívidas). O que separa as duas é
// `_fixaRecorrenteOrigemId`, presente apenas nas ocorrências de recorrência fixa.
const ehOcorrenciaFixa=c=>!!(c&&c._autoGerado&&c._fixaRecorrenteOrigemId);
const podeEditarConta=c=>!!c&&(!c._autoGerado||ehOcorrenciaFixa(c));

// Último dia do mês ANTERIOR à competência da ocorrência editada — é o marco que encerra a
// vigência da base antiga. Ex.: ocorrência de 15/09/2026 → '2026-08-31'. Assim agosto ainda é
// gerado pela base antiga e setembro em diante passa a vir da base nova, sem sobreposição.
// Tudo em UTC para não escorregar de dia por fuso.
const fixaFimVigenciaAntes=venc=>{
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(venc||'')))return null;
  const d=new Date(Date.UTC(Number(venc.slice(0,4)),Number(venc.slice(5,7))-1,1));
  d.setUTCDate(0); // dia 0 do mês da ocorrência = último dia do mês anterior
  return d.toISOString().slice(0,10);
};

const gerarParcelaDividaLegacy=null; // legado removido
// Mescla contas manuais com parcelas automáticas de dívidas + fixas recorrentes (sem duplicar)
const mergeContasComParcelas=(contas,dividas)=>{
  const __auditOn=typeof window!=='undefined'&&window.__PRX_AUDIT__;
  const manuaisIds=new Set(contas.map(c=>c.id));
  const autoContasGeradas=dividas.flatMap(gerarParcelasDivida);
  const autoContas=autoContasGeradas.filter(c=>!manuaisIds.has(c.id));
  const resultado=[...contas];
  let __autoDescartadasPorConflito=0;
  autoContas.forEach(auto=>{
    // Se já existe conta manual vinculada à mesma dívida no mesmo vencimento, não duplica
    const jaExiste=contas.find(c=>
      c.dividaVinculadaId===auto.dividaVinculadaId&&
      c.vencimento===auto.vencimento
    );
    if(!jaExiste){resultado.push(auto);}
    else{
      __autoDescartadasPorConflito++;
      if(__auditOn)console.log('PRX_AUDIT_04 — Parcela automática descartada no merge',JSON.stringify({parcelaId:auto.id,dividaVinculadaId:auto.dividaVinculadaId,vencimento:auto.vencimento,motivo:'já existe conta manual com mesma dividaVinculadaId+vencimento',contaManualConflitante:jaExiste.id}));
    }
  });
  // Adiciona instâncias mensais recorrentes das despesas Fixas
  const fixasRecorrentes=expandirFixasRecorrentes(contas);
  let __fixasDescartadasPorIdColisao=0;
  fixasRecorrentes.forEach(f=>{
    if(!manuaisIds.has(f.id)){resultado.push(f);}
    else __fixasDescartadasPorIdColisao++;
  });
  if(__auditOn)console.log('PRX_AUDIT_04 — Merge (resumo)',JSON.stringify({
    qtdContasManuais:contas.length,
    qtdDividas:dividas.length,
    qtdAutoContasGeradasBruto:autoContasGeradas.length,
    qtdAutoContasJaExistiamComoManual:autoContasGeradas.length-autoContas.length,
    qtdAutoContasDescartadasPorConflitoVencimento:__autoDescartadasPorConflito,
    qtdAutoContasIncluidas:autoContas.length-__autoDescartadasPorConflito,
    qtdFixasRecorrentesGeradas:fixasRecorrentes.length,
    qtdFixasDescartadasPorIdColisao:__fixasDescartadasPorIdColisao,
    qtdFinalResultado:resultado.length,
  }));
  return resultado;
};

// ══════════════════════════════════════
// FORNECEDORES — visão estratégica
// ══════════════════════════════════════
function Fornecedores({contas,selectedYear,selectedMonth}){
  const now=new Date();
  // Mês/ano vêm do estado GLOBAL (Painel do Dono). Sem useState local nem seletor visual.
  const selYear=selectedYear;
  const selMonth=selectedMonth;
  const chartEvolRef=useRef(null);

  const fornNome=c=>(c.fornecedor&&c.fornecedor.trim())?c.fornecedor.trim():(c.descricao||'Sem identificação').trim();
  const todayStr=today();

  // Universo: só boletos do tipo Fornecedor
  const universo=contas.filter(c=>c.tipoDespesa==='Fornecedor');

  // Filtro de período (mês/ano selecionado)
  const mStart=monthStart(selYear,selMonth);
  const mEnd=monthEnd(selYear,selMonth);
  const contasMes=universo.filter(c=>c.vencimento>=mStart&&c.vencimento<=mEnd);

  // Agrupamento por fornecedor no mês
  const map={};
  contasMes.forEach(c=>{
    const nome=fornNome(c);
    if(!map[nome])map[nome]={nome,valor:0,qtd:0,datas:[],itens:[]};
    map[nome].valor+=c.valor;
    map[nome].qtd+=1;
    map[nome].datas.push(c.vencimento);
    map[nome].itens.push(c);
  });
  const fornArr=Object.values(map).sort((a,b)=>b.valor-a.valor);
  const totalMes=fornArr.reduce((s,f)=>s+f.valor,0);
  const totalBoletos=fornArr.reduce((s,f)=>s+f.qtd,0);
  const ticketMedio=totalBoletos>0?totalMes/totalBoletos:0;
  const top3Valor=fornArr.slice(0,3).reduce((s,f)=>s+f.valor,0);
  const concTop3=totalMes>0?pct(top3Valor,totalMes):0;

  // === Total já PAGO aos fornecedores do mês ===
  // Atualiza automaticamente conforme boletos são marcados como Pago.
  const contasPagasMes=contasMes.filter(c=>c.status==='Pago');
  const totalPagoMes=contasPagasMes.reduce((s,c)=>s+c.valor,0);
  const qtdPagosMes=contasPagasMes.length;
  const pctPagoMes=totalMes>0?pct(totalPagoMes,totalMes):0;
  const totalRestanteMes=Math.max(0,totalMes-totalPagoMes);
  const qtdRestanteMes=Math.max(0,totalBoletos-qtdPagosMes);

  // === Agrupamento por SEGMENTO (Custo por Segmento) ===
  // Prioridade: segmento → categoria → "Sem segmento". Só considera tipoDespesa='Fornecedor' (já filtrado em contasMes).
  const segMap={};
  contasMes.forEach(c=>{
    const key=(c.segmento&&c.segmento.trim())||(c.categoria&&c.categoria.trim())||'Sem segmento';
    if(!segMap[key])segMap[key]={nome:key,valor:0,qtd:0};
    segMap[key].valor+=c.valor;
    segMap[key].qtd+=1;
  });
  const segArr=Object.values(segMap).sort((a,b)=>b.valor-a.valor);

  // Próximos vencimentos (a partir de hoje, no período)
  const dMaisHoje=d=>{const a=new Date(d+'T12:00:00'),b=new Date(todayStr+'T12:00:00');return Math.round((a-b)/(1000*60*60*24));};
  const pendentes=universo.filter(c=>c.status!=='Pago'&&c.vencimento>=todayStr);
  const prox7=pendentes.filter(c=>{const d=dMaisHoje(c.vencimento);return d>=0&&d<=7;}).reduce((s,c)=>s+c.valor,0);
  const prox30=pendentes.filter(c=>{const d=dMaisHoje(c.vencimento);return d>=0&&d<=30;}).reduce((s,c)=>s+c.valor,0);

  // Próximos vencimentos por fornecedor (janela 30 dias)
  const proxMap={};
  pendentes.filter(c=>{const d=dMaisHoje(c.vencimento);return d>=0&&d<=30;}).forEach(c=>{
    const nome=fornNome(c);
    if(!proxMap[nome])proxMap[nome]={nome,v7:0,v15:0,v30:0,total:0,qtd:0};
    const d=dMaisHoje(c.vencimento);
    if(d<=7)proxMap[nome].v7+=c.valor;
    if(d<=15)proxMap[nome].v15+=c.valor;
    proxMap[nome].v30+=c.valor;
    proxMap[nome].total+=c.valor;
    proxMap[nome].qtd+=1;
  });
  const proxArr=Object.values(proxMap).sort((a,b)=>b.total-a.total);

  // Frequência / cadência (intervalo médio em dias entre compras no mês)
  const cadencia=fornArr.map(f=>{
    const dts=[...new Set(f.datas)].sort();
    let intMed=null;
    if(dts.length>=2){
      const difs=[];
      for(let i=1;i<dts.length;i++){
        const a=new Date(dts[i-1]+'T12:00:00'),b=new Date(dts[i]+'T12:00:00');
        difs.push(Math.round((b-a)/(1000*60*60*24)));
      }
      intMed=Math.round(difs.reduce((s,x)=>s+x,0)/difs.length);
    }
    let classif='—';
    if(intMed===null)classif='Eventual';
    else if(intMed<=3)classif='Semanal+';
    else if(intMed<=8)classif='Semanal';
    else if(intMed<=16)classif='Quinzenal';
    else classif='Mensal';
    return{nome:f.nome,qtd:f.qtd,intMed,classif,valor:f.valor};
  });

  // Evolução últimos 6 meses — top 5 fornecedores do mês selecionado
  const top5=fornArr.slice(0,5).map(f=>f.nome);
  const meses=[];
  for(let i=5;i>=0;i--){
    const d=new Date(selYear,selMonth-i,1);
    meses.push({y:d.getFullYear(),m:d.getMonth(),label:MONTHS_SHORT[d.getMonth()]+'/'+String(d.getFullYear()).slice(2)});
  }
  const evolDatasets=top5.map((nome,idx)=>{
    const cores=['#dc2626','#2563eb','#16a34a','#d97706','#7c3aed'];
    const data=meses.map(mn=>{
      const s=monthStart(mn.y,mn.m),e=monthEnd(mn.y,mn.m);
      return universo.filter(c=>c.vencimento>=s&&c.vencimento<=e&&fornNome(c)===nome).reduce((sm,c)=>sm+c.valor,0);
    });
    return{label:nome,data,borderColor:cores[idx],backgroundColor:cores[idx]+'14',tension:0.3,pointRadius:3,fill:false};
  });

  // (gráfico donut "Concentração de Compras" removido — substituído pelo painel "Custo por Segmento")

  useChart(chartEvolRef,evolDatasets.length>0?{
    type:'line',
    data:{labels:meses.map(m=>m.label),datasets:evolDatasets},
    options:{responsive:true,maintainAspectRatio:false,plugins:{
      legend:{position:'bottom',labels:{boxWidth:10,font:{size:10},color:'#475569'}},
      tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': '+formatCurrency(ctx.parsed.y)}}
    },scales:{y:{ticks:{callback:v=>formatCurrency(v)}}}}
  }:null);

  if(universo.length===0){
    return(
      <div className="forn-empty-state">
        <div className="forn-empty-icon">🚚</div>
        <div className="forn-empty-title">Nenhum boleto de fornecedor cadastrado</div>
        <div className="forn-empty-sub">Cadastre boletos na aba <strong>Contas a Pagar</strong> com o tipo <em>Fornecedor</em> para que esta aba ganhe vida.</div>
      </div>
    );
  }

  return(
    <div>
      {/* CARD HERO — Total Pago a Fornecedores no mês (atualiza em tempo real) */}
      <div className="forn-pago-hero">
        <div className="forn-pago-hero-main">
          <div className="forn-pago-hero-label">
            <span className="forn-pago-ico">✓</span>
            <span>Pago a Fornecedores — {MONTHS[selMonth]} {selYear}</span>
          </div>
          <div className="forn-pago-hero-value">{fmtFull(totalPagoMes)}</div>
          <div className="forn-pago-hero-sub">
            {qtdPagosMes} de {totalBoletos} boleto{totalBoletos===1?'':'s'} quitado{qtdPagosMes===1?'':'s'}
          </div>
          <div className="forn-pago-hero-prog-wrap">
            <div className="forn-pago-hero-prog-bg">
              <div className="forn-pago-hero-prog" style={{width:Math.min(100,pctPagoMes)+'%'}}></div>
            </div>
          </div>
        </div>
        <div className="forn-pago-hero-cell">
          <div className="forn-pago-hero-cell-lbl">% do total comprado</div>
          <div className="forn-pago-hero-cell-val">{pctPagoMes}%</div>
          <div className="forn-pago-hero-cell-sub">de {fmtFull(totalMes)}</div>
        </div>
        <div className="forn-pago-hero-cell">
          <div className="forn-pago-hero-cell-lbl">Restante a pagar</div>
          <div className="forn-pago-hero-cell-val">{fmtFull(totalRestanteMes)}</div>
          <div className="forn-pago-hero-cell-sub">{qtdRestanteMes} boleto{qtdRestanteMes===1?'':'s'} em aberto</div>
        </div>
        <div className="forn-pago-hero-cell">
          <div className="forn-pago-hero-cell-lbl">Ticket médio pago</div>
          <div className="forn-pago-hero-cell-val">{fmtFull(qtdPagosMes>0?totalPagoMes/qtdPagosMes:0)}</div>
          <div className="forn-pago-hero-cell-sub">por boleto quitado</div>
        </div>
      </div>

      {/* KPIs no topo */}
      <div className="metrics-grid forn-kpi-grid">
        <div className="metric-card" style={{borderTop:'2px solid var(--blue)'}}>
          <div className="metric-label">Total comprado</div>
          <div className="metric-value" style={{color:'var(--blue)'}}>{fmtFull(totalMes)}</div>
          <div className="metric-sub">{totalBoletos} boleto{totalBoletos===1?'':'s'} em {MONTHS[selMonth]}</div>
        </div>
        <div className="metric-card" style={{borderTop:'2px solid var(--ink-300, #94a3b8)'}}>
          <div className="metric-label">Fornecedores ativos</div>
          <div className="metric-value">{fornArr.length}</div>
          <div className="metric-sub">com compras no mês</div>
        </div>
        <div className="metric-card" style={{borderTop:'2px solid var(--amber)'}}>
          <div className="metric-label">Ticket médio</div>
          <div className="metric-value amber">{fmtFull(ticketMedio)}</div>
          <div className="metric-sub">por boleto</div>
        </div>
        <div className="metric-card" style={{borderTop:`2px solid ${concTop3>=60?'var(--red)':concTop3>=40?'var(--amber)':'var(--green)'}`}}>
          <div className="metric-label">Concentração TOP-3</div>
          <div className="metric-value" style={{color:concTop3>=60?'var(--red)':concTop3>=40?'var(--amber)':'var(--green)'}}>{concTop3}%</div>
          <div className="metric-sub">{concTop3>=60?'⚠️ Alta dependência':concTop3>=40?'Atenção':'Diversificado'}</div>
        </div>
        <div className="metric-card" style={{borderTop:'2px solid var(--red)'}}>
          <div className="metric-label">Vence em 7 dias</div>
          <div className="metric-value red">{fmtFull(prox7)}</div>
          <div className="metric-sub">a pagar (geral)</div>
        </div>
        <div className="metric-card" style={{borderTop:'2px solid var(--amber)'}}>
          <div className="metric-label">Vence em 30 dias</div>
          <div className="metric-value amber">{fmtFull(prox30)}</div>
          <div className="metric-sub">a pagar (geral)</div>
        </div>
      </div>

      {/* Linha 1: Ranking por volume (40%) + Custo por Segmento (60%) */}
      <div className="forn-row-2col forn-row-4060">
        <div className="card forn-rank-card">
          <div className="card-title">Ranking por Volume — {MONTHS[selMonth]} {selYear}</div>
          {fornArr.length===0?(
            <div className="forn-empty">Nenhuma compra de fornecedor neste mês.</div>
          ):(
            <table className="forn-table">
              <thead>
                <tr><th style={{width:28}}>#</th><th>Fornecedor</th><th style={{textAlign:'right',width:104}}>Valor</th><th style={{textAlign:'right',width:90}}>% Total</th><th style={{textAlign:'right',width:60}}>Boletos</th><th style={{textAlign:'right',width:96}}>Ticket médio</th></tr>
              </thead>
              <tbody>
                {fornArr.slice(0,10).map((f,i)=>{
                  const p=totalMes>0?pct(f.valor,totalMes):0;
                  const tk=f.qtd>0?f.valor/f.qtd:0;
                  return(
                    <tr key={i}>
                      <td className="forn-rank-num">{i+1}</td>
                      <td className="forn-rank-name" title={f.nome}>{f.nome}</td>
                      <td style={{textAlign:'right',fontWeight:600,color:'var(--text-primary)'}}>{fmtFull(f.valor)}</td>
                      <td style={{textAlign:'right'}}>
                        <div className="forn-pct-cell">
                          <div className="forn-pct-bar"><div className="forn-pct-fill" style={{width:p+'%'}}></div></div>
                          <span>{p}%</span>
                        </div>
                      </td>
                      <td style={{textAlign:'right'}}>{f.qtd}</td>
                      <td style={{textAlign:'right'}}>{fmtFull(tk)}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )}
          {fornArr.length>10&&<div className="forn-foot-note">Exibindo top 10 de {fornArr.length} fornecedores</div>}
        </div>

        <div className="card forn-seg-card">
          <div className="forn-seg-head">
            <div className="card-title" style={{marginBottom:0}}>Custo por Segmento — {MONTHS[selMonth]} {selYear}</div>
            <div className="forn-seg-total">
              <div className="forn-seg-total-lbl">Total comprado</div>
              <div className="forn-seg-total-val">{fmtFull(totalMes)}</div>
            </div>
          </div>
          {segArr.length===0?(
            <div className="forn-empty">Nenhuma compra de fornecedor registrada neste mês.</div>
          ):(
            <div className="forn-seg-list">
              {segArr.map((s,i)=>{
                const p=totalMes>0?pct(s.valor,totalMes):0;
                return(
                  <div className="forn-seg-cell" key={i}>
                    <div className="forn-seg-row-top">
                      <div className="forn-seg-name" title={s.nome}>
                        <span className="forn-seg-rank">{i+1}</span>
                        <span>{s.nome}</span>
                      </div>
                      <div className="forn-seg-val">{fmtFull(s.valor)}</div>
                    </div>
                    <div className="forn-seg-bar-wrap">
                      <div className="forn-seg-bar-bg"><div className="forn-seg-bar-fill" style={{width:Math.min(100,p)+'%'}}></div></div>
                      <div className="forn-seg-pct">{p}%</div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>

      {/* Linha 2: Frequência + Próximos vencimentos */}
      <div className="forn-row-2col">
        <div className="card">
          <div className="card-title">Frequência de Compra (Cadência)</div>
          {cadencia.length===0?(
            <div className="forn-empty">Sem dados de cadência.</div>
          ):(
            <table className="forn-table">
              <thead>
                <tr><th>Fornecedor</th><th style={{textAlign:'center',width:56}}>Boletos</th><th style={{textAlign:'center',width:96}}>Intervalo médio</th><th style={{textAlign:'right',width:96}}>Classificação</th></tr>
              </thead>
              <tbody>
                {cadencia.slice(0,8).map((c,i)=>{
                  const badgeClass=c.classif==='Semanal+'||c.classif==='Semanal'?'cad-semanal':c.classif==='Quinzenal'?'cad-quinzenal':c.classif==='Mensal'?'cad-mensal':'cad-eventual';
                  return(
                    <tr key={i}>
                      <td className="forn-rank-name" title={c.nome}>{c.nome}</td>
                      <td style={{textAlign:'center'}}>{c.qtd}</td>
                      <td style={{textAlign:'center',color:'var(--text-secondary)'}}>{c.intMed===null?'—':c.intMed+' dia'+(c.intMed===1?'':'s')}</td>
                      <td style={{textAlign:'right'}}><span className={`cad-badge ${badgeClass}`}>{c.classif}</span></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )}
        </div>

        <div className="card">
          <div className="card-title">Próximos Vencimentos por Fornecedor</div>
          {proxArr.length===0?(
            <div className="forn-empty">Nenhum vencimento a pagar nos próximos 30 dias.</div>
          ):(
            <table className="forn-table">
              <thead>
                <tr><th>Fornecedor</th><th style={{textAlign:'right',width:84}}>7 dias</th><th style={{textAlign:'right',width:84}}>15 dias</th><th style={{textAlign:'right',width:84}}>30 dias</th></tr>
              </thead>
              <tbody>
                {proxArr.slice(0,8).map((f,i)=>(
                  <tr key={i}>
                    <td className="forn-rank-name" title={f.nome}>{f.nome}</td>
                    <td style={{textAlign:'right',color:f.v7>0?'var(--red-dim)':'var(--text-muted)',fontWeight:f.v7>0?600:400}}>{f.v7>0?fmtFull(f.v7):'—'}</td>
                    <td style={{textAlign:'right',color:f.v15>0?'var(--amber-dim)':'var(--text-muted)'}}>{f.v15>0?fmtFull(f.v15):'—'}</td>
                    <td style={{textAlign:'right',color:'var(--text-secondary)'}}>{f.v30>0?fmtFull(f.v30):'—'}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>

      {/* Linha 3: Evolução mensal */}
      <div className="card forn-evol-card">
        <div className="card-title">Evolução Mensal — Top 5 fornecedores · últimos 6 meses</div>
        {top5.length===0?(
          <div className="forn-empty">Selecione um mês com compras para visualizar a evolução.</div>
        ):(
          <div style={{position:'relative',height:240}}>
            <canvas ref={chartEvolRef}></canvas>
          </div>
        )}
      </div>
    </div>
  );
}

// Fonte de dados: Supabase via props — conectado no BLOCO 4.6.
// calcUnitKPIs é placeholder; retorna zeros até o login ser adaptado.

const MAX_UNITS=100;

// BLOCO 4.6 — KPIs reais do Portfólio. Lê do mapa kpisPortfolio pré-calculado via Supabase.
// Se a unidade ainda não tiver dados carregados, retorna objeto empty como fallback seguro.
const KPIS_EMPTY={totalEntradas:0,totalContasAbertas:0,totalDespesasPeriodo:0,totalDividasAtivas:0,totalRetiradas:0,totalFornecedores:0,saldoProjetado:0,status:'empty'};
const calcUnitKPIs=(unit,kpisPortfolio)=>kpisPortfolio?.[unit.id]||KPIS_EMPTY;

// Classificação única de status financeiro — mesma regra usada no BLOCO 4.6 (useEffect de KPIs),
// extraída para função pura para também classificar o total consolidado do Portfólio sem duplicar a regra.
// `totalObrigacoes` DEVE ser o mesmo valor exibido no card como "Contas a Pagar"
// (totalDespesasPeriodo). Antes recebia totalContasAbertas — métrica diferente da exibida —, o que
// classificava como Saudável unidades cujo card mostrava obrigações acima das entradas.
// Uma unidade cujas obrigações do período superam as entradas é Crítica, mesmo com saldo positivo.
// Coerções com Number(...)||0 evitam NaN e impedem que dado ausente caia em 'ok'.
const pfClassifyStatus=(totalEntradas,totalObrigacoes,saldoProjetado)=>{
  const ent=Number(totalEntradas)||0;
  const obr=Number(totalObrigacoes)||0;
  const saldo=Number(saldoProjetado)||0;
  if(ent>0||obr>0){
    if(saldo<=0||obr>ent)return'danger';
    if(obr>=ent*0.75)return'warn';
    return'ok';
  }
  return'empty';
};
// Meta de apresentação (classe CSS + rótulo) por status — fonte única para pills, faixas laterais, filtros, contadores, tabela e visão consolidada.

  warn:{key:'atencao',label:'Atenção'},
  danger:{key:'critica',label:'Crítica'},
  empty:{key:'sem-mov',label:'Sem movimentação'},

const pfTone=key=>key==='critica'?'r':key==='atencao'?'a':key==='sem-mov'?'gray':'g';

// ══════════════════════════════════════════════════════════════
// PRIMEIRA CAMADA DO PORTFÓLIO — VISÃO GERAL (gráfico + resumo)
// Camada VISUAL isolada. Não lê, não escreve e não interfere em:
// kpisPortfolio, cards de unidade, comparação, Supabase, localStorage,
// criação/exclusão/seleção de unidade ou qualquer outra aba.
// ══════════════════════════════════════════════════════════════

// Série mensal VAZIA (Jan..Dez) — estado inicial e fallback real. `faturamento:null` marca
// "mês sem lançamentos" e aciona o estado visual de ausência de dados já implementado.
// NÃO é mock: não carrega valor algum, apenas a moldura de 12 meses.
const pfOvSerieVazia=()=>MONTHS_SHORT.map((m,i)=>({
  mes:m,mesCompleto:MONTHS[i],
  faturamento:null,despesaFixa:0,despesaVariavel:0,despesaFornecedores:0,despesaFinanceira:0,
}));

// Índice do mês (0..11) de uma data 'YYYY-MM-DD' dentro do ano informado; -1 se for de outro ano.
// Comparação por string, sem Date — mesma abordagem usada no resto do sistema (sem fuso horário).
const pfOvMesDe=(data,ano)=>{
  if(!data||typeof data!=='string')return -1;
  const partes=data.split('-');
  if(Number(partes[0])!==Number(ano))return -1;
  const mi=Number(partes[1])-1;
  return (mi>=0&&mi<=11)?mi:-1;
};

// Consolida os 12 meses do ano a partir das fontes REAIS, replicando as réguas já existentes:
//  • Faturamento  = soma de entradas.total com `data` dentro do mês — mesma regra do Painel do
//                   Dono (linhas 2046-2047) e do KPI totalEntradas do Portfólio (linha 6181).
//  • Despesas     = mergeContasComParcelas(contas,dividas) POR EMPRESA, filtrado por `vencimento`
//                   dentro do mês — mesma regra de totalDespesasPeriodo (linha 6189).
//  • Categorias   = classificação por `tipoDespesa` com o MESMO fallback do Painel do Dono
//                   (linha 2106): tipo ausente ou desconhecido cai em 'Variável'.
// SEM DUPLA CONTAGEM: as parcelas de dívidas já entram no merge como tipoDespesa 'Financeira'
// (linha 4583), por isso `dividas` nunca é somada separadamente.
const buildPortfolioMonthlyData=(ano,ids,rawEnt,rawCon,rawDiv)=>{
  const serie=pfOvSerieVazia();
  const entPorMes=serie.map(()=>0);
  const qtdRegistros=serie.map(()=>0); // 0 = mês sem nenhum lançamento real
  (rawEnt||[]).forEach(r=>{
    const mi=pfOvMesDe(r.data,ano);
    if(mi<0)return;
    entPorMes[mi]+=Number(r.total)||0;
    qtdRegistros[mi]++;
  });
  (ids||[]).forEach(id=>{
    // Merge por empresa (nunca cruzando unidades) — igual ao consolidado do Portfólio.
    const con=(rawCon||[]).filter(r=>r.empresa_id===id);
    const div=(rawDiv||[]).filter(r=>r.empresa_id===id);
    mergeContasComParcelas(con,div).forEach(r=>{
      const mi=pfOvMesDe(r.vencimento,ano);
      if(mi<0)return;
      const t=r.tipoDespesa||'Variável';
      const campo=t==='Fixa'?'despesaFixa':t==='Fornecedor'?'despesaFornecedores':t==='Financeira'?'despesaFinanceira':'despesaVariavel';
      serie[mi][campo]+=Number(r.valor)||0;
      qtdRegistros[mi]++;
    });
  });
  serie.forEach((m,i)=>{
    if(qtdRegistros[i]===0)return; // permanece com faturamento null → estado visual de "sem dados"
    m.faturamento=pfOvCents(entPorMes[i]);
    m.despesaFixa=pfOvCents(m.despesaFixa);
    m.despesaVariavel=pfOvCents(m.despesaVariavel);
    m.despesaFornecedores=pfOvCents(m.despesaFornecedores);
    m.despesaFinanceira=pfOvCents(m.despesaFinanceira);
  });
  return serie;
};

// Arredonda para centavos — elimina o resíduo binário do float e garante que a soma dos quatro
// subcards seja EXATAMENTE igual ao total exibido e à barra vermelha do gráfico.
const pfOvCents=v=>Math.round((Number(v)||0)*100)/100;
// FONTE ÚNICA do total de despesas do mês: usado pela barra vermelha, pelo total do resumo e
// pela conferência dos subcards. Nenhum outro lugar recalcula despesas nesta camada.
const getDespesasTotais=item=>pfOvCents((item?.despesaFixa||0)+(item?.despesaVariavel||0)+(item?.despesaFornecedores||0)+(item?.despesaFinanceira||0));
// Retorna null (estado neutro) quando não há base comparável — evita NaN e Infinity.
const getVariacaoPercentual=(atual,anterior)=>{
  if(anterior===null||anterior===undefined)return null;
  const base=Number(anterior);
  if(!Number.isFinite(base)||base<=0)return null;
  const v=((Number(atual)-base)/base)*100;
  return Number.isFinite(v)?v:null;
};
const getDeltaMonetario=(atual,anterior)=>{
  if(anterior===null||anterior===undefined)return null;
  const base=Number(anterior);
  if(!Number.isFinite(base))return null;
  const d=pfOvCents(Number(atual)-base);
  return Number.isFinite(d)?d:null;
};
// Separa visualmente inteiro/centavos SEM quebrar a localização: formata em pt-BR primeiro
// (formatCurrencyBR já existente) e corta na última vírgula, que é o separador decimal do locale.
const splitCurrencyBRParts=valor=>{
  const s=formatCurrencyBR(valor);
  const i=s.lastIndexOf(',');
  return i===-1?{inteiro:s,centavos:''}:{inteiro:s.slice(0,i),centavos:s.slice(i)};
};

// Ícones dos subcards — SVG inline no mesmo traço dos ícones já usados no sistema (sem emoji).
const PFOverviewIcon={
  fixa:(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M10 21v-5h4v5"/></svg>),
  variavel:(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12h4l3 7 4-14 3 7h4"/></svg>),
  fornecedores:(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 7h11v10H3z"/><path d="M14 10h4l3 3v4h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>),
  financeira:(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 10l9-5 9 5"/><path d="M5 10v8M19 10v8M9 10v8M15 10v8"/><path d="M3 21h18"/></svg>),
  grafico:(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 16V11M12 16V8M16 16v-3"/></svg>),
};

// Geometria do gráfico — viewBox fixo + width:100% no CSS = escala responsiva sem largura rígida.
// Valores replicados do design aprovado (PRX FLUXO DE CAIXA - 85.html):
// trilhos verticais do topo à base, marcador circular na altura do valor, rótulo do mês em círculo.
const PF_OV_CHART={
  w:680,h:214,padT:40,padB:42,padL:16,padR:16,
  off:8,          // afastamento das duas hastes (Faturamento à esquerda, Despesas à direita)
  raioDot:5,      // marcador no topo da haste
  raioLab:13,     // círculo do rótulo do mês
  folgaTopo:1.3,  // headroom da escala — mantém os marcadores longe da borda superior
};

function PortfolioOverview({mesInicial,empresas,ano}){
  // ÚNICO estado de mês desta camada (0..11) — fonte de verdade do gráfico, do tooltip,
  // da variação, do resumo e dos quatro subcards. Puramente local: não toca selMonth/selYear
  // globais, portanto não afeta nada abaixo desta seção.
  const[mesIdx,setMesIdx]=useState(()=>{
    const n=Number(mesInicial);
    return Number.isInteger(n)&&n>=0&&n<=11?n:new Date().getMonth();
  });
  // Série mensal REAL. Estado inicial = 12 meses vazios (nunca valores fictícios).
  const[serie,setSerie]=useState(pfOvSerieVazia);
  const idsChave=(empresas||[]).map(e=>e.id).filter(Boolean).join(',');
  // Carrega UMA vez por (ano × conjunto de unidades) — trocar o mês não refaz consulta.
  // Reaproveita o cliente, os filtros por empresa_id, a paginação e a ordenação determinística
  // já existentes (fetchAllPages + .order('id')), sem tocar em nenhuma query do sistema.
  useEffect(()=>{
    const ids=idsChave?idsChave.split(','):[];
    if(!ids.length){setSerie(pfOvSerieVazia());return;}
    let cancelado=false; // descarta resposta antiga ao trocar de ano/cliente (evita corrida)
    (async()=>{
      try{
        const aStart=`${ano}-01-01`,aEnd=`${ano}-12-31`;
        // contas/dividas SEM filtro de data: mergeContasComParcelas precisa do histórico completo
        // (uma dívida ou fixa de meses atrás gera parcela dentro do ano exibido) — mesma exigência
        // já aplicada no consolidado do Portfólio e no Painel do Dono.
        const[rawEnt,rawCon,rawDiv]=await Promise.all([
          fetchAllPages((from,to)=>supabase.from('entradas').select('empresa_id,total,data').in('empresa_id',ids).gte('data',aStart).lte('data',aEnd).order('id',{ascending:true}).range(from,to),'overviewMensal:entradas'),
          fetchAllPages((from,to)=>supabase.from('contas').select('id,empresa_id,valor,status,vencimento,tipoDespesa,dividaVinculadaId,descricao').in('empresa_id',ids).order('id',{ascending:true}).range(from,to),'overviewMensal:contas'),
          fetchAllPages((from,to)=>supabase.from('dividas').select('id,empresa_id,parcelaMensal,status,vencimento,valorUtilizado,banco,tipo,quitada_em').in('empresa_id',ids).in('status',['Ativa','Quitada']).order('id',{ascending:true}).range(from,to),'overviewMensal:dividas'),
        ]);
        if(cancelado)return;
        setSerie(buildPortfolioMonthlyData(ano,ids,rawEnt,rawCon,rawDiv));
      }catch(err){
        if(cancelado)return;
        // Mantém a última série válida; nunca cai em valores fictícios.
        console.error('Erro ao carregar a série mensal do Portfólio:',err);
      }
    })();
    return()=>{cancelado=true;};
  },[ano,idsChave]);
  // Mês "com dados" = faturamento informado. A série atual do index.html tem os 12 meses
  // preenchidos, então o estado vazio nunca dispara — o tratamento visual existe para quando a
  // fonte real entrar. Nenhum mês fictício, null ou valor do arquivo 85 foi introduzido.
  const temDados=x=>!!x&&x.faturamento!=null;
  const preenchidos=serie.map((x,i)=>temDados(x)?i:-1).filter(i=>i>=0);
  // Mês ativo: o selecionado se tiver dados; senão, o último preenchido (evita seleção inválida).
  const idx=temDados(serie[mesIdx])?mesIdx:(preenchidos.length?preenchidos[preenchidos.length-1]:0);
  const atual=serie[idx];
  // Mês preenchido imediatamente anterior ao ativo — base da variação.
  const antesDoAtivo=preenchidos.filter(m=>m<idx);
  const pIdx=antesDoAtivo.length?antesDoAtivo[antesDoAtivo.length-1]:null;
  const anterior=pIdx!=null?serie[pIdx]:null;
  const despesasAtual=getDespesasTotais(atual);
  const delta=getDeltaMonetario(atual.faturamento,anterior?anterior.faturamento:null);
  const valorPartes=splitCurrencyBRParts(atual.faturamento);

  // Escala vertical dinâmica sobre o maior valor entre os meses PREENCHIDOS (faturamento OU
  // despesas), com folga no topo (×1.3, como no arquivo 85). Base ZERO — eixo nunca truncado.
  const G=PF_OV_CHART;
  const plotH=G.h-G.padT-G.padB;
  const baseY=G.padT+plotH;
  const labY=baseY+24;                       // centro dos círculos de rótulo
  const slotW=(G.w-G.padL-G.padR)/serie.length;
  const maxSerie=preenchidos.reduce((m,i)=>Math.max(m,Number(serie[i].faturamento)||0,getDespesasTotais(serie[i])),0);
  const escala=(maxSerie>0?maxSerie:1)*G.folgaTopo; // nunca divide por zero
  const cxOf=i=>G.padL+slotW*i+slotW/2;
  const yOf=v=>G.padT+plotH-(Math.max(0,Number(v)||0)/escala)*plotH;

  // Tooltip HTML sobreposto ao SVG — posicionado em % e travado entre 17% e 83% da largura,
  // para não vazar do painel quando o primeiro ou o último mês está selecionado.
  const tipLeft=Math.min(Math.max(cxOf(idx)/G.w*100,17),83);
  const tipTop=yOf(Math.max(atual.faturamento,despesasAtual))/G.h*100;

  // Saldo projetado do período = faturamento consolidado − despesas consolidadas (mesma base do gráfico).
  const saldoProjetadoPeriodo=pfOvCents((Number(atual.faturamento)||0)-(Number(despesasAtual)||0));
  const badgeClasse=delta===null?'':(delta>0?'up':delta<0?'down':'');
  const badgeSeta=delta===null?'—':(delta>0?'↑':delta<0?'↓':'→');

  const subcards=[
    {chave:'fixa',        lbl:'Despesas Fixas',           valor:atual.despesaFixa,         ico:PFOverviewIcon.fixa,         tom:'b'},
    {chave:'variavel',    lbl:'Despesas Variáveis',       valor:atual.despesaVariavel,     ico:PFOverviewIcon.variavel,     tom:'a'},
    {chave:'fornecedores',lbl:'Despesas c/ Fornecedores', valor:atual.despesaFornecedores, ico:PFOverviewIcon.fornecedores, tom:'p'},
    {chave:'financeira',  lbl:'Despesas Financeiras',     valor:atual.despesaFinanceira,   ico:PFOverviewIcon.financeira,   tom:'r'},
  ];

  return(
    <div className="pf-overview-grid">
      {/* ── PAINEL ESQUERDO — FATURAMENTO VS DESPESAS ── */}
      <section className="pf-overview-chart-panel">
        <header className="pf-overview-hd">
          <div className="pf-overview-titlewrap">
            <div className="pf-overview-title-ico" aria-hidden="true">{PFOverviewIcon.grafico}</div>
            <div style={{minWidth:0}}>
              <h3 className="pf-overview-title">Faturamento vs Despesas</h3>
              <p className="pf-overview-sub">Faturamento e despesas consolidadas de todas as unidades, mês a mês.</p>
            </div>
          </div>
          <div className="pf-overview-pill">
            <select
              className="pf-overview-pill-sel"
              aria-label="Mês em destaque no gráfico de faturamento e despesas"
              value={idx}
              onChange={e=>setMesIdx(parseInt(e.target.value,10))}
            >
              {preenchidos.map(i=><option key={i} value={i}>{MONTHS[i]}</option>)}
            </select>
            <svg className="pf-overview-pill-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </header>

        <div className="pf-overview-legend">
          <span><i className="pf-overview-sw" style={{background:'var(--green)'}}></i>Faturamento</span>
          <span><i className="pf-overview-sw" style={{background:'var(--red)'}}></i>Despesas</span>
        </div>

        <div className="pf-overview-plot">
          <svg
            className="pf-overview-svg"
            viewBox={`0 0 ${G.w} ${G.h}`}
            preserveAspectRatio="xMidYMid meet"
            role="img"
            aria-labelledby="pfOvChartTitle pfOvChartDesc"
          >
            <title id="pfOvChartTitle">Faturamento e despesas consolidadas por mês</title>
            <desc id="pfOvChartDesc">
              {`Mês em destaque: ${atual.mesCompleto}. Faturamento ${formatCurrencyBR(atual.faturamento)}. Despesas ${formatCurrencyBR(despesasAtual)}.`}
            </desc>

            <defs>
              {/* Halos verticais em degradê, um por série, atrás de cada mês com valor */}
              <linearGradient id="pfOvGradFat" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stopColor="var(--green)" stopOpacity="0.30"/>
                <stop offset="1" stopColor="var(--green)" stopOpacity="0"/>
              </linearGradient>
              <linearGradient id="pfOvGradDesp" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stopColor="var(--red)" stopOpacity="0.26"/>
                <stop offset="1" stopColor="var(--red)" stopOpacity="0"/>
              </linearGradient>
            </defs>

            {serie.map((it,i)=>{
              const cx=cxOf(i);
              // Mês SEM lançamentos: trilhos e círculo esmaecidos, sem marcadores e não selecionável.
              if(!temDados(it)){
                return(
                  <g key={it.mes}>
                    <line className="pf-overview-track empty" x1={cx} y1={G.padT} x2={cx} y2={baseY}/>
                    <circle cx={cx} cy={labY} r={G.raioLab} fill="var(--surface-2)" opacity="0.55"/>
                    <text x={cx} y={labY} textAnchor="middle" dominantBaseline="central" className="pf-overview-mlab" fill="var(--text-muted)" opacity="0.55">{it.mes}</text>
                  </g>
                );
              }
              const dv=getDespesasTotais(it);
              const sel=i===idx;
              const fX=cx-G.off, dX=cx+G.off;
              const fY=yOf(it.faturamento), dY=yOf(dv);
              return(
                <g key={it.mes} className="pf-overview-col"
                  tabIndex={0} role="button"
                  aria-label={`${it.mesCompleto}: faturamento ${formatCurrencyBR(it.faturamento)}, despesas ${formatCurrencyBR(dv)}`}
                  aria-pressed={sel}
                  onClick={()=>setMesIdx(i)}
                  onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setMesIdx(i);}}}
                >
                  {/* Faixas coloridas: visíveis sempre que houver valor, independentemente da seleção */}
                  {Number(it.faturamento)>0&&(
                    <rect x={fX-8} y={fY-8} width="16" height={baseY-(fY-8)} rx="8" fill="url(#pfOvGradFat)"/>
                  )}
                  {Number(dv)>0&&(
                    <rect x={dX-8} y={dY-8} width="16" height={baseY-(dY-8)} rx="8" fill="url(#pfOvGradDesp)"/>
                  )}
                  {/* Auréolas — destaque exclusivo do mês selecionado */}
                  {sel&&(<>
                    <circle cx={fX} cy={fY} r="10" fill="var(--green)" opacity="0.14"/>
                    <circle cx={dX} cy={dY} r="10" fill="var(--red)" opacity="0.12"/>
                  </>)}
                  {/* Trilhos verticais finos (Faturamento e Despesas, lado a lado) */}
                  <line className="pf-overview-track" x1={fX} y1={G.padT} x2={fX} y2={baseY}/>
                  <line className="pf-overview-track" x1={dX} y1={G.padT} x2={dX} y2={baseY}/>
                  {/* Marcadores arredondados na altura do valor */}
                  <circle className="pf-overview-dot" cx={fX} cy={fY} r={G.raioDot} fill="var(--green)"/>
                  <circle className="pf-overview-dot" cx={dX} cy={dY} r={G.raioDot} fill="var(--red)"/>
                  {/* Rótulo do mês em círculo (escuro se ativo, cinza-claro caso contrário) */}
                  <circle cx={cx} cy={labY} r={G.raioLab} fill={sel?'var(--carbon)':'var(--surface-2)'}/>
                  <text x={cx} y={labY} textAnchor="middle" dominantBaseline="central" className="pf-overview-mlab" fill={sel?'#fff':'var(--text-secondary)'}>{it.mes}</text>
                  {/* Área de toque ampliada */}
                  <rect x={cx-slotW/2} y={G.padT-16} width={slotW} height={plotH+50} fill="transparent"/>
                </g>
              );
            })}
          </svg>

          {/* Tooltip escuro (chip carbon) — Faturamento e Despesas do mês selecionado */}
          <div className="pf-overview-tip" style={{left:tipLeft+'%',top:tipTop+'%'}}>
            <div className="pf-overview-tip-month">{MONTHS[idx]}</div>
            <div className="pf-overview-tip-row">
              <i className="pf-overview-tip-dot" style={{background:'var(--green-mid)'}}></i>
              <span className="pf-overview-tip-lbl">Faturamento</span>
              <span className="pf-overview-tip-val">{formatCurrencyBR(atual.faturamento)}</span>
            </div>
            <div className="pf-overview-tip-row">
              <i className="pf-overview-tip-dot" style={{background:'#f87171'}}></i>
              <span className="pf-overview-tip-lbl">Despesas</span>
              <span className="pf-overview-tip-val">{formatCurrencyBR(despesasAtual)}</span>
            </div>
            <span className="pf-overview-tip-arrow"></span>
          </div>
        </div>

        {/* Indicador grande de saldo projetado (canto inferior esquerdo) */}
        <footer className="pf-overview-foot">
          <div className={`pf-overview-var ${saldoProjetadoPeriodo>0?'up':saldoProjetadoPeriodo<0?'down':'neutral'}`}>{formatCurrencyBR(saldoProjetadoPeriodo)}</div>
          <div className="pf-overview-var-cap">Saldo projetado</div>
        </footer>
      </section>

      {/* ── PAINEL DIREITO — RESUMO DO MÊS ── */}
      <section className="pf-overview-summary-panel">
        <div className="pf-overview-sum-hd">Resumo de {atual.mesCompleto}</div>
        <div className="pf-overview-sum-lbl">Faturamento consolidado</div>
        <div className="pf-overview-sum-val">
          {valorPartes.inteiro}<span className="pf-overview-sum-cents">{valorPartes.centavos}</span>
        </div>
        <div className={`pf-overview-badge ${badgeClasse}`}>
          <span>{badgeSeta} {delta===null?'sem base comparável':formatCurrencyBR(Math.abs(delta))}</span>
          <span className="sep">·</span>
          <span className="sep">vs. mês anterior</span>
        </div>

        <div className="pf-overview-expense-grid">
          {subcards.map(c=>(
            <div className="pf-overview-expense-card" key={c.chave}>
              <div className={`pf-overview-expense-ico ${c.tom}`}>{c.ico}</div>
              <div className="pf-overview-expense-lbl">{c.lbl}</div>
              <div className="pf-overview-expense-val" title={formatCurrencyBR(c.valor)}>{formatCurrencyBR(c.valor)}</div>
            </div>
          ))}
        </div>

        <div className="pf-overview-total">
          <span className="pf-overview-total-lbl">Despesas totais</span>
          <span className="pf-overview-total-val">{formatCurrencyBR(despesasAtual)}</span>
        </div>
      </section>
    </div>
  );
}

          <span style={{fontSize:9.5,color:'var(--text-muted)',fontWeight:500,letterSpacing:'.02em'}}>{mesLabel}</span>

        <div className="unit-kpi">
          <div className="unit-kpi-lbl">📋 Contas em aberto</div>

        </div>
        <div className="unit-kpi">
          <div className="unit-kpi-lbl">🏦 Dívidas ativas</div>
          <div className={`unit-kpi-val${k.totalDividasAtivas>0?' r':''}`}>{k.totalDividasAtivas>0?fmt(k.totalDividasAtivas):'—'}</div>

        </div>
        <div className="unit-kpi">
          <div className="unit-kpi-lbl">👤 Retiradas do mês</div>
          <div className={`unit-kpi-val${k.totalRetiradas>0?' a':''}`}>{k.totalRetiradas>0?fmt(k.totalRetiradas):'—'}</div>
          <div className="unit-kpi-sub">{mesLabel}</div>
        </div>
        <div className="unit-kpi">
          <div className="unit-kpi-lbl">🚚 Fornecedores</div>
          <div className="unit-kpi-val">{k.totalFornecedores>0?fmt(k.totalFornecedores):'—'}</div>
          <div className="unit-kpi-sub">total do mês</div>
        </div>
        <div className="unit-kpi">
          <div className="unit-kpi-lbl">💵 Saldo projetado</div>
          <div className={`unit-kpi-val${k.saldoProjetado>0?' g':k.saldoProjetado<0?' r':''}`}>{k.status==='empty'?'—':fmt(k.saldoProjetado)}</div>
          <div className="unit-kpi-sub">entradas − contas − retiradas</div>
        </div>
      </div>
      <div className="unit-card-footer">
        <button className="unit-card-footer-btn" onClick={e=>{e.stopPropagation();onSelect(unit.id);}}>
          Abrir painel →
