        {showExcluir&&(
          <button className="unit-card-footer-btn" style={{color:'var(--red-dim)'}} onClick={e=>{e.stopPropagation();onExcluir(unit);}}>
            Excluir
          </button>
        )}
        <span className="unit-card-mes">{unit.clienteNome||''}</span>
      </div>
    </div>
  );
}

function Portfolio({empresas,selYear,selMonth,setSelYear,setSelMonth,empresaAtiva,onSelectEmpresa,kpisPortfolio,onCriarUnidade,onExcluirUnidade,onRenomearUnidade,roleGlobal}){
  const[showModal,setShowModal]=useState(false);
  const[newName,setNewName]=useState('');
  const[newSeg,setNewSeg]=useState('');
  const[salvandoUnidade,setSalvandoUnidade]=useState(false);
  const[erroUnidade,setErroUnidade]=useState('');
  const[confirmDelete,setConfirmDelete]=useState(null);
  const[excluindoUnidade,setExcluindoUnidade]=useState(false);
  const[erroExcluir,setErroExcluir]=useState('');
  const[editUnit,setEditUnit]=useState(null);
  const[editName,setEditName]=useState('');
  const[salvandoEdicao,setSalvandoEdicao]=useState(false);
  const[erroEdicao,setErroEdicao]=useState('');
  // Estado da comparação — apenas interface, não afeta cálculos nem persistência.
  const[viewMode,setViewMode]=useState('cards'); // 'cards' | 'tabela'
  const[search,setSearch]=useState('');
  const[sortBy,setSortBy]=useState('saldo');     // saldo | entradas | contas | fornecedores | nome
  const[statusFilter,setStatusFilter]=useState('todos');
  const canAdd=empresas.length<MAX_UNITS;
  const canDelete=empresas.length>1;
  const fecharModal=()=>{setShowModal(false);setNewName('');setNewSeg('');setErroUnidade('');};
  const fecharConfirmDelete=()=>{if(excluindoUnidade)return;setConfirmDelete(null);setErroExcluir('');};
  const handleCriar=async()=>{
    setErroUnidade('');
    setSalvandoUnidade(true);
    const err=await onCriarUnidade(newName);
    setSalvandoUnidade(false);
    if(err){setErroUnidade(err);return;}
    fecharModal();
  };
  const handleExcluir=async()=>{
    if(!confirmDelete)return;
    setErroExcluir('');
    setExcluindoUnidade(true);
    const err=await onExcluirUnidade(confirmDelete.id);
    setExcluindoUnidade(false);
    if(err){setErroExcluir(err);return;}
    setConfirmDelete(null);
  };
  const abrirEdicao=u=>{setEditUnit(u);setEditName(u.nome);setErroEdicao('');};
  const fecharEdicao=()=>{if(salvandoEdicao)return;setEditUnit(null);setEditName('');setErroEdicao('');};
  const handleSalvarNome=async()=>{
    if(!editUnit)return;
    setErroEdicao('');
    setSalvandoEdicao(true);
    const err=await onRenomearUnidade(editUnit.id,editName);
    setSalvandoEdicao(false);
    if(err){setErroEdicao(err);return;}
    setEditUnit(null);setEditName('');
  };
  const mesLabel=MONTHS[selMonth]+'/'+selYear;

  // Formatação BR de percentual (duas casas quando necessário).
  const fmtPct=v=>((v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}))+'%';
  const toneVar=t=>t==='r'?'var(--red)':t==='a'?'var(--amber-dim)':t==='gray'?'var(--text-muted)':'var(--green-dim)';
  const chipDot=k=>k==='saudavel'?'var(--green)':k==='atencao'?'var(--amber)':k==='critica'?'var(--red)':'var(--ink-300)';
  // Barra proporcional real: 0 quando o valor é zero (sem barra enganosa).
  const barPct=(v,mx)=>(mx>0&&v>0)?Math.max(4,Math.round(v/mx*100)):0;
  const pillLabel=k=>k==='sem-mov'?'Sem mov.':(k==='saudavel'?'Saudável':k==='atencao'?'Atenção':'Crítica');

  // KPIs de cada unidade já calculados via Supabase (BLOCO 4.6) + meta de status (fonte única PF_STATUS_META).
  const compData=empresas.map(u=>{
    const k=kpisPortfolio?.[u.id]||KPIS_EMPTY;
    return{...u,kpi:k,status:PF_STATUS_META[k.status]||PF_STATUS_META.empty};
  });

  // Consolidado = soma de todas as unidades no período selecionado.
  // "Contas a Pagar" do consolidado usa totalDespesasPeriodo (todas as categorias, qualquer status —
  // representa o total geral de despesas do período) e não totalContasAbertas (que permanece "em
  // aberto" e é usado, sem alteração, pelos cards/ordenação/comparação individuais das unidades).
  const consol=compData.reduce((a,u)=>{
    a.totalEntradas+=u.kpi.totalEntradas;
    a.totalContasAbertas+=u.kpi.totalDespesasPeriodo;
    a.totalFornecedores+=u.kpi.totalFornecedores;
    return a;
  },{totalEntradas:0,totalContasAbertas:0,totalFornecedores:0});
  // Saldo Projetado Consolidado = Entradas Consolidadas − Contas a Pagar (exclusivo do consolidado;
  // o saldoProjetado de cada unidade individual não é alterado por esta regra).
  consol.saldoProjetado=consol.totalEntradas-consol.totalContasAbertas;
  // PRX_AUDIT_08/09/10 — rastreia exclusivamente a propagação kpisPortfolio → compData → consol →
  // fmt() → renderização, e correlaciona com o mês/ano LIVE selecionado (props selYear/selMonth)
  // para provar (ou descartar) que o card está exibindo dado de uma requisição desatualizada.
  if(typeof window!=='undefined'&&window.__PRX_AUDIT__){
    const __mesKeyAtual=`${selYear}-${String(selMonth+1).padStart(2,'0')}`;
    console.log('PRX_AUDIT_08 — Estado React (kpisPortfolio bruto)',JSON.stringify(
      Object.fromEntries(Object.entries(kpisPortfolio||{}).map(([k,v])=>[k,{totalDespesasPeriodo:v.totalDespesasPeriodo,totalEntradas:v.totalEntradas,status:v.status}]))
    ));
    console.log('PRX_AUDIT_08 — compData (renderização)',JSON.stringify(compData.map(u=>({id:u.id,nome:u.nome,totalDespesasPeriodo:u.kpi.totalDespesasPeriodo}))));
    console.log('PRX_AUDIT_08 — consol (renderização)',JSON.stringify({totalEntradas:consol.totalEntradas,totalContasAbertas:consol.totalContasAbertas,totalFornecedores:consol.totalFornecedores,saldoProjetado:consol.saldoProjetado}));
    console.log('PRX_AUDIT_09 — Valor renderizado no card "Despesas Consolidadas"',fmt(consol.totalContasAbertas),'(bruto:',consol.totalContasAbertas,')');
    console.log('PRX_AUDIT_10 — Resumo (mês live vs. última requisição finalizada)',JSON.stringify({
      mesAtualNaTela:__mesKeyAtual,
      ultimaRequisicaoSeqFinalizada:window.__prxAuditMaxSeqFinished||0,
      totalConsolidadoExibidoAgora:consol.totalContasAbertas,
    }));
  }
  const consolStatus=PF_STATUS_META[pfClassifyStatus(consol.totalEntradas,consol.totalContasAbertas,consol.saldoProjetado)];
  const consolTone=pfTone(consolStatus.key);
  const pctFornContas=consol.totalContasAbertas>0?(consol.totalFornecedores/consol.totalContasAbertas*100):0;
  const compTotal=consol.totalEntradas+consol.totalContasAbertas;
  const entPctBar=compTotal>0?(consol.totalEntradas/compTotal*100):0;
  const saiPctBar=compTotal>0?(consol.totalContasAbertas/compTotal*100):0;

  // Máximos para barras proporcionais — sobre todas as unidades (comparação real).
  const maxEnt=Math.max(0,...compData.map(u=>u.kpi.totalEntradas));
  const maxCon=Math.max(0,...compData.map(u=>u.kpi.totalDespesasPeriodo));
  const maxForn=Math.max(0,...compData.map(u=>u.kpi.totalFornecedores));

  // Melhor unidade (maior saldo) e a que exige mais atenção (menor saldo), só entre as com movimento.
  const comMov=compData.filter(u=>u.kpi.status!=='empty');
  const bestUnit=comMov.length?comMov.reduce((a,b)=>b.kpi.saldoProjetado>a.kpi.saldoProjetado?b:a):null;
  const worstUnit=comMov.length?comMov.reduce((a,b)=>b.kpi.saldoProjetado<a.kpi.saldoProjetado?b:a):null;
  // Unidade com maior soma de entradas (mesmo campo que compõe Entradas Consolidadas) — usada exclusivamente
  // no rótulo "Maior entrada" do card Entradas Consolidadas. Não usar para "Melhor saldo"/"Exige atenção".
  const bestEntradaUnit=comMov.length?comMov.reduce((a,b)=>b.kpi.totalEntradas>a.kpi.totalEntradas?b:a):null;

  // Contagem por status (para os chips de filtro).
  const statusCounts=compData.reduce((a,u)=>{a[u.status.key]=(a[u.status.key]||0)+1;return a;},{});

  // Lista filtrada + ordenada (afeta apenas a exibição da comparação).
  const q=search.trim().toLowerCase();
  let display=compData.filter(u=>{
    if(statusFilter!=='todos'&&u.status.key!==statusFilter)return false;
    if(q&&!(u.nome.toLowerCase().includes(q)||(u.clienteNome||'').toLowerCase().includes(q)))return false;
    return true;
  });
  const sortFns={
    saldo:(a,b)=>b.kpi.saldoProjetado-a.kpi.saldoProjetado,
    entradas:(a,b)=>b.kpi.totalEntradas-a.kpi.totalEntradas,
    contas:(a,b)=>b.kpi.totalDespesasPeriodo-a.kpi.totalDespesasPeriodo,
    fornecedores:(a,b)=>b.kpi.totalFornecedores-a.kpi.totalFornecedores,
    nome:(a,b)=>a.nome.localeCompare(b.nome,'pt-BR'),
  };
  display=[...display].sort(sortFns[sortBy]||sortFns.saldo);

  const statusChips=[
    {key:'todos',label:'Todas'},
    {key:'saudavel',label:'Saudável'},
    {key:'atencao',label:'Atenção'},
    {key:'critica',label:'Crítica'},
    {key:'sem-mov',label:'Sem movimentação'},
  ];

  const renderCard=u=>{
    const k=u.kpi;const tone=pfTone(u.status.key);
    const podeExcluir=canDelete&&empresaAtiva?.id!==u.id;
    return(
      <div className="pf-unit" key={u.id} onClick={()=>onSelectEmpresa(u.id)} title={'Abrir '+u.nome}>
        <span className={`pf-unit-side ${u.status.key}`}></span>
        <div className="pf-unit-hd">
          <div style={{minWidth:0}}>
            <div className="pf-unit-name">{u.nome}</div>
            {u.clienteNome?<div className="pf-unit-seg">{u.clienteNome}</div>:null}
          </div>
          <div style={{display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
            <span className={`pf-pill ${u.status.key}`}><span className="dot"></span>{pillLabel(u.status.key)}</span>
            <button className="pf-unit-edit" title="Editar nome da unidade"
              onClick={e=>{e.stopPropagation();abrirEdicao(u);}}>✏️</button>
            {podeExcluir&&(
              <button className="pf-unit-del" title="Remover unidade"
                onClick={e=>{e.stopPropagation();setConfirmDelete(u);}}>✕</button>
            )}
          </div>
        </div>
        <div className="pf-unit-body">
          <div className="pf-metric">
            <div className="pf-metric-top"><span className="pf-metric-lbl">Entradas</span>
              <span className={`pf-metric-val ${k.totalEntradas>0?'g':'muted'}`} title={fmt(k.totalEntradas)}>{fmt(k.totalEntradas)}</span></div>
            <div className="pf-bar"><i className="g" style={{width:barPct(k.totalEntradas,maxEnt)+'%'}}></i></div>
          </div>
          <div className="pf-metric">
            <div className="pf-metric-top"><span className="pf-metric-lbl">Contas a Pagar</span>
              <span className={`pf-metric-val ${k.totalDespesasPeriodo>0?'r':'muted'}`} title={fmt(k.totalDespesasPeriodo)}>{fmt(k.totalDespesasPeriodo)}</span></div>
            <div className="pf-bar"><i className="r" style={{width:barPct(k.totalDespesasPeriodo,maxCon)+'%'}}></i></div>
          </div>
          <div className="pf-metric">
            <div className="pf-metric-top"><span className="pf-metric-lbl">Fornecedores</span>
              <span className={`pf-metric-val ${k.totalFornecedores>0?'p':'muted'}`} title={fmt(k.totalFornecedores)}>{fmt(k.totalFornecedores)}</span></div>
            <div className="pf-bar"><i className="p" style={{width:barPct(k.totalFornecedores,maxForn)+'%'}}></i></div>
          </div>
        </div>
        <div className="pf-unit-ft">
          <div style={{minWidth:0}}>
            <div className="pf-saldo-lbl">Saldo Projetado</div>
            <div className={`pf-saldo-val ${tone}`} title={fmt(k.saldoProjetado)}>{fmt(k.saldoProjetado)}</div>
          </div>
          <button className="pf-open" onClick={e=>{e.stopPropagation();onSelectEmpresa(u.id);}}>Abrir</button>
        </div>
      </div>
    );
  };

  return(
    <div className="portfolio-wrap">
      <div className="portfolio-toolbar">
        <div className="portfolio-toolbar-left">
          <div className="portfolio-count">
            <strong>{empresas.length}</strong> de {MAX_UNITS} unidades
          </div>
          <div className="month-bar-inline" style={{marginBottom:0}}>
            <select className="year-sel" value={selYear} onChange={e=>setSelYear(parseInt(e.target.value))}>
              {[new Date().getFullYear()-1,new Date().getFullYear(),new Date().getFullYear()+1].map(y=><option key={y} value={y}>{y}</option>)}
            </select>
            <div className="month-sep"></div>
            {MONTHS_SHORT.map((m,i)=>(
              <button key={i} className={`mchip${selMonth===i?' active':''}`} onClick={()=>setSelMonth(i)}>{m}</button>
            ))}
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          {canAdd&&(
            <button className="btn btn-primary btn-sm" onClick={()=>setShowModal(true)} style={{background:'var(--papaya)',display:'flex',alignItems:'center',gap:5}}>
              <span style={{fontSize:14,lineHeight:1}}>＋</span> Nova Unidade
            </button>
          )}
        </div>
      </div>

      <div className="pf-subtitle">
        Visão financeira consolidada de <strong>{empresas.length}</strong> {empresas.length===1?'unidade':'unidades'} em <strong>{MONTHS[selMonth].toLowerCase()} de {selYear}</strong>.
      </div>

      {empresas.length===0?(
        <div className="pf-empty">
          Nenhuma unidade cadastrada. Clique em "Nova Unidade" para começar.
        </div>
      ):(
        <>
          {/* ── VISÃO GERAL DO PORTFÓLIO (primeira camada) ── */}
          <PortfolioOverview mesInicial={selMonth} empresas={empresas} ano={selYear}/>

          {/* ── COMPARAÇÃO ENTRE UNIDADES ── */}
          <div className="pf-section-hdr">
            <div className="pf-section-title">Comparação entre Unidades</div>
            <div className="pf-controls">
              <div className="pf-search">
                {PFIcon.search}
                <input placeholder="Buscar unidade..." value={search} onChange={e=>setSearch(e.target.value)}/>
              </div>
              <select className="pf-sel" value={sortBy} onChange={e=>setSortBy(e.target.value)}>
                <option value="saldo">Ordenar: Saldo projetado</option>
                <option value="entradas">Ordenar: Entradas</option>
                <option value="contas">Ordenar: Contas a pagar</option>
                <option value="fornecedores">Ordenar: Fornecedores</option>
                <option value="nome">Ordenar: Nome</option>
              </select>
              <div className="pf-toggle">
                <button className={viewMode==='cards'?'on':''} onClick={()=>setViewMode('cards')}>Cards</button>
                <button className={viewMode==='tabela'?'on':''} onClick={()=>setViewMode('tabela')}>Tabela</button>
              </div>
            </div>
          </div>

          {/* Os chips agregadores de status (Todas/Saudável/Atenção/Crítica/Sem movimentação)
              deixaram de ser renderizados. A classificação de saúde por unidade segue intacta e
              continua colorindo cada card (pf-pill / u.status.key). statusFilter permanece em
              'todos', então a lista exibe todas as unidades. */}

          {display.length===0?(
            <div className="pf-empty">Nenhuma unidade corresponde ao filtro atual.</div>
          ):viewMode==='cards'?(
            <div className="pf-grid">{display.map(renderCard)}</div>
          ):(
            <div className="comp-panel">
              <div className="comp-scroll">
                <table className="comp-table pf-table">
                  <thead>
                    <tr>
                      <th>Unidade</th>
                      <th>Entradas</th>
                      <th>Contas a Pagar</th>
                      <th>Fornecedores</th>
                      <th>Saldo Projetado</th>
                      <th style={{textAlign:'center'}}>Status</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody>
                    {display.map(u=>{
                      const k=u.kpi;const tone=pfTone(u.status.key);
                      const podeExcluir=canDelete&&empresaAtiva?.id!==u.id;
                      return(
                        <tr key={u.id} style={{cursor:'pointer'}} onClick={()=>onSelectEmpresa(u.id)} title={'Abrir '+u.nome}>
                          <td>{u.nome}</td>
                          <td><span className="comp-val" style={{color:k.totalEntradas>0?'var(--green-dim)':'var(--text-muted)'}}>{fmt(k.totalEntradas)}</span></td>
                          <td><span className="comp-val" style={{color:k.totalDespesasPeriodo>0?'var(--red)':'var(--text-muted)'}}>{fmt(k.totalDespesasPeriodo)}</span></td>
                          <td><span className="comp-val" style={{color:k.totalFornecedores>0?'var(--papaya-dark)':'var(--text-muted)'}}>{fmt(k.totalFornecedores)}</span></td>
                          <td><span className="comp-val" style={{color:toneVar(tone)}}>{fmt(k.saldoProjetado)}</span></td>
                          <td style={{textAlign:'center'}}><span className={`pf-pill ${u.status.key}`}><span className="dot"></span>{pillLabel(u.status.key)}</span></td>
                          <td style={{textAlign:'center'}}>
                            {podeExcluir?(
                              <button className="pf-unit-del" title="Remover unidade"
                                onClick={e=>{e.stopPropagation();setConfirmDelete(u);}}>✕</button>
                            ):null}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </>
      )}

      {showModal&&(
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&fecharModal()}>
          <div className="modal" style={{maxWidth:420}}>
            <div className="flex items-center justify-between" style={{marginBottom:16}}>
              <div style={{fontSize:15,fontWeight:700}}>🏢 Nova Unidade</div>
              <button className="btn btn-secondary btn-sm" onClick={fecharModal}>✕</button>
            </div>
            <div className="unit-modal-form">
              <div className="fg">
                <label>Nome da unidade *</label>
                <input
                  autoFocus
                  placeholder="Ex: Mercado Zanon — Filial Norte"
                  value={newName}
                  onChange={e=>{setNewName(e.target.value);setErroUnidade('');}}
                  onKeyDown={e=>{if(e.key==='Enter'&&newName.trim()&&!salvandoUnidade)handleCriar();}}
                  maxLength={60}
                  disabled={salvandoUnidade}
                />
              </div>
              <div className="fg">
                <label>Segmento / Tipo</label>
                <input
                  placeholder="Ex: Supermercado, Açougue, Padaria..."
                  value={newSeg}
                  onChange={e=>setNewSeg(e.target.value)}
                  maxLength={50}
                  disabled={salvandoUnidade}
                />
              </div>
              {erroUnidade&&<div className="alert alert-r" style={{marginBottom:0}}><span>⚠️</span><span>{erroUnidade}</span></div>}
              <div className="flex gap-2" style={{justifyContent:'flex-end',marginTop:8}}>
                <button className="btn btn-secondary btn-sm" onClick={fecharModal} disabled={salvandoUnidade}>Cancelar</button>
                <button
                  className="btn btn-sm"
                  style={{background:'var(--papaya)',color:'#fff',opacity:salvandoUnidade?0.7:1}}
                  onClick={handleCriar}
                  disabled={!newName.trim()||salvandoUnidade}
                >
                  {salvandoUnidade?'Criando…':'Criar Unidade'}
                </button>
              </div>
            </div>
          </div>
        </div>
      )}
      {confirmDelete&&(
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&fecharConfirmDelete()}>
          <div className="modal" style={{maxWidth:400}}>
            <div className="flex items-center justify-between" style={{marginBottom:16}}>
              <div style={{fontSize:15,fontWeight:700}}>Excluir unidade</div>
              <button className="btn btn-secondary btn-sm" onClick={fecharConfirmDelete} disabled={excluindoUnidade}>✕</button>
            </div>
            <p style={{fontSize:14,color:'var(--text-secondary)',marginBottom:6}}>
              Tem certeza que deseja excluir <strong>{confirmDelete.nome}</strong>?
            </p>
            {confirmDelete.nome.trim().toLowerCase()===confirmDelete.clienteNome.trim().toLowerCase()
              ?(
                <p style={{fontSize:12,color:'var(--yellow,#f59e0b)',marginBottom:16}}>
                  ⚠️ Esta parece ser a unidade principal do cliente. Deseja realmente ocultá-la? Os dados serão preservados.
                </p>
              ):(
                <p style={{fontSize:12,color:'var(--text-muted)',marginBottom:16}}>
                  Ela será ocultada do sistema, mas os dados financeiros serão preservados.
                </p>
              )
            }
            {erroExcluir&&<div className="alert alert-r" style={{marginBottom:12}}><span>⚠️</span><span>{erroExcluir}</span></div>}
            <div className="flex gap-2" style={{justifyContent:'flex-end'}}>
              <button className="btn btn-secondary btn-sm" onClick={fecharConfirmDelete} disabled={excluindoUnidade}>Cancelar</button>
              <button
                className="btn btn-sm"
                style={{background:'var(--red-dim)',color:'#fff',opacity:excluindoUnidade?0.7:1}}
                onClick={handleExcluir}
                disabled={excluindoUnidade}
              >{excluindoUnidade?'Excluindo…':'Confirmar exclusão'}</button>
            </div>
          </div>
        </div>
      )}
      {editUnit&&(
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&fecharEdicao()}>
          <div className="modal" style={{maxWidth:420}}>
            <div className="flex items-center justify-between" style={{marginBottom:16}}>
              <div style={{fontSize:15,fontWeight:700}}>✏️ Editar Unidade</div>
              <button className="btn btn-secondary btn-sm" onClick={fecharEdicao} disabled={salvandoEdicao}>✕</button>
            </div>
            <div className="unit-modal-form">
              <div className="fg">
                <label>Nome da unidade *</label>
                <input
                  autoFocus
                  value={editName}
                  onChange={e=>{setEditName(e.target.value);setErroEdicao('');}}
                  onKeyDown={e=>{if(e.key==='Enter'&&editName.trim()&&!salvandoEdicao)handleSalvarNome();}}
                  maxLength={60}
                  disabled={salvandoEdicao}
                />
              </div>
              {erroEdicao&&<div className="alert alert-r" style={{marginBottom:0}}><span>⚠️</span><span>{erroEdicao}</span></div>}
              <div className="flex gap-2" style={{justifyContent:'flex-end',marginTop:8}}>
                <button className="btn btn-secondary btn-sm" onClick={fecharEdicao} disabled={salvandoEdicao}>Cancelar</button>
                <button
                  className="btn btn-sm"
                  style={{background:'var(--papaya)',color:'#fff',opacity:salvandoEdicao?0.7:1}}
                  onClick={handleSalvarNome}
                  disabled={!editName.trim()||salvandoEdicao}
                >
                  {salvandoEdicao?'Salvando…':'Salvar'}
                </button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function LoginScreen({onLogin}){
  const[email,setEmail]=useState('');
  const[senha,setSenha]=useState('');
  const[loading,setLoading]=useState(false);
  const[erro,setErro]=useState('');
  const handleLogin=async e=>{
    e.preventDefault();
    setLoading(true);setErro('');
    try{
      const{data,error}=await supabase.auth.signInWithPassword({email,password:senha});
      if(error){setErro(error.message==='Invalid login credentials'?'E-mail ou senha inválidos.':error.message);return;}
      const{data:usuario}=await supabase.from('usuarios').select('empresa_id,role_global').eq('id',data.user.id).single();
      if(!usuario){setErro('Usuário não vinculado a uma empresa. Contate o administrador.');return;}
      const rg=usuario.role_global||null;
      if(rg==='prx_admin'||rg==='prx_editor'){
        const{data:emps}=await supabase.from('empresas').select('id,nome,cliente_id,clientes(nome)').eq('ativo',true).order('nome');
        onLogin(rg,emps||[]);
      }else{
        EMPRESA_ID=usuario.empresa_id;
        onLogin(rg,[]);
      }
    }catch(err){setErro(err.message||'Erro ao fazer login.');}
    finally{setLoading(false);}
  };
  return(
    <div className="auth-screen">
      <div style={{width:'100%',maxWidth:'380px',padding:'0 16px',position:'relative'}}>
        <div style={{background:'var(--surface)',borderRadius:'var(--radius)',boxShadow:'var(--shadow-md)',padding:'20px 32px 32px'}}>
          <div className="login-panel-logo">
            <PRXLogo/>
          </div>
          <p style={{fontSize:'13px',color:'var(--text-muted)',marginBottom:'24px'}}>PRX — Gestão de Caixa</p>
          <form onSubmit={handleLogin}>
            <div style={{marginBottom:'14px'}}>
              <label style={{display:'block',fontSize:'12px',fontWeight:'600',color:'var(--text-secondary)',marginBottom:'5px',letterSpacing:'.04em',textTransform:'uppercase'}}>E-mail</label>
              <input
                type="email" required autoFocus
                value={email} onChange={e=>setEmail(e.target.value)}
                placeholder="seu@email.com"
                style={{width:'100%',padding:'9px 12px',borderRadius:'var(--radius-sm)',border:'1px solid var(--border)',fontSize:'14px',background:'var(--ink-50)',color:'var(--text-primary)',outline:'none',fontFamily:'inherit',transition:'border-color .15s'}}
                onFocus={e=>e.target.style.borderColor='#FF8000'}
                onBlur={e=>e.target.style.borderColor='var(--border)'}
              />
            </div>
            <div style={{marginBottom:'20px'}}>
              <label style={{display:'block',fontSize:'12px',fontWeight:'600',color:'var(--text-secondary)',marginBottom:'5px',letterSpacing:'.04em',textTransform:'uppercase'}}>Senha</label>
              <input
                type="password" required
                value={senha} onChange={e=>setSenha(e.target.value)}
                placeholder="••••••••"
                style={{width:'100%',padding:'9px 12px',borderRadius:'var(--radius-sm)',border:'1px solid var(--border)',fontSize:'14px',background:'var(--ink-50)',color:'var(--text-primary)',outline:'none',fontFamily:'inherit',transition:'border-color .15s'}}
                onFocus={e=>e.target.style.borderColor='#FF8000'}
                onBlur={e=>e.target.style.borderColor='var(--border)'}
              />
            </div>
            {erro&&<div style={{background:'var(--red-light)',border:'1px solid #fecaca',borderRadius:'var(--radius-xs)',padding:'9px 12px',fontSize:'13px',color:'var(--red-dim)',marginBottom:'14px'}}>{erro}</div>}
            <button
              type="submit" disabled={loading}
              style={{width:'100%',padding:'10px',background:loading?'#E67300':'#FF8000',color:'#fff',border:'none',borderRadius:'var(--radius-sm)',fontSize:'14px',fontWeight:'700',letterSpacing:'.04em',cursor:loading?'not-allowed':'pointer',fontFamily:'inherit',transition:'background .15s',opacity:loading?0.8:1}}
              onMouseEnter={e=>{if(!loading)e.currentTarget.style.background='#E67300';}}
              onMouseLeave={e=>{if(!loading)e.currentTarget.style.background='#FF8000';}}
            >{loading?'Entrando…':'Entrar'}</button>
          </form>
        </div>
        <p style={{textAlign:'center',fontSize:'11.5px',color:'var(--text-muted)',marginTop:'16px'}}>Acesso restrito. Sem opção de cadastro.</p>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// SECTION 12-B — EMPRESA SELECTOR (PRX Admin)
// Componente visual puro. Não chama Supabase. Não altera estado global.
// Recebe a lista de empresas pronta do App e devolve o id selecionado via onSelect.
// ─────────────────────────────────────────────────────────────
function EmpresaSelector({empresas,roleGlobal,onSelect}){
  const roleLbl=roleGlobal==='prx_editor'?'PRX Editor':'PRX Admin';
  // Agrupar empresas por cliente_id → exibir um item por cliente
  const clientes=React.useMemo(()=>{
    const map={};
    empresas.forEach(e=>{
      if(!e.cliente_id)return;
      if(!map[e.cliente_id]){
        map[e.cliente_id]={clienteId:e.cliente_id,clienteNome:e.clientes?.nome||'(sem cliente)',unidades:[]};
      }
      map[e.cliente_id].unidades.push(e);
    });
    return Object.values(map).sort((a,b)=>a.clienteNome.localeCompare(b.clienteNome,'pt-BR'));
  },[empresas]);
  // Unidade padrão ao entrar no cliente, nesta ordem:
  //  1) unidade com o mesmo nome do cliente (regra existente);
  //  2) unidade Matriz — a consulta de empresas traz apenas id/nome/cliente_id/clientes(nome),
  //     sem campo estrutural de unidade principal, então a identificação é por nome normalizado
  //     (trim + minúsculas + sem acentos, via normalizeIdentityText) com igualdade EXATA a
  //     'matriz'. Sem esta etapa a lista, ordenada por nome, entregava a primeira unidade
  //     alfabética (ex.: "Loja 02" antes de "Matriz");
  //  3) primeira unidade da lista (fallback existente, para clientes sem Matriz identificável).
  // A lista já contém apenas unidades ativas e autorizadas. Isto define somente o padrão da
  // entrada no cliente — a troca manual (trocarEmpresa) e a unidade do usuário comum
  // (usuarios.empresa_id) não passam por aqui e seguem inalteradas.
  const handleSelect=grupo=>{
    const principal=grupo.unidades.find(
      e=>e.nome.trim().toLowerCase()===grupo.clienteNome.trim().toLowerCase()
    )||grupo.unidades.find(e=>normalizeIdentityText(e.nome)==='matriz')
     ||grupo.unidades[0];
    onSelect(principal.id);
  };
  return(
    <div className="auth-screen">
      <div style={{width:'100%',maxWidth:'520px',padding:'0 16px',position:'relative'}}>
        <div className="auth-screen-logo">
          <PRXLogo/>
        </div>
        <div style={{background:'var(--surface)',borderRadius:'var(--radius)',boxShadow:'var(--shadow-md)',padding:'28px 32px'}}>
          <div style={{marginBottom:'20px'}}>
            <div style={{display:'inline-flex',alignItems:'center',padding:'3px 10px',background:'rgba(255, 128, 0, 0.10)',borderRadius:'20px',marginBottom:'10px'}}>
              <span style={{fontSize:'11px',fontWeight:'700',letterSpacing:'.08em',textTransform:'uppercase',color:'#C95F00'}}>{roleLbl}</span>
            </div>
            <h2 style={{fontSize:'18px',fontWeight:'700',color:'var(--text-primary)',marginBottom:'4px',letterSpacing:'-.02em'}}>Selecionar cliente</h2>
            <p style={{fontSize:'13px',color:'var(--text-muted)'}}>Escolha o cliente que deseja acessar.</p>
          </div>
          {clientes.length===0?(
            <div style={{textAlign:'center',padding:'28px 0',color:'var(--text-muted)',fontSize:'13px'}}>Nenhum cliente encontrado.</div>
          ):(
            <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
              {clientes.map(c=>(
                <button
                  key={c.clienteId}
                  onClick={()=>handleSelect(c)}
                  style={{
                    display:'flex',alignItems:'center',justifyContent:'space-between',
                    width:'100%',padding:'12px 16px',
                    background:'var(--ink-50)',border:'1px solid var(--border)',
                    borderRadius:'var(--radius-sm)',cursor:'pointer',
                    fontFamily:'DM Sans,sans-serif',
                    transition:'all .15s',textAlign:'left',
                  }}
                  onMouseEnter={e=>{ e.currentTarget.style.background='rgba(255, 128, 0, 0.10)'; e.currentTarget.style.borderColor='#FF8000'; }}
                  onMouseLeave={e=>{ e.currentTarget.style.background='var(--ink-50)'; e.currentTarget.style.borderColor='var(--border)'; }}
                >
                  <div>
                    <div style={{fontSize:'14px',fontWeight:'600',color:'var(--text-primary)',marginBottom:'2px'}}>{c.clienteNome}</div>
                    <div style={{fontSize:'11px',color:'var(--text-muted)'}}>{c.unidades.length}{c.unidades.length===1?' unidade':' unidades'}</div>
                  </div>
                  <span style={{fontSize:'16px',color:'var(--text-muted)',marginLeft:'12px'}}>→</span>
                </button>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function App(){
  const[activeTab,setActiveTab]=useState('painel');
  // ── Estado global de mês/ano: ÚNICA fonte de verdade para o mês selecionado em todo o dashboard ──
  const[selectedYear,setSelectedYear]=useState(new Date().getFullYear());
  const[selectedMonth,setSelectedMonth]=useState(new Date().getMonth());
  // ── Estados de autenticação e carregamento ──
  const[autenticado,setAutenticado]=useState(false);
  const[aguardandoSelecaoEmpresa,setAguardandoSelecaoEmpresa]=useState(false);
  const[carregandoAuth,setCarregandoAuth]=useState(true);
  const[carregandoDados,setCarregandoDados]=useState(false);
  const[isSaving,setIsSaving]=useState(false);
  // Estados do Portfólio — carregados via Supabase após autenticação (BLOCO 4.4)
  const[roleGlobal,setRoleGlobal]=useState(null);
  const[empresasSeletorPRX,setEmpresasSeletorPRX]=useState([]); // lista global — só para EmpresaSelector PRX
  const[empresasDisponiveis,setEmpresasDisponiveis]=useState([]); // unidades do cliente ativo — para o Portfólio
  const[empresaAtiva,setEmpresaAtiva]=useState(null);
  const[kpisPortfolio,setKpisPortfolio]=useState({}); // BLOCO 4.6 — KPIs calculados por empresa para o Portfólio

  const[entradas,setE_]=useState([]);
  const[contas,setC_]=useState([]);
  const[dividas,setD_]=useState([]);
  const[retiradas,setR_]=useState([]);
  const[config,setCfg_]=useState({...defaultConfig});

  // useEffect 1: verificar sessão existente ao abrir o sistema
  useEffect(()=>{
    supabase.auth.getSession().then(async({data:{session}})=>{
      if(session){
        const{data:usuario}=await supabase.from('usuarios').select('empresa_id,role_global').eq('id',session.user.id).single();
        if(usuario){
          const rg=usuario.role_global||null;
          setRoleGlobal(rg);
          if(rg==='prx_admin'||rg==='prx_editor'){
            const{data:emps}=await supabase.from('empresas').select('id,nome,cliente_id,clientes(nome)').eq('ativo',true).order('nome');
            setEmpresasSeletorPRX(emps||[]);
            setAguardandoSelecaoEmpresa(true);
          }else{
            EMPRESA_ID=usuario.empresa_id;
            setAutenticado(true);
          }
        }
      }
      setCarregandoAuth(false);
    });
  },[]);

  // useEffect 2: escutar eventos de auth (SIGNED_OUT, renovação de token)
  useEffect(()=>{
    const{data:{subscription}}=supabase.auth.onAuthStateChange((event,session)=>{
      if(event==='SIGNED_OUT'){setAutenticado(false);EMPRESA_ID=null;setRoleGlobal(null);setEmpresasSeletorPRX([]);setEmpresasDisponiveis([]);setAguardandoSelecaoEmpresa(false);}
    });
    return()=>subscription.unsubscribe();
  },[]);

  // useEffect 3: carregar dados do Supabase após autenticação bem-sucedida
  useEffect(()=>{
    if(!autenticado)return;
    setCarregandoDados(true);
    Promise.all([
      loadS(KEYS.entradas),
      loadS(KEYS.contas),
      loadS(KEYS.dividas),
      loadS(KEYS.retiradas),
      loadS(KEYS.config),
    ]).then(([ent,cnt,div,ret,cfg])=>{
      setE_(Array.isArray(ent)?ent:[]);
      setC_(Array.isArray(cnt)?cnt:[]);
      setD_(Array.isArray(div)?div:[]);
      setR_(Array.isArray(ret)?ret:[]);
      setCfg_({...defaultConfig,...((cfg&&typeof cfg==='object')?cfg:{})});
    }).catch(err=>{
      console.error('Erro ao carregar dados:',err);
    }).finally(()=>{
      setCarregandoDados(false);
    });
  },[autenticado]);

  // useEffect 4: carregar empresas disponíveis para o Portfólio após autenticação
  // Dispara quando autenticado ou roleGlobal mudam.
  // Não altera EMPRESA_ID nem loadS/saveS — apenas popula empresasDisponiveis.
  useEffect(()=>{
    if(!autenticado)return;
    (async()=>{
      try{
        if(roleGlobal==='prx_admin'||roleGlobal==='prx_editor'){
          // PRX: empresasDisponiveis já foi filtrada por cliente no onSelect do EmpresaSelector.
          // useEffect 4 não sobrescreve para PRX.
          return;
        }else{
          // Cliente: RLS em usuarios_empresas filtra automaticamente pelo auth.uid()
          const{data,error}=await supabase
            .from('usuarios_empresas')
            .select('empresas!inner(id,nome,clientes(nome))').eq('empresas.ativo',true);
          if(error)throw error;
          if(data){
            const unitsRaw=data.map(r=>({
              id:r.empresas.id,
              nome:r.empresas.nome,
              clienteNome:r.empresas.clientes?.nome||'',
            }));
            // Deduplicação por id — se houver mais de um vínculo em usuarios_empresas para a
            // mesma empresa, evita que o Portfólio Consolidado some a mesma unidade 2x
            // (cada card individual já lê por id e não duplicava; só a soma consolidada era afetada).
            const seenIds=new Set();
            const units=unitsRaw.filter(u=>seenIds.has(u.id)?false:(seenIds.add(u.id),true));
            setEmpresasDisponiveis(units);
            setEmpresaAtiva(units.find(e=>e.id===EMPRESA_ID)||null);
          }
        }
      }catch(err){
        console.error('Erro ao carregar empresas do Portfólio:',err);
      }
    })();
  },[autenticado,roleGlobal]);

  // useEffect 5 (BLOCO 4.6): calcular KPIs reais do Portfólio via queries batch no Supabase.
  // Dispara ao abrir a aba Portfólio ou ao mudar mês/ano enquanto ela está ativa.
  // Não altera EMPRESA_ID, loadS, saveS nem useEffect 3.
  useEffect(()=>{
    if(activeTab!=='portfolio'||!autenticado||empresasDisponiveis.length===0)return;
    // PRX_AUDIT_02 — identifica esta invocação do efeito p/ detectar corrida entre requisições.
    // __auditMySeq é monotônico: se uma requisição com seq MENOR terminar (setKpisPortfolio) DEPOIS
    // de uma com seq MAIOR já ter terminado, isso PROVA sobrescrita de dados novos por dados velhos.
    const __auditOn=typeof window!=='undefined'&&window.__PRX_AUDIT__;
    const __auditMesKey=`${selectedYear}-${String(selectedMonth+1).padStart(2,'0')}`;
    if(__auditOn)window.__prxAuditSeq=(window.__prxAuditSeq||0)+1;
    const __auditMySeq=__auditOn?window.__prxAuditSeq:0;
    const __auditReqId=`${__auditMesKey}-seq${__auditMySeq}`;
    const __auditStartedAt=Date.now();
    if(__auditOn)console.log('PRX_AUDIT_02 — Requisição do Portfólio INICIADA',JSON.stringify({reqId:__auditReqId,seq:__auditMySeq,mesSolicitado:__auditMesKey,timestamp:__auditStartedAt}));
    (async()=>{
      try{
        const ids=empresasDisponiveis.map(e=>e.id);
        const mStart=monthStart(selectedYear,selectedMonth);
        const mEnd=monthEnd(selectedYear,selectedMonth);
        // PRX_ZANON_AUDIT_STATE — auditoria temporária (window.__PRX_AUDIT__=true), remover ao final.
        if(__auditOn){
          console.log('PRX_ZANON_AUDIT_STATE',JSON.stringify({
            EMPRESA_ID,empresaAtivaId:empresaAtiva?.id||null,
            selectedYear,selectedMonth,mesDaRequisicao:__auditMesKey,
            idsEmpresasConsolidadas:ids,
            nomesEmpresasConsolidadas:empresasDisponiveis.map(e=>({id:e.id,nome:e.nome})),
          }));
        }
        // entradas/contas/dividas/retiradas usam fetchAllPages: o total do portfólio (soma de várias
        // empresas) pode ultrapassar o limite padrão de linhas por resposta da API do Supabase.
        // contas/dividas: sem filtro de vencimento na query — mergeContasComParcelas precisa do
        // histórico completo (uma dívida/fixa de meses atrás pode gerar parcela no mês selecionado).
        // Mesma exigência que já vale para o Painel do Dono (contas/dividas carregadas por inteiro).
        const[rawEnt,rawCon,rawDiv,rawRet,{data:rawCfg}]=await Promise.all([
          fetchAllPages((from,to)=>supabase.from('entradas').select('empresa_id,total,data').in('empresa_id',ids).gte('data',mStart).lte('data',mEnd).order('id',{ascending:true}).range(from,to),'portfolio:entradas'),
          fetchAllPages((from,to)=>supabase.from('contas').select('id,empresa_id,valor,status,vencimento,tipoDespesa,dividaVinculadaId,descricao').in('empresa_id',ids).order('id',{ascending:true}).range(from,to),'portfolio:contas'),
          fetchAllPages((from,to)=>supabase.from('dividas').select('id,empresa_id,parcelaMensal,status,vencimento,valorUtilizado,banco,tipo,quitada_em').in('empresa_id',ids).in('status',['Ativa','Quitada']).order('id',{ascending:true}).range(from,to),'portfolio:dividas'),
          fetchAllPages((from,to)=>supabase.from('retiradas').select('empresa_id,valor,data').in('empresa_id',ids).gte('data',mStart).lte('data',mEnd).order('id',{ascending:true}).range(from,to),'portfolio:retiradas'),
          supabase.from('config').select('empresa_id,saldoInicial').in('empresa_id',ids),
        ]);
        const kpis={};
        ids.forEach(id=>{
          const ent=(rawEnt||[]).filter(r=>r.empresa_id===id);
          const conAll=(rawCon||[]).filter(r=>r.empresa_id===id);
          const con=conAll.filter(r=>r.vencimento>=mStart&&r.vencimento<=mEnd);
          const div=(rawDiv||[]).filter(r=>r.empresa_id===id);
          const ret=(rawRet||[]).filter(r=>r.empresa_id===id);
          const cfg=(rawCfg||[]).find(r=>r.empresa_id===id);
          const totalEntradas=ent.reduce((s,r)=>s+(r.total||0),0);
          const totalContasAbertas=con.filter(r=>r.status!=='Pago').reduce((s,r)=>s+(r.valor||0),0);
          const totalFornecedores=con.filter(r=>r.tipoDespesa==='Fornecedor').reduce((s,r)=>s+(r.valor||0),0);
          // Total de despesas do período — MESMA fonte usada em "Saídas do Mês" (Painel do Dono):
          // reaproveita mergeContasComParcelas (contas manuais + parcelas automáticas de dívidas +
          // recorrências de despesas Fixas), depois filtra pelo período (vencimento). Alimenta o card
          // "Contas a Pagar" (unidade) e "Despesas Consolidadas" (Portfólio). Não afeta
          // totalContasAbertas (baseado só em `con`, sem sintéticos — inalterado).
          const despesasPeriodoRegistros=mergeContasComParcelas(conAll,div).filter(r=>r.vencimento>=mStart&&r.vencimento<=mEnd);
          const totalDespesasPeriodo=despesasPeriodoRegistros.reduce((s,r)=>s+(r.valor||0),0);
          // PRX_AUDIT_03 — empresa individual dentro do consolidado; registra array B p/ PRX_AUDIT_07.
          if(__auditOn){
            const __nomeEmpresa=(empresasDisponiveis.find(e=>e.id===id)||{}).nome||'?';
            console.log('PRX_AUDIT_03 — Empresa no consolidado',JSON.stringify({reqId:__auditReqId,empresa_id:id,nome:__nomeEmpresa,mesKey:__auditMesKey,qtd:despesasPeriodoRegistros.length,total:totalDespesasPeriodo}));
            if(typeof __prxAuditRegister==='function')__prxAuditRegister('B',id,__auditMesKey,despesasPeriodoRegistros);
          }
          // PRX_ZANON_AUDIT_PORTFOLIO_UNIT — auditoria temporária desta tarefa, remover ao final.
          if(__auditOn){
            const __nomeEmpresaZ=(empresasDisponiveis.find(e=>e.id===id)||{}).nome||'?';
            const __fornZ=despesasPeriodoRegistros.filter(r=>r.tipoDespesa==='Fornecedor');
            const __fixaZ=despesasPeriodoRegistros.filter(r=>r.tipoDespesa==='Fixa');
            const __varZ=despesasPeriodoRegistros.filter(r=>r.tipoDespesa==='Variável');
            const __finZ=despesasPeriodoRegistros.filter(r=>r.tipoDespesa==='Financeira');
            console.log('PRX_ZANON_AUDIT_PORTFOLIO_UNIT',JSON.stringify({
              empresa_id:id,nome:__nomeEmpresaZ,mes:__auditMesKey,
              qtdContas:despesasPeriodoRegistros.length,totalGeral:totalDespesasPeriodo,
              qtdFornecedores:__fornZ.length,totalFornecedores:__fornZ.reduce((s,r)=>s+(r.valor||0),0),
              qtdFixas:__fixaZ.length,totalFixas:__fixaZ.reduce((s,r)=>s+(r.valor||0),0),
              qtdVariaveis:__varZ.length,totalVariaveis:__varZ.reduce((s,r)=>s+(r.valor||0),0),
              qtdFinanceiras:__finZ.length,totalFinanceiras:__finZ.reduce((s,r)=>s+(r.valor||0),0),
              idsRegistros:despesasPeriodoRegistros.map(r=>r.id),
              idsFornecedores:__fornZ.map(r=>r.id),
            }));
            if(typeof __prxZanonAuditRegister==='function')__prxZanonAuditRegister('PORTFOLIO_UNIT',id,__auditMesKey,despesasPeriodoRegistros);
          }
          // Só dívidas 'Ativa' compõem este KPI (a query agora também traz 'Quitada' p/ o corte
          // histórico das parcelas, mas Quitada não conta como dívida ativa neste indicador).
          const totalDividasAtivas=div.filter(r=>r.status==='Ativa').reduce((s,r)=>s+parseCurrencyBR(r.parcelaMensal),0);
          const totalRetiradas=ret.reduce((s,r)=>s+(r.valor||0),0);
          const saldoInicial=Number(cfg?.saldoInicial)||defaultConfig.saldoInicial;
          // Saldo Projetado da unidade = Entradas do período − Contas a Pagar do período, usando
          // EXATAMENTE a base exibida no card (totalDespesasPeriodo). Antes era
          // saldoInicial+entradas−totalContasAbertas−retiradas, cuja base de obrigações não era a
          // exibida, permitindo unidade Crítica com saldo positivo. saldoInicial, totalRetiradas e
          // totalContasAbertas seguem calculados e inalterados — apenas não compõem mais este KPI.
          const saldoProjetado=(Number(totalEntradas)||0)-(Number(totalDespesasPeriodo)||0);
          // Classifica pelo MESMO valor que o card exibe em "Contas a Pagar" (totalDespesasPeriodo),
          // não por totalContasAbertas — este último permanece intacto e segue alimentando o
          // KPI "Contas em aberto", sem nenhuma alteração de cálculo.
          const status=pfClassifyStatus(totalEntradas,totalDespesasPeriodo,saldoProjetado);
          kpis[id]={totalEntradas,totalContasAbertas,totalDespesasPeriodo,totalDividasAtivas,totalRetiradas,totalFornecedores,saldoProjetado,status};
        });
        // PRX_AUDIT_03 — total consolidado desta requisição (soma de totalDespesasPeriodo de todas as empresas).
        if(__auditOn){
          const __totalConsolReq=ids.reduce((s,id)=>s+(kpis[id]?.totalDespesasPeriodo||0),0);
          console.log('PRX_AUDIT_03 — Total consolidado da requisição',JSON.stringify({reqId:__auditReqId,mesKey:__auditMesKey,qtdEmpresas:ids.length,empresas:ids,totalConsolidado:__totalConsolReq}));
        }
        // PRX_AUDIT_02 — requisição concluída. window.__prxAuditMaxSeqFinished guarda o maior "seq"
        // que já chamou setKpisPortfolio. Se __auditMySeq < esse máximo, uma requisição MAIS NOVA
        // (mês solicitado depois deste) JÁ terminou antes — e este setKpisPortfolio, ao rodar agora,
        // SOBRESCREVE dados mais novos com dados mais velhos. Isso prova (ou descarta) a Hipótese 2.
        if(__auditOn){
          const __finishedAt=Date.now();
          const __maxSeqFinishedAntes=window.__prxAuditMaxSeqFinished||0;
          const __sobrescritaForaDeOrdem=__auditMySeq<__maxSeqFinishedAntes;
          console.log('PRX_AUDIT_02 — Requisição do Portfólio CONCLUÍDA',JSON.stringify({
            reqId:__auditReqId,seq:__auditMySeq,mesSolicitado:__auditMesKey,
            timestampInicio:__auditStartedAt,timestampFim:__finishedAt,duracaoMs:__finishedAt-__auditStartedAt,
            mesAtualSelecionadoAgora:`${selectedYear}-${String(selectedMonth+1).padStart(2,'0')}`,
            maxSeqJaFinalizadoAntesDeste:__maxSeqFinishedAntes,
            SOBRESCRITA_FORA_DE_ORDEM_CONFIRMADA:__sobrescritaForaDeOrdem,
          }));
          if(__sobrescritaForaDeOrdem){
            console.warn('PRX_AUDIT_02 — ALERTA: esta requisição (seq '+__auditMySeq+', mês '+__auditMesKey+') está prestes a SOBRESCREVER kpisPortfolio com dados mais antigos que uma requisição já concluída (seq '+__maxSeqFinishedAntes+').');
          }
          window.__prxAuditMaxSeqFinished=Math.max(__maxSeqFinishedAntes,__auditMySeq);
        }
        setKpisPortfolio(kpis);
      }catch(err){
        console.error('Erro ao calcular KPIs do Portfólio:',err);
      }
    })();
  },[activeTab,autenticado,empresasDisponiveis,selectedYear,selectedMonth]);

  // ── Setters assíncronos com optimistic update e indicador isSaving ──
  const setEntradas=async d=>{setE_(d);setIsSaving(true);try{await saveS(KEYS.entradas,d);}catch(err){console.error('Erro ao salvar entradas:',err);}finally{setIsSaving(false);}};
  // Recarga REAL das Entradas a partir do Supabase, sem gravar nada. Obrigatória após a
  // importação: o importador insere direto no banco, e um saveS posterior (disparado por
  // qualquer edição manual) opera sobre o array em memória — se ele estivesse desatualizado,
  // o DELETE+INSERT do saveS apagaria as linhas recém-importadas.
  const recarregarEntradas=async()=>{
    const ent=await loadS(KEYS.entradas);
    setE_(Array.isArray(ent)?ent:[]);
  };
  const setContas=d=>setC_(d);
  const onContaCriar=async entry=>{const eid=EMPRESA_ID;setIsSaving(true);try{await insertConta(entry,eid);}catch(err){console.error('Erro ao criar conta:',err);setIsSaving(false);throw err;}setIsSaving(false);};
  const onContaEditar=async entry=>{const eid=EMPRESA_ID;setIsSaving(true);try{await updateConta(entry,eid);}catch(err){console.error('Erro ao editar conta:',err);setIsSaving(false);throw err;}setIsSaving(false);};
  const onContaExcluir=async id=>{const eid=EMPRESA_ID;setIsSaving(true);try{await deleteConta(id,eid);}catch(err){console.error('Erro ao excluir conta:',err);setIsSaving(false);throw err;}setIsSaving(false);};
  // Importação via RPC transacional 'importar_contas' — AUTORIDADE FINAL no banco (atômica,
  // idempotente por identidade financeira, à prova de concorrência/duas abas/clique duplo).
  // Sem fallback para .insert(): se a RPC não existir, o erro é propagado e nada é inserido.
  // Retorna o relatório por linha: {inseridos:[{linha,id}], duplicados:[...], erros:[...]}.
  const onContasImportar=async novos=>{
    const eid=EMPRESA_ID;
    setIsSaving(true);
    try{
      const{data,error}=await supabase.rpc('importar_contas',{p_empresa_id:eid,p_rows:novos});
      if(error)throw error;
      return data||{inseridos:[],duplicados:[],erros:[]};
    }catch(err){
      console.error('Erro ao importar contas (RPC importar_contas):',err);
      throw err;
    }finally{
      setIsSaving(false);
    }
  };
  const setDividas=d=>setD_(d);
  const onDividaCriar=async entry=>{const eid=EMPRESA_ID;setIsSaving(true);try{await insertDivida(entry,eid);}catch(err){console.error('Erro ao criar dívida:',err);setIsSaving(false);throw err;}setIsSaving(false);};
  const onDividaEditar=async entry=>{const eid=EMPRESA_ID;setIsSaving(true);try{await updateDivida(entry,eid);}catch(err){console.error('Erro ao editar dívida:',err);setIsSaving(false);throw err;}setIsSaving(false);};
  const onDividaExcluir=async id=>{const eid=EMPRESA_ID;setIsSaving(true);try{await deleteDivida(id,eid);}catch(err){console.error('Erro ao excluir dívida:',err);setIsSaving(false);throw err;}setIsSaving(false);};
  const setRetiradas=async d=>{setR_(d);setIsSaving(true);try{await saveS(KEYS.retiradas,d);}catch(err){console.error('Erro ao salvar retiradas:',err);}finally{setIsSaving(false);}};
  const setConfig=async d=>{setCfg_(d);setIsSaving(true);try{await saveS(KEYS.config,d);}catch(err){console.error('Erro ao salvar config:',err);}finally{setIsSaving(false);}};

  // BLOCO 4.5 — Troca de unidade pelo Portfólio (cliente comum)
  const trocarEmpresa=(eid)=>{
    // Correção 1: bloquear troca durante gravação em andamento
    if(isSaving){alert('Aguarde o salvamento terminar antes de trocar de unidade.');return;}
    // Correção 2: empresa já ativa — apenas navega para o painel
    if(eid===EMPRESA_ID){setActiveTab('painel');return;}
    // Troca de contexto: define EMPRESA_ID antes de qualquer setState
    EMPRESA_ID=eid;
    setEmpresaAtiva(empresasDisponiveis.find(e=>e.id===eid)||null);
    setActiveTab('painel');
    // Recarrega todos os dados para a nova empresa (mesmo padrão do useEffect 3, sem tocá-lo)
    setCarregandoDados(true);
    Promise.all([
      loadS(KEYS.entradas),
      loadS(KEYS.contas),
      loadS(KEYS.dividas),
      loadS(KEYS.retiradas),
      loadS(KEYS.config),
    ]).then(([ent,cnt,div,ret,cfg])=>{
      setE_(Array.isArray(ent)?ent:[]);
      setC_(Array.isArray(cnt)?cnt:[]);
      setD_(Array.isArray(div)?div:[]);
      setR_(Array.isArray(ret)?ret:[]);
      setCfg_({...defaultConfig,...((cfg&&typeof cfg==='object')?cfg:{})});
    }).catch(err=>{
      console.error('Erro ao recarregar dados após troca de unidade:',err);
    }).finally(()=>{
      setCarregandoDados(false);
    });
  };

  // BLOCO 4.7 — Criar nova unidade pelo Portfólio.
  // Retorna null em caso de sucesso ou string de erro para exibir ao usuário.
  const criarUnidade=async(nome)=>{
    const nomeTrimmed=nome.trim();
    if(!nomeTrimmed)return'Nome não pode estar vazio.';
    if(!EMPRESA_ID)return'Nenhuma empresa ativa. Selecione uma unidade primeiro.';
    // Verificação client-side de duplicidade
    if(empresasDisponiveis.some(e=>e.nome.trim().toLowerCase()===nomeTrimmed.toLowerCase())){
      return'Já existe uma unidade com este nome.';
    }
    try{
      // Buscar cliente_id da empresa ativa
      const{data:empAtiva,error:errEmp}=await supabase.from('empresas').select('cliente_id').eq('id',EMPRESA_ID).single();
      if(errEmp||!empAtiva?.cliente_id)return'Não foi possível identificar o cliente da unidade ativa.';
      const clienteId=empAtiva.cliente_id;
      // Criar empresa e vínculos via RPC (atômico, cria vínculos para todos os usuários do cliente)
      const{data,error}=await supabase.rpc('criar_unidade',{p_nome:nomeTrimmed,p_cliente_id:clienteId});
      if(error)return error.message||'Erro ao criar unidade.';
      // Atualizar lista imediatamente sem novo reload
      const clienteNome=empresasDisponiveis.find(e=>e.id===EMPRESA_ID)?.clienteNome||'';
      setEmpresasDisponiveis(prev=>[...prev,{id:data.empresa_id,nome:nomeTrimmed,clienteNome}]);
      return null;
    }catch(err){
      return err.message||'Erro inesperado ao criar unidade.';
    }
  };

  // BLOCO 4.8 — Excluir unidade pelo Portfólio.
  // Remove apenas o vínculo em usuarios_empresas. Não apaga dados financeiros.
  // Retorna null em caso de sucesso ou string de erro para exibir ao usuário.
  const excluirUnidade=async(empresaId)=>{
    if(empresaId===EMPRESA_ID)return'Não é possível excluir a unidade ativa. Troque para outra unidade primeiro.';
    if(empresasDisponiveis.length<=1)return'Não é possível excluir a última unidade ativa.';
    try{
      const{error}=await supabase.rpc('inativar_unidade',{p_empresa_id:empresaId});
      if(error)return error.message||'Erro ao excluir unidade.';
      setEmpresasDisponiveis(prev=>prev.filter(e=>e.id!==empresaId));
      return null;
    }catch(err){
      return err.message||'Erro inesperado ao excluir unidade.';
    }
  };

  // BLOCO 4.9 — Renomear unidade pelo Portfólio. Atualiza somente empresas.nome — o id (identidade
  // real da unidade, usado por entradas/contas/retiradas/dívidas/config) não é alterado.
  // Retorna null em caso de sucesso ou string de erro para exibir ao usuário.
  const renomearUnidade=async(empresaId,novoNome)=>{
    const nomeTrimmed=novoNome.trim();
    if(!nomeTrimmed)return'Nome não pode estar vazio.';
    if(empresasDisponiveis.some(e=>e.id!==empresaId&&e.nome.trim().toLowerCase()===nomeTrimmed.toLowerCase())){
      return'Já existe uma unidade com este nome.';
    }
    try{
      // .select() devolve as linhas REALMENTE afetadas. É indispensável: sob RLS, um UPDATE que
      // não casa com nenhuma policy não gera `error` — retorna sucesso com zero linhas. Sem esta
      // checagem o nome era trocado só no estado local e "voltava" no próximo carregamento.
      // Somente `nome` é enviado; cnpj, cliente_id e ativo não são tocados.
      const{data,error}=await supabase.from('empresas')
        .update({nome:nomeTrimmed}).eq('id',empresaId).select('id,nome');
      if(error)return error.message||'Erro ao renomear unidade.';
      if(!data||data.length===0){
        return'Não foi possível salvar o nome: seu acesso não permite alterar esta unidade.';
      }
      // Estado atualizado só após a confirmação do banco.
      setEmpresasDisponiveis(prev=>prev.map(e=>e.id===empresaId?{...e,nome:nomeTrimmed}:e));
      setEmpresaAtiva(prev=>prev&&prev.id===empresaId?{...prev,nome:nomeTrimmed}:prev);
      // empresasSeletorPRX é carregada uma única vez no login e é a fonte que o EmpresaSelector
      // usa para REMONTAR empresasDisponiveis ao trocar de cliente. Sem sincronizá-la aqui, o
      // nome antigo ressurgia ao usar "Trocar empresa" e voltar, mesmo com o banco já correto.
      setEmpresasSeletorPRX(prev=>prev.map(e=>e.id===empresaId?{...e,nome:nomeTrimmed}:e));
      return null;
    }catch(err){
      return err.message||'Erro inesperado ao renomear unidade.';
    }
  };

  const handleLogout=async()=>{await supabase.auth.signOut();setAutenticado(false);EMPRESA_ID=null;};
  // Volta ao EmpresaSelector já existente, sem logout: reproduz o mesmo par de estados que o
  // login do PRX produz. `autenticado:false` é indispensável — é a transição false→true, no
  // onSelect, que faz o useEffect de carregamento recarregar os dados do novo cliente.
  const handleTrocarEmpresa=()=>{setAutenticado(false);setAguardandoSelecaoEmpresa(true);};
  // Mescla contas manuais + parcelas automáticas de dívidas
  const contasComParcelas=mergeContasComParcelas(contas,dividas);
  const hoje=today();
  const entMes=entradas.filter(e=>e.data>=addDays(hoje,-30));
  const totalEntMes=entMes.reduce((s,e)=>s+e.total,0);
  const diasV=new Set(entMes.map(e=>e.data)).size;
  const mediaDiaria=diasV>0?totalEntMes/diasV:0;

  // ── Telas de carregamento / login ──
  const Spinner=({msg})=>(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',background:'var(--bg)',gap:'14px'}}>
      <div style={{width:'36px',height:'36px',border:'3px solid var(--ink-200)',borderTop:'3px solid var(--petronas)',borderRadius:'50%',animation:'spin 0.8s linear infinite'}}></div>
      <p style={{fontSize:'13px',color:'var(--text-muted)'}}>{msg}</p>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    </div>
  );
  if(carregandoAuth)return <Spinner msg="Verificando sessão…"/>;
  if(!autenticado&&!aguardandoSelecaoEmpresa)return <LoginScreen onLogin={(rg,emps)=>{setRoleGlobal(rg);if(rg==='prx_admin'||rg==='prx_editor'){setEmpresasSeletorPRX(emps);setAguardandoSelecaoEmpresa(true);}else{setAutenticado(true);}}}/>;
  if(aguardandoSelecaoEmpresa)return <EmpresaSelector empresas={empresasSeletorPRX} roleGlobal={roleGlobal} onSelect={(eid)=>{EMPRESA_ID=eid;const emp=empresasSeletorPRX.find(e=>e.id===eid);const cid=emp?.cliente_id;const unidadesRaw=cid?empresasSeletorPRX.filter(e=>e.cliente_id===cid):[emp].filter(Boolean);const seenIds=new Set();const unidades=unidadesRaw.filter(e=>seenIds.has(e.id)?false:(seenIds.add(e.id),true));setEmpresasDisponiveis(unidades.map(e=>({id:e.id,nome:e.nome,clienteNome:e.clientes?.nome||''})));setEmpresaAtiva({id:emp?.id,nome:emp?.nome,clienteNome:emp?.clientes?.nome||''});setAguardandoSelecaoEmpresa(false);setAutenticado(true);}}/>;
  if(carregandoDados)return <Spinner msg="Carregando dados…"/>;

  const nowStr=new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'});
  const activeTabObj=TABS.find(t=>t.id===activeTab);
  const pageHeaderEl=(
    <PageHeader
      icon={activeTabObj?.icon}
      title={activeTabObj?.label}
      sub={TAB_META[activeTab]?.sub}
      leftExtras={activeTab==='painel'?(
        <React.Fragment>
          <div className="page-hdr-sep"></div>
          <div className="month-bar-inline">
            <select className="year-sel" value={selectedYear} onChange={e=>setSelectedYear(parseInt(e.target.value))}>
              {[new Date().getFullYear()-1,new Date().getFullYear(),new Date().getFullYear()+1].map(y=><option key={y} value={y}>{y}</option>)}
            </select>
            <div className="month-sep"></div>
            {MONTHS_SHORT.map((m,i)=>(
              <button key={i} className={`mchip${selectedMonth===i?' active':''}`} onClick={()=>setSelectedMonth(i)}>{m}</button>
            ))}
          </div>
        </React.Fragment>
      ):null}
      actions={(
        <div className="page-hdr-prx" title="PRX — Gestão de recebíveis" aria-label="PRX">
          <img src={PRX_LOGO_SRC} alt="PRX"/>
        </div>
      )}
    />
  );
  return(
    <div className="app-shell">
      <header className="app-header">
        <button
          onClick={()=>setActiveTab('portfolio')}
          title="Portfólio de unidades"
          style={{
            display:'inline-flex',alignItems:'center',justifyContent:'center',
            width:30,height:30,borderRadius:6,flexShrink:0,
            background:activeTab==='portfolio'?'var(--papaya)':'rgba(255,255,255,.07)',
            border:activeTab==='portfolio'?'1px solid var(--papaya)':'1px solid rgba(255,255,255,.12)',
            cursor:'pointer',color:activeTab==='portfolio'?'#fff':'rgba(255,255,255,.55)',
            fontSize:14,transition:'all .15s',
          }}
        >🏢</button>
        {/* Acesso visual à aba Projeção retirado do header. A aba e todo o seu código
            (componente Projecao, motores, helpers, CSS .prx-proj-nav) seguem intactos —
            apenas não há mais ponto de entrada na interface. */}
        {(()=>{
          // Identificação do cliente ativo a partir de TODAS as fontes já carregadas em empresaAtiva
          // (clienteNome vem do join com `clientes`; nome é o nome da própria empresa/unidade).
          // Checadas de forma independente — no fluxo do usuário padrão (via usuarios_empresas),
          // clienteNome pode não resolver da mesma forma que no fluxo admin (EmpresaSelector),
          // então não basta usar clienteNome com fallback único para nome.
          const nomesCliente=[empresaAtiva?.clienteNome,empresaAtiva?.nome].map(v=>String(v||'').trim().toLowerCase());
          if(nomesCliente.some(v=>v.includes('mercado doca')))return <div className="hdr-logo"></div>;
          const n=nomesCliente[0]||nomesCliente[1]||'';
          const isPicanhas=n==='picanhas grill';
          return(
            <div className={`hdr-logo${isPicanhas?' hdr-logo-picanhas-wrap':''}`}>
              {isPicanhas?<img className="hdr-logo-picanhas" src="./picanhas-grill-logo.png" alt="Picanhas Grill"/>:<ZanonLogo/>}
            </div>
          );
        })()}
        <div className="hdr-div"></div>
        <nav className="hdr-nav">
          <div className="hdr-grp">
            {TABS.filter(t=>t.id!=='projecao'&&t.id!=='portfolio').map(t=>(
              <button key={t.id} className={`hdr-btn${activeTab===t.id?' active':''}`} onClick={()=>setActiveTab(t.id)}>
                <span className="dot"></span><span>{t.icon}</span><span>{t.label}</span>
              </button>
            ))}
          </div>
        </nav>
        <div className="hdr-right">
          {isSaving&&<span style={{fontSize:'11px',color:'var(--petronas)',fontWeight:'600',letterSpacing:'.04em',animation:'pulse 1s ease-in-out infinite'}}>💾 Salvando…<style>{`@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}`}</style></span>}
          <span className="hdr-date">{nowStr}</span>
          {roleGlobal==='prx_admin'&&(
            <button className="hdr-clear" onClick={handleTrocarEmpresa} title="Voltar à seleção de cliente" aria-label="Trocar empresa">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
              Trocar empresa
            </button>
          )}
          <button className="hdr-clear" onClick={handleLogout} title="Sair do sistema">⏏ Sair</button>
        </div>
      </header>
      <div className="page-wrap">
        {activeTab!=='painel'&&pageHeaderEl}
        {activeTab==='painel'&&<Painel entradas={entradas} contas={contasComParcelas} dividas={dividas} retiradas={retiradas} config={config} setConfig={setConfig} selectedYear={selectedYear} setSelectedYear={setSelectedYear} selectedMonth={selectedMonth} setSelectedMonth={setSelectedMonth} header={pageHeaderEl} nomeUnidadeAtiva={empresaAtiva?.nome}/>}
        {activeTab==='entradas'&&<Entradas entradas={entradas} setEntradas={setEntradas} onRecarregarEntradas={recarregarEntradas} contas={contasComParcelas} dividas={dividas} selectedYear={selectedYear} selectedMonth={selectedMonth}/>}
        {activeTab==='contas'&&<Contas contas={contas} setContas={setContas} onContaCriar={onContaCriar} onContaEditar={onContaEditar} onContaExcluir={onContaExcluir} onContasImportar={onContasImportar} contasComParcelas={contasComParcelas} mediaDiariaEntrada={mediaDiaria} dividas={dividas} setDividas={setDividas} onDividaEditar={onDividaEditar} selectedYear={selectedYear} selectedMonth={selectedMonth}/>}
        {activeTab==='fornecedores'&&<Fornecedores contas={contasComParcelas} selectedYear={selectedYear} selectedMonth={selectedMonth}/>}
        {activeTab==='dividas'&&<Dividas dividas={dividas} setDividas={setDividas} onDividaCriar={onDividaCriar} onDividaEditar={onDividaEditar} onDividaExcluir={onDividaExcluir} entradaMensal={totalEntMes}/>}
        {activeTab==='retiradas'&&<Retiradas retiradas={retiradas} setRetiradas={setRetiradas} entradaMensal={totalEntMes} config={config} setConfig={setConfig}/>}
        {activeTab==='projecao'&&<Projecao empresas={empresasDisponiveis}/>}
        {activeTab==='portfolio'&&<Portfolio
          empresas={empresasDisponiveis}
          selYear={selectedYear}
          selMonth={selectedMonth}
          setSelYear={setSelectedYear}
          setSelMonth={setSelectedMonth}
          empresaAtiva={empresaAtiva}
          onSelectEmpresa={trocarEmpresa}
          kpisPortfolio={kpisPortfolio}
          onCriarUnidade={criarUnidade}
          onExcluirUnidade={excluirUnidade}
          onRenomearUnidade={renomearUnidade}
          roleGlobal={roleGlobal}
        />}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
