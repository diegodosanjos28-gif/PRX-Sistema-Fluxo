          <div style={{marginTop:12,display:'flex',gap:8,justifyContent:'flex-end'}}>
            <button className="btn btn-secondary" onClick={()=>{setShowForm(false);setEditId(null);setForm(emptyContaForm);setFixaCorte(null);}}>Cancelar</button>
            <button className="btn btn-primary" onClick={save_}>Salvar</button>
          </div>
        </Modal>
      )}

      {showImport&&(
        <ImportModal
          onClose={()=>setShowImport(false)}
          onConfirm={handleImport}
          contasPersistidas={contas}
          contasSinteticas={contasComParcelas.filter(c=>c._autoGerado)}
          empresaId={EMPRESA_ID}
        />
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// SECTION 10 — DÍVIDAS
// ─────────────────────────────────────────────────────────────

function pressaoInfo(pctVal){
  if(pctVal<=5)return{label:'Baixa',color:'#16a34a',bg:'#f0fdf4'};
  if(pctVal<=10)return{label:'Média',color:'#d97706',bg:'#fffbeb'};
  if(pctVal<=20)return{label:'Alta',color:'#ea580c',bg:'#fff7ed'};
  return{label:'Crítica',color:'#dc2626',bg:'#fef2f2'};
}

function statusDividaBadge(s){
  if(s==='Ativa')return'br';
  if(s==='Quitada')return'bg';
  if(s==='Renegociada')return'ba';
  return'bb';
}

function DividaPanel({d,entradaMensal,onEdit,onRemove,onQuitar}){
  const[open,setOpen]=useState(false);
  const pIndPct=entradaMensal>0?Math.round((d.parcelaMensal/entradaMensal)*100):0;
  const pInfo=pressaoInfo(pIndPct);
  const stBadge=statusDividaBadge(d.status);
  return(
    <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'var(--radius)',marginBottom:8,boxShadow:'var(--shadow-xs)',overflow:'hidden'}}>
      {/* CABEÇALHO SEMPRE VISÍVEL */}
      <div style={{display:'flex',alignItems:'center',gap:0,cursor:'pointer'}} onClick={()=>setOpen(!open)}>
        {/* Barra lateral de cor por pressão */}
        <div style={{width:4,alignSelf:'stretch',background:pInfo.color,flexShrink:0}}></div>
        <div style={{flex:1,padding:'11px 14px',minWidth:0}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,flexWrap:'wrap'}}>
            {/* Esquerda: banco + tipo + status */}
            <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',minWidth:0}}>
              <span style={{fontSize:14,fontWeight:700,color:'var(--text-primary)'}}>{d.banco}</span>
              <span className="badge ba" style={{fontSize:10}}>{d.tipo}</span>
              <span className={`badge ${stBadge}`} style={{fontSize:10}}>{d.status}</span>
            </div>
            {/* Direita: métricas principais */}
            <div style={{display:'flex',alignItems:'center',gap:18,flexShrink:0,flexWrap:'wrap'}}>
              <div style={{textAlign:'right'}}>
                <div style={{fontSize:10,color:'var(--text-muted)',fontWeight:500}}>Saldo atual</div>
                <div style={{fontSize:15,fontWeight:700,color:'var(--red)',letterSpacing:'-.02em'}}>{fmtFull(d.valorUtilizado)}</div>
              </div>
              <div style={{textAlign:'right'}}>
                <div style={{fontSize:10,color:'var(--text-muted)',fontWeight:500}}>Parcela/mês</div>
                <div style={{fontSize:14,fontWeight:700,color:'var(--amber-dim)'}}>{fmtFull(d.parcelaMensal)}</div>
              </div>
              <div style={{textAlign:'right'}}>
                <div style={{fontSize:10,color:'var(--text-muted)',fontWeight:500}}>Taxa a.m.</div>
                <div style={{fontSize:13,fontWeight:600,color:'var(--text-primary)'}}>{d.taxaJuros?formatPercentBR(d.taxaJuros):'—'}</div>
              </div>
              <div style={{textAlign:'center'}}>
                <div style={{fontSize:10,color:'var(--text-muted)',fontWeight:500,marginBottom:2}}>Pressão</div>
                <span style={{display:'inline-flex',alignItems:'center',padding:'2px 8px',borderRadius:20,fontSize:10,fontWeight:600,background:pInfo.bg,color:pInfo.color,border:`1px solid ${pInfo.color}33`}}>{pInfo.label} {pIndPct>0?`· ${pIndPct}%`:''}</span>
              </div>
              <div style={{color:'var(--text-muted)',fontSize:12,marginLeft:4}}>{open?'▲':'▼'}</div>
            </div>
          </div>
        </div>
      </div>

      {/* DETALHES EXPANDÍVEIS */}
      {open&&(
        <div style={{borderTop:'1px solid var(--border)',padding:'12px 18px',background:'var(--surface-2)'}}>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:'8px 16px',marginBottom:12}}>
            {[
              {l:'Valor Original',v:d.valorOriginal?fmtFull(d.valorOriginal):'—'},
              {l:'Saldo Atual',v:fmtFull(d.valorUtilizado),color:'var(--red)'},
              {l:'Parcela Mensal',v:fmtFull(d.parcelaMensal),color:'var(--amber-dim)'},
              {l:'Taxa a.m.',v:d.taxaJuros?formatPercentBR(d.taxaJuros):'—'},
              {l:'Data de Contratação',v:d.dataContratacao?fmtDate(d.dataContratacao):'—'},
              {l:'Prazo Total',v:d.prazoTotal?d.prazoTotal+' meses':'—'},
              {l:'Parcelas Pagas',v:d.parcelasPagas?d.parcelasPagas:'—'},
              {l:'Parcelas Restantes',v:d.parcelasRestantes?d.parcelasRestantes:'—'},
              {l:'Vencimento da Parcela',v:d.vencimento?fmtDate(d.vencimento):'—'},
              {l:'Status',v:d.status},
              ...(d.quitada_em?[{l:'Quitada em',v:monthOf(d.quitada_em).split('-').reverse().join('/'),color:'var(--green-dim)'}]:[]),
            ].map(({l,v,color})=>(
              <div key={l}>
                <div style={{fontSize:10,color:'var(--text-muted)',fontWeight:500,marginBottom:2}}>{l}</div>
                <div style={{fontSize:13,fontWeight:600,color:color||'var(--text-primary)'}}>{v}</div>
              </div>
            ))}
          </div>
          {d.obs&&(
            <div style={{fontSize:12,color:'var(--text-muted)',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:6,padding:'7px 10px',marginBottom:10}}>
              <span style={{fontWeight:600,color:'var(--text-secondary)'}}>Obs: </span>{d.obs}
            </div>
          )}
          <div style={{display:'flex',gap:7,justifyContent:'flex-end'}}>
            <button className="btn btn-secondary btn-sm" onClick={e=>{e.stopPropagation();onEdit(d);}}>✏️ Editar</button>
            {d.status!=='Quitada'&&!d.quitada_em&&<button className="btn btn-primary btn-sm" onClick={e=>{e.stopPropagation();onQuitar(d);}}>✓ Quitada</button>}
            <button className="btn btn-danger btn-sm" onClick={e=>{e.stopPropagation();onRemove(d.id);}}>✕ Remover</button>
          </div>
        </div>
      )}
    </div>
  );
}

function Dividas({dividas,setDividas,onDividaCriar,onDividaEditar,onDividaExcluir,entradaMensal}){
  const[showForm,setShowForm]=useState(false);
  const[editId,setEditId]=useState(null);
  const emptyForm={banco:'',tipo:'Capital de Giro',valorOriginal:'',valorUtilizado:'',parcelaMensal:'',taxaJuros:'',dataContratacao:'',prazoTotal:'',parcelasPagas:'',parcelasRestantes:'',vencimento:'',status:'Ativa',obs:''};
  const[form,setForm]=useState(emptyForm);
  const[filtroStatus,setFiltroStatus]=useState('Todas');
  const[ordenacao,setOrdenacao]=useState('Maior saldo');
  const[dividaErro,setDividaErro]=useState(null);
  // Modal de quitação (registra apenas mês/ano de corte). Não altera o fluxo de edição/remoção.
  const[quitarTarget,setQuitarTarget]=useState(null);
  const[quitarMes,setQuitarMes]=useState('');
  const[quitarAno,setQuitarAno]=useState('');
  const[quitarErro,setQuitarErro]=useState('');
  const dividaOpLock=useRef(false);

  const totalDivida=dividas.reduce((s,d)=>s+d.valorUtilizado,0);
  const totalParcelas=dividas.reduce((s,d)=>s+d.parcelaMensal,0);
  const custoFin=dividas.reduce((s,d)=>s+(d.parcelaMensal*(d.taxaJuros/100||0)),0);
  const pctComp=entradaMensal>0?pct(totalParcelas,entradaMensal):0;
  const maiorTaxa=dividas.length?dividas.reduce((m,d)=>d.taxaJuros>m.taxaJuros?d:m):null;
  const pGeral=pressaoInfo(pctComp);

  const openForm=(d=null)=>{
    if(d){
      setForm({...emptyForm,...d,
        valorOriginal:d.valorOriginal!=null?d.valorOriginal.toString():'',
        valorUtilizado:d.valorUtilizado.toString(),
        parcelaMensal:d.parcelaMensal.toString(),
        taxaJuros:d.taxaJuros!=null?d.taxaJuros.toString():'',
        prazoTotal:d.prazoTotal?.toString()||'',
        parcelasPagas:d.parcelasPagas?.toString()||'',
        parcelasRestantes:d.parcelasRestantes?.toString()||'',
      });
      setEditId(d.id);
    } else {
      setForm(emptyForm);setEditId(null);
    }
    setShowForm(true);
  };

  const save_=()=>{
    if(dividaOpLock.current)return;
    // 1) Ler e normalizar os valores do formulário
    const bancoNorm=String(form.banco||'').trim();
    const tipoNorm=String(form.tipo||'').trim();
    const valorOriginalNum=parseCurrencyBR(form.valorOriginal);
    const parcelaMensalNum=parseCurrencyBR(form.parcelaMensal);
    const vencimentoNorm=String(form.vencimento||'').trim();
    const dataContratacaoNorm=String(form.dataContratacao||'').trim();
    const prazoTotalRaw=String(form.prazoTotal||'').trim();
    const prazoTotalFloat=Number(prazoTotalRaw);
    const prazoTotalValido=prazoTotalRaw!==''&&Number.isFinite(prazoTotalFloat)&&Number.isInteger(prazoTotalFloat)&&prazoTotalFloat>0;

    // 2) Validar campos obrigatórios (Banco/Credor, Tipo, Valor Original, Parcela Mensal, Vencimento da Parcela, Prazo Total)
    const faltantes=[];
    if(!bancoNorm)faltantes.push('Banco / Credor');
    if(!tipoNorm)faltantes.push('Tipo da dívida');
    if(!(valorOriginalNum>0))faltantes.push('Valor Original');
    if(!(parcelaMensalNum>0))faltantes.push('Parcela Mensal');
    if(!vencimentoNorm)faltantes.push('Vencimento da Parcela');
    if(!prazoTotalValido)faltantes.push('Prazo Total');

    // 3) Se houver campo obrigatório ausente/inválido: interrompe, mantém modal aberto e dados preenchidos
    if(faltantes.length>0){
      const listaFaltantes=faltantes.length===1?faltantes[0]:faltantes.slice(0,-1).join(', ')+' e '+faltantes[faltantes.length-1];
      alert('Preencha os campos obrigatórios: '+listaFaltantes+'.');
      return;
    }

    // 4) Data de Contratação: usa a informada; se vazia, usa o Vencimento da Parcela (já validado no passo 2)
    const dataContratacaoFinal=dataContratacaoNorm||vencimentoNorm;

    dividaOpLock.current=true;
    // 5) Construir o objeto da dívida usando a estrutura atual
    const entry={...form,
      dataContratacao:dataContratacaoFinal,
      valorOriginal:valorOriginalNum||null,
      valorUtilizado:parseCurrencyBR(form.valorUtilizado),
      parcelaMensal:parcelaMensalNum,
      taxaJuros:parsePercentBR(form.taxaJuros),
      prazoTotal:prazoTotalFloat,
      parcelasPagas:parseInt(form.parcelasPagas)||null,
      parcelasRestantes:parseInt(form.parcelasRestantes)||null,
      id:editId||genId()
    };
    const prev=dividas;
    // 6) Persistir usando a função existente
    if(editId){
      setDividas(dividas.map(d=>d.id===editId?entry:d));
      onDividaEditar(entry).catch(err=>{setDividas(prev);setDividaErro('Erro ao salvar a dívida. Alteração revertida.');}).finally(()=>{dividaOpLock.current=false;});
    } else {
      setDividas([...dividas,entry]);
      onDividaCriar(entry).catch(err=>{setDividas(prev);setDividaErro('Erro ao criar a dívida. Operação revertida.');}).finally(()=>{dividaOpLock.current=false;});
    }
    setShowForm(false);setEditId(null);setForm(emptyForm);
  };

  const remove=id=>{
    if(dividaOpLock.current)return;
    if(confirm('Remover esta dívida?')){
      dividaOpLock.current=true;
      const prev=dividas;
      setDividas(dividas.filter(d=>d.id!==id));
      onDividaExcluir(id).catch(err=>{setDividas(prev);setDividaErro('Erro ao excluir a dívida. Operação revertida.');}).finally(()=>{dividaOpLock.current=false;});
    }
  };

  // ── Quitação: registra mês/ano de corte, marca status 'Quitada' e persiste (sem excluir) ──
  const abrirQuitacao=d=>{
    const now=new Date();
    setQuitarTarget(d);
    setQuitarMes(String(now.getMonth()+1));
    setQuitarAno(String(now.getFullYear()));
    setQuitarErro('');
  };
  const fecharQuitacao=()=>{if(dividaOpLock.current)return;setQuitarTarget(null);setQuitarErro('');};
  const confirmarQuitacao=()=>{
    if(!quitarTarget||dividaOpLock.current)return;
    const mes=parseInt(quitarMes,10);
    const ano=parseInt(quitarAno,10);
    if(!Number.isInteger(mes)||mes<1||mes>12){setQuitarErro('Informe um mês válido (1 a 12).');return;}
    if(!Number.isInteger(ano)||ano<1000||ano>9999){setQuitarErro('Informe um ano válido com quatro dígitos.');return;}
    // Data de corte no 1º dia do mês informado — representa apenas o mês, não o dia real.
    const corte=`${ano}-${String(mes).padStart(2,'0')}-01`;
    // Impede quitação anterior à data de contratação (quando existir e for válida).
    const contrat=quitarTarget.dataContratacao;
    if(contrat&&/^\d{4}-\d{2}-\d{2}$/.test(contrat)&&monthOf(corte)<monthOf(contrat)){
      setQuitarErro('O mês de quitação não pode ser anterior à data de contratação da dívida.');return;
    }
    dividaOpLock.current=true;
    setQuitarErro('');
    const entry={...quitarTarget,status:'Quitada',quitada_em:corte};
    const prev=dividas;
    setDividas(dividas.map(d=>d.id===quitarTarget.id?entry:d));
    onDividaEditar(entry)
      .then(()=>{setQuitarTarget(null);})
      .catch(err=>{setDividas(prev);setQuitarErro('Erro ao registrar a quitação. Nenhuma alteração foi salva.');})
      .finally(()=>{dividaOpLock.current=false;});
  };

  // Filtro
  let lista=dividas.filter(d=>{
    if(filtroStatus==='Todas')return true;
    return d.status===filtroStatus;
  });
  // Ordenação
  if(ordenacao==='Maior saldo')lista=[...lista].sort((a,b)=>b.valorUtilizado-a.valorUtilizado);
  else if(ordenacao==='Maior parcela')lista=[...lista].sort((a,b)=>b.parcelaMensal-a.parcelaMensal);
  else if(ordenacao==='Maior taxa')lista=[...lista].sort((a,b)=>(b.taxaJuros||0)-(a.taxaJuros||0));
  else lista=[...lista].sort((a,b)=>a.status.localeCompare(b.status));

  return(
    <div>
      {dividaErro&&<div className="alert alert-r" style={{marginBottom:12,display:'flex',alignItems:'center',gap:8}}><span>⚠️</span><span style={{flex:1}}>{dividaErro}</span><button onClick={()=>setDividaErro(null)} style={{background:'none',border:'none',cursor:'pointer',color:'inherit',fontWeight:700,lineHeight:1}}>✕</button></div>}
      {/* CARDS EXECUTIVOS */}
      <div className="metrics-grid" style={{gridTemplateColumns:'repeat(auto-fill,minmax(140px,1fr))'}}>
        <div className="metric-card" style={{borderTop:'2px solid var(--red)'}}>
          <div className="metric-label">Total de Dívidas</div>
          <div className="metric-value red">{fmtFull(totalDivida)}</div>
          <div className="metric-sub">{dividas.length} dívida(s)</div>
        </div>
        <div className="metric-card" style={{borderTop:'2px solid var(--amber)'}}>
          <div className="metric-label">Parcelas Mensais</div>
          <div className="metric-value amber">{fmtFull(totalParcelas)}</div>
          <div className="metric-sub">{pctComp}% da entrada</div>
        </div>
        <div className="metric-card" style={{borderTop:'2px solid var(--red)'}}>
          <div className="metric-label">Custo Financeiro Est.</div>
          <div className="metric-value red">{fmtFull(custoFin)}</div>
          <div className="metric-sub">juros sobre parcelas</div>
        </div>
        <div className="metric-card" style={{borderTop:'2px solid var(--purple)'}}>
          <div className="metric-label">Dívida Mais Cara</div>
          <div className="metric-value" style={{fontSize:13}}>{maiorTaxa?maiorTaxa.banco:'—'}</div>
          <div className="metric-sub">{maiorTaxa?formatPercentBR(maiorTaxa.taxaJuros)+' a.m.':''}</div>
        </div>
      </div>

      {/* PRESSÃO BANCÁRIA */}
      <div className="card mb-3">
        <div className="card-title">Pressão Bancária Geral</div>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
          <div style={{flex:1}}>
            <div className="pressao-bar-bg" style={{height:7,borderRadius:4}}>
              <div className="pressao-bar" style={{width:Math.min(pctComp,100)+'%',background:pGeral.color,height:'100%',borderRadius:4,transition:'width .4s'}}></div>
            </div>
          </div>
          <span style={{display:'inline-flex',padding:'3px 10px',borderRadius:20,fontSize:11,fontWeight:600,background:pGeral.bg,color:pGeral.color,border:`1px solid ${pGeral.color}33`,whiteSpace:'nowrap'}}>{pGeral.label} · {pctComp}% da entrada</span>
        </div>
        <div style={{display:'flex',gap:12,fontSize:10,color:'var(--text-muted)'}}>
          <span>🟢 Baixa ≤5%</span><span>🟡 Média 5–10%</span><span>🟠 Alta 10–20%</span><span>🔴 Crítica &gt;20%</span>
        </div>
      </div>

      {/* CONTROLES: filtros + ordenação + botão */}
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12,flexWrap:'wrap'}}>
        <div style={{display:'flex',gap:4}}>
          {['Todas','Ativa','Quitada','Renegociada','Suspensa'].map(f=>(
            <button key={f} onClick={()=>setFiltroStatus(f)} style={{padding:'4px 11px',borderRadius:20,fontSize:11,fontWeight:500,cursor:'pointer',border:`1px solid ${filtroStatus===f?'var(--zanon-red)':'var(--border)'}`,background:filtroStatus===f?'var(--zanon-red)':'var(--surface)',color:filtroStatus===f?'white':'var(--text-muted)',fontFamily:'DM Sans,sans-serif',transition:'all .1s'}}>
              {f}
            </button>
          ))}
        </div>
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:6}}>
          <span style={{fontSize:11,color:'var(--text-muted)'}}>Ordenar por</span>
          <select value={ordenacao} onChange={e=>setOrdenacao(e.target.value)} style={{padding:'4px 8px',borderRadius:6,fontSize:11,border:'1px solid var(--border)',background:'var(--surface)',color:'var(--text-secondary)',fontFamily:'DM Sans,sans-serif',cursor:'pointer'}}>
            <option>Maior saldo</option>
            <option>Maior parcela</option>
            <option>Maior taxa</option>
            <option>Status</option>
          </select>
          <button className="btn btn-primary btn-sm" onClick={()=>openForm()}>+ Adicionar</button>
        </div>
      </div>

      {/* PAINÉIS INDIVIDUAIS */}
      {lista.length===0?(
        <div className="empty"><div className="empty-icon">🏦</div>
          {filtroStatus==='Todas'?'Nenhuma dívida cadastrada.':'Nenhuma dívida com status "'+filtroStatus+'".'}
        </div>
      ):(
        lista.map(d=>(
          <DividaPanel key={d.id} d={d} entradaMensal={entradaMensal} onEdit={openForm} onRemove={remove} onQuitar={abrirQuitacao}/>
        ))
      )}

      {/* MODAL CADASTRO/EDIÇÃO */}
      {showForm&&(
        <Modal title={editId?'Editar Dívida':'Nova Dívida'} onClose={()=>{setShowForm(false);setEditId(null);setForm(emptyForm);}}>
          <div className="form-grid">
            <div className="fg full"><label>Banco / Credor *</label><input type="text" placeholder="Ex: Sicredi, Bradesco, Sicoob..." value={form.banco} onChange={e=>setForm({...form,banco:e.target.value})}/></div>
            <div className="fg"><label>Tipo da dívida *</label><select value={form.tipo} onChange={e=>setForm({...form,tipo:e.target.value})}>{TIPOS_DIVIDA.map(t=><option key={t}>{t}</option>)}</select></div>
            <div className="fg"><label>Status</label><select value={form.status} onChange={e=>setForm({...form,status:e.target.value})}>{STATUS_DIVIDA.map(s=><option key={s}>{s}</option>)}</select></div>
            <div className="fg"><label>Valor Original (R$) *</label><input type="text" placeholder="Ex: 500.000,00" value={form.valorOriginal} onChange={e=>setForm({...form,valorOriginal:e.target.value})}/></div>
            <div className="fg"><label>Saldo Atual (R$)</label><input type="text" placeholder="Ex: 399.306,00" value={form.valorUtilizado} onChange={e=>setForm({...form,valorUtilizado:e.target.value})}/></div>
            <div className="fg"><label>Parcela Mensal (R$) *</label><input type="text" placeholder="Ex: 14.210,00" value={form.parcelaMensal} onChange={e=>setForm({...form,parcelaMensal:e.target.value})}/></div>
            <div className="fg"><label>Taxa a.m. (%)</label><input type="text" placeholder="Ex: 1,43" value={form.taxaJuros} onChange={e=>setForm({...form,taxaJuros:e.target.value})}/></div>
            <div className="fg"><label>Data de Contratação</label><input type="date" value={form.dataContratacao} onChange={e=>setForm({...form,dataContratacao:e.target.value})}/></div>
            <div className="fg"><label>Prazo Total (meses) *</label><input type="number" placeholder="0" value={form.prazoTotal} onChange={e=>setForm({...form,prazoTotal:e.target.value})}/></div>
            <div className="fg"><label>Parcelas Pagas</label><input type="number" placeholder="0" value={form.parcelasPagas} onChange={e=>setForm({...form,parcelasPagas:e.target.value})}/></div>
            <div className="fg"><label>Parcelas Restantes</label><input type="number" placeholder="0" value={form.parcelasRestantes} onChange={e=>setForm({...form,parcelasRestantes:e.target.value})}/></div>
            <div className="fg"><label>Vencimento da Parcela *</label><input type="date" value={form.vencimento} onChange={e=>setForm({...form,vencimento:e.target.value})}/></div>
            <div className="fg full"><label>Observação</label><textarea placeholder="Condições, renegociações, notas..." value={form.obs} onChange={e=>setForm({...form,obs:e.target.value})}/></div>
          </div>
          <div style={{marginTop:12,display:'flex',gap:8,justifyContent:'flex-end'}}>
            <button className="btn btn-secondary" onClick={()=>{setShowForm(false);setEditId(null);setForm(emptyForm);}}>Cancelar</button>
            <button className="btn btn-primary" onClick={save_}>Salvar</button>
          </div>
        </Modal>
      )}

      {/* MODAL QUITAÇÃO — solicita apenas mês e ano do corte */}
      {quitarTarget&&(
        <Modal title="Registrar quitação da dívida" onClose={fecharQuitacao}>
          <p style={{fontSize:13,color:'var(--text-muted)',marginBottom:12}}>Informe o mês e o ano em que esta dívida foi quitada. A partir desse mês, ela deixará de ser considerada nos cálculos financeiros.</p>
          {quitarErro&&<div className="alert alert-r" style={{marginBottom:12}}>{quitarErro}</div>}
          <div className="form-grid">
            <div className="fg"><label>Mês da quitação *</label><select value={quitarMes} onChange={e=>setQuitarMes(e.target.value)}>{MONTHS.map((m,i)=><option key={i} value={i+1}>{m}</option>)}</select></div>
            <div className="fg"><label>Ano da quitação *</label><input type="number" placeholder="Ex: 2026" value={quitarAno} onChange={e=>setQuitarAno(e.target.value)}/></div>
          </div>
          <div style={{marginTop:12,display:'flex',gap:8,justifyContent:'flex-end'}}>
            <button className="btn btn-secondary" onClick={fecharQuitacao}>Cancelar</button>
            <button className="btn btn-primary" onClick={confirmarQuitacao}>Confirmar quitação</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── RETIRADAS ──
function Retiradas({retiradas,setRetiradas,entradaMensal,config,setConfig}){
  const[showForm,setShowForm]=useState(false);
  const[form,setForm]=useState({data:today(),valor:'',obs:''});
  const total=retiradas.reduce((s,r)=>s+r.valor,0);
  const pctRet=entradaMensal>0?pct(total,entradaMensal):0;
  const save_=()=>{
    if(!form.data||!form.valor)return alert('Preencha data e valor.');
    setRetiradas([...retiradas,{id:genId(),...form,valor:parseNum(form.valor)}]);
    setForm({data:today(),valor:'',obs:''});setShowForm(false);
  };
  const remove=id=>{if(confirm('Remover?'))setRetiradas(retiradas.filter(r=>r.id!==id));};
  const sorted=[...retiradas].sort((a,b)=>b.data.localeCompare(a.data));
  return(
    <div>
      <div className="metrics-grid">
        <div className="metric-card"><div className="metric-label">Total Retirado</div><div className="metric-value red">{fmtFull(total)}</div><div className="metric-sub">{retiradas.length} retirada(s)</div></div>
        <div className="metric-card"><div className="metric-label">% da Entrada</div><div className={`metric-value ${pctRet>25?'red':pctRet>15?'amber':'green'}`}>{pctRet}%</div><div className="metric-sub">{pctRet>25?'Elevado':'Dentro do limite'}</div></div>
        <div className="metric-card">
          <div className="metric-label">Retirada Ideal/Mês (R$)</div>
          <div className="metric-value" style={{fontSize:13}}>{fmtFull(config.retiradaIdeal)}</div>
          <input style={{marginTop:4,width:'100%',padding:'3px 6px',fontSize:10,borderRadius:4,border:'1px solid var(--border)',background:'var(--surface-2)',color:'var(--text-muted)',outline:'none',fontFamily:'DM Sans,sans-serif'}} type="number" value={config.retiradaIdeal} onChange={e=>setConfig({...config,retiradaIdeal:parseNum(e.target.value)})} placeholder="Meta mensal"/>
        </div>
      </div>
      <div className="section-header"><div className="section-title">Histórico de Retiradas</div><button className="btn btn-primary" onClick={()=>setShowForm(true)}>+ Adicionar</button></div>
      {sorted.length===0?<div className="empty"><div className="empty-icon">👤</div>Nenhuma retirada cadastrada.</div>:(
        <div className="tw">
          <table><thead><tr><th>Data</th><th>Valor</th><th>Observação</th><th></th></tr></thead>
          <tbody>{sorted.map(r=>(<tr key={r.id}><td>{fmtDate(r.data)}</td><td><strong>{fmtFull(r.valor)}</strong></td><td style={{color:'var(--text-muted)'}}>{r.obs||'—'}</td><td><button className="btn btn-danger btn-sm" onClick={()=>remove(r.id)}>✕</button></td></tr>))}</tbody></table>
        </div>
      )}
      {showForm&&(
        <Modal title="Nova Retirada" onClose={()=>setShowForm(false)}>
          <div className="form-grid">
            <div className="fg"><label>Data</label><input type="date" value={form.data} onChange={e=>setForm({...form,data:e.target.value})}/></div>
            <div className="fg"><label>Valor (R$)</label><input type="number" placeholder="0" value={form.valor} onChange={e=>setForm({...form,valor:e.target.value})}/></div>
            <div className="fg full"><label>Observação</label><textarea placeholder="Motivo, destino..." value={form.obs} onChange={e=>setForm({...form,obs:e.target.value})}/></div>
          </div>
          <div style={{marginTop:12,display:'flex',gap:8,justifyContent:'flex-end'}}>
            <button className="btn btn-secondary" onClick={()=>setShowForm(false)}>Cancelar</button>
            <button className="btn btn-primary" onClick={save_}>Salvar</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── PROJEÇÃO ──
// ══════════════════════════════════════════════════════════════════════════
// PROJEÇÃO DE CAIXA CONSOLIDADA (aba Projeção) — motor puro, sem I/O.
// Consolida o GRUPO (cliente): não há visão por unidade.
// Âncora = saldo real da tabela saldos_caixa_consolidados; config.saldoInicial
// NÃO é usado aqui e permanece intocado.
// ══════════════════════════════════════════════════════════════════════════
const PROJ_MODALIDADES=['dinheiro','pix','debito','credito','voucher','outros'];
const PROJ_MOD_LABEL={dinheiro:'Dinheiro',pix:'PIX',debito:'Débito',credito:'Crédito',voucher:'Voucher',outros:'Outros'};
const PROJ_JANELA_HIST=56;   // 8 semanas até ontem
const PROJ_MIN_DIAS_HIST=14; // mínimo para liberar o cenário Provável

const projNum=v=>{const n=Number(v);return Number.isFinite(n)?n:0;};
const projCents=v=>Math.round(projNum(v)*100)/100;
const projDataValida=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d);
const projDow=d=>new Date(d+'T12:00:00').getDay();
const projDiasEntre=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);

// Espelha calcRecebimento da aba Entradas: dias CORRIDOS (addDays), com o caso
// especial do voucher antecipado. Não cria regra concorrente de liquidação.
// PRAZO APLICÁVEL a uma modalidade, em dias. O prazo CONGELADO na própria Entrada
// (entradas.prazos_recebimento, jsonb) tem precedência sobre a configuração global, que é
// mutável e vale por navegador. É isso que impede uma venda já lançada de mudar de data de
// recebimento retroativamente quando o cliente altera o prazo padrão depois.
// Entrada legada (prazos_recebimento NULL) → prazo global, exatamente como antes.
// Este campo NUNCA representa antecipação: antecipação continua sendo decidida antes, pelos
// campos creditoAntecipado/creditoDataReceb e voucherAntecipado/voucherDataReceb.
const projPrazoEntrada=(entry,forma,prazos)=>{
  const p=entry&&entry.prazos_recebimento;
  if(p&&typeof p==='object'&&p[forma]!=null&&Number.isFinite(Number(p[forma])))return projNum(p[forma]);
  return projNum(prazos[forma]);
};

const projDataRecebimento=(entry,forma,prazos)=>{
  if(forma==='voucher'){
    if(entry.voucherAntecipado==='sim'&&projDataValida(entry.voucherDataReceb))return entry.voucherDataReceb;
    return addDays(entry.data,projPrazoEntrada(entry,'voucher',prazos));
  }
  if(forma==='credito'){
    if(entry.creditoAntecipado==='sim'&&projDataValida(entry.creditoDataReceb))return entry.creditoDataReceb;
    return addDays(entry.data,projPrazoEntrada(entry,'credito',prazos));
  }
  return addDays(entry.data,projPrazoEntrada(entry,forma,prazos));
};

// Monta a série diária consolidada. Tudo derivado de dados reais; nada é inventado.
const buildProjecaoCaixa=({entradas,contas,dividas,retiradas,empresaIds,prazos,saldoValor,dataPosicao,hoje,horizonte})=>{
  const vazio={rows:[],hist:{diasComVenda:0,suficiente:false,mediaDow:[0,0,0,0,0,0,0],mix:{},totalHist:0},
               metricas:null,porModalidade:[],porCategoria:[],qualidade:{semVencimento:0,semData:0,vencidas:0}};
  if(!projDataValida(dataPosicao)||!projDataValida(hoje))return vazio;

  // Regra temporal: só projeta a partir de uma posição do PRÓPRIO dia. Uma posição antiga não
  // reconstrói o caixa — não há extrato bancário que prove o que já está refletido no saldo,
  // então reaplicar movimentos passados arriscaria dupla contagem.
  if(dataPosicao!==hoje)return vazio;
  // A posição é o saldo de FECHAMENTO da data informada: a projeção começa no dia seguinte e
  // movimentos datados na própria data_posicao não são somados nem subtraídos de novo.
  const fim=addDays(hoje,projNum(horizonte));
  const inicio=addDays(dataPosicao,1);
  if(inicio>fim)return vazio;

  // ── Esqueleto diário ──
  const map={},ordem=[];
  for(let d=inicio;d<=fim;d=addDays(d,1)){
    map[d]={data:d,comprometido:0,estimado:0,saidas:0,porMod:{},porCat:{}};
    ordem.push(d);
    if(ordem.length>800)break; // trava de segurança
  }
  const ids=new Set((empresaIds||[]).filter(Boolean));
  const qualidade={semVencimento:0,semData:0,vencidas:0};

  // ── 1. RECEBIMENTOS COMPROMETIDOS — vendas JÁ realizadas ──
  (entradas||[]).forEach(e=>{
    if(!ids.has(e.empresa_id))return;
    if(!projDataValida(e.data)){qualidade.semData++;return;}
    PROJ_MODALIDADES.forEach(forma=>{
      const v=projNum(e[forma]);
      if(v<=0)return;
      const dr=projDataRecebimento(e,forma,prazos);
      if(!projDataValida(dr)||!map[dr])return; // já disponível antes do início, ou fora do horizonte
      map[dr].comprometido+=v;
      map[dr].porMod[forma]=(map[dr].porMod[forma]||0)+v;
    });
  });

  // ── 2. HISTÓRICO para a estimativa ──
  const histIni=addDays(hoje,-PROJ_JANELA_HIST),histFim=addDays(hoje,-1);
  const totalPorData={},modPorData={};
  (entradas||[]).forEach(e=>{
    if(!ids.has(e.empresa_id))return;
    if(!projDataValida(e.data)||e.data<histIni||e.data>histFim)return;
    totalPorData[e.data]=(totalPorData[e.data]||0)+projNum(e.total);
    PROJ_MODALIDADES.forEach(f=>{
      if(!modPorData[f])modPorData[f]=0;
      modPorData[f]+=projNum(e[f]);
    });
  });
  const datasHist=Object.keys(totalPorData).filter(d=>totalPorData[d]>0);
  const diasComVenda=datasHist.length;
  const totalHist=datasHist.reduce((s,d)=>s+totalPorData[d],0);
  const somaDow=[0,0,0,0,0,0,0],cntDow=[0,0,0,0,0,0,0];
  datasHist.forEach(d=>{const w=projDow(d);somaDow[w]+=totalPorData[d];cntDow[w]+=1;});
  const mediaGeral=diasComVenda>0?totalHist/diasComVenda:0;
  const mediaDow=[0,1,2,3,4,5,6].map(w=>cntDow[w]>0?somaDow[w]/cntDow[w]:mediaGeral);
  const somaMod=PROJ_MODALIDADES.reduce((s,f)=>s+projNum(modPorData[f]),0);
  const mix={};
  PROJ_MODALIDADES.forEach(f=>{mix[f]=somaMod>0?projNum(modPorData[f])/somaMod:0;});
  const suficiente=diasComVenda>=PROJ_MIN_DIAS_HIST&&somaMod>0;
  const hist={diasComVenda,suficiente,mediaDow,mix,totalHist,
              semanas:Math.floor(diasComVenda/7),janelaIni:histIni,janelaFim:histFim};

  // ── 3. VENDAS FUTURAS ESTIMADAS — apenas dias APÓS hoje ──
  // Hoje pode ter vendas ainda não lançadas; estimar hoje duplicaria o comprometido.
  if(suficiente){
    ordem.forEach(d=>{
      if(d<=hoje)return;
      const totalDia=projNum(mediaDow[projDow(d)]);
      if(totalDia<=0)return;
      PROJ_MODALIDADES.forEach(f=>{
        const v=totalDia*projNum(mix[f]);
        if(v<=0)return;
        const dr=addDays(d,projNum(prazos[f])); // estimativa não tem voucher antecipado
        if(!map[dr])return;
        map[dr].estimado+=v;
      });
    });
  }

  // ── 4. SAÍDAS — contas + parcelas de dívidas + fixas recorrentes (via merge) ──
  // Dívidas NUNCA são somadas em separado: entram só pelo merge, o que impede
  // dupla contagem. 'Pago' é excluído porque já deixou o caixa — mesma regra que
  // a aba Projeção já aplicava.
  ids.forEach(id=>{
    const con=(contas||[]).filter(r=>r.empresa_id===id);
    const div=(dividas||[]).filter(r=>r.empresa_id===id);
    mergeContasComParcelas(con,div).forEach(c=>{
      if(!projDataValida(c.vencimento)){qualidade.semVencimento++;return;}
      if(c.status==='Pago')return;
      if(c.vencimento<inicio){if(c.vencimento<hoje)qualidade.vencidas++;return;}
      if(!map[c.vencimento])return;
      const v=projNum(c.valor);
      if(v<=0)return;
      map[c.vencimento].saidas+=v;
      const cat=c.tipoDespesa||'Variável';
      map[c.vencimento].porCat[cat]=(map[c.vencimento].porCat[cat]||0)+v;
    });
  });
  (retiradas||[]).forEach(r=>{
    if(!ids.has(r.empresa_id))return;
    if(!projDataValida(r.data)||!map[r.data])return;
    const v=projNum(r.valor);
    if(v<=0)return;
    map[r.data].saidas+=v;
    map[r.data].porCat['Retiradas']=(map[r.data].porCat['Retiradas']||0)+v;
  });

  // ── 5. ACUMULAÇÃO DIÁRIA ──
  let gar=projNum(saldoValor),prov=projNum(saldoValor);
  const rows=ordem.map(d=>{
    const c=map[d];
    gar=gar+c.comprometido-c.saidas;
    prov=prov+c.comprometido+c.estimado-c.saidas;
    return{data:c.data,comprometido:projCents(c.comprometido),estimado:projCents(c.estimado),
           saidas:projCents(c.saidas),saldoGar:projCents(gar),saldoProv:projCents(prov),
           porMod:c.porMod,porCat:c.porCat,futuro:c.data>=hoje};
  });

  // ── 6. MÉTRICAS — apenas sobre o horizonte visível (de hoje em diante) ──
  const janela=rows.filter(r=>r.futuro);
  let metricas=null;
  if(janela.length){
    const menorGar=janela.reduce((m,r)=>r.saldoGar<m.saldoGar?r:m);
    const menorProv=janela.reduce((m,r)=>r.saldoProv<m.saldoProv?r:m);
    const primNegGar=janela.find(r=>r.saldoGar<0)||null;
    const primNegProv=janela.find(r=>r.saldoProv<0)||null;
    const fimJ=janela[janela.length-1];
    const status=!suficiente
      ? (menorGar.saldoGar<0?'vermelho':'verde')
      : (menorProv.saldoProv<0?'vermelho':(menorGar.saldoGar<0?'amarelo':'verde'));
    metricas={
      menorSaldoGar:menorGar.saldoGar,diaMenorGar:menorGar.data,
      menorSaldoProv:menorProv.saldoProv,diaMenorProv:menorProv.data,
      primeiroNegGar:primNegGar?primNegGar.data:null,
      primeiroNegProv:primNegProv?primNegProv.data:null,
      deficitMax:projCents(Math.max(0,-Math.min(menorGar.saldoGar,menorProv.saldoProv))),
      saldoFimGar:fimJ.saldoGar,saldoFimProv:fimJ.saldoProv,
      totalComprometido:projCents(janela.reduce((s,r)=>s+r.comprometido,0)),
      totalEstimado:projCents(janela.reduce((s,r)=>s+r.estimado,0)),
      totalSaidas:projCents(janela.reduce((s,r)=>s+r.saidas,0)),
      status,
    };
  }

  // ── 7. Composições para os detalhes ──
  const accMod={},accCat={};
  janela.forEach(r=>{
    Object.entries(r.porMod).forEach(([k,v])=>{accMod[k]=(accMod[k]||0)+v;});
    Object.entries(r.porCat).forEach(([k,v])=>{accCat[k]=(accCat[k]||0)+v;});
  });
  const porModalidade=PROJ_MODALIDADES.filter(f=>accMod[f]>0)
    .map(f=>({chave:f,label:PROJ_MOD_LABEL[f],valor:projCents(accMod[f]),prazo:projNum(prazos[f])}))
    .sort((a,b)=>b.valor-a.valor);
  const porCategoria=Object.keys(accCat).map(k=>({label:k,valor:projCents(accCat[k])}))
    .sort((a,b)=>b.valor-a.valor);

  return{rows,hist,metricas,porModalidade,porCategoria,qualidade};
};

// ══════════════════════════════════════════════════════════════════════════
// PROJEÇÃO — CAMADA 2: resultado de UM DIA (motor de "Hoje", generalizado).
// Reaproveita EXATAMENTE os helpers do motor acima — projDataRecebimento para o
// regime de caixa dos recebimentos, mergeContasComParcelas (+ mesmo filtro de
// status 'Pago') para as saídas — filtrando ambos para `dataAlvo`. Não é um
// motor concorrente: nenhuma regra de prazo é copiada ou reinterpretada.
//
// Generalização de buildHojeCaixa(hoje) → buildCaixaDoDia(dataAlvo): mesma regra,
// parametrizada pela data. Usada tanto pelo Card "Hoje" quanto pelo acumulativo
// de "Em Conta" (soma do resultado diário desde a última posição manual).
// ══════════════════════════════════════════════════════════════════════════
const buildCaixaDoDia=({entradas,contas,dividas,retiradas,empresaIds,prazos,dataAlvo})=>{
  const ids=new Set((empresaIds||[]).filter(Boolean));

  // ── Entra: mesma regra de projDataRecebimento, filtrada para dr===dataAlvo ──
  const porModalidade={};
  let entra=0;
  (entradas||[]).forEach(e=>{
    if(!ids.has(e.empresa_id))return;
    if(!projDataValida(e.data))return;
    PROJ_MODALIDADES.forEach(forma=>{
      const v=projNum(e[forma]);
      if(v<=0)return;
      const dr=projDataRecebimento(e,forma,prazos);
      if(dr!==dataAlvo)return; // só o que fica disponível no dia-alvo; nunca D+30, nem véspera/seguinte
      entra+=v;
      porModalidade[forma]=(porModalidade[forma]||0)+v;
    });
  });

  // ── Sai: mesmo merge (contas manuais + parcelas de dívidas + fixas), sem
  // somar dívidas em separado, mesma exclusão de status 'Pago' já aplicada acima ──
  let sai=0;
  const porOrigem={contas:0,retiradas:0};
  ids.forEach(id=>{
    const con=(contas||[]).filter(r=>r.empresa_id===id);
    const div=(dividas||[]).filter(r=>r.empresa_id===id);
    mergeContasComParcelas(con,div).forEach(c=>{
      if(!projDataValida(c.vencimento)||c.vencimento!==dataAlvo)return;
      if(c.status==='Pago')return;
      const v=projNum(c.valor);
      if(v<=0)return;
      sai+=v;
      porOrigem.contas+=v;
    });
  });
  (retiradas||[]).forEach(r=>{
    if(!ids.has(r.empresa_id))return;
    if(!projDataValida(r.data)||r.data!==dataAlvo)return;
    const v=projNum(r.valor);
    if(v<=0)return;
    sai+=v;
    porOrigem.retiradas+=v;
  });

  return{
    entra:projCents(entra),sai:projCents(sai),
    sobra:projCents(entra-sai),
    porModalidade,porOrigem,
  };
};

// Sobra Hoje = Entra Hoje − Sai Hoje. NÃO soma o saldo em conta: como o próprio
// buildProjecaoCaixa comenta acima, `saldos_caixa_consolidados.valor` (quando a
// posição é de hoje) é o saldo de FECHAMENTO do dia — já inclui os recebimentos e
// pagamentos de hoje. Somá-lo de novo aqui duplicaria esses mesmos movimentos.
const buildHojeCaixa=({entradas,contas,dividas,retiradas,empresaIds,prazos,hoje})=>{
  const dia=buildCaixaDoDia({entradas,contas,dividas,retiradas,empresaIds,prazos,dataAlvo:hoje});
  return{
    entraHoje:dia.entra,saiHoje:dia.sai,sobraHoje:dia.sobra,
    porModalidade:dia.porModalidade,porOrigem:dia.porOrigem,
  };
};

// ══════════════════════════════════════════════════════════════════════════
// PROJEÇÃO — SÉRIE DIÁRIA de ENTRADAS × SAÍDAS (camada do gráfico 15/30/60).
// Re-agrupamento por dia dos MESMOS primitivos que buildCaixaDoDia já usa —
// projDataRecebimento para o regime de caixa dos recebimentos e mergeContasComParcelas
// (+ mesmo filtro de status 'Pago') para as saídas. Não é uma segunda verdade: nenhuma
// regra de prazo, antecipação ou parcela é reinterpretada aqui.
//
// NÃO ACUMULA: cada ponto é o montante previsto NAQUELE dia, não o saldo corrente.
//
// ENTRADAS = COMPROMETIDO — vendas JÁ realizadas, na data real de disponibilidade. A
// estimativa de vendas futuras (cenário Provável de buildProjecaoCaixa) NÃO entra aqui.
//
// Independe do saldo em conta — por isso não reaproveita buildProjecaoCaixa, que só
// devolve linhas quando existe posição do próprio dia (`if(dataPosicao!==hoje)`).
// ══════════════════════════════════════════════════════════════════════════
const buildSerieProjecao=({entradas,contas,dividas,retiradas,empresaIds,prazos,inicio,fim})=>{
  const vazio={rows:[],totalEntradas:0,totalSaidas:0};
  if(!projDataValida(inicio)||!projDataValida(fim)||inicio>fim)return vazio;
  const ids=new Set((empresaIds||[]).filter(Boolean));

  const map={},ordem=[];
  for(let d=inicio;d<=fim;d=addDays(d,1)){
    map[d]={entradas:0,saidas:0};
    ordem.push(d);
    if(ordem.length>400)break; // trava de segurança
  }

  // ── Entradas: mesma regra de projDataRecebimento (D+X, crédito/voucher antecipados) ──
  (entradas||[]).forEach(e=>{
    if(!ids.has(e.empresa_id))return;
    if(!projDataValida(e.data))return;
    PROJ_MODALIDADES.forEach(forma=>{
      const v=projNum(e[forma]);
      if(v<=0)return;
      const dr=projDataRecebimento(e,forma,prazos);
      if(!projDataValida(dr)||!map[dr])return; // fora da janela projetada
      map[dr].entradas+=v;
    });
  });

  // ── Saídas: mesmo merge (contas + parcelas de dívidas + fixas), sem somar dívidas
  // em separado, mesma exclusão de status 'Pago' ──
  ids.forEach(id=>{
    const con=(contas||[]).filter(r=>r.empresa_id===id);
    const div=(dividas||[]).filter(r=>r.empresa_id===id);
    mergeContasComParcelas(con,div).forEach(c=>{
      if(!projDataValida(c.vencimento)||!map[c.vencimento])return;
      if(c.status==='Pago')return;
      const v=projNum(c.valor);
      if(v<=0)return;
      map[c.vencimento].saidas+=v;
    });
  });
  (retiradas||[]).forEach(r=>{
    if(!ids.has(r.empresa_id))return;
    if(!projDataValida(r.data)||!map[r.data])return;
    const v=projNum(r.valor);
    if(v<=0)return;
    map[r.data].saidas+=v;
  });

  const rows=ordem.map(d=>({data:d,entradas:projCents(map[d].entradas),saidas:projCents(map[d].saidas)}));
  return{
    rows,
    totalEntradas:projCents(rows.reduce((s,r)=>s+r.entradas,0)),
    totalSaidas:projCents(rows.reduce((s,r)=>s+r.saidas,0)),
  };
};

// Eixo Y compacto do gráfico de projeção — só apresentação, não altera nenhum valor.
const fcEixoY=v=>{
  const n=projNum(v),a=Math.abs(n);
  if(a>=1000000)return 'R$ '+(n/1000000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi';
  if(a>=1000)return 'R$ '+Math.round(n/1000)+' mil';
  return 'R$ '+Math.round(n);
};

// Confiança qualitativa — regra explícita, sem percentual arbitrário.
const projConfianca=(hist,idadePosicao,metricas)=>{
  if(!metricas)return{nivel:'—',motivo:'Sem base para calcular.'};
  const semanas=hist.semanas||0;
  const idade=projNum(idadePosicao);
  const totalEnt=projNum(metricas.totalComprometido)+projNum(metricas.totalEstimado);
  const pctComp=totalEnt>0?projNum(metricas.totalComprometido)/totalEnt:1;
  let nivel='baixa';
  if(idade<=1&&semanas>=6)nivel='alta';
  else if(idade<=7&&semanas>=3)nivel='média';
  const partes=[];
  partes.push(idade===0?'saldo atualizado hoje':(idade===1?'saldo de ontem':`saldo informado há ${idade} dias`));
  partes.push(semanas>0?`${semanas} ${semanas===1?'semana':'semanas'} de histórico`:'histórico insuficiente');
  if(totalEnt>0)partes.push(`${Math.round(pctComp*100)}% das entradas já vendidas`);
  return{nivel,motivo:partes.join(' · ')};
};

// ══════════════════════════════════════════════════════════════════════════
// CAPITAL DE GIRO — CAMADA 1 (aba Projeção).
// Reserva financeira do CLIENTE (grupo), separada do saldo operacional em conta
// (saldos_caixa_consolidados) e de config.saldoInicial. Ledger append-only em
// public.capital_giro_movimentos — sem UPDATE, sem DELETE.
// ══════════════════════════════════════════════════════════════════════════

// Representação visual discreta do nível de confiança já calculado por projConfianca.
// Não cria um novo nível nem percentual — só transforma alta/média/baixa em pontos.
const cgConfDots=nivel=>nivel==='alta'?'●●●●':nivel==='média'?'●●●○':nivel==='baixa'?'●●○○':'○○○○';

// Aviso 1 — leitura executiva do caixa, a partir das MESMAS métricas do Hero da Projeção
// (metricas/conf já calculados por buildProjecaoCaixa/projConfianca para o horizonte
// selecionado). Nenhum dado é inventado; nenhuma causa é atribuída sem prova.
const cgAviso1Texto=(horizonte,metricas,conf)=>{
  if(!metricas){
    return{titulo:'ATUALIZE O SALDO PARA ANALISAR O CAIXA',
      corpo:'Informe o saldo em conta para que a Projeção calcule a saúde do caixa dos próximos dias.',
      rodape:null};
  }
  const rodape=conf?`Confiança: ${cgConfDots(conf.nivel)}  ·  ${conf.motivo}`:null;
  if(metricas.status==='verde'){
    return{titulo:'NO RITMO ATUAL, DÁ PRA PAGAR TUDO',
      corpo:`As contas conhecidas dos próximos ${horizonte} dias estão cobertas pelo caixa garantido. Menor folga do período: ${fmt(metricas.menorSaldoGar)}, em ${fmtDate(metricas.diaMenorGar)}.`,
      rodape};
  }
  if(metricas.status==='amarelo'){
    return{titulo:'O CAIXA DEPENDE DA MANUTENÇÃO DAS VENDAS',
      corpo:`Com o que já está garantido, o caixa fica apertado a partir de ${fmtDate(metricas.primeiroNegGar)}. Mantendo o ritmo médio de vendas, o período fecha sem ficar negativo. Ponto de atenção: ${fmtDate(metricas.diaMenorGar)}.`,
      rodape};
  }
  return{titulo:'HÁ RISCO DE FALTA DE CAIXA',
    corpo:`Mesmo considerando a estimativa de vendas, o caixa pode ficar negativo a partir de ${fmtDate(metricas.primeiroNegProv||metricas.diaMenorProv)}. Menor saldo previsto: ${fmt(metricas.menorSaldoProv)}.`,
    rodape};
};

// Aviso 2 — necessidade de Capital de Giro nos PRÓXIMOS 30 DIAS, sempre pelo cenário
// GARANTIDO (conservador) e sempre com horizonte fixo em 30 — nunca o horizonte
// selecionado na tela. `proj30` é o MESMO motor buildProjecaoCaixa; nenhuma regra nova.
const cgAviso2Texto=(proj30,capitalDisponivel)=>{
  if(!proj30||!proj30.metricas){
    return{titulo:'NECESSIDADE DE CAPITAL — 30 DIAS',
      corpo:'Atualize o saldo para calcular a necessidade de Capital de Giro.',rodape:null};
  }
  const necessidade=projCents(Math.max(0,-proj30.metricas.menorSaldoGar));
  if(necessidade<=0){
    return{titulo:'NECESSIDADE DE CAPITAL — 30 DIAS',
      corpo:'Pela projeção atual, não há necessidade prevista de utilizar o Capital de Giro nos próximos 30 dias.',
      rodape:null};
  }
  const rodape=necessidade>projNum(capitalDisponivel)
    ?`Necessidade projetada: ${fmt(necessidade)}  ·  Capital disponível: ${fmt(capitalDisponivel)}`:null;
  return{titulo:'NECESSIDADE DE CAPITAL — 30 DIAS',
    corpo:`Nos próximos 30 dias, a operação pode precisar de até ${fmt(necessidade)} do Capital de Giro para manter o caixa não negativo.`,
    rodape};
};

// Aviso 3 — utilização e retorno do Capital de Giro. Utilizado/Retornado são do MÊS
// CORRENTE real (data de hoje); "a retornar" é a pendência histórica — nunca reseta
// na virada do mês (o Capital de Giro atravessa meses).
const cgAviso3Texto=(cgCalc,hoje)=>{
  const mesNome=(MONTHS[Number(hoje.slice(5,7))-1]||'').toLowerCase();
  if(cgCalc.utilizadoMes<=0){
    if(cgCalc.aRetornar>0){
      return{titulo:'CAPITAL UTILIZADO NA OPERAÇÃO',
        corpo:`Nenhuma saída de Capital de Giro em ${mesNome}.`,
        rodape:`Ainda há ${fmt(cgCalc.aRetornar)} pendente de retorno de movimentos anteriores.`};
    }
    return{titulo:'CAPITAL UTILIZADO NA OPERAÇÃO',
      corpo:'Nenhum valor do Capital de Giro foi utilizado na operação neste mês.',rodape:null};
  }
  const partes=[`Durante ${mesNome}, ${fmt(cgCalc.utilizadoMes)} saíram do Capital de Giro para ajudar nos pagamentos.`];
  if(cgCalc.retornadoMes>0)partes.push(`${fmt(cgCalc.retornadoMes)} já retornaram neste mês.`);
  const rodape=cgCalc.aRetornar>0?`Ainda devem retornar: ${fmt(cgCalc.aRetornar)}.`:'Sem pendência de retorno no momento.';
  return{titulo:'CAPITAL UTILIZADO NA OPERAÇÃO',corpo:partes.join(' '),rodape};
};

// NOTA: cgAviso1Texto/cgAviso2Texto/cgAviso3Texto acima permanecem definidos e testados, mas hoje
// sem consumidor — o carrossel de avisos que os renderizava foi substituído pelo painel "Em Conta".
// Mantidos de propósito (mesma política do motor da Projeção antiga): são funções puras, derivadas
// de metricas/conf/proj30/cgCalc, e serão reaproveitadas quando o Mural voltar em outra camada.

// ── POSIÇÃO MANUAL DO CAPITAL DE GIRO (public.capital_giro_posicoes) ──
// Instante do corte, em ms. A comparação é SEMPRE por timestamp real (criado_em do movimento
// × posicao_em da posição), nunca por `data`: os botões Entrada/Saída gravam movimentos no
// mesmo dia da posição, e um corte por data os descartaria indevidamente.
const cgTs=v=>{const t=Date.parse(v);return Number.isFinite(t)?t:NaN;};

// Um movimento só entra no DISPONÍVEL quando é comprovadamente posterior à posição.
// Sem posição, tudo entra (comportamento atual preservado). Com posição, um movimento cujo
// criado_em não seja legível NÃO entra: não dá para provar que é posterior, e reaplicá-lo
// sobre a posição seria dupla contagem.
const cgPosterior=(criadoEm,corte)=>{
  if(corte===null)return true;
  const t=cgTs(criadoEm);
  return Number.isFinite(t)&&t>corte;
};

// parseNum devolve 0 para texto inválido, então a validade do TEXTO é checada antes —
// é o que separa "0" (valor legítimo) de "abc" (entrada inválida).
const cgEntradaValida=t=>{
  const s=String(t==null?'':t).trim();
  if(!s||!/\d/.test(s))return false;
  return /^-?\s*(R\$)?\s*-?[\d.,]+$/.test(s);
};

// Data curta para o histórico de saldos: "08 Ago". Reutiliza MONTHS_SHORT já definido no projeto.
const accDataCurta=d=>{
  if(!projDataValida(d))return '—';
  return `${d.slice(8,10)} ${MONTHS_SHORT[Number(d.slice(5,7))-1]||''}`.trim();
};

// ══════════════════════════════════════════════════════════════════════════
// PROJEÇÃO — REDESIGN: helpers de APRESENTAÇÃO (prefixo rdp).
// Nenhum deles calcula dinheiro: só formatam ou comparam valores que os motores
// existentes (buildSerieProjecao / buildCaixaDoDia / cgCalc) já produziram.
// ══════════════════════════════════════════════════════════════════════════

// BRL sem centavos — é a notação usada pelo mockup nos minis, na legenda do
// gráfico e no Resumo semanal ("R$ 171.044"). O hero, o Capital de Giro e os
// cards de Hoje seguem com fmt() (centavos), como no mockup.
const rdpFmt0=v=>projNum(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL',
  minimumFractionDigits:0,maximumFractionDigits:0});

// Variação percentual entre dois valores REAIS já calculados. Devolve null quando
// não há base de comparação (evita percentual inventado). Nunca cria dado novo.
const rdpVariacao=(atual,anterior)=>{
  const base=projNum(anterior);
  if(base<=0)return null;
  const d=(projNum(atual)-base)/base*100;
  return Number.isFinite(d)?d:null;
};
const rdpPct=d=>`${d>=0?'+':'−'}${Math.abs(d).toLocaleString('pt-BR',{maximumFractionDigits:1})}%`;

// Rótulo do período de uma semana civil: "01–07 ago".
const rdpPeriodo=(ini,fim)=>{
  const mi=MONTHS_SHORT[Number(ini.slice(5,7))-1]||'',mf=MONTHS_SHORT[Number(fim.slice(5,7))-1]||'';
  return mi===mf?`${ini.slice(8,10)}–${fim.slice(8,10)} ${mi.toLowerCase()}`
                :`${ini.slice(8,10)} ${mi.toLowerCase()}–${fim.slice(8,10)} ${mf.toLowerCase()}`;
};

// ── RESUMO SEMANAL — agrupamento SEMANAL CIVIL da MESMA série do gráfico ──
// Regra de divisão (idêntica à estrutura do mockup): dentro de cada mês, blocos
// fixos de 7 dias a partir do dia 1 — 01–07, 08–14, 15–21, 22–28, 29–fim. As
// bordas são recortadas pelo horizonte exibido (a série começa amanhã), então a
// 1ª e a última semana podem ser parciais; o período impresso mostra os dias reais.
// Entradas/Saídas são a soma das MESMAS linhas verde/vermelha — nenhuma reconsulta,
// nenhum segundo cálculo.
//
// SITUAÇÃO — determinística, nesta ordem de precedência:
//   1. "Melhor semana" — única semana com o maior resultado, e resultado > 0;
//   2. "Maior saída"   — única semana com o maior total de saídas, e saídas > 0;
//   3. resultado < 0 → "Déficit"; resultado > 0 → "Positivo"; resultado = 0 → "Neutra".
// 1 e 2 exigem 2+ semanas e empate zero (máximo estrito): sem isso o rótulo seria
// arbitrário. A cor do pill segue SEMPRE o sinal do resultado.
const rdpSemanas=rows=>{
  const grupos=[],idx={};
  (rows||[]).forEach(r=>{
    if(!projDataValida(r.data))return;
    const bloco=Math.min(5,Math.ceil(Number(r.data.slice(8,10))/7));
    const chave=`${r.data.slice(0,7)}-${bloco}`;
    if(idx[chave]===undefined){idx[chave]=grupos.length;grupos.push({ini:r.data,fim:r.data,entradas:0,saidas:0});}
    const g=grupos[idx[chave]];
    if(r.data<g.ini)g.ini=r.data;
    if(r.data>g.fim)g.fim=r.data;
    g.entradas+=projNum(r.entradas);
    g.saidas+=projNum(r.saidas);
  });
  const linhas=grupos.map((g,i)=>({
    n:i+1,ini:g.ini,fim:g.fim,
    entradas:projCents(g.entradas),saidas:projCents(g.saidas),
    resultado:projCents(g.entradas-g.saidas),
  }));
  if(!linhas.length)return[];
  const maxRes=Math.max(...linhas.map(l=>l.resultado));
  const maxSai=Math.max(...linhas.map(l=>l.saidas));
  const melhorUnico=linhas.filter(l=>l.resultado===maxRes).length===1;
  const saidaUnica=linhas.filter(l=>l.saidas===maxSai).length===1;
  return linhas.map(l=>{
    let situacao;
    if(linhas.length>1&&melhorUnico&&l.resultado===maxRes&&l.resultado>0)situacao='Melhor semana';
    else if(linhas.length>1&&saidaUnica&&l.saidas===maxSai&&l.saidas>0)situacao='Maior saída';
    else situacao=l.resultado<0?'Déficit':(l.resultado>0?'Positivo':'Neutra');
    return{...l,situacao,cls:l.resultado<0?'neg':(l.resultado>0?'pos':'zero')};
  });
};

// Título do Resumo semanal a partir do período REAL exibido ("agosto 2026",
// "agosto–setembro 2026", "dezembro 2026–janeiro 2027").
const rdpTituloPeriodo=rows=>{
  if(!rows||!rows.length)return '';
  const a=rows[0].data,b=rows[rows.length-1].data;
  const ma=(MONTHS[Number(a.slice(5,7))-1]||'').toLowerCase(),mb=(MONTHS[Number(b.slice(5,7))-1]||'').toLowerCase();
  const ya=a.slice(0,4),yb=b.slice(0,4);
  if(ya===yb)return ma===mb?`${ma} ${ya}`:`${ma}–${mb} ${ya}`;
  return `${ma} ${ya}–${mb} ${yb}`;
};
