// ══════════════════════════════════════════════════════════════════════════
// IMPORTAR ENTRADAS (.xlsx) — modal em 4 etapas: arquivo → regras → prévia → resultado.
// Reaproveita a linguagem visual do importador de Contas (.imp-*); a lógica financeira e a
// persistência são próprias de `entradas`. NUNCA usa saveS: insere apenas as linhas novas.
// ══════════════════════════════════════════════════════════════════════════
function ImportEntradasModal({onClose,entradasExistentes,empresaId,onImportado}){
  const[etapa,setEtapa]=useState('arquivo'); // arquivo|regras|previa|resultado
  const[nomeArq,setNomeArq]=useState('');
  const[erro,setErro]=useState('');
  const[lendo,setLendo]=useState(false);
  const[parse,setParse]=useState(null);
  const[prazosSel,setPrazosSel]=useState({...ENT_IMP_PADRAO});
  const[enviando,setEnviando]=useState(false);
  const[resultado,setResultado]=useState(null);
  const[dragging,setDragging]=useState(false);
  const inputRef=useRef(null);
  const envioLock=useRef(false);

  const datasExistentes=React.useMemo(()=>(entradasExistentes||[]).map(e=>e.data),[entradasExistentes]);
  const resumo=React.useMemo(()=>parse?entImpResumo(parse):null,[parse]);

  const lerArquivo=async file=>{
    setErro('');setParse(null);setNomeArq(file?file.name:'');
    if(!file)return;
    if(!/\.xlsx$/i.test(file.name)){setErro('Somente arquivos .xlsx são aceitos nesta versão.');return;}
    if(typeof XLSX==='undefined'){setErro('O leitor de planilhas não carregou. Verifique a conexão e recarregue a página.');return;}
    setLendo(true);
    try{
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:'array'});
      if(!wb||!wb.SheetNames||!wb.SheetNames.length){setErro('Não foi possível ler a planilha.');return;}
      const nomeAba=wb.SheetNames.find(n=>entImpNorm(n)===entImpNorm(ENT_IMP_ABA));
      if(!nomeAba){setErro(`A planilha não tem a aba "${ENT_IMP_ABA}". Abas encontradas: ${wb.SheetNames.join(', ')}.`);return;}
      const aoa=XLSX.utils.sheet_to_json(wb.Sheets[nomeAba],{header:1,raw:true,defval:null});
      const p=entImpParse(aoa,datasExistentes);
      if(p.erroFatal){setErro(p.erroFatal);return;}
      if(!p.linhas.length){setErro('A aba não tem nenhuma linha de dados.');return;}
      setParse(p);setEtapa('regras');
    }catch(err){
      console.error('Erro ao ler a planilha de entradas:',err);
      setErro('Arquivo inválido ou corrompido. Confirme que é um .xlsx gerado pelo Excel.');
    }finally{setLendo(false);}
  };

  const confirmar=async()=>{
    if(envioLock.current)return;
    if(!resumo||!resumo.validas.length)return;
    if(!empresaId){setErro('Não foi possível identificar a unidade ativa.');return;}
    envioLock.current=true;setEnviando(true);setErro('');
    try{
      const novas=resumo.validas.map(l=>entImpParaEntrada(l,prazosSel));
      const inseridas=await insertEntradasBatch(novas,empresaId);
      // Contagem pelo que o BANCO confirmou, não pelo que foi enviado: se o índice único
      // ignorou alguma data, ela não entra no total nem no número de importadas.
      const datasOk=new Set((inseridas||[]).map(r=>r.data));
      const totalOk=Math.round(novas.filter(e=>datasOk.has(e.data)).reduce((s,e)=>s+e.total,0)*100)/100;
      // Recarga REAL antes de mostrar o resultado — o state local não pode ficar defasado.
      if(onImportado)await onImportado();
      setResultado({importadas:datasOk.size,ignoradasBanco:novas.length-datasOk.size,
        existentes:resumo.existentes.length,invalidas:resumo.invalidas.length,
        total:totalOk,lidas:parse.linhas.length});
      setEtapa('resultado');
    }catch(err){
      console.error('Erro ao importar entradas:',err);
      const msg=String((err&&(err.message||err.details))||'');
      if(/row-level security|permission denied/i.test(msg)){
        setErro('Seu acesso não permite gravar entradas nesta unidade.');
      }else if(/duplicate key|23505/i.test(msg)){
        setErro('Alguma data deste arquivo já foi cadastrada enquanto a importação era preparada. Feche e refaça a importação.');
      }else{
        setErro('Não foi possível concluir a importação. Nenhuma entrada foi gravada.');
      }
    }finally{setEnviando(false);envioLock.current=false;}
  };

  const rotuloPrazo=d=>`D+${d}`;
  const titulo=etapa==='resultado'?'Importação concluída':'Importar Entradas (Excel)';

  return(
    <Modal title={titulo} onClose={enviando?()=>{}:onClose}>
      {erro&&<div className="alert alert-r" style={{marginBottom:12}}>{erro}</div>}

      {etapa==='arquivo'&&(<>
        <div className={`imp-drop${dragging?' drag':''}`}
          onClick={()=>inputRef.current&&inputRef.current.click()}
          onDragOver={e=>{e.preventDefault();setDragging(true);}}
          onDragLeave={()=>setDragging(false)}
          onDrop={e=>{e.preventDefault();setDragging(false);lerArquivo(e.dataTransfer.files&&e.dataTransfer.files[0]);}}>
          <div className="imp-drop-icon">📊</div>
          <div className="imp-drop-text">{lendo?'Lendo a planilha…':'Clique ou arraste a planilha .xlsx aqui'}</div>
          <div className="imp-drop-sub">Aba “{ENT_IMP_ABA}” · colunas {ENT_IMP_COLS.join(' · ')}</div>
        </div>
        <input ref={inputRef} type="file" accept=".xlsx" style={{display:'none'}}
          onChange={e=>{lerArquivo(e.target.files&&e.target.files[0]);e.target.value='';}}/>
      </>)}

      {etapa==='regras'&&resumo&&(<>
        <div className="imp-preview">
          <div className="imp-preview-title">Regras de recebimento</div>
          <p style={{fontSize:11.5,color:'var(--text-muted)',lineHeight:1.5,margin:'0 0 10px'}}>
            Estes prazos ficam gravados <strong>nesta importação</strong> e não mudam se a
            configuração padrão for alterada depois. Não representam antecipação.
          </p>
          <div className="impent-prazos">
            {[['debito','Débito'],['credito','Crédito'],['voucher','Voucher'],['pix','PIX']].map(([k,lbl])=>(
              <label key={k} className="impent-prazo">
                <span>{lbl}</span>
                <select value={prazosSel[k]} disabled={ENT_IMP_PRAZOS[k].length<2}
                  onChange={e=>setPrazosSel({...prazosSel,[k]:parseInt(e.target.value,10)})}>
                  {ENT_IMP_PRAZOS[k].map(d=><option key={d} value={d}>{rotuloPrazo(d)}</option>)}
                </select>
              </label>
            ))}
          </div>
        </div>
        <div style={{marginTop:12,display:'flex',gap:8,justifyContent:'flex-end'}}>
          <button className="btn btn-secondary" onClick={()=>{setEtapa('arquivo');setParse(null);}}>Voltar</button>
          <button className="btn btn-primary" onClick={()=>setEtapa('previa')}>Ver prévia</button>
        </div>
      </>)}

      {etapa==='previa'&&resumo&&(<>
        <div className="imp-preview">
          <div className="imp-preview-title">Prévia da importação · {nomeArq}</div>
          <div className="imp-stat"><span className="imp-stat-label">📄 Linhas lidas</span><span className="imp-stat-val">{parse.linhas.length}</span></div>
          <div className="imp-stat"><span className="imp-stat-label">✅ Entradas a importar</span><span className="imp-stat-val green">{resumo.validas.length}</span></div>
          <div className="imp-stat"><span className="imp-stat-label">↩️ Já existentes (ignoradas)</span><span className="imp-stat-val amber">{resumo.existentes.length}</span></div>
          <div className="imp-stat"><span className="imp-stat-label">❌ Inválidas</span><span className="imp-stat-val red">{resumo.invalidas.length}</span></div>
          <div className="imp-stat"><span className="imp-stat-label">📅 Período</span><span className="imp-stat-val">{resumo.de?`${fmtDate(resumo.de)} a ${fmtDate(resumo.ate)}`:'—'}</span></div>
        </div>
        <div className="imp-preview">
          <div className="imp-preview-title">Valores a importar</div>
          <div className="imp-seg-row"><span>Débito <strong>{rotuloPrazo(prazosSel.debito)}</strong></span><strong>{fmt(resumo.debito)}</strong></div>
          <div className="imp-seg-row"><span>Crédito <strong>{rotuloPrazo(prazosSel.credito)}</strong></span><strong>{fmt(resumo.credito)}</strong></div>
          <div className="imp-seg-row"><span>Voucher <strong>{rotuloPrazo(prazosSel.voucher)}</strong></span><strong>{fmt(resumo.voucher)}</strong></div>
          <div className="imp-seg-row"><span>PIX <strong>{rotuloPrazo(prazosSel.pix)}</strong></span><strong>{fmt(resumo.pix)}</strong></div>
          <div className="imp-stat" style={{marginTop:6}}><span className="imp-stat-label">Total</span><span className="imp-stat-val green">{fmt(resumo.total)}</span></div>
          {parse.totalGeral&&(
            <div className="imp-seg-row" style={{marginTop:4}}>
              <span>TOTAL GERAL da planilha (conferência, não importado)</span>
              <strong>{fmt(parse.totalGeral.total)}</strong>
            </div>
          )}
        </div>
        {(resumo.invalidas.length>0||resumo.existentes.length>0)&&(
          <div className="imp-preview">
            <div className="imp-preview-title">Linhas não importadas</div>
            <div className="imp-err-list">
              {resumo.existentes.map(l=>(
                <div className="imp-err-item" key={'e'+l.linha} style={{color:'var(--amber-dim)'}}>
                  Linha {l.linha} · {fmtDate(l.data)} — já existe no sistema
                </div>
              ))}
              {resumo.invalidas.map(l=>(
                <div className="imp-err-item" key={'i'+l.linha}>
                  Linha {l.linha}{l.data?` · ${fmtDate(l.data)}`:''} — {l.motivo}
                </div>
              ))}
            </div>
          </div>
        )}
        <div style={{marginTop:12,display:'flex',gap:8,justifyContent:'flex-end'}}>
          <button className="btn btn-secondary" onClick={()=>setEtapa('regras')} disabled={enviando}>Voltar</button>
          <button className="btn btn-primary" onClick={confirmar} disabled={enviando||resumo.validas.length===0}>
            {enviando?'Importando…':`Importar ${resumo.validas.length} entrada${resumo.validas.length===1?'':'s'}`}
          </button>
        </div>
      </>)}

      {etapa==='resultado'&&resultado&&(<>
        <div className="imp-success-banner">
          {resultado.importadas} entrada{resultado.importadas===1?'':'s'} importada{resultado.importadas===1?'':'s'} com sucesso.
        </div>
        <div className="imp-preview">
          <div className="imp-stat"><span className="imp-stat-label">📄 Linhas encontradas</span><span className="imp-stat-val">{resultado.lidas}</span></div>
          <div className="imp-stat"><span className="imp-stat-label">✅ Importadas</span><span className="imp-stat-val green">{resultado.importadas}</span></div>
          <div className="imp-stat"><span className="imp-stat-label">↩️ Já existentes</span><span className="imp-stat-val amber">{resultado.existentes}</span></div>
          {resultado.ignoradasBanco>0&&(
            <div className="imp-stat"><span className="imp-stat-label">🛡️ Ignoradas pela trava de data</span><span className="imp-stat-val amber">{resultado.ignoradasBanco}</span></div>
          )}
          <div className="imp-stat"><span className="imp-stat-label">❌ Inválidas</span><span className="imp-stat-val red">{resultado.invalidas}</span></div>
          <div className="imp-stat"><span className="imp-stat-label">💰 Total importado</span><span className="imp-stat-val green">{fmt(resultado.total)}</span></div>
        </div>
        <div style={{marginTop:12,display:'flex',justifyContent:'flex-end'}}>
          <button className="btn btn-primary" onClick={onClose}>Concluir</button>
        </div>
      </>)}
    </Modal>
  );
}

function Entradas({entradas,setEntradas,onRecarregarEntradas,contas,dividas,selectedYear,selectedMonth}){
  const now=new Date();
  const selYear=selectedYear;
  const selMonth=selectedMonth;
  const[showForm,setShowForm]=useState(false);
  const[editId,setEditId]=useState(null);
  const[showConfig,setShowConfig]=useState(false);
  const[prazos,setPrazos_]=useState(()=>loadLocalS('zanon_prazos')||DEFAULT_PRAZOS);
  const setPrazos=p=>{setPrazos_(p);saveLocalS('zanon_prazos',p);};
  const emptyForm={data:today(),dinheiro:'',pix:'',debito:'',credito:'',voucher:'',outros:'',obs:'',voucherAntecipado:'nao',voucherDataReceb:'',creditoAntecipado:'nao',creditoDataReceb:''};
  const[form,setForm]=useState(emptyForm);
  const chartDayRef=useRef(null);
  const totalF=f=>['dinheiro','pix','debito','credito','voucher','outros'].reduce((s,k)=>s+parseNum(f[k]),0);
  const todayStr=today();
  const[showImportEnt,setShowImportEnt]=useState(false);

  // ── Filtro mensal: todas as entradas usadas nesta aba são as do mês/ano selecionado ──
  const mStart=monthStart(selYear,selMonth);
  const mEnd=monthEnd(selYear,selMonth);
  const entradasDoMes=entradas.filter(e=>e.data>=mStart&&e.data<=mEnd);

  const openForm=(e=null)=>{
    if(e){setForm({...e,dinheiro:e.dinheiro.toString(),pix:e.pix.toString(),debito:e.debito.toString(),credito:e.credito.toString(),voucher:e.voucher.toString(),outros:e.outros.toString(),voucherAntecipado:e.voucherAntecipado||'nao',voucherDataReceb:e.voucherDataReceb||'',creditoAntecipado:e.creditoAntecipado||'nao',creditoDataReceb:e.creditoDataReceb||''});setEditId(e.id);}
    else{setForm(emptyForm);setEditId(null);}
    setShowForm(true);
  };

  const save_=()=>{
    const t=totalF(form);if(!form.data||t===0)return alert('Informe a data e pelo menos um valor.');
    const creditoVal=parseNum(form.credito);
    if(creditoVal>0&&form.creditoAntecipado==='sim'&&!form.creditoDataReceb)return alert('Informe a data de recebimento do crédito antecipado.');
    // Crédito zero não guarda configuração de antecipação (evita metadado órfão).
    const creditoAnt=creditoVal>0?(form.creditoAntecipado||'nao'):'nao';
    // ── TRAVA DE DATA ÚNICA POR UNIDADE ──
    // Detectada ANTES de qualquer gravação. `setEntradas` chama saveS, que faz DELETE de todas
    // as linhas da empresa e depois INSERT do array: se o array tiver duas Entradas na mesma
    // data, o INSERT falha DEPOIS do DELETE e o histórico se perde. Na edição a substituição é
    // por id e não checava data, então mudar um lançamento para uma data já ocupada produzia
    // exatamente esse array inválido. A própria Entrada editada é ignorada na comparação.
    const conflitoData=entradas.find(e=>e.data===form.data&&e.id!==editId);
    if(conflitoData){
      return alert(`Já existe um lançamento de entradas em ${fmtDate(form.data)}.\n\nCada unidade admite um único consolidado por data. Edite o lançamento existente em vez de criar outro para a mesma data.`);
    }
    const entry={...form,id:editId||genId(),dinheiro:parseNum(form.dinheiro),pix:parseNum(form.pix),debito:parseNum(form.debito),credito:creditoVal,voucher:parseNum(form.voucher),outros:parseNum(form.outros),total:t,voucherAntecipado:form.voucherAntecipado||'nao',voucherDataReceb:form.voucherDataReceb||'',creditoAntecipado:creditoAnt,creditoDataReceb:creditoAnt==='sim'?(form.creditoDataReceb||''):''};
    const updated=editId?entradas.map(e=>e.id===editId?entry:e):[...entradas.filter(e=>e.data!==form.data||editId),entry];
    setEntradas(updated.sort((a,b)=>a.data.localeCompare(b.data)));
    setForm(emptyForm);setEditId(null);setShowForm(false);
  };
  const remove=id=>{if(confirm('Remover?'))setEntradas(entradas.filter(e=>e.id!==id));};

  const totalMes=entradasDoMes.reduce((s,e)=>s+e.total,0);
  const dias=new Set(entradasDoMes.map(e=>e.data)).size;
  const media=dias>0?totalMes/dias:0;
  // Média diária por dias CORRIDOS — mesma régua do Painel do Dono
  const totalDiasMesEnt=daysInMonth(selYear,selMonth);
  const isMesAtualEnt=now.getFullYear()===selYear&&now.getMonth()===selMonth;
  const diasCorridosBaseEnt=isMesAtualEnt?now.getDate():totalDiasMesEnt;
  const mediaDiariaEnt=(totalMes>0&&diasCorridosBaseEnt>0)?totalMes/diasCorridosBaseEnt:0;
  const melhor=entradasDoMes.length?entradasDoMes.reduce((m,e)=>e.total>m.total?e:m):null;
  const pior=entradasDoMes.length?entradasDoMes.reduce((m,e)=>e.total<m.total?e:m):null;
  const sorted=[...entradasDoMes].sort((a,b)=>b.data.localeCompare(a.data));

  // ── Lógica de disponibilidade de caixa ──
  // Mesma precedência de projDataRecebimento (antecipação › prazo congelado na Entrada ›
  // prazo global), via o MESMO helper projPrazoEntrada — nenhuma segunda regra. Sem isto, uma
  // Entrada importada com prazo próprio apareceria aqui numa data e na Projeção em outra.
  const calcRecebimento=(entry,forma)=>{
    if(forma==='voucher'){
      if(entry.voucherAntecipado==='sim'&&entry.voucherDataReceb) return entry.voucherDataReceb;
      return addDays(entry.data,projPrazoEntrada(entry,'voucher',prazos));
    }
    // Crédito antecipado: a data informada substitui o prazo. Mesma regra do voucher.
    if(forma==='credito'){
      if(entry.creditoAntecipado==='sim'&&entry.creditoDataReceb) return entry.creditoDataReceb;
      return addDays(entry.data,projPrazoEntrada(entry,'credito',prazos));
    }
    return addDays(entry.data,projPrazoEntrada(entry,forma,prazos));
  };

  const FORMAS=[
    {key:'dinheiro',label:'Dinheiro',color:'#16a34a'},
    {key:'pix',label:'PIX',color:'#2563eb'},
    {key:'debito',label:'Débito',color:'#7c3aed'},
    {key:'credito',label:'Crédito',color:'#d97706'},
    {key:'voucher',label:'Voucher',color:'#e11d48'},
    {key:'outros',label:'Outros',color:'#64748b'},
  ];

  const disponibilidade=FORMAS.map(f=>{
    const vendido=entradasDoMes.reduce((s,e)=>s+(e[f.key]||0),0);
    let disponivel=0,aReceber=0;
    entradasDoMes.forEach(e=>{
      const v=e[f.key]||0;if(!v)return;
      const dtReceb=calcRecebimento(e,f.key);
      if(dtReceb<=todayStr)disponivel+=v;else aReceber+=v;
    });
    const prazoLabel=f.key==='dinheiro'||f.key==='pix'?'D+0':f.key==='debito'?'D+1':f.key==='credito'?`D+${prazos.credito}`:f.key==='voucher'?`D+${prazos.voucher}`:`D+${prazos.outros}`;
    return{...f,vendido,disponivel,aReceber,prazoLabel};
  });

  const totalDisponivelBruto=disponibilidade.reduce((s,f)=>s+f.disponivel,0);
  const totalAReceber=disponibilidade.reduce((s,f)=>s+f.aReceber,0);

  // ── Integração com Contas a Pagar (do mês selecionado) ──
  const contasDoMes=(contas||[]).filter(c=>c.vencimento>=mStart&&c.vencimento<=mEnd);
  const contasPagas=contasDoMes.filter(c=>c.status==='Pago'&&c.vencimento<=todayStr);
  const totalPago=contasPagas.reduce((s,c)=>s+c.valor,0);
  const disponivelLiquido=totalDisponivelBruto-totalPago;

  const contasHoje=(contas||[]).filter(c=>c.vencimento===todayStr);

// ── CSV import helpers ──
const parseDateBR=v=>{
  if(!v)return null;
  const s=v.toString().trim();
  // YYYY-MM-DD
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  // DD/MM/YYYY
  if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)){const[d,m,y]=s.split('/');return`${y}-${m}-${d}`;}
  // DD-MM-YYYY
  if(/^\d{2}-\d{2}-\d{4}$/.test(s)){const[d,m,y]=s.split('-');return`${y}-${m}-${d}`;}
  return null;
};

// ── Identidade canônica da despesa (espelho EXATO da função SQL contas_identidade) ──
// Usada SOMENTE para deduplicação dentro do arquivo e pré-checagem/preview no front.
// A autoridade final é o banco (RPC importar_contas + índice único parcial).
// Regras: texto → trim + minúsculas + remove acentos (NFD) + colapsa espaços (mantém pontuação,
// para não fundir nomes legitimamente diferentes); data → 'YYYY-MM-DD'; valor → centavos inteiros.
const normalizeIdentityText=v=>(v==null?'':String(v)).trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ');
const normalizeIdentityDate=v=>parseDateBR(v); // 'YYYY-MM-DD' ou null
const normalizeIdentityAmount=v=>{const n=parseCurrencyBR(v);return Number.isFinite(n)?Math.round(n*100):null;};
// Retorna a chave lógica ou null quando data/valor não são confiáveis (sem identidade estável).
const buildContaIdentityKey=(c,empresaId)=>{
  const d=normalizeIdentityDate(c.vencimento);
  const cents=normalizeIdentityAmount(c.valor);
  if(!d||cents==null)return null;
  return [empresaId||'',d,cents,normalizeIdentityText(c.fornecedor),normalizeIdentityText(c.descricao)].join('|');
};

// Gera CSV modelo para download
const downloadModeloCSV=()=>{
  const headers=['Vencimento','Fornecedor','Descrição','Segmento','Valor','Categoria','Tipo de Despesa','Status','Forma de Pagamento','Conta de Saída','Observação'];
  const ex1=['15/05/2026','Rossi Frigorífico','Boleto Rossi Frigorífico','Açougue','2166,30','Fornecedores','Fornecedor','A vencer','Boleto','Banco principal','Compra semanal'];
  const ex2=['18/05/2026','Segalas','Compra semanal Segalas','Mercearia Seca','1450,00','Fornecedores','Fornecedor','A vencer','Boleto','Banco principal','Compra de reposição'];
  const csv=[headers,ex1,ex2].map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='modelo_importacao_zanon.csv';a.click();URL.revokeObjectURL(url);
};

// Parseia texto CSV respeitando aspas
// Aceita delimitadores , (vírgula) e ; (ponto e vírgula) — detecção automática pelo cabeçalho
const parseCSV=text=>{
  // remove BOM (UTF-8) se presente no início do arquivo
  if(text&&text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2)return[];
  // detecta delimitador a partir do cabeçalho: usa ';' se ele for mais frequente que ',' fora de aspas
  const detectDelim=line=>{
    let semi=0,comma=0,inQ=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){if(inQ&&line[i+1]==='"')i++;else inQ=!inQ;}
      else if(!inQ){if(ch===';')semi++;else if(ch===',')comma++;}
    }
    return semi>comma?';':',';
  };
  const DELIM=detectDelim(lines[0]);
  const parseRow=line=>{
    const cells=[];let cur='';let inQ=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
      else if(ch===DELIM&&!inQ){cells.push(cur.trim());cur='';}
      else cur+=ch;
    }
    cells.push(cur.trim());
    return cells.map(c=>c.replace(/^"|"$/g,'').trim());
  };
  const hdr=parseRow(lines[0]).map(h=>h.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));
  const col=k=>hdr.findIndex(h=>h.includes(k));
  const iVenc=col('vencimento');const iForn=col('fornecedor');const iDesc=col('descri');const iSeg=col('segmento');
  const iVal=col('valor');const iCat=col('categoria');const iTipo=col('tipo');const iSt=col('status');
  const iForma=col('forma');const iConta=col('conta');const iObs=col('obs');
  const rows=[];
  for(let i=1;i<lines.length;i++){
    const cells=parseRow(lines[i]);
    if(cells.every(c=>!c))continue;
    rows.push({
      vencimento:iVenc>=0?cells[iVenc]||'':'',
      fornecedor:iForn>=0?cells[iForn]||'':'',
      descricao:iDesc>=0?cells[iDesc]||'':'',
      segmento:iSeg>=0?cells[iSeg]||'':'',
      valor:iVal>=0?cells[iVal]||'':'',
      categoria:iCat>=0?cells[iCat]||'':'',
      tipoDespesa:iTipo>=0?cells[iTipo]||'':'',
      status:iSt>=0?cells[iSt]||'':'',
      formaPag:iForma>=0?cells[iForma]||'':'',
      contaSaida:iConta>=0?cells[iConta]||'':'',
      obs:iObs>=0?cells[iObs]||'':'',
      _linha:i+1,
    });
  }
  return rows;
};

// Deduplicação em camadas (front) — a AUTORIDADE FINAL é o banco (RPC importar_contas):
//  • invalidas             → falha de validação de campos
//  • duplicadasNoArquivo   → mesma identidade repetida DENTRO do próprio arquivo (guarda a 1ª linha)
//  • duplicadasNoBanco     → identidade já existe em contas PERSISTIDAS (não sintéticas)
//  • conflitosSinteticos   → identidade coincide com registro CALCULADO (parcela de dívida / fixa
//                            recorrente) que ainda não está persistido — apenas aviso, não é do banco
//  • validas               → seguem para a RPC decidir de forma atômica
const validarLinhas=(rows,contasPersistidas,contasSinteticas,empresaId)=>{
  const validas=[];const invalidas=[];const duplicadasNoArquivo=[];const duplicadasNoBanco=[];const conflitosSinteticos=[];
  // Índices por identidade canônica (mesma regra usada pela função SQL contas_identidade).
  const persistByKey=new Map();(contasPersistidas||[]).forEach(c=>{const k=buildContaIdentityKey(c,empresaId);if(k&&!persistByKey.has(k))persistByKey.set(k,c);});
  const syntByKey=new Map();(contasSinteticas||[]).forEach(c=>{const k=buildContaIdentityKey(c,empresaId);if(k&&!syntByKey.has(k))syntByKey.set(k,c);});
  const seenNoArquivo=new Map(); // key → _linha da 1ª ocorrência
  rows.forEach(r=>{
    const erros=[];
    const venc=parseDateBR(r.vencimento);
    if(!r.vencimento)erros.push('vencimento vazio');
    else if(!venc)erros.push('data inválida');
    if(!r.fornecedor)erros.push('fornecedor vazio');
    if(!r.descricao)erros.push('descrição vazia');
    const exigeSegmento=!r.tipoDespesa||r.tipoDespesa==='Fornecedor';
    if(exigeSegmento){
      if(!r.segmento)erros.push('segmento vazio');
      else if(!SEGMENTOS.includes(r.segmento))erros.push(`segmento inválido: "${r.segmento}"`);
    }else if(r.segmento&&!SEGMENTOS.includes(r.segmento)){
      erros.push(`segmento inválido: "${r.segmento}"`);
    }
    const val=parseCurrencyBR(r.valor);
    if(!r.valor)erros.push('valor vazio');
    else if(isNaN(val)||val<=0)erros.push('valor inválido ou zero');
    if(erros.length>0){invalidas.push({...r,erros});return;}
    const norm={...r,vencimento:venc,valor:val};
    const key=buildContaIdentityKey(norm,empresaId);
    // 1) Duplicidade DENTRO do arquivo (só a primeira ocorrência é candidata)
    if(key&&seenNoArquivo.has(key)){
      duplicadasNoArquivo.push({...norm,_motivo:`Duplicada dentro do arquivo: mesma identidade da linha ${seenNoArquivo.get(key)}.`,_primeiraLinha:seenNoArquivo.get(key)});
      return;
    }
    // 2) Duplicidade contra contas PERSISTIDAS (banco)
    if(key&&persistByKey.has(key)){
      const ex=persistByKey.get(key);
      duplicadasNoBanco.push({...norm,_motivo:'Já existe no banco (mesma identidade financeira).',_existenteId:ex.id,_existenteStatus:ex.status||''});
      return;
    }
    // 3) Conflito com registro SINTÉTICO (recorrência/dívida calculada, não persistida) — apenas aviso
    if(key&&syntByKey.has(key)){
      const ex=syntByKey.get(key);
      conflitosSinteticos.push({...norm,_motivo:'Coincide com despesa recorrente/parcela calculada pelo sistema (não persistida).',_existenteDescricao:ex.descricao||''});
      return;
    }
    if(key)seenNoArquivo.set(key,r._linha);
    validas.push({...norm,
      categoria:r.categoria||'Fornecedores',
      tipoDespesa:r.tipoDespesa||'Fornecedor',
      status:r.status||'A vencer',
      formaPag:r.formaPag||'Boleto',
      contaSaida:r.contaSaida||'Banco principal',
      obs:r.obs||'',
    });
  });
  return{validas,invalidas,duplicadasNoArquivo,duplicadasNoBanco,conflitosSinteticos};
};

// ── MODAL DE IMPORTAÇÃO ──
function ImportModal({onClose,onConfirm,contasPersistidas,contasSinteticas,empresaId}){
  const[step,setStep]=useState('upload');// upload | preview | done
  const[dragging,setDragging]=useState(false);
  const[preview,setPreview]=useState(null);
  const[resultado,setResultado]=useState(null);
  const[processando,setProcessando]=useState(false);// bloqueia clique duplo durante a RPC
  const[erroEnvio,setErroEnvio]=useState('');
  const fileRef=useRef(null);

  const processFile=file=>{
    if(!file)return;
    const name=file.name.toLowerCase();
    if(!name.endsWith('.csv')&&!name.endsWith('.txt'))return alert('Por enquanto, apenas arquivos CSV são suportados.');
    const reader=new FileReader();
    reader.onload=e=>{
      const text=e.target.result;
      const rows=parseCSV(text);
      if(rows.length===0)return alert('O arquivo parece estar vazio ou no formato incorreto.');
      const{validas,invalidas,duplicadasNoArquivo,duplicadasNoBanco,conflitosSinteticos}=validarLinhas(rows,contasPersistidas,contasSinteticas,empresaId);
      const totalValor=validas.reduce((s,r)=>s+r.valor,0);
      const datas=validas.map(r=>r.vencimento).sort();
      const porSeg={};
      validas.forEach(r=>{if(r.segmento){porSeg[r.segmento]=(porSeg[r.segmento]||0)+r.valor;}});
      setErroEnvio('');
      setPreview({validas,invalidas,duplicadasNoArquivo,duplicadasNoBanco,conflitosSinteticos,totalLido:rows.length,totalValor,dataMin:datas[0]||null,dataMax:datas[datas.length-1]||null,porSeg});
      setStep('preview');
    };
    reader.readAsText(file,'UTF-8');
  };

  const onDrop=e=>{e.preventDefault();setDragging(false);const f=e.dataTransfer.files[0];if(f)processFile(f);};
  const onFileChange=e=>{const f=e.target.files[0];if(f)processFile(f);};

  // Envio ASSÍNCRONO: a RPC do banco é a autoridade final. O passo 'done' só aparece após a
  // resposta real. Clique duplo é bloqueado por `processando`. Em erro, o modal permanece aberto.
  const confirmar=async()=>{
    if(processando||!preview||preview.validas.length===0)return;
    const novos=preview.validas.map(r=>({
      id:genId(),
      linha:r._linha,
      vencimento:r.vencimento,
      fornecedor:r.fornecedor,
      descricao:r.descricao,
      segmento:r.segmento,
      categoria:r.categoria,
      tipoDespesa:r.tipoDespesa,
      valor:r.valor,
      status:r.status,
      formaPag:r.formaPag,
      contaSaida:r.contaSaida,
      obs:r.obs,
    }));
    setProcessando(true);setErroEnvio('');
    try{
      // onConfirm devolve o relatório real do banco: {inseridos, duplicados, erros}
      const rep=await onConfirm(novos);
      const inseridos=(rep&&rep.inseridos)||[];
      const dupBanco=(rep&&rep.duplicados)||[];
      const errBanco=(rep&&rep.erros)||[];
      setResultado({
        totalLido:preview.totalLido,
        enviados:novos.length,
        inseridos:inseridos.length,
        duplicadosNoArquivo:preview.duplicadasNoArquivo.length,
        duplicadosNoBanco:preview.duplicadasNoBanco.length+dupBanco.length,
        conflitosSinteticos:preview.conflitosSinteticos.length,
        invalidos:preview.invalidas.length,
        rejeitadosPeloBanco:dupBanco.length+errBanco.length,
        rejeicoesBanco:[...dupBanco,...errBanco],
      });
      setStep('done');
    }catch(err){
      const msg=String(err&&(err.message||err.details||err.hint)||'');
      // Função ausente no Supabase (RPC ainda não instalada) → 42883 / "could not find function"
      if(/42883|could not find function|function .*importar_contas.* does not exist|schema cache/i.test(msg)){
        setErroEnvio('A estrutura de importação segura ainda não foi instalada no Supabase. Aplique o SQL da RPC "importar_contas" antes de usar o importador.');
      }else{
        setErroEnvio('Falha ao importar: '+(msg||'erro desconhecido')+'. Nenhum registro foi inserido.');
      }
    }finally{
      setProcessando(false);
    }
  };

  return(
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{maxWidth:600}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
          <div>
            <div style={{fontSize:15,fontWeight:700}}>📥 Importar Boletos / Fornecedores</div>
            {step==='preview'&&<div style={{fontSize:11,color:'var(--text-muted)',marginTop:2}}>Confira a prévia antes de confirmar</div>}
          </div>
          <button className="btn btn-secondary btn-sm" onClick={onClose}>✕ Fechar</button>
        </div>

        {step==='upload'&&(
          <>
            <div
              className={`imp-drop${dragging?' drag':''}`}
              onDragOver={e=>{e.preventDefault();setDragging(true);}}
              onDragLeave={()=>setDragging(false)}
              onDrop={onDrop}
              onClick={()=>fileRef.current.click()}
            >
              <div className="imp-drop-icon">📂</div>
              <div className="imp-drop-text">Clique ou arraste um arquivo CSV aqui</div>
              <div className="imp-drop-sub">Somente arquivos .csv são aceitos nesta versão</div>
              <input ref={fileRef} type="file" accept=".csv,.txt" style={{display:'none'}} onChange={onFileChange}/>
            </div>

            <div style={{marginTop:14,padding:'10px 12px',background:'var(--blue-light)',border:'1px solid var(--blue)',borderRadius:'var(--radius-xs)',fontSize:12,color:'var(--blue-dim)'}}>
              <strong>Colunas obrigatórias:</strong> Vencimento, Fornecedor, Descrição, Segmento, Valor<br/>
              <span style={{color:'var(--text-muted)',marginTop:3,display:'block'}}>Descrição = nome do lançamento no sistema. Ex: Boleto Rossi Frigorífico, Compra semanal Segalas, Boleto Atacadão.</span>
            </div>

            <div style={{marginTop:10,padding:'8px 12px',background:'var(--ink-50)',border:'1px solid var(--border)',borderRadius:'var(--radius-xs)',fontSize:11,color:'var(--text-muted)'}}>
              <strong>Segmentos aceitos:</strong> {SEGMENTOS.join(' · ')}
            </div>

            <div style={{marginTop:12,display:'flex',gap:8,justifyContent:'space-between',alignItems:'center'}}>
              <button className="btn btn-secondary" style={{fontSize:12}} onClick={downloadModeloCSV}>⬇ Baixar modelo CSV</button>
              <button className="btn btn-secondary" onClick={onClose}>Cancelar</button>
            </div>
          </>
        )}

        {step==='preview'&&preview&&(
          <>
            <div className="imp-preview">
              <div className="imp-preview-title">Prévia da Importação</div>
              <div className="imp-stat"><span className="imp-stat-label">📄 Total lido</span><span className="imp-stat-val">{preview.totalLido}</span></div>
              <div className="imp-stat"><span className="imp-stat-label">✅ Válidos para envio</span><span className="imp-stat-val green">{preview.validas.length}</span></div>
              <div className="imp-stat"><span className="imp-stat-label">❌ Linhas com erro</span><span className="imp-stat-val red">{preview.invalidas.length}</span></div>
              {preview.duplicadasNoArquivo.length>0&&<div className="imp-stat"><span className="imp-stat-label">🔁 Duplicados no arquivo</span><span className="imp-stat-val amber">{preview.duplicadasNoArquivo.length}</span></div>}
              {preview.duplicadasNoBanco.length>0&&<div className="imp-stat"><span className="imp-stat-label">🏦 Duplicados já no banco</span><span className="imp-stat-val amber">{preview.duplicadasNoBanco.length}</span></div>}
              {preview.conflitosSinteticos.length>0&&<div className="imp-stat"><span className="imp-stat-label">🧮 Conflito c/ recorrência calculada</span><span className="imp-stat-val amber">{preview.conflitosSinteticos.length}</span></div>}
              <div className="imp-stat"><span className="imp-stat-label">💰 Total a importar</span><span className="imp-stat-val">{fmtFull(preview.totalValor)}</span></div>
              {preview.dataMin&&<div className="imp-stat"><span className="imp-stat-label">📅 Período</span><span className="imp-stat-val">{fmtDate(preview.dataMin)} a {fmtDate(preview.dataMax)}</span></div>}
            </div>

            {Object.keys(preview.porSeg).length>0&&(
              <div style={{marginTop:8,padding:'10px 14px',background:'var(--surface-2)',border:'1px solid var(--border)',borderRadius:'var(--radius-xs)'}}>
                <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',color:'var(--text-muted)',marginBottom:7}}>Resumo por Segmento</div>
                {Object.entries(preview.porSeg).sort((a,b)=>b[1]-a[1]).map(([seg,val])=>(
                  <div key={seg} className="imp-seg-row"><strong>{seg}</strong><span>{fmtFull(val)}</span></div>
                ))}
              </div>
            )}

            {preview.invalidas.length>0&&(
              <div style={{marginTop:8,padding:'10px 14px',background:'var(--red-light)',border:'1px solid #fca5a5',borderRadius:'var(--radius-xs)'}}>
                <div style={{fontSize:11,fontWeight:700,color:'var(--red-dim)',marginBottom:5}}>Linhas com erro (não serão importadas):</div>
                <div className="imp-err-list">
                  {preview.invalidas.map((r,i)=>(
                    <div key={i} className="imp-err-item">Linha {r._linha}: {r.erros.join('; ')}</div>
                  ))}
                </div>
              </div>
            )}

            {(preview.duplicadasNoArquivo.length>0||preview.duplicadasNoBanco.length>0||preview.conflitosSinteticos.length>0)&&(
              <details style={{marginTop:8}}>
                <summary style={{fontSize:12,fontWeight:700,color:'var(--amber-dim)',cursor:'pointer'}}>Ver duplicidades e conflitos ({preview.duplicadasNoArquivo.length+preview.duplicadasNoBanco.length+preview.conflitosSinteticos.length})</summary>
                <div style={{marginTop:6,padding:'10px 14px',background:'var(--amber-light)',border:'1px solid var(--amber)',borderRadius:'var(--radius-xs)'}}>
                  {[...preview.duplicadasNoArquivo,...preview.duplicadasNoBanco,...preview.conflitosSinteticos].map((r,i)=>(
                    <div key={i} className="imp-err-item" style={{marginBottom:4}}>
                      Linha {r._linha} · {r.descricao} · {r.fornecedor} · {fmtDate(r.vencimento)} · {fmtFull(r.valor)} · {r.tipoDespesa||'—'}<br/>
                      <span style={{color:'var(--amber-dim)'}}>{r._motivo}{r._existenteId?` (ID existente: ${r._existenteId}${r._existenteStatus?', status: '+r._existenteStatus:''})`:''}</span>
                    </div>
                  ))}
                </div>
              </details>
            )}

            {erroEnvio&&<div className="alert alert-r" style={{marginTop:10}}>{erroEnvio}</div>}

            {preview.validas.length===0?(
              <>
                <div style={{marginTop:10,padding:'10px',background:'var(--amber-light)',border:'1px solid var(--amber)',borderRadius:'var(--radius-xs)',fontSize:13,color:'var(--amber-dim)',textAlign:'center'}}>
                  Nenhum boleto válido encontrado para importar.
                </div>
                <div style={{marginTop:8,display:'flex',justifyContent:'flex-end'}}>
                  <button className="btn btn-secondary" onClick={()=>setStep('upload')} disabled={processando}>← Voltar</button>
                </div>
              </>
            ):(
              <div style={{marginTop:12,display:'flex',gap:8,justifyContent:'flex-end'}}>
                <button className="btn btn-secondary" onClick={()=>setStep('upload')} disabled={processando}>← Voltar</button>
                <button className="btn btn-primary" onClick={confirmar} disabled={processando}>{processando?'Enviando ao banco…':`✓ Confirmar importação de ${preview.validas.length} boleto(s)`}</button>
              </div>
            )}
          </>
        )}

        {step==='done'&&resultado&&(
          <>
            <div className="imp-success-banner">✅ Importação concluída: <strong>{resultado.inseridos} registro(s) inserido(s) pelo banco.</strong></div>
            <div className="imp-preview" style={{marginTop:8}}>
              <div className="imp-stat"><span className="imp-stat-label">📄 Total lido</span><span className="imp-stat-val">{resultado.totalLido}</span></div>
              <div className="imp-stat"><span className="imp-stat-label">📤 Enviados ao banco</span><span className="imp-stat-val">{resultado.enviados}</span></div>
              <div className="imp-stat"><span className="imp-stat-label">✅ Importados com sucesso</span><span className="imp-stat-val green">{resultado.inseridos}</span></div>
              {resultado.duplicadosNoArquivo>0&&<div className="imp-stat"><span className="imp-stat-label">🔁 Duplicados no arquivo</span><span className="imp-stat-val amber">{resultado.duplicadosNoArquivo}</span></div>}
              {resultado.duplicadosNoBanco>0&&<div className="imp-stat"><span className="imp-stat-label">🏦 Duplicados já existentes</span><span className="imp-stat-val amber">{resultado.duplicadosNoBanco}</span></div>}
              {resultado.conflitosSinteticos>0&&<div className="imp-stat"><span className="imp-stat-label">🧮 Conflitos c/ recorrência</span><span className="imp-stat-val amber">{resultado.conflitosSinteticos}</span></div>}
              {resultado.invalidos>0&&<div className="imp-stat"><span className="imp-stat-label">❌ Inválidos</span><span className="imp-stat-val red">{resultado.invalidos}</span></div>}
              {resultado.rejeitadosPeloBanco>0&&<div className="imp-stat"><span className="imp-stat-label">🚫 Rejeitados pelo banco</span><span className="imp-stat-val red">{resultado.rejeitadosPeloBanco}</span></div>}
            </div>
            {resultado.rejeicoesBanco&&resultado.rejeicoesBanco.length>0&&(
              <details style={{marginTop:8}}>
                <summary style={{fontSize:12,fontWeight:700,color:'var(--red-dim)',cursor:'pointer'}}>Ver rejeições do banco ({resultado.rejeicoesBanco.length})</summary>
                <div style={{marginTop:6,padding:'10px 14px',background:'var(--red-light)',border:'1px solid #fca5a5',borderRadius:'var(--radius-xs)'}}>
                  {resultado.rejeicoesBanco.map((r,i)=>(
                    <div key={i} className="imp-err-item">Linha {r.linha}: {r.motivo}{r.existente_id?` (ID existente: ${r.existente_id}${r.existente_status?', status: '+r.existente_status:''})`:''}</div>
                  ))}
                </div>
              </details>
            )}
            <div style={{marginTop:12,display:'flex',justifyContent:'flex-end'}}>
              <button className="btn btn-primary" onClick={onClose}>Fechar</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}


function pressaoLabel(p){
  if(!p)return{txt:'—',color:'var(--text-muted)'};
  if(p<0.5)return{txt:'Normal',color:'var(--green)'};
  if(p<1)return{txt:'Atenção',color:'var(--amber)'};
  if(p<2)return{txt:'Alta pressão',color:'var(--amber-dim)'};
  return{txt:'⚠️ Crítico',color:'var(--red)'};
}

function ContaAgendaItem({c,dividas,onPago,onEdit,onRemove}){
  const isVenc=c.vencimento<today()&&c.status!=='Pago';
  const divVinc=c.dividaVinculadaId?(dividas||[]).find(d=>d.id===c.dividaVinculadaId):null;
  const tipoBadge=c.tipoDespesa==='Fixa'?'bg':c.tipoDespesa==='Fornecedor'?'bb':c.tipoDespesa==='Financeira'?'bp':'ba';
  const stBadge=c.status==='Pago'?'bg':isVenc?'br':c.status==='Renegociado'?'ba':'bb';
  return(
    <div style={{display:'flex',alignItems:'flex-start',gap:10,padding:'8px 0',borderBottom:'1px solid var(--border)'}}>
      <div style={{flex:1,minWidth:0}}>
        <div style={{display:'flex',alignItems:'center',gap:5,flexWrap:'wrap'}}>
          <span style={{fontSize:13,fontWeight:600,color:'var(--text-primary)'}}>{c.descricao}</span>
          <span className={`badge ${tipoBadge}`}>{c.tipoDespesa}</span>
          <span className={`badge ${stBadge}`}>{isVenc&&c.status!=='Pago'?'Vencido':c.status}</span>
          {c._autoGerado&&<span style={{fontSize:9,background:'var(--purple-light)',color:'var(--purple)',borderRadius:10,padding:'1px 5px',fontWeight:600}}>AUTO</span>}
          {divVinc&&<span style={{fontSize:11,color:'var(--purple)'}}>🏦 {divVinc.banco}</span>}
        </div>
        {c.categoria&&<div style={{fontSize:11,color:'var(--text-muted)',marginTop:2}}>{c.categoria}{c.formaPag?' · '+c.formaPag:''}{c.contaSaida?' · '+c.contaSaida:''}</div>}
      </div>
      <div style={{display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
        <span style={{fontWeight:700,fontSize:14,color:isVenc?'var(--red)':'var(--text-primary)'}}>{fmtFull(c.valor)}</span>
        {c.status!=='Pago'&&<button className="btn btn-secondary btn-sm" style={{fontSize:11,padding:'3px 8px',color:'var(--green)',borderColor:'var(--green)'}} onClick={()=>onPago(c)}>✓ Pago</button>}
        {podeEditarConta(c)&&<button className="btn btn-secondary btn-sm" style={{fontSize:11,padding:'3px 8px'}} onClick={()=>onEdit(c)}>✏️</button>}
        {podeEditarConta(c)&&<button className="btn btn-danger btn-sm" style={{fontSize:11,padding:'3px 8px'}} onClick={()=>onRemove(c.id)}>✕</button>}
      </div>
    </div>
  );
}

function Contas({contas,setContas,onContaCriar,onContaEditar,onContaExcluir,onContasImportar,contasComParcelas,mediaDiariaEntrada,dividas,setDividas,onDividaEditar,selectedYear,selectedMonth}){
  const now=new Date();
  // Mês/ano vêm do estado GLOBAL (Painel do Dono). Sem useState local nem seletor visual.
  const selYear=selectedYear;
  const selMonth=selectedMonth;
  const[showForm,setShowForm]=useState(false);
  const[editId,setEditId]=useState(null);
  const[filtroStatus,setFiltroStatus]=useState('Todos');
  const[showImport,setShowImport]=useState(false);
  const[contaErro,setContaErro]=useState(null);
  const contaOpLock=useRef(false);
  // Marco de corte quando a edição parte de uma ocorrência FUTURA de despesa fixa.
  // null = edição comum (demais categorias e linha-base da própria fixa) — caminho inalterado.
  const[fixaCorte,setFixaCorte]=useState(null);
  // Categoria (tipoDespesa) selecionada nos chips do cabeçalho da Agenda do Dia — estado único,
  // combinado (não substitui) com filtroStatus, data/mês e afeta toda a aba.
  const[categoriaSelecionada,setCategoriaSelecionada]=useState('Todas');
  // Agenda inicia no dia atual se ele estiver no mês selecionado, senão no 1º dia do mês
  const isMesAtual=now.getFullYear()===selYear&&now.getMonth()===selMonth;
  const dataInicialAgenda=isMesAtual?today():monthStart(selYear,selMonth);
  const[dataAgenda,setDataAgenda]=useState(dataInicialAgenda);
  // Sempre que o mês GLOBAL mudar, realinha a Agenda do Dia para esse mês
  useEffect(()=>{
    const mAtual=now.getFullYear()===selYear&&now.getMonth()===selMonth;
    setDataAgenda(mAtual?today():monthStart(selYear,selMonth));
    // eslint-disable-next-line
  },[selYear,selMonth]);
  const emptyContaForm={vencimento:today(),fornecedor:'',descricao:'',segmento:'',categoria:'Fornecedores',tipoDespesa:'Variável',valor:'',status:'A vencer',formaPag:'',contaSaida:'Banco principal',obs:'',dividaVinculadaId:''};
  const[form,setForm]=useState(emptyContaForm);
  const hoje=today();
  const em7=addDays(hoje,7),em15=addDays(hoje,15);
  // Início e fim do MÊS SELECIONADO (não mais do mês corrente)
  const iniMes=monthStart(selYear,selMonth);
  const fimMes=monthEnd(selYear,selMonth);

  // Universo: SOMENTE contas do mês selecionado (filtro mensal estrito)
  const contasNoMes=contasComParcelas.filter(c=>c.vencimento>=iniMes&&c.vencimento<=fimMes);
  // Filtro de categoria (tipoDespesa) — combinado (não substitui) com o filtro mensal acima.
  // "Todas" não restringe; qualquer outra categoria filtra pelo tipoDespesa normalizado.
  const matchCategoria=c=>categoriaSelecionada==='Todas'||normTipoDespesa(c.tipoDespesa)===categoriaSelecionada;
  const contasNoMesCat=contasNoMes.filter(matchCategoria);

  const pendentes=contasNoMesCat.filter(c=>c.status!=='Pago'&&c.status!=='Renegociado');
  const tHoje=pendentes.filter(c=>c.vencimento===hoje);
  const tHojeTotal=tHoje.reduce((s,c)=>s+c.valor,0);
  const t7tot=pendentes.filter(c=>c.vencimento>hoje&&c.vencimento<=em7).reduce((s,c)=>s+c.valor,0);
  const t15tot=pendentes.filter(c=>c.vencimento>hoje&&c.vencimento<=em15).reduce((s,c)=>s+c.valor,0);
  const tMes=pendentes.filter(c=>c.vencimento<=fimMes).reduce((s,c)=>s+c.valor,0);
  // "Total vencido": só contas vencidas DENTRO do mês selecionado (já considerando a categoria)
  const tvenc=contasNoMesCat.filter(c=>c.vencimento<hoje&&c.status!=='Pago'&&c.status!=='Renegociado').reduce((s,c)=>s+c.valor,0);
  const nVenc=contasNoMesCat.filter(c=>c.vencimento<hoje&&c.status!=='Pago'&&c.status!=='Renegociado').length;

  const pressaoDia=c=>{
    if(mediaDiariaEntrada===0)return null;
    const ds=contasComParcelas.filter(x=>x.vencimento===c.vencimento&&x.status!=='Pago').reduce((s,x)=>s+x.valor,0);
    return ds/mediaDiariaEntrada;
  };

  const abaterDivida=(conta,divIds)=>{
    if(conta.tipoDespesa!=='Financeira'||!conta.dividaVinculadaId)return divIds;
    return divIds.map(d=>d.id!==conta.dividaVinculadaId?d:{...d,valorUtilizado:Math.max(0,d.valorUtilizado-conta.valor)});
  };
  const reverterAbatimento=(conta,divIds)=>{
    if(conta.tipoDespesa!=='Financeira'||!conta.dividaVinculadaId)return divIds;
    return divIds.map(d=>d.id!==conta.dividaVinculadaId?d:{...d,valorUtilizado:d.valorUtilizado+conta.valor});
  };

  const openForm=(c=null)=>{
    if(c){
      // Se auto-gerada, abre para editar (salvará como manual)
      // Em ocorrência de FIXA o `obs` vem decorado com "Recorrência automática (mês …)";
      // a nova base recebe o `obs` da base de origem, para o rótulo não se acumular.
      const baseFixa=ehOcorrenciaFixa(c)?contas.find(x=>x.id===c._fixaRecorrenteOrigemId):null;
      setForm({...c,obs:baseFixa?(baseFixa.obs||''):(c.obs||''),valor:c.valor.toString(),tipoDespesa:c.tipoDespesa||'Variável',dividaVinculadaId:c.dividaVinculadaId||'',contaSaida:c.contaSaida||'Banco principal'});
      setEditId(c._autoGerado?null:c.id);// auto-geradas criam nova entrada manual
      // Ocorrência futura de FIXA: guarda o marco do corte. Editar a própria linha-base não
      // entra aqui (ela não é _autoGerado) — nesse caso a base é atualizada direto, pois não
      // existe mês anterior daquela série a preservar.
      setFixaCorte(ehOcorrenciaFixa(c)?{origemId:c._fixaRecorrenteOrigemId,vencimentoOcorrencia:c.vencimento}:null);
    } else {setForm(emptyContaForm);setEditId(null);setFixaCorte(null);}
    setShowForm(true);
  };

  // ── EDIÇÃO PROSPECTIVA DE DESPESA FIXA ──
  // Duas operações relacionadas: encerrar a vigência da base antiga e criar a base nova.
  // O PostgREST não expõe transação para o cliente, então NÃO existe atomicidade real aqui —
  // e não vou simular uma. A mitigação é a ORDEM e a COMPENSAÇÃO:
  //   1º UPDATE (encerra a base antiga) → 2º INSERT (cria a base nova).
  // Se o passo 2 falhar, o pior estado possível é a recorrência PARADA no corte: nada é
  // duplicado, nada do passado se perde e o efeito é visível e reversível. A ordem inversa
  // produziria duas bases ativas, ou seja, despesa DUPLICADA nas projeções — silenciosa e
  // muito mais danosa. Além disso, ao falhar o INSERT devolvemos o vigencia_ate anterior da
  // base (compensação); se essa compensação também falhar, o usuário é avisado explicitamente.
  const salvarFixaProspectiva=(entry,corte)=>{
    const base=contas.find(c=>c.id===corte.origemId);
    if(!base){
      setContaErro('Não foi possível localizar a despesa fixa de origem. Recarregue a página.');
      contaOpLock.current=false;return;
    }
    const fimVigencia=fixaFimVigenciaAntes(corte.vencimentoOcorrencia);
    if(!fimVigencia){
      setContaErro('Não foi possível determinar a competência da edição.');
      contaOpLock.current=false;return;
    }
    const vigenciaAnterior=base.vigencia_ate??null;
    const baseEncerrada={...base,vigencia_ate:fimVigencia};
    // A base nova nasce da ocorrência editada e não tem fim de vigência.
    const novaBase={...entry,vigencia_ate:null};
    const prevContas=contas;
    setContas(contas.map(c=>c.id===base.id?baseEncerrada:c).concat([novaBase]));
    onContaEditar(baseEncerrada)
      .then(()=>onContaCriar(novaBase).catch(errIns=>{
        // Compensação: desfaz o encerramento para não deixar a recorrência interrompida.
        return onContaEditar({...base,vigencia_ate:vigenciaAnterior})
          .then(()=>{setContas(prevContas);setContaErro('Não foi possível criar a nova configuração da despesa fixa. Nada foi alterado.');})
          .catch(()=>{setContas(contas.map(c=>c.id===base.id?baseEncerrada:c));
            setContaErro(`A despesa fixa foi encerrada em ${fmtDate(fimVigencia)}, mas a nova configuração não foi criada. Ela não vai recorrer a partir dessa data até que você a cadastre novamente.`);});
      }))
      .catch(()=>{setContas(prevContas);setContaErro('Erro ao salvar a despesa fixa. Alteração revertida.');})
      .finally(()=>{contaOpLock.current=false;});
  };

  const marcarPago=(c)=>{
    if(contaOpLock.current)return;
    contaOpLock.current=true;
    const entry={...c,status:'Pago'};
    let nd=[...(dividas||[])];
    let divAfetada=null;
    if(!c.abateuDivida&&entry.dividaVinculadaId){nd=abaterDivida(entry,nd);entry.abateuDivida=true;divAfetada=nd.find(d=>d.id===entry.dividaVinculadaId)||null;}
    const prevContas=contas;
    const prevDividas=dividas;
    if(divAfetada)setDividas(nd);
    let persistConta;
    // Se é uma conta auto-gerada, promove para conta manual permanente
    if(c._autoGerado){setContas([...contas,entry]);persistConta=onContaCriar(entry);}
    else{setContas(contas.map(x=>x.id===c.id?entry:x));persistConta=onContaEditar(entry);}
    persistConta
      .then(()=>{if(divAfetada&&onDividaEditar)return onDividaEditar(divAfetada).catch(err=>{setDividas(prevDividas);setContaErro('Conta salva, mas dívida vinculada não foi atualizada. Recarregue a página.');});})
      .catch(err=>{setContas(prevContas);if(divAfetada)setDividas(prevDividas);setContaErro('Erro ao marcar como pago. Operação revertida.');})
      .finally(()=>{contaOpLock.current=false;});
  };

  const save_=()=>{
    if(contaOpLock.current)return;
    if(!form.vencimento||!form.descricao||!form.valor)return alert('Preencha vencimento, descrição e valor.');
    contaOpLock.current=true;
    const entry={...form,valor:parseNum(form.valor),id:editId||genId()};
    // Desvio EXCLUSIVO da despesa fixa editada a partir de uma ocorrência futura. Sai antes do
    // fluxo comum, que segue intacto para Variáveis, Fornecedores, Financeiras e para a
    // linha-base da própria fixa. Campos `_` não são persistidos (sanitizeContaForSupabase).
    if(fixaCorte){
      const limpo={...entry};
      Object.keys(limpo).forEach(k=>{if(k.startsWith('_'))delete limpo[k];});
      salvarFixaProspectiva(limpo,fixaCorte);
      setShowForm(false);setEditId(null);setForm(emptyContaForm);setFixaCorte(null);
      return;
    }
    let nd=[...(dividas||[])];
    const prevContas=contas;
    const prevDividas=dividas;
    const divAfetadaIds=[];
    if(editId){
      const ant=contas.find(c=>c.id===editId);
      if(ant&&ant.status==='Pago'&&ant.abateuDivida&&(entry.status!=='Pago'||entry.dividaVinculadaId!==ant.dividaVinculadaId)){
        nd=reverterAbatimento(ant,nd);entry.abateuDivida=false;
        if(ant.dividaVinculadaId)divAfetadaIds.push(ant.dividaVinculadaId);
      }
      if(entry.status==='Pago'&&entry.dividaVinculadaId&&!entry.abateuDivida){nd=abaterDivida(entry,nd);entry.abateuDivida=true;if(!divAfetadaIds.includes(entry.dividaVinculadaId))divAfetadaIds.push(entry.dividaVinculadaId);}
      if(divAfetadaIds.length>0)setDividas(nd);
      setContas(contas.map(c=>c.id===editId?entry:c));
      onContaEditar(entry)
        .then(()=>{if(divAfetadaIds.length>0&&onDividaEditar){const ps=divAfetadaIds.map(did=>{const d=nd.find(x=>x.id===did);return d?onDividaEditar(d):Promise.resolve();});return Promise.all(ps).catch(err=>{setDividas(prevDividas);setContaErro('Conta salva, mas dívida vinculada não foi atualizada. Recarregue a página.');});}})
        .catch(err=>{setContas(prevContas);if(divAfetadaIds.length>0)setDividas(prevDividas);setContaErro('Erro ao salvar a conta. Alteração revertida.');})
        .finally(()=>{contaOpLock.current=false;});
    } else {
      if(entry.status==='Pago'&&entry.dividaVinculadaId){nd=abaterDivida(entry,nd);entry.abateuDivida=true;divAfetadaIds.push(entry.dividaVinculadaId);}
      if(divAfetadaIds.length>0)setDividas(nd);
      setContas([...contas,entry]);
      onContaCriar(entry)
        .then(()=>{if(divAfetadaIds.length>0&&onDividaEditar){const ps=divAfetadaIds.map(did=>{const d=nd.find(x=>x.id===did);return d?onDividaEditar(d):Promise.resolve();});return Promise.all(ps).catch(err=>{setDividas(prevDividas);setContaErro('Conta salva, mas dívida vinculada não foi atualizada. Recarregue a página.');});}})
        .catch(err=>{setContas(prevContas);if(divAfetadaIds.length>0)setDividas(prevDividas);setContaErro('Erro ao salvar a conta. Alteração revertida.');})
        .finally(()=>{contaOpLock.current=false;});
    }
    setShowForm(false);setEditId(null);setForm(emptyContaForm);setFixaCorte(null);
  };

  const remove=id=>{
    if(contaOpLock.current)return;
    // ── EXCLUSÃO PROSPECTIVA DE DESPESA FIXA ──
    // A ocorrência futura não existe no banco (id sintético), então não há o que deletar.
    // Excluir NUNCA remove a base: apenas encerra a vigência no fim do mês anterior. É uma
    // ÚNICA operação (UPDATE), portanto atômica por natureza — sem risco de estado parcial.
    const ocorrencia=(contasComParcelas||[]).find(x=>x.id===id);
    if(ehOcorrenciaFixa(ocorrencia)){
      const base=contas.find(c=>c.id===ocorrencia._fixaRecorrenteOrigemId);
      const fimVigencia=fixaFimVigenciaAntes(ocorrencia.vencimento);
      if(!base||!fimVigencia){setContaErro('Não foi possível localizar a despesa fixa de origem. Recarregue a página.');return;}
      const compet=fmtDate(ocorrencia.vencimento);
      if(!confirm(`Interromper a despesa fixa "${ocorrencia.descricao}" a partir de ${compet}?\n\nEla deixa de recorrer desta competência em diante. Os meses anteriores, inclusive os já pagos, permanecem no histórico e não são apagados.`))return;
      contaOpLock.current=true;
      const prevContas=contas;
      const baseEncerrada={...base,vigencia_ate:fimVigencia};
      setContas(contas.map(c=>c.id===base.id?baseEncerrada:c));
      onContaEditar(baseEncerrada)
        .catch(()=>{setContas(prevContas);setContaErro('Erro ao interromper a despesa fixa. Operação revertida.');})
        .finally(()=>{contaOpLock.current=false;});
      return;
    }
    if(confirm('Remover?')){
      const c=contas.find(x=>x.id===id);
      let nd=[...(dividas||[])];
      let divAfetada=null;
      if(c&&c.abateuDivida&&c.tipoDespesa==='Financeira'&&c.dividaVinculadaId){nd=reverterAbatimento(c,nd);divAfetada=nd.find(d=>d.id===c.dividaVinculadaId)||null;if(divAfetada)setDividas(nd);}
      contaOpLock.current=true;
      const prevContas=contas;
      const prevDividas=dividas;
      setContas(contas.filter(c=>c.id!==id));
      onContaExcluir(id)
        .then(()=>{if(divAfetada&&onDividaEditar)return onDividaEditar(divAfetada).catch(err=>{setDividas(prevDividas);setContaErro('Conta excluída, mas dívida vinculada não foi atualizada. Recarregue a página.');});})
        .catch(err=>{setContas(prevContas);if(divAfetada)setDividas(prevDividas);setContaErro('Erro ao excluir a conta. Operação revertida.');})
        .finally(()=>{contaOpLock.current=false;});
    }
  };

  // Importação: a RPC do banco é a autoridade final. NÃO faz update otimista amplo —
  // adiciona ao estado local SOMENTE os registros confirmados como inseridos pelo banco.
  // Retorna o relatório do banco para o ImportModal exibir; erros propagam (modal trata).
  const handleImport=async novos=>{
    if(contaOpLock.current)throw new Error('Importação já em andamento.');
    contaOpLock.current=true;
    try{
      const rep=await onContasImportar(novos); // {inseridos:[{linha,id}], duplicados:[...], erros:[...]}
      const inseridasLinhas=new Set(((rep&&rep.inseridos)||[]).map(x=>x.linha));
      const inseridasRows=novos.filter(n=>inseridasLinhas.has(n.linha)).map(({linha,...c})=>c);
      if(inseridasRows.length)setContas([...contas,...inseridasRows]);
      return rep;
    }finally{
      contaOpLock.current=false;
    }
  };

  const contasFiltradas=[...contasNoMesCat]
    .filter(c=>{
      if(filtroStatus==='Todos')return true;
      if(filtroStatus==='Vencido')return c.vencimento<hoje&&c.status!=='Pago'&&c.status!=='Renegociado';
      return c.status===filtroStatus;
    })
    .sort((a,b)=>a.vencimento.localeCompare(b.vencimento));

  // ── AGENDA DO DIA ── (também respeita a categoria selecionada)
  const contasDoDia=[...contasComParcelas].filter(c=>c.vencimento===dataAgenda).filter(matchCategoria)
    .sort((a,b)=>{
      // ordena por status (a vencer/vencido primeiro), depois por valor desc
      const rank=s=>s==='Pago'?2:s==='Renegociado'?1:0;
      const d=rank(a.status)-rank(b.status);
      return d!==0?d:b.valor-a.valor;
    });
  const totalDia=contasDoDia.reduce((s,c)=>s+c.valor,0);
  const totalPagoDia=contasDoDia.filter(c=>c.status==='Pago').reduce((s,c)=>s+c.valor,0);
  const totalAbertoDia=contasDoDia.filter(c=>c.status!=='Pago'&&c.status!=='Renegociado').reduce((s,c)=>s+c.valor,0);
  const irDiaAnterior=()=>setDataAgenda(addDays(dataAgenda,-1));
  const irProximoDia=()=>setDataAgenda(addDays(dataAgenda,1));
  const irHoje=()=>setDataAgenda(hoje);
  const labelAgenda=dataAgenda===hoje?'HOJE':(dataAgenda<hoje?'DIA ANTERIOR':'DIA FUTURO');
  const corLabelAgenda=dataAgenda===hoje?'var(--red)':(dataAgenda<hoje?'var(--text-muted)':'var(--blue)');

  return(
    <div>
      {contaErro&&<div className="alert alert-r" style={{marginBottom:12,display:'flex',alignItems:'center',gap:8}}><span>⚠️</span><span style={{flex:1}}>{contaErro}</span><button onClick={()=>setContaErro(null)} style={{background:'none',border:'none',cursor:'pointer',color:'inherit',fontWeight:700,lineHeight:1}}>✕</button></div>}
      {/* ── CARDS ── */}
      <div className="metrics-grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(195px,1fr))'}}>
        <div className="metric-card" style={{borderTop:`2px solid ${tHojeTotal>0?'var(--red)':'var(--border)'}`}}>
          <div className="metric-label">A Pagar Hoje</div>
          <div className={`metric-value ${tHojeTotal>0?'red':''}`}>{fmtFull(tHojeTotal)}</div>
          <div className="metric-sub">{tHoje.length===0?'Nenhum vencimento':`${tHoje.length} conta(s)`}</div>
        </div>
        <div className="metric-card" style={{borderTop:'2px solid var(--amber)'}}>
          <div className="metric-label">Próximos 7 dias</div>
          <div className="metric-value amber">{fmtFull(t7tot)}</div>
          <div className="metric-sub">{pendentes.filter(c=>c.vencimento>hoje&&c.vencimento<=em7).length} conta(s)</div>
        </div>
        <div className="metric-card" style={{borderTop:'2px solid var(--blue)'}}>
          <div className="metric-label">Próximos 15 dias</div>
          <div className="metric-value" style={{color:'var(--blue)'}}>{fmtFull(t15tot)}</div>
          <div className="metric-sub">{pendentes.filter(c=>c.vencimento>hoje&&c.vencimento<=em15).length} conta(s)</div>
        </div>
        <div className="metric-card" style={{borderTop:'2px solid var(--ink-300)'}}>
          <div className="metric-label">Até fim do mês</div>
          <div className="metric-value">{fmtFull(tMes)}</div>
          <div className="metric-sub">{pendentes.filter(c=>c.vencimento<=fimMes).length} conta(s)</div>
        </div>
        <div className="metric-card" style={{borderTop:`2px solid ${tvenc>0?'var(--red)':'var(--border)'}`}}>
          <div className="metric-label">Total Vencido</div>
          <div className={`metric-value ${tvenc>0?'red':'green'}`}>{fmtFull(tvenc)}</div>
          <div className="metric-sub">{nVenc>0?`${nVenc} em atraso`:'Tudo em dia ✓'}</div>
        </div>
        <div className="metric-card" style={{borderTop:'2px solid var(--amber)'}}>
          <div className="metric-label">Falta Pagar no Mês</div>
          <div className="metric-value amber">{fmtFull(pendentes.reduce((s,c)=>s+c.valor,0))}</div>
          <div style={{marginTop:3}}><div style={{height:3,background:'var(--ink-100)',borderRadius:2,overflow:'hidden'}}><div style={{height:'100%',borderRadius:2,background:'var(--amber)',width:(()=>{const total=contasNoMesCat.reduce((s,c)=>s+c.valor,0);const pago=contasNoMesCat.filter(c=>c.status==='Pago').reduce((s,c)=>s+c.valor,0);return total>0?pct(pago,total)+'%':'0%';})()}}></div></div><div className="metric-sub" style={{marginTop:2}}>{pendentes.length} conta(s) restante(s)</div></div>
        </div>
      </div>

      {/* ── AGENDA DO DIA (largura total, com filtro de categoria no cabeçalho) ── */}
      <div className="card" style={{minWidth:0,marginBottom:12}}>
        {/* Cabeçalho da Agenda do Dia */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,marginBottom:8,flexWrap:'wrap'}}>
          <div className="card-title" style={{marginBottom:0}}>📅 Agenda do Dia</div>
          <div style={{display:'flex',alignItems:'center',gap:4}}>
            <button className="btn btn-secondary btn-sm" style={{fontSize:11,padding:'4px 9px'}} onClick={irDiaAnterior} title="Dia anterior">← Anterior</button>
            <button className="btn btn-secondary btn-sm" style={{fontSize:11,padding:'4px 9px',color:dataAgenda===hoje?'var(--ink-900)':'var(--text-muted)',borderColor:dataAgenda===hoje?'var(--ink-900)':'var(--border)',fontWeight:dataAgenda===hoje?700:500}} onClick={irHoje} title="Voltar para hoje">Hoje</button>
            <button className="btn btn-secondary btn-sm" style={{fontSize:11,padding:'4px 9px'}} onClick={irProximoDia} title="Próximo dia">Próximo →</button>
          </div>
        </div>
        {/* Indicação da data selecionada + seletor de categorias (tipoDespesa), lado a lado à esquerda */}
        <div style={{display:'flex',alignItems:'center',gap:12,flexWrap:'wrap',marginBottom:8,paddingBottom:6,borderBottom:'1px solid var(--border)'}}>
          <div style={{fontSize:11,fontWeight:700,color:corLabelAgenda,textTransform:'uppercase',letterSpacing:'.06em',whiteSpace:'nowrap'}}>
            {labelAgenda} — {fmtDate(dataAgenda)}
          </div>
          <div className="cat-chips-wrap">
            {CATEGORIAS_TIPO.map(cat=>(
              <button key={cat} className={`cat-chip${categoriaSelecionada===cat?' active':''}`} onClick={()=>setCategoriaSelecionada(cat)} title={NOME_CAT_FULL[cat]}>{NOME_CAT_CHIP[cat]}</button>
            ))}
          </div>
        </div>
        {/* Resumo financeiro do dia */}
        {contasDoDia.length>0&&(
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:6,marginBottom:10,padding:'8px 10px',background:'var(--ink-50)',borderRadius:6}}>
            <div>
              <div style={{fontSize:10,color:'var(--text-muted)',fontWeight:500,textTransform:'uppercase',letterSpacing:'.05em'}}>Total do dia</div>
              <div style={{fontSize:14,fontWeight:700,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{fmtFull(totalDia)}</div>
            </div>
            <div>
              <div style={{fontSize:10,color:'var(--text-muted)',fontWeight:500,textTransform:'uppercase',letterSpacing:'.05em'}}>Pago</div>
              <div style={{fontSize:14,fontWeight:700,color:'var(--green)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{fmtFull(totalPagoDia)}</div>
            </div>
            <div>
              <div style={{fontSize:10,color:'var(--text-muted)',fontWeight:500,textTransform:'uppercase',letterSpacing:'.05em'}}>Em aberto</div>
              <div style={{fontSize:14,fontWeight:700,color:totalAbertoDia>0?'var(--amber)':'var(--text-muted)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{fmtFull(totalAbertoDia)}</div>
            </div>
            <div>
              <div style={{fontSize:10,color:'var(--text-muted)',fontWeight:500,textTransform:'uppercase',letterSpacing:'.05em'}}>Contas</div>
              <div style={{fontSize:14,fontWeight:700,whiteSpace:'nowrap'}}>{contasDoDia.length}</div>
            </div>
          </div>
        )}
        {/* Lista de contas do dia */}
        {contasDoDia.length===0?(
          <div style={{fontSize:13,color:'var(--text-muted)',padding:'18px 0',textAlign:'center'}}>{categoriaSelecionada==='Todas'?'Nenhum pagamento registrado para esta data.':'Nenhuma conta desta categoria para a data selecionada.'}</div>
        ):(
          <div className={contasDoDia.length>5?'agenda-dia-lista':''}>
            {contasDoDia.map(c=><ContaAgendaItem key={c.id} c={c} dividas={dividas} onPago={marcarPago} onEdit={openForm} onRemove={remove}/>)}
          </div>
        )}
      </div>

      {/* ── TABELA PRINCIPAL COM FILTROS ── */}
      <div className="section-header" style={{flexWrap:'wrap',gap:8}}>
        <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
          <div className="section-title">Todas as Contas</div>
          {['Todos','A vencer','Pago','Vencido','Renegociado'].map(f=>(
            <button key={f} onClick={()=>setFiltroStatus(f)} style={{padding:'4px 12px',borderRadius:20,fontSize:12,fontWeight:500,cursor:'pointer',border:'1px solid',transition:'all .12s',fontFamily:'DM Sans,sans-serif',background:filtroStatus===f?'var(--ink-900)':'var(--surface)',color:filtroStatus===f?'white':'var(--text-secondary)',borderColor:filtroStatus===f?'var(--ink-900)':'var(--border)'}}>
              {f}{f==='Vencido'&&nVenc>0?<span style={{marginLeft:4,background:'var(--red)',color:'white',borderRadius:10,padding:'1px 5px',fontSize:10,fontWeight:700}}>{nVenc}</span>:null}
            </button>
          ))}
        </div>
        <div style={{display:'flex',gap:7}}>
          <button className="btn btn-secondary" style={{fontSize:13}} onClick={()=>{
            if(!contasNoMes||contasNoMes.length===0){alert('Nenhuma conta no mês selecionado para exportar.');return;}
            const mesLabel=(selMonth+1).toString().padStart(2,'0');
            const nomearq='Zanon_Contas_'+selYear+'_'+mesLabel+'.csv';
            const cabecalho=['Vencimento','Fornecedor','Descrição','Segmento','Valor','Categoria','Tipo de Despesa','Status','Forma de Pagamento','Conta de Saída','Observação'];
            const escapar=v=>{const s=String(v===null||v===undefined?'':v);return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s;};
            const linhas=contasNoMes.map(c=>[c.vencimento||'',c.fornecedor||'',c.descricao||'',c.segmento||'',typeof c.valor==='number'?c.valor.toFixed(2):'',c.categoria||'Fornecedores',c.tipoDespesa||'',c.status||'',c.formaPag||'',c.contaSaida||'',c.obs||''].map(escapar).join(','));
            const csv='﻿'+cabecalho.join(',')+'\n'+linhas.join('\n');
            const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
            const url=URL.createObjectURL(blob);
            const a=document.createElement('a');a.href=url;a.download=nomearq;a.click();URL.revokeObjectURL(url);
          }}>📤 Exportar CSV</button>
          <button className="btn btn-secondary" style={{fontSize:13}} onClick={()=>setShowImport(true)}>📥 Importar</button>
          <button className="btn btn-primary" onClick={()=>openForm()}>+ Adicionar</button>
        </div>
      </div>

      {contasFiltradas.length===0?(
        <div className="empty"><div className="empty-icon">📋</div>{filtroStatus==='Todos'?'Nenhuma conta cadastrada.':'Nenhuma conta com status "'+filtroStatus+'".'}</div>
      ):(
        <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'var(--radius)',boxShadow:'var(--shadow-xs)',overflow:'hidden',marginBottom:12}}>
          <div style={{overflowX:'auto'}}>
            <div style={{overflowY:'auto',maxHeight:400}}>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
                <thead style={{position:'sticky',top:0,zIndex:1}}>
                  <tr>
                    {['Vencimento','Descrição','Tipo','Valor','Status','Forma / Conta','Pressão',''].map((h,i)=>(
                      <th key={i} style={{background:'var(--surface-2)',padding:'8px 12px',textAlign:i===3?'right':'left',fontSize:11,fontWeight:600,color:'var(--text-muted)',letterSpacing:'.05em',textTransform:'uppercase',borderBottom:'1px solid var(--border)',whiteSpace:'nowrap'}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {contasFiltradas.map(c=>{
                    const p=pressaoDia(c);
                    const pl=pressaoLabel(c.status!=='Pago'?p:null);
                    const isVenc=c.vencimento<hoje&&c.status!=='Pago';
                    const isHoje=c.vencimento===hoje&&c.status!=='Pago';
                    const divVinc=c.dividaVinculadaId?(dividas||[]).find(d=>d.id===c.dividaVinculadaId):null;
                    const tipoBadge=c.tipoDespesa==='Fixa'?'bg':c.tipoDespesa==='Fornecedor'?'bb':c.tipoDespesa==='Financeira'?'bp':'ba';
                    const stBadge=c.status==='Pago'?'bg':isVenc?'br':c.status==='Renegociado'?'ba':'bb';
                    return(
                      <tr key={c.id} style={{background:isVenc?'#fff5f5':isHoje?'#fffbeb':''}}>
                        <td style={{padding:'8px 12px',borderBottom:'1px solid var(--border)',whiteSpace:'nowrap',fontWeight:isHoje||isVenc?600:400,color:isVenc?'var(--red)':isHoje?'var(--amber-dim)':'var(--text-secondary)'}}>{fmtDate(c.vencimento)}</td>
                        <td style={{padding:'8px 12px',borderBottom:'1px solid var(--border)'}}>
                          <div style={{display:'flex',alignItems:'center',gap:5,flexWrap:'wrap'}}>
                            <span style={{fontWeight:500,color:'var(--text-primary)'}}>{c.descricao}</span>
                            {c._autoGerado&&<span style={{fontSize:9,background:'var(--purple-light)',color:'var(--purple)',borderRadius:10,padding:'1px 5px',fontWeight:600}}>AUTO</span>}
                          </div>
                          {c.categoria&&<div style={{fontSize:11,color:'var(--text-muted)'}}>{c.categoria}</div>}
                          {divVinc&&<div style={{fontSize:11,color:'var(--purple)'}}>🏦 {divVinc.banco}{c.abateuDivida?' ✓':''}</div>}
                        </td>
                        <td style={{padding:'8px 12px',borderBottom:'1px solid var(--border)'}}><span className={`badge ${tipoBadge}`}>{c.tipoDespesa||'—'}</span></td>
                        <td style={{padding:'8px 12px',borderBottom:'1px solid var(--border)',textAlign:'right'}}><strong style={{fontSize:14,color:isVenc?'var(--red)':'var(--text-primary)'}}>{fmtFull(c.valor)}</strong></td>
                        <td style={{padding:'8px 12px',borderBottom:'1px solid var(--border)'}}><span className={`badge ${stBadge}`}>{isVenc&&c.status!=='Pago'?'Vencido':c.status}</span></td>
                        <td style={{padding:'8px 12px',borderBottom:'1px solid var(--border)',color:'var(--text-muted)',fontSize:12}}>
                          {c.formaPag&&<div>{c.formaPag}</div>}
                          {c.contaSaida&&<div style={{fontSize:11}}>{c.contaSaida}</div>}
                          {!c.formaPag&&!c.contaSaida&&'—'}
                        </td>
                        <td style={{padding:'8px 12px',borderBottom:'1px solid var(--border)'}}><span style={{fontSize:12,color:pl.color,fontWeight:500}}>{pl.txt}</span></td>
                        <td style={{padding:'8px 12px',borderBottom:'1px solid var(--border)'}}>
                          <div style={{display:'flex',gap:3}}>
                            {c.status!=='Pago'&&<button className="btn btn-secondary btn-sm" style={{color:'var(--green)',borderColor:'var(--green)',fontSize:11}} title="Marcar como pago" onClick={()=>marcarPago(c)}>✓</button>}
                            {podeEditarConta(c)&&<button className="btn btn-secondary btn-sm" onClick={()=>openForm(c)}>✏️</button>}
                            {podeEditarConta(c)&&<button className="btn btn-danger btn-sm" onClick={()=>remove(c.id)}>✕</button>}
                            {c._autoGerado&&!ehOcorrenciaFixa(c)&&<span style={{fontSize:10,color:'var(--text-muted)',whiteSpace:'nowrap'}}>via Dívidas</span>}
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}

      {/* ── MODAL ── */}
      {showForm&&(
        <Modal title={editId?'Editar Conta':'Nova Conta a Pagar'} onClose={()=>{setShowForm(false);setEditId(null);setForm(emptyContaForm);setFixaCorte(null);}}>
          <div className="form-grid">
            <div className="fg"><label>Vencimento</label><input type="date" value={form.vencimento} onChange={e=>setForm({...form,vencimento:e.target.value})}/></div>
            <div className="fg"><label>Valor (R$)</label><input type="number" placeholder="0" value={form.valor} onChange={e=>setForm({...form,valor:e.target.value})}/></div>
            <div className="fg full"><label>Fornecedor</label><input type="text" placeholder="Ex: Rossi Frigorífico, Segalas..." value={form.fornecedor||''} onChange={e=>setForm({...form,fornecedor:e.target.value})}/></div>
            <div className="fg full"><label>Descrição <span style={{fontSize:10,color:'var(--text-muted)',fontWeight:400}}>— nome do lançamento no sistema (ex: Boleto Rossi Frigorífico)</span></label><input type="text" placeholder="Ex: Boleto Rossi Frigorífico, Compra semanal Segalas..." value={form.descricao} onChange={e=>setForm({...form,descricao:e.target.value})}/></div>
            <div className="fg"><label>Categoria</label><select value={form.categoria} onChange={e=>setForm({...form,categoria:e.target.value})}>{CATEGORIAS.map(c=><option key={c}>{c}</option>)}</select></div>
            <div className="fg"><label>Tipo de Despesa</label><select value={form.tipoDespesa||'Variável'} onChange={e=>setForm({...form,tipoDespesa:e.target.value,dividaVinculadaId:'',segmento:e.target.value!=='Fornecedor'?'':form.segmento})}>{TIPO_DESPESA.map(t=><option key={t}>{t}</option>)}</select></div>
            {(form.tipoDespesa==='Fornecedor'||form.segmento)&&(
              <div className="fg">
                <label>Segmento {form.tipoDespesa==='Fornecedor'&&<span style={{color:'var(--amber)',fontSize:10}}>recomendado</span>}</label>
                <select value={form.segmento||''} onChange={e=>setForm({...form,segmento:e.target.value})}>
                  <option value="">— Selecione —</option>
                  {SEGMENTOS.map(s=><option key={s}>{s}</option>)}
                </select>
              </div>
            )}
            <div className="fg"><label>Status</label><select value={form.status} onChange={e=>setForm({...form,status:e.target.value})}>{STATUS_LIST.map(s=><option key={s}>{s}</option>)}</select></div>
            <div className="fg"><label>Forma de Pagamento</label><select value={form.formaPag} onChange={e=>setForm({...form,formaPag:e.target.value})}><option value="">—</option>{FORMAS_PAG.map(f=><option key={f}>{f}</option>)}</select></div>
            <div className="fg"><label>Conta de Saída</label><select value={form.contaSaida} onChange={e=>setForm({...form,contaSaida:e.target.value})}>{CONTAS_SAIDA.map(c=><option key={c}>{c}</option>)}</select></div>
            {form.tipoDespesa==='Financeira'&&(
              <div className="fg full">
                <label>🏦 Vincular à dívida (opcional)</label>
                <select value={form.dividaVinculadaId} onChange={e=>setForm({...form,dividaVinculadaId:e.target.value})}>
                  <option value="">— Nenhuma (apenas saída de caixa) —</option>
                  {(dividas||[]).filter(d=>d.status==='Ativa').map(d=><option key={d.id} value={d.id}>{d.banco} — {d.tipo} — {fmtFull(d.valorUtilizado)}</option>)}
                </select>
                {form.dividaVinculadaId&&form.status==='Pago'&&<div style={{fontSize:12,color:'var(--purple)',marginTop:3}}>✓ Ao salvar, o valor será abatido da dívida selecionada.</div>}
              </div>
            )}
            <div className="fg full"><label>Observação</label><textarea placeholder="Obs..." value={form.obs} onChange={e=>setForm({...form,obs:e.target.value})}/></div>
          </div>
