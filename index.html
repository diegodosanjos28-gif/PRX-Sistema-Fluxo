function CapitalDeGiroLayer({clienteId,hoje,horizonte,metricas,conf,proj30,emConta,saldoHistorico,onEditarSaldo,entraHoje,saiHoje,sobraHoje}){
  const[cg,setCg]=useState({estado:'idle',mov:[],pos:null}); // idle|carregando|ok|erro
  const[acaoModal,setAcaoModal]=useState(null);      // null|'aporte'|'retorno'|'saida'
  const[valorInput,setValorInput]=useState('');
  const[salvandoCg,setSalvandoCg]=useState(false);
  const[erroCg,setErroCg]=useState('');
  const[feedbackCg,setFeedbackCg]=useState('');
  const[editandoPos,setEditandoPos]=useState(false); // modal do lápis (posição manual)
  const[valorPos,setValorPos]=useState('');

  // Carregamento do ledger + da POSIÇÃO MANUAL do CLIENTE — independente das unidades/entradas/
  // contas da Projeção. Guard de corrida preservado: resposta atrasada de um cliente anterior
  // nunca sobrescreve o atual (o mesmo `cancelado` cobre as duas consultas).
  useEffect(()=>{
    if(!clienteId){setCg({estado:'idle',mov:[],pos:null});return;}
    let cancelado=false;
    setCg({estado:'carregando',mov:[],pos:null});
    (async()=>{
      try{
        const[mov,posRes]=await Promise.all([
          // criado_em entrou no select porque é o lado do movimento no corte temporal.
          // Filtro por cliente_id e paginação inalterados.
          fetchAllPages((from,to)=>supabase.from('capital_giro_movimentos')
            .select('tipo,valor,data,criado_em').eq('cliente_id',clienteId)
            .order('id',{ascending:true}).range(from,to),'capitalGiro:movimentos'),
          // Posição manual mais recente do MESMO cliente. Nunca por empresa, nunca por UUID fixo.
          supabase.from('capital_giro_posicoes')
            .select('valor,data_posicao,posicao_em').eq('cliente_id',clienteId)
            .order('posicao_em',{ascending:false}).limit(1),
        ]);
        if(cancelado)return;
        if(posRes&&posRes.error)throw posRes.error;
        setCg({estado:'ok',mov:mov||[],pos:((posRes&&posRes.data)||[])[0]||null});
      }catch(err){
        if(cancelado)return;
        console.error('Erro ao carregar o Capital de Giro:',err);
        setCg({estado:'erro',mov:[],pos:null});
      }
    })();
    return()=>{cancelado=true;};
  },[clienteId]);

  // Derivações — fórmula oficial, única fonte de verdade para os 3 indicadores exibidos.
  //
  // Uma única passada sobre o ledger alimenta DOIS grupos de acumuladores (nenhuma lógica
  // financeira duplicada):
  //   (A) ...Disp — só movimentos POSTERIORES à posição manual. Alimentam o disponível.
  //   (B) ...Hist — TODOS os movimentos, sem filtro. Alimentam "A retornar", "Utilizado no
  //       mês" e "Retornado no mês", que continuam sendo leitura do histórico real e por
  //       isso NUNCA mudam quando o lápis é usado.
  //
  // Disponível = posição manual + aportes + retornos − saídas posteriores a ela.
  // Sem posição manual, `corte` é null, todo movimento entra em (A) e a fórmula recai
  // exatamente na anterior: Σaportes + Σretornos − Σsaídas.
  const cgCalc=React.useMemo(()=>{
    const mesRef=hoje.slice(0,7);
    // base e corte andam JUNTOS: a posição só é usada como ponto de partida se o seu
    // posicao_em for utilizável como fronteira. Se não for, cai inteiramente no
    // comportamento antigo (base 0 + todos os movimentos) — nunca soma a posição e os
    // movimentos que ela já contempla, o que seria dupla contagem.
    const corteBruto=cg.pos&&cg.pos.posicao_em?cgTs(cg.pos.posicao_em):NaN;
    const temPos=!!cg.pos&&Number.isFinite(corteBruto);
    const corteOk=temPos?corteBruto:null;
    let aportesDisp=0,saidasDisp=0,retornosDisp=0;
    let saidasHist=0,retornosHist=0,utilizadoMes=0,retornadoMes=0;
    (cg.mov||[]).forEach(m=>{
      const v=projNum(m.valor);
      if(v<=0)return;
      const doMes=(m.data||'').slice(0,7)===mesRef;
      const posterior=cgPosterior(m.criado_em,corteOk);
      if(m.tipo==='aporte'){
        if(posterior)aportesDisp+=v;
      }else if(m.tipo==='saida'){
        saidasHist+=v;if(doMes)utilizadoMes+=v;
        if(posterior)saidasDisp+=v;
      }else if(m.tipo==='retorno'){
        retornosHist+=v;if(doMes)retornadoMes+=v;
        if(posterior)retornosDisp+=v;
      }
    });
    const base=temPos?projNum(cg.pos.valor):0;
    return{
      disponivel:projCents(base+aportesDisp+retornosDisp-saidasDisp),
      aRetornar:projCents(Math.max(0,saidasHist-retornosHist)),
      utilizadoMes:projCents(utilizadoMes),
      retornadoMes:projCents(retornadoMes),
    };
  },[cg.mov,cg.pos,hoje]);

  const abrirModal=tipo=>{setAcaoModal(tipo);setValorInput('');setErroCg('');setFeedbackCg('');};
  const fecharModal=()=>{if(salvandoCg)return;setAcaoModal(null);setValorInput('');setErroCg('');};

  // ── LÁPIS: POSIÇÃO MANUAL ──
  // "O Capital de Giro real disponível neste momento é este valor." Grava um valor ABSOLUTO em
  // capital_giro_posicoes; NÃO gera aporte, saída, retorno nem qualquer movimento. O campo é
  // pré-preenchido com o disponível EXIBIDO (cgCalc.disponivel), não com a soma histórica.
  const abrirEditorPosicao=()=>{
    setEditandoPos(true);
    setValorPos(String(cgCalc.disponivel));
    setErroCg('');setFeedbackCg('');
  };
  const fecharEditorPosicao=()=>{if(salvandoCg)return;setEditandoPos(false);setValorPos('');setErroCg('');};

  const salvarPosicaoCg=async()=>{
    if(salvandoCg)return;
    if(!cgEntradaValida(valorPos)){setErroCg('Informe um valor válido.');return;}
    const valor=projCents(parseNum(valorPos));
    if(!Number.isFinite(valor)){setErroCg('Informe um valor válido.');return;}
    if(valor<0){setErroCg('O Capital de Giro não pode ser negativo.');return;}
    if(!clienteId){setErroCg('Não foi possível identificar o cliente.');return;}
    // Igual ao disponível atual: nada mudou, então nenhuma posição é gravada.
    if(valor===cgCalc.disponivel){fecharEditorPosicao();return;}
    setSalvandoCg(true);setErroCg('');
    try{
      // UNIQUE(cliente_id,data_posicao): a 2ª edição do mesmo dia atualiza a MESMA linha e o
      // trigger renova posicao_em, que passa a ser a nova fronteira temporal.
      // Envia só cliente_id/data_posicao/valor — posicao_em/atualizado_em/atualizado_por são do banco.
      const{error}=await supabase.from('capital_giro_posicoes')
        .upsert({cliente_id:clienteId,data_posicao:hoje,valor},{onConflict:'cliente_id,data_posicao'});
      if(error)throw error;
      // Relê a posição gravada: o posicao_em vem do trigger e define o corte — nunca é assumido
      // localmente. Estado atualizado só após a confirmação do banco (sem atualização otimista).
      const{data,error:errLer}=await supabase.from('capital_giro_posicoes')
        .select('valor,data_posicao,posicao_em').eq('cliente_id',clienteId)
        .order('posicao_em',{ascending:false}).limit(1);
      if(errLer)throw errLer;
      setCg(c=>({...c,pos:((data||[])[0])||null}));
      setEditandoPos(false);setValorPos('');
      setFeedbackCg('Capital de Giro atualizado.');
    }catch(err){
      console.error('Erro ao salvar a posição do Capital de Giro:',err);
      const msg=String((err&&(err.message||err.details))||'');
      if(/row-level security|permission denied|violates/i.test(msg)){
        setErroCg('Você tem acesso somente para consulta ao Capital de Giro.');
      }else{
        setErroCg('Não foi possível salvar. Tente novamente.');
      }
    }finally{setSalvandoCg(false);}
  };

  // INSERT único por confirmação — botão desabilitado durante o salvamento impede duplo clique.
  // Envia SOMENTE cliente_id/tipo/valor/data — id/criado_em/criado_por são do trigger do banco.
  const confirmarAcaoCg=async()=>{
    if(salvandoCg)return;
    const valor=projCents(parseNum(valorInput));
    if(!(valor>0)){setErroCg('Informe um valor válido.');return;}
    if(acaoModal==='saida'&&valor>cgCalc.disponivel){setErroCg('Esse valor é maior que o Capital de Giro disponível.');return;}
    if(acaoModal==='retorno'&&valor>cgCalc.aRetornar){setErroCg('O valor informado é maior que o saldo pendente de retorno.');return;}
    if(!clienteId){setErroCg('Não foi possível identificar o cliente.');return;}
    setSalvandoCg(true);setErroCg('');
    try{
      // .select() devolve a linha gravada com o criado_em REAL do trigger. É indispensável:
      // o criado_em é o lado do movimento no corte temporal, e um movimento sem ele não é
      // reconhecido como posterior à posição — o valor recém-lançado não entraria no
      // disponível até o próximo carregamento. O envio segue sendo só cliente_id/tipo/valor/data.
      const{data:novo,error}=await supabase.from('capital_giro_movimentos')
        .insert({cliente_id:clienteId,tipo:acaoModal,valor,data:hoje})
        .select('tipo,valor,data,criado_em').single();
      if(error)throw error;
      // Estado local atualizado após confirmação do banco — nunca antes (evita movimento fictício).
      setCg(c=>({...c,mov:[...c.mov,novo||{tipo:acaoModal,valor,data:hoje,criado_em:new Date().toISOString()}]}));
      setAcaoModal(null);setValorInput('');
      setFeedbackCg('Capital atualizado.');
    }catch(err){
      console.error('Erro ao registrar movimento do Capital de Giro:',err);
      const msg=String((err&&(err.message||err.details))||'');
      if(/row-level security|permission denied|violates/i.test(msg)){
        setErroCg('Você tem acesso somente para consulta ao Capital de Giro.');
      }else{
        setErroCg('Não foi possível salvar. Tente novamente.');
      }
    }finally{setSalvandoCg(false);}
  };

  const modalTitulo=acaoModal==='aporte'?'Adicionar Capital de Giro'
    :acaoModal==='retorno'?'Retornar ao Capital de Giro'
    :'Utilizar Capital de Giro';

  // ── REDESIGN: o componente passa a renderizar APENAS o card "Capital de giro"
  // (2ª coluna do hero row do mockup). O stack Entra/Sai/Sobra e o painel "Em conta"
  // que ficavam aqui foram reposicionados por Projecao() nos blocos Hero e "Movimento
  // de hoje" — mesmos valores, mesmas fontes. Nenhuma regra do Capital de Giro mudou:
  // cgCalc, confirmarAcaoCg, o ledger append-only e os modais seguem intactos. Os props
  // emConta/saldoHistorico/onEditarSaldo/entraHoje/saiHoje/sobraHoje permanecem na
  // assinatura (consumidos agora por Projecao) e o contrato do componente é preservado.
  return(
    <div className="prx-rdp-card prx-rdp-cg">
      <div className="prx-rdp-chead">
        <div className="prx-rdp-label">
          <span className="prx-rdp-ichip brand">{RdpIcon.cifrao}</span>
          Capital de giro
        </div>
        {cg.estado==='ok'&&(
          <div className="prx-rdp-cg-actions">
            <button type="button" className="prx-rdp-chip pos" onClick={()=>abrirModal('aporte')}>+ Entrada</button>
            <button type="button" className="prx-rdp-chip neg" onClick={()=>abrirModal('saida')}>− Saída</button>
            <button type="button" className="prx-rdp-cg-edit" onClick={abrirEditorPosicao}
              aria-label="Editar Capital de Giro" title="Editar Capital de Giro">✎</button>
          </div>
        )}
      </div>

      {cg.estado==='erro'?(
        <div className="prx-rdp-cg-state erro">Não foi possível carregar o Capital de Giro.</div>
      ):cg.estado!=='ok'?(
        <div className="prx-rdp-cg-state">Carregando Capital de Giro…</div>
      ):(<>
        <div className="prx-rdp-cg-value prx-rdp-num">{fmt(cgCalc.disponivel)}</div>
        <div className="prx-rdp-cg-split">
          <div>
            <div className="n">Utilizado no mês</div>
            <div className="v prx-rdp-num">{rdpFmt0(cgCalc.utilizadoMes)}</div>
          </div>
          <div>
            <div className="n">A retornar</div>
            <div className={`v prx-rdp-num${cgCalc.aRetornar>0?' warn':''}`}>{rdpFmt0(cgCalc.aRetornar)}</div>
          </div>
        </div>
        {feedbackCg&&<div className="prx-rdp-cg-msg ok">{feedbackCg}</div>}
        {erroCg&&!acaoModal&&!editandoPos&&<div className="prx-rdp-cg-msg erro">{erroCg}</div>}
      </>)}

      {acaoModal&&(
        <Modal title={modalTitulo} onClose={fecharModal}>
          {acaoModal!=='saida'&&(
            <div className="prx-cg-modal-tipo" role="group" aria-label="Tipo de entrada">
              <button type="button" className={acaoModal==='aporte'?'on':''}
                onClick={()=>{setAcaoModal('aporte');setErroCg('');}}>Aporte</button>
              <button type="button" className={acaoModal==='retorno'?'on':''}
                onClick={()=>{setAcaoModal('retorno');setErroCg('');}}>Retorno</button>
            </div>
          )}
          {acaoModal==='saida'&&<p className="prx-cg-modal-info">Disponível: <strong>{fmt(cgCalc.disponivel)}</strong></p>}
          {acaoModal==='retorno'&&<p className="prx-cg-modal-info">Pendente de retorno: <strong>{fmt(cgCalc.aRetornar)}</strong></p>}
          {erroCg&&<div className="alert alert-r" style={{marginBottom:12}}>{erroCg}</div>}
          <div className="form-grid">
            <div className="fg">
              <label>{acaoModal==='aporte'?'Valor':(acaoModal==='retorno'?'Valor do retorno':'Valor da saída')}</label>
              <input type="text" inputMode="decimal" placeholder="R$ 0,00" autoFocus
                value={valorInput} onChange={e=>{setValorInput(e.target.value);setErroCg('');}}
                onKeyDown={e=>{if(e.key==='Enter')confirmarAcaoCg();}}/>
            </div>
          </div>
          <div style={{marginTop:12,display:'flex',gap:8,justifyContent:'flex-end'}}>
            <button className="btn btn-secondary" onClick={fecharModal} disabled={salvandoCg}>Cancelar</button>
            <button className="btn btn-primary" onClick={confirmarAcaoCg} disabled={salvandoCg}>
              {salvandoCg?'Salvando…':(acaoModal==='aporte'?'Confirmar aporte':(acaoModal==='retorno'?'Confirmar retorno':'Confirmar saída'))}
            </button>
          </div>
        </Modal>
      )}

      {/* ── EDITAR CAPITAL DE GIRO (lápis) — posição manual ABSOLUTA.
          Mesmo componente Modal, mesmo input monetário e mesmo par de botões dos demais
          modais do Capital de Giro. Não registra movimento algum. ── */}
      {editandoPos&&(
        <Modal title="Editar Capital de Giro" onClose={fecharEditorPosicao}>
          <p className="prx-cg-modal-info">
            Informe o Capital de Giro real disponível agora. Isto <strong>não</strong> registra
            entrada, saída nem retorno, e não altera “Utilizado no mês” ou “A retornar”.
          </p>
          {erroCg&&<div className="alert alert-r" style={{marginBottom:12}}>{erroCg}</div>}
          <div className="form-grid">
            <div className="fg full"><label>Capital de Giro atual</label>
              <input type="text" inputMode="decimal" placeholder="R$ 0,00" autoFocus
                value={valorPos} onChange={e=>{setValorPos(e.target.value);setErroCg('');}}
                onKeyDown={e=>{if(e.key==='Enter')salvarPosicaoCg();}}/>
            </div>
          </div>
          <div style={{marginTop:12,display:'flex',gap:8,justifyContent:'flex-end'}}>
            <button className="btn btn-secondary" onClick={fecharEditorPosicao} disabled={salvandoCg}>Cancelar</button>
            <button className="btn btn-primary" onClick={salvarPosicaoCg} disabled={salvandoCg}>
              {salvandoCg?'Salvando…':'Salvar'}
            </button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// PROJEÇÃO — CAMADA 2 "HOJE": o wrapper visual e o card "Em Conta" isolado deixaram de ser
// renderizados (redundantes com o painel Em Conta superior, que agora carrega também o lápis
// de edição). Os dados de Hoje continuam ativos: hojeCaixa alimenta o stack Entra/Sai/Sobra,
// e emConta/salvarSaldo/modal seguem intactos.

// Ocultação cirúrgica (temporária) da antiga seção "Projeção de Caixa" — Hero, Ponto de
// Partida, cards, curva, cenários, detalhes e agenda. O motor que a alimenta (proj/proj30/
// metricas/conf) continua ativo e é reaproveitado pela Camada 1 (Mural, Capital de Giro) e
// pelas próximas camadas. Apenas o JSX deixa de ser renderizado — nada foi apagado.
const MOSTRAR_PROJECAO_ANTIGA=false;

function Projecao({empresas}){
  const chartRef=useRef(null);
  const hoje=today();
  const[horizonte,setHorizonte]=useState(30);
  const[carga,setCarga]=useState({estado:'idle',ent:[],con:[],div:[],ret:[]});
  const[clienteId,setClienteId]=useState(null);
  const[saldoPos,setSaldoPos]=useState(null);      // {data_posicao, valor, atualizado_em}
  const[saldoLista,setSaldoLista]=useState([]);    // posições persistidas, mais recente → mais antiga
  const[form,setForm]=useState({valor:'',data:hoje});
  const[editando,setEditando]=useState(false);
  const[salvando,setSalvando]=useState(false);
  const[aviso,setAviso]=useState(null);            // {tipo:'ok'|'erro'|'ro', texto}
  const[detalhes,setDetalhes]=useState(false);
  const fcRef=useRef(null);                        // canvas do gráfico de previsão
  const[fcHorizonte,setFcHorizonte]=useState(30);  // 15|30|60 — independe do seletor da projeção antiga

  const prazos=React.useMemo(()=>({...DEFAULT_PRAZOS,...(loadLocalS('zanon_prazos')||{})}),[]);
  const idsChave=(empresas||[]).map(e=>e.id).filter(Boolean).join(',');

  // ── Carregamento consolidado: 1 rodada por (cliente × conjunto de unidades) ──
  useEffect(()=>{
    const ids=idsChave?idsChave.split(','):[];
    if(!ids.length){setCarga({estado:'sem-empresas',ent:[],con:[],div:[],ret:[]});setClienteId(null);setSaldoPos(null);setSaldoLista([]);return;}
    let cancelado=false;
    setCarga(c=>({...c,estado:'carregando'}));
    (async()=>{
      try{
        // cliente atual — mesmo padrão já usado em criarUnidade
        const{data:emp,error:errEmp}=await supabase.from('empresas').select('cliente_id').eq('id',EMPRESA_ID).single();
        if(errEmp)throw errEmp;
        const cid=emp?.cliente_id||null;
        if(cancelado)return;
        setClienteId(cid);

        const maxPrazo=Math.max(...PROJ_MODALIDADES.map(f=>projNum(prazos[f])),0);
        const entIni=addDays(hoje,-(Math.max(PROJ_JANELA_HIST,maxPrazo)+14));
        const retFim=addDays(hoje,90);

        const[ent,con,div,ret,saldo]=await Promise.all([
          fetchAllPages((from,to)=>supabase.from('entradas')
            .select('empresa_id,data,total,dinheiro,pix,debito,credito,voucher,outros,voucherAntecipado,voucherDataReceb,creditoAntecipado,creditoDataReceb,prazos_recebimento')
            .in('empresa_id',ids).gte('data',entIni).order('id',{ascending:true}).range(from,to),'projecao:entradas'),
          fetchAllPages((from,to)=>supabase.from('contas')
            .select('id,empresa_id,valor,status,vencimento,tipoDespesa,dividaVinculadaId,descricao')
            .in('empresa_id',ids).order('id',{ascending:true}).range(from,to),'projecao:contas'),
          fetchAllPages((from,to)=>supabase.from('dividas')
            .select('id,empresa_id,parcelaMensal,status,vencimento,valorUtilizado,banco,tipo,quitada_em')
            .in('empresa_id',ids).in('status',['Ativa','Quitada']).order('id',{ascending:true}).range(from,to),'projecao:dividas'),
          fetchAllPages((from,to)=>supabase.from('retiradas')
            .select('empresa_id,valor,data').in('empresa_id',ids)
            .gte('data',addDays(hoje,-90)).lte('data',retFim).order('id',{ascending:true}).range(from,to),'projecao:retiradas'),
          // 6 posições: a mais recente (âncora do Em Conta) + até 5 anteriores para o histórico.
          cid?supabase.from('saldos_caixa_consolidados')
            .select('cliente_id,data_posicao,valor,atualizado_em')
            .eq('cliente_id',cid).order('data_posicao',{ascending:false}).limit(6):Promise.resolve({data:[]}),
        ]);
        if(cancelado)return;
        const lista=(saldo&&saldo.data)||[];
        const pos=lista[0]||null;
        setSaldoPos(pos);
        setSaldoLista(lista);
        setForm({valor:pos?String(pos.valor):'',data:pos?pos.data_posicao:hoje});
        setCarga({estado:'ok',ent:ent||[],con:con||[],div:div||[],ret:ret||[]});
      }catch(err){
        if(cancelado)return;
        console.error('Erro ao carregar a projeção de caixa:',err);
        setCarga({estado:'erro',ent:[],con:[],div:[],ret:[]});
      }
    })();
    return()=>{cancelado=true;};
  },[idsChave,hoje]);

  const dataPosicao=saldoPos?saldoPos.data_posicao:null;
  const posicaoValida=!!saldoPos&&projDataValida(dataPosicao);
  const posicaoFutura=posicaoValida&&dataPosicao>hoje;
  const posicaoAntiga=posicaoValida&&dataPosicao<hoje;
  // Só uma posição do próprio dia libera a projeção. Posição antiga fica visível como histórico,
  // mas não reconstrói o caixa.
  const temSaldo=posicaoValida&&dataPosicao===hoje;
  const idadePosicao=posicaoValida?projDiasEntre(dataPosicao,hoje):null;

  const proj=React.useMemo(()=>{
    if(!temSaldo)return null;
    return buildProjecaoCaixa({
      entradas:carga.ent,contas:carga.con,dividas:carga.div,retiradas:carga.ret,
      empresaIds:idsChave?idsChave.split(','):[],prazos,
      saldoValor:projNum(saldoPos.valor),dataPosicao,hoje,horizonte,
    });
  },[carga,idsChave,prazos,saldoPos,dataPosicao,hoje,horizonte,temSaldo]);

  // Mesma projeção (mesmo motor, mesmas entradas), SEMPRE com horizonte fixo em 30 dias —
  // usada apenas pelo Aviso 2 do mural do Capital de Giro. Independe do seletor 30/60/90 acima.
  const proj30=React.useMemo(()=>{
    if(!temSaldo)return null;
    return buildProjecaoCaixa({
      entradas:carga.ent,contas:carga.con,dividas:carga.div,retiradas:carga.ret,
      empresaIds:idsChave?idsChave.split(','):[],prazos,
      saldoValor:projNum(saldoPos.valor),dataPosicao,hoje,horizonte:30,
    });
  },[carga,idsChave,prazos,saldoPos,dataPosicao,hoje,temSaldo]);

  const metricas=proj?proj.metricas:null;
  const conf=proj?projConfianca(proj.hist,idadePosicao,metricas):null;
  const janela=proj?proj.rows.filter(r=>r.futuro):[];
  // A projeção começa no dia seguinte à posição; a 1ª linha é amanhã.
  const linha1=janela.length?janela[0]:null;
  const saldoPosicao=projNum(saldoPos&&saldoPos.valor);

  // ── CAMADA 2 · HOJE — independe do saldo (ver nota em buildHojeCaixa) ──
  const hojeCaixa=React.useMemo(()=>buildHojeCaixa({
    entradas:carga.ent,contas:carga.con,dividas:carga.div,retiradas:carga.ret,
    empresaIds:idsChave?idsChave.split(','):[],prazos,hoje,
  }),[carga,idsChave,prazos,hoje]);

  // ── CAMADA 2 · EM CONTA — saldo operacional acumulado até hoje ──
  // Prioridade 1 (manual): se a posição mais recente em saldos_caixa_consolidados é de
  // hoje, ela É o Em Conta de hoje — não soma Entra/Sai/Sobra de novo (dupla contagem).
  // Prioridade 2 (automático): se a posição mais recente é anterior a hoje, acumula o
  // resultado diário (buildCaixaDoDia, mesmo motor de "Hoje") de (dataPosicao+1) até hoje.
  // Sem nenhuma posição histórica: null → "Saldo não informado" (nunca assume R$ 0,00).
  const emConta=React.useMemo(()=>{
    if(!posicaoValida||posicaoFutura)return{valor:null,origem:null};
    if(dataPosicao===hoje)return{valor:projNum(saldoPos.valor),origem:'manual'};
    const ids=idsChave?idsChave.split(','):[];
    let acumulado=projNum(saldoPos.valor);
    let d=addDays(dataPosicao,1),guarda=0;
    while(d<=hoje&&guarda<800){
      acumulado+=buildCaixaDoDia({
        entradas:carga.ent,contas:carga.con,dividas:carga.div,retiradas:carga.ret,
        empresaIds:ids,prazos,dataAlvo:d,
      }).sobra;
      d=addDays(d,1);guarda++;
    }
    return{valor:projCents(acumulado),origem:'automatico'};
  },[carga,idsChave,prazos,saldoPos,dataPosicao,hoje,posicaoValida,posicaoFutura]);

  // ── Histórico de saldos anteriores (painel "Em Conta") ──
  // Mesma fonte já persistida do Em Conta: saldos_caixa_consolidados. Cada linha é o saldo de
  // FECHAMENTO daquela data_posicao — ou seja, quanto sobrou em conta naquele período. A posição
  // de hoje fica no card principal e não se repete aqui. Máximo de 5 registros EXIBIDOS; nada é
  // apagado do banco. Duplicidade por período é impossível: a chave é (cliente_id, data_posicao).
  const saldoHistorico=React.useMemo(()=>
    (saldoLista||[]).filter(r=>r&&r.data_posicao!==hoje).slice(0,5)
  ,[saldoLista,hoje]);

  // ── CAMADA DE PREVISÃO 15/30/60 ──
  // A série é construída UMA vez para a janela cheia de 60 dias (amanhã → hoje+60).
  // Trocar 15/30/60 apenas fatia esse array em memória: nenhuma consulta nova ao Supabase.
  const serieProj=React.useMemo(()=>buildSerieProjecao({
    entradas:carga.ent,contas:carga.con,dividas:carga.div,retiradas:carga.ret,
    empresaIds:idsChave?idsChave.split(','):[],prazos,
    inicio:addDays(hoje,1),fim:addDays(hoje,60),
  }),[carga,idsChave,prazos,hoje]);

  const fcRows=React.useMemo(()=>serieProj.rows.slice(0,fcHorizonte),[serieProj,fcHorizonte]);

  // ── UMA ÚNICA VERDADE FINANCEIRA DA PROJEÇÃO ──
  // fcRows é a fatia da série diária correspondente ao horizonte selecionado. Dela — e
  // SÓ dela — derivam: a linha verde e a linha vermelha do gráfico, os totais da legenda,
  // "Vai entrar" / "Vai sair" / "Saldo no fim" e o Resumo semanal. Nenhum desses números
  // é recalculado por outra fonte; trocar 15/30/60 apenas refatia o array em memória.
  const fcTotais=React.useMemo(()=>({
    entradas:projCents(fcRows.reduce((s,r)=>s+projNum(r.entradas),0)),
    saidas:projCents(fcRows.reduce((s,r)=>s+projNum(r.saidas),0)),
  }),[fcRows]);

  // SALDO NO FIM — posição projetada ao término do horizonte.
  // Fórmula: saldo em conta hoje + entradas do horizonte − saídas do horizonte. É
  // EXATAMENTE a acumulação do cenário GARANTIDO de buildProjecaoCaixa (gar = saldo +
  // Σcomprometido − Σsaidas) sobre a mesma janela (amanhã → hoje+horizonte), porque
  // `serieProj.entradas` usa a mesma regra de projDataRecebimento que alimenta
  // `comprometido`. Não é uma fórmula concorrente — é o mesmo motor, reexpresso sobre a
  // série que já está em memória e que não depende de posição do próprio dia.
  // Capital de Giro NÃO entra: continua sendo reserva separada do caixa operacional.
  // Sem saldo em conta informado não há posição de partida → null (nunca assume zero).
  const fcSaldoFim=React.useMemo(()=>{
    if(emConta.valor==null)return null;
    return projCents(projNum(emConta.valor)+fcTotais.entradas-fcTotais.saidas);
  },[emConta,fcTotais]);

  // Resumo semanal — mesmas linhas de fcRows, agrupadas por semana civil.
  // LIMITE DE APRESENTAÇÃO: no máximo 5 semanas, sempre as 5 primeiras em ordem
  // cronológica. É um corte só de exibição, aplicado DEPOIS do agrupamento: rdpSemanas
  // (o motor) não muda, fcRows não muda, e o gráfico / Vai entrar / Vai sair / Saldo no
  // fim seguem lendo o horizonte inteiro. Nenhum valor é estimado ou completado — cada
  // semana continua sendo a soma dos recebimentos comprometidos e das despesas já
  // cadastradas daquelas datas, consolidados entre TODAS as unidades ativas do cliente.
  const RDP_MAX_SEMANAS=5;
  const fcSemanas=React.useMemo(()=>rdpSemanas(fcRows).slice(0,RDP_MAX_SEMANAS),[fcRows]);

  // ── Comparativo de HOJE contra ONTEM (chips de tendência de Entra/Sai) ──
  // Reaproveita buildCaixaDoDia — o MESMO motor de "Hoje", só com dataAlvo=ontem. Não é
  // métrica nova: é a mesma leitura de um dia, aplicada ao dia anterior. A carga já cobre
  // essa data (entradas desde hoje−(56|maxPrazo)−14; contas sem filtro; retiradas desde
  // hoje−90). Sem movimento ontem, rdpVariacao devolve null e o chip não é renderizado.
  const ontemCaixa=React.useMemo(()=>buildCaixaDoDia({
    entradas:carga.ent,contas:carga.con,dividas:carga.div,retiradas:carga.ret,
    empresaIds:idsChave?idsChave.split(','):[],prazos,dataAlvo:addDays(hoje,-1),
  }),[carga,idsChave,prazos,hoje]);

  // Variação do saldo em conta desde a ÚLTIMA posição registrada antes de hoje — dado real
  // de saldos_caixa_consolidados, não uma projeção. Ausente quando não há posição anterior.
  const heroTrend=React.useMemo(()=>{
    if(emConta.valor==null)return null;
    const ant=(saldoLista||[]).find(r=>r&&projDataValida(r.data_posicao)&&r.data_posicao<hoje);
    if(!ant)return null;
    const base=projNum(ant.valor);
    if(base===0)return null;
    const d=(projNum(emConta.valor)-base)/Math.abs(base)*100;
    if(!Number.isFinite(d))return null;
    return{pct:d,data:ant.data_posicao};
  },[emConta,saldoLista,hoje]);

  // ── Abrir editor do "Em Conta" a partir do card (pré-preenche com o valor calculado) ──
  const abrirEditorSaldo=()=>{
    setAviso(null);
    setForm({valor:emConta.valor==null?'':String(emConta.valor),data:hoje});
    setEditando(true);
  };

  // ── Gráfico (Chart.js, já disponível no projeto) ──
  const labels=janela.map(r=>fmtDate(r.data).slice(0,5));
  const idxMenor=metricas?janela.findIndex(r=>r.data===metricas.diaMenorGar):-1;
  const chartCfg={
    type:'line',
    data:{labels,datasets:[
      {label:'Zero',data:janela.map(()=>0),borderColor:'rgba(120,120,120,.45)',borderWidth:1,
       pointRadius:0,fill:false,tension:0,order:3},
      {label:'Garantido',data:janela.map(r=>r.saldoGar),borderColor:'#1B1C20',backgroundColor:'rgba(27,28,32,.06)',
       borderWidth:2.4,fill:true,tension:.25,order:1,
       pointRadius:janela.map((_,i)=>i===idxMenor?5:0),
       pointBackgroundColor:'#dc2626',pointBorderColor:'#fff',pointBorderWidth:2},
      ...(proj&&proj.hist.suficiente?[{label:'Provável',data:janela.map(r=>r.saldoProv),borderColor:'#16a34a',
       borderWidth:2,borderDash:[6,4],fill:false,tension:.25,pointRadius:0,order:2}]:[]),
    ]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{backgroundColor:'#1B1C20',padding:10,cornerRadius:8,
        callbacks:{label:c=>c.dataset.label==='Zero'?null:`${c.dataset.label}: ${fmt(c.parsed.y)}`}}},
      scales:{x:{grid:{display:false},ticks:{maxTicksLimit:10,font:{size:10}}},
              y:{grid:{color:'rgba(18,18,20,.06)'},ticks:{font:{size:10},callback:v=>fmt(v)}}}},
  };
  useChart(chartRef,chartCfg);

  // ── Gráfico da camada de previsão: Entradas × Saídas POR DIA (não acumulado) ──
  // Mesmos dados de sempre (fcRows); a linguagem visual é a do mockup: linhas de 2.5px com
  // ponta arredondada em #16a34a / #dc2626, áreas em degradê da cor até transparente,
  // grid horizontal pontilhado #eef0f4 (4 5) sem grid vertical, rótulos 11px #94a3b8 e
  // tooltip carbon com raio 8. Chart.js já existente — nenhuma biblioteca ou CDN novo.
  const fcLabels=fcRows.map(r=>`${r.data.slice(8,10)} ${(MONTHS_SHORT[Number(r.data.slice(5,7))-1]||'').toLowerCase()}`);
  // Degradê do mockup: stop 0 = cor com alfa (0.14 verde / 0.16 vermelho), stop 100% = 0.
  const fcFill=(cor,alfa)=>ctx=>{
    const{ctx:c,chartArea}=ctx.chart;
    if(!chartArea)return `rgba(${cor},0)`;
    const g=c.createLinearGradient(0,chartArea.top,0,chartArea.bottom);
    g.addColorStop(0,`rgba(${cor},${alfa})`);
    g.addColorStop(1,`rgba(${cor},0)`);
    return g;
  };
  // Acabamento do mockup, desenhado explicitamente — puramente decorativo, não lê nem
  // altera nenhum valor. Duas coisas que a config declarativa do Chart.js 4 não entrega
  // do jeito da referência:
  //   1. grid horizontal PONTILHADO (#eef0f4, traço 4 5) — em v4 `grid.borderDash` passou
  //      a valer para a borda do eixo, não para as linhas-guia;
  //   2. linha vertical pontilhada no ponto sob o cursor.
  const fcSkin={
    id:'rdpSkin',
    beforeDatasetsDraw(chart){
      const y=chart.scales&&chart.scales.y;
      if(!y)return;
      const{ctx:c,chartArea}=chart;
      c.save();
      c.setLineDash([4,5]);c.lineWidth=1;c.strokeStyle='#eef0f4';
      (y.ticks||[]).forEach((_,i)=>{
        const py=Math.round(y.getPixelForTick(i))+.5;
        c.beginPath();c.moveTo(chartArea.left,py);c.lineTo(chartArea.right,py);c.stroke();
      });
      c.restore();
    },
    afterDatasetsDraw(chart){
      const act=chart.tooltip&&chart.tooltip.getActiveElements&&chart.tooltip.getActiveElements();
      if(!act||!act.length)return;
      const{ctx:c,chartArea}=chart;
      const x=act[0].element.x;
      c.save();
      c.beginPath();c.setLineDash([3,3]);c.lineWidth=1;c.strokeStyle='rgba(148,163,184,.75)';
      c.moveTo(x,chartArea.top);c.lineTo(x,chartArea.bottom);c.stroke();
      c.restore();
    },
  };
  const fcCfg={
    type:'line',
    plugins:[fcSkin],
    data:{labels:fcLabels,datasets:[
      {label:'Entradas',data:fcRows.map(r=>r.entradas),borderColor:'#16a34a',backgroundColor:fcFill('22,163,74',.14),
       borderWidth:2.5,borderCapStyle:'round',fill:true,tension:.35,pointRadius:0,pointHoverRadius:5.5,
       pointHoverBackgroundColor:'#fff',pointHoverBorderColor:'#16a34a',pointHoverBorderWidth:3,order:1},
      {label:'Saídas',data:fcRows.map(r=>r.saidas),borderColor:'#dc2626',backgroundColor:fcFill('220,38,38',.16),
       borderWidth:2.5,borderCapStyle:'round',fill:true,tension:.35,pointRadius:0,pointHoverRadius:5.5,
       pointHoverBackgroundColor:'#fff',pointHoverBorderColor:'#dc2626',pointHoverBorderWidth:3,order:2},
    ]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      layout:{padding:{top:6}},
      plugins:{legend:{display:false},tooltip:{
        backgroundColor:'#1B1C20',padding:10,cornerRadius:8,displayColors:true,boxWidth:8,boxHeight:8,boxPadding:4,
        titleFont:{size:11,weight:'600'},titleColor:'rgba(255,255,255,.72)',
        bodyFont:{size:12.5,weight:'700'},bodyColor:'#fff',
        callbacks:{
          title:it=>{const i=it&&it[0]?it[0].dataIndex:-1;const r=fcRows[i];return r?fmtDate(r.data):'';},
          label:c=>`${c.dataset.label}: ${fmt(c.parsed.y)}`,
        }}},
      // Densidade dos rótulos do mockup (5 marcas em 15 dias) escalada por horizonte,
      // para que 60 dias não polua o eixo. Eixo Y em BRL compacto (fcEixoY), com a mesma
      // quantidade de linhas-guia do mockup (4–5).
      scales:{x:{grid:{display:false},border:{display:false},
                 ticks:{maxTicksLimit:fcHorizonte<=15?5:(fcHorizonte<=30?7:9),font:{size:11,weight:'500'},
                        color:'#94a3b8',autoSkip:true,maxRotation:0,padding:6}},
              y:{beginAtZero:true,border:{display:false},grid:{display:false},
                 ticks:{font:{size:11,weight:'500'},color:'#94a3b8',maxTicksLimit:5,padding:8,callback:v=>fcEixoY(v)}}}},
  };
  useChart(fcRef,fcCfg);

  // ── Gravação do saldo consolidado ──
  const salvarSaldo=async()=>{
    setAviso(null);
    const valor=parseNum(form.valor);
    if(!projDataValida(form.data)){setAviso({tipo:'erro',texto:'Informe uma data válida.'});return;}
    if(form.data>hoje){setAviso({tipo:'erro',texto:'A data da posição não pode ser futura.'});return;}
    if(!clienteId){setAviso({tipo:'erro',texto:'Não foi possível identificar o cliente.'});return;}
    if(!Number.isFinite(valor)){setAviso({tipo:'erro',texto:'Informe um valor válido.'});return;}
    setSalvando(true);
    try{
      // atualizado_em / atualizado_por são controlados pelo trigger do banco.
      const{error}=await supabase.from('saldos_caixa_consolidados')
        .upsert({cliente_id:clienteId,data_posicao:form.data,valor},{onConflict:'cliente_id,data_posicao'});
      if(error)throw error;
      const{data,error:errLer}=await supabase.from('saldos_caixa_consolidados')
        .select('cliente_id,data_posicao,valor,atualizado_em')
        .eq('cliente_id',clienteId).order('data_posicao',{ascending:false}).limit(6);
      if(errLer)throw errLer;
      const lista=data||[];
      const pos=lista[0]||null;
      setSaldoPos(pos);
      setSaldoLista(lista);
      if(pos)setForm({valor:String(pos.valor),data:pos.data_posicao});
      setEditando(false);
      setAviso({tipo:'ok',texto:'Saldo atualizado.'});
    }catch(err){
      console.error('Erro ao salvar o saldo consolidado:',err);
      const msg=String((err&&(err.message||err.details))||'');
      if(/row-level security|permission denied|violates/i.test(msg)){
        setAviso({tipo:'ro',texto:'Seu acesso é somente leitura. Peça a um administrador para atualizar o saldo.'});
      }else{
        setAviso({tipo:'erro',texto:'Não foi possível salvar. '+(msg||'Tente novamente.')});
      }
    }finally{setSalvando(false);}
  };

  // ── Estados de carregamento / vazio ──
  if(carga.estado==='sem-empresas')
    return <div className="prx-proj-wrap"><div className="prx-proj-vazio">Nenhuma unidade ativa neste cliente. A projeção precisa de ao menos uma unidade ativa.</div></div>;
  if(carga.estado==='carregando'||carga.estado==='idle')
    return <div className="prx-proj-wrap"><div className="prx-proj-vazio">Carregando a projeção…</div></div>;
  if(carga.estado==='erro')
    return <div className="prx-proj-wrap"><div className="prx-proj-vazio erro">Não foi possível carregar os dados da projeção. Verifique a conexão e tente novamente.</div></div>;

  const stMeta={
    verde:{cls:'ok',titulo:`Dá para pagar tudo nos próximos ${horizonte} dias.`},
    amarelo:{cls:'warn',titulo:'O caixa depende de manter o ritmo atual de vendas.'},
    vermelho:{cls:'danger',titulo:metricas&&metricas.primeiroNegProv
      ? `Pode faltar dinheiro a partir de ${fmtDate(metricas.primeiroNegProv)}.`
      : 'O caixa fica negativo dentro do período.'},
  };
  const st=metricas?stMeta[metricas.status]:null;
  const numeroHero=metricas
    ? (metricas.status==='verde'?metricas.menorSaldoGar:(metricas.deficitMax>0?-metricas.deficitMax:metricas.menorSaldoProv))
    : 0;

  // ── APRESENTAÇÃO DO REDESIGN — derivações puramente visuais, sem cálculo financeiro ──
  const emContaValor=emConta.valor;
  const emContaFoot=emConta.origem==='manual'?'Saldo informado hoje'
    :(emConta.origem==='automatico'?'Saldo acumulado desde a última posição':'Informe o saldo em conta');
  const entraHoje=hojeCaixa.entraHoje,saiHoje=hojeCaixa.saiHoje,sobraHoje=hojeCaixa.sobraHoje;
  // Proporção do movimento do dia — é o número que desenha as barras dos cards (mockup).
  const movHoje=projNum(entraHoje)+projNum(saiHoje);
  const pctEntraHoje=movHoje>0?Math.round(projNum(entraHoje)/movHoje*100):0;
  const pctSaiHoje=movHoje>0?100-pctEntraHoje:0;
  const sobraCls=sobraHoje>0?'pos':(sobraHoje<0?'neg':'flat');
  // Chips de tendência de Entra/Sai contra ontem. A cor segue o que a variação significa
  // para o caixa: mais entradas é bom, mais saídas é ruim.
  const varEntra=rdpVariacao(entraHoje,ontemCaixa.entra);
  const varSai=rdpVariacao(saiHoje,ontemCaixa.sai);
  // Seletor de horizonte — o MESMO estado para os dois segmentados do mockup.
  const segHorizonte=(
    <div className="prx-rdp-seg" role="group" aria-label="Horizonte da projeção">
      {[15,30,60].map(h=>(
        <button key={h} type="button" className={fcHorizonte===h?'on':''}
          onClick={()=>setFcHorizonte(h)} aria-pressed={fcHorizonte===h}>{h}d</button>
      ))}
    </div>
  );
  const fimHorizonte=addDays(hoje,fcHorizonte);

  return(
    <div className="prx-rdp">
      {/* ══ BLOCO 1 · HERO — Saldo acumulado · Capital de giro · Sobra prevista hoje ══ */}
      <div className="prx-rdp-row prx-rdp-r-hero">

        {/* SALDO ACUMULADO EM CONTA — card herói papaya. O valor é o MESMO `emConta`
            que o sistema já usava (posição manual de hoje em saldos_caixa_consolidados
            ou acumulado por buildCaixaDoDia desde a última posição). Não usa
            config.saldoInicial nem Capital de Giro. A subdivisão Principal/Reserva/Caixa
            do mockup foi omitida por decisão do produto: não existe base no banco e
            preenchê-la seria inventar dado. */}
        <div className="prx-rdp-card prx-rdp-hero prx-rdp-accent">
          <div className="prx-rdp-sheen"></div>
          <div className="prx-rdp-chead">
            <div className="prx-rdp-label">
              <span className="prx-rdp-ichip">{RdpIcon.card}</span>
              Saldo acumulado em conta
            </div>
            <div className="prx-rdp-hero-tools">
              {heroTrend&&(
                <span className="prx-rdp-trend on-brand"
                  title={`Variação desde a posição de ${fmtDate(heroTrend.data)}`}>
                  {heroTrend.pct>=0?RdpIcon.chevronUp:RdpIcon.chevron}
                  {Math.abs(heroTrend.pct).toLocaleString('pt-BR',{maximumFractionDigits:1})}%
                </span>
              )}
              <button type="button" className="prx-rdp-hero-edit" onClick={abrirEditorSaldo}
                aria-label="Editar saldo em conta" title="Editar saldo em conta">✎</button>
            </div>
          </div>
          <div className={`prx-rdp-hero-value prx-rdp-num${emContaValor==null?' muted':''}`}>
            {emContaValor==null?'Saldo ainda não informado':fmt(emContaValor)}
          </div>
          <div className="prx-rdp-hero-meta">{emContaFoot}</div>
        </div>

        {/* CAPITAL DE GIRO — componente existente, agora renderizando só o card. */}
        <CapitalDeGiroLayer
          clienteId={clienteId}
          hoje={hoje}
          horizonte={horizonte}
          metricas={metricas}
          conf={conf}
          proj30={proj30}
          emConta={emConta}
          saldoHistorico={saldoHistorico}
          onEditarSaldo={abrirEditorSaldo}
          entraHoje={entraHoje}
          saiHoje={saiHoje}
          sobraHoje={sobraHoje}
        />

        {/* SOBRA PREVISTA HOJE — buildHojeCaixa.sobraHoje (Entra − Sai de hoje). */}
        <div className="prx-rdp-card prx-rdp-stat">
          <div className="prx-rdp-chead">
            <div className="prx-rdp-label">
              <span className={`prx-rdp-ichip ${sobraCls==='flat'?'':sobraCls}`}>{RdpIcon.seta}</span>
              Sobra prevista hoje
            </div>
          </div>
          <div className={`prx-rdp-stat-value prx-rdp-num ${sobraCls}`}>{fmt(sobraHoje)}</div>
          <div className="prx-rdp-foot">
            <span className="prx-rdp-meta">Entradas − saídas de hoje</span>
            <span className={`prx-rdp-trend ${sobraCls}`}>
              {sobraHoje<0?'déficit':(sobraHoje>0?'superávit':'neutro')}
            </span>
          </div>
          <div className="prx-rdp-bar">
            <span style={{width:`${pctEntraHoje}%`,background:'var(--rdp-pos)'}}></span>
            <span style={{flex:1,background:'var(--rdp-line)'}}></span>
          </div>
        </div>
      </div>

      {/* ══ BLOCO 2 · MOVIMENTO DE HOJE — os três valores de buildHojeCaixa ══ */}
      <div className="prx-rdp-section">
        <span className="tk"></span><span className="t">Movimento de hoje</span><span className="rule"></span>
      </div>
      <div className="prx-rdp-row prx-rdp-r-today">
        <div className="prx-rdp-card prx-rdp-stat">
          <div className="prx-rdp-chead">
            <div className="prx-rdp-label"><span className="prx-rdp-ichip pos">{RdpIcon.baixo}</span>Entra hoje</div>
          </div>
          <div className="prx-rdp-stat-value prx-rdp-num pos">{entraHoje>0?'+':''}{fmt(entraHoje)}</div>
          <div className="prx-rdp-foot">
            <span className="prx-rdp-meta">Recebimentos previstos</span>
            {varEntra!==null&&(
              <span className={`prx-rdp-trend ${varEntra>=0?'pos':'neg'}`} title="Comparado a ontem">
                {rdpPct(varEntra)}
              </span>
            )}
          </div>
          <div className="prx-rdp-bar">
            <span style={{width:`${pctEntraHoje}%`,background:'var(--rdp-pos)'}}></span>
            <span style={{flex:1,background:'var(--rdp-line)'}}></span>
          </div>
        </div>

        <div className="prx-rdp-card prx-rdp-stat">
          <div className="prx-rdp-chead">
            <div className="prx-rdp-label"><span className="prx-rdp-ichip neg">{RdpIcon.cima}</span>Sai hoje</div>
          </div>
          <div className="prx-rdp-stat-value prx-rdp-num neg">{saiHoje>0?fmt(-saiHoje):fmt(0)}</div>
          <div className="prx-rdp-foot">
            <span className="prx-rdp-meta">Pagamentos previstos</span>
            {varSai!==null&&(
              <span className={`prx-rdp-trend ${varSai>0?'neg':'pos'}`} title="Comparado a ontem">
                {rdpPct(varSai)}
              </span>
            )}
          </div>
          <div className="prx-rdp-bar">
            <span style={{width:`${pctSaiHoje}%`,background:'var(--rdp-neg)'}}></span>
            <span style={{flex:1,background:'var(--rdp-line)'}}></span>
          </div>
        </div>

        <div className="prx-rdp-card prx-rdp-stat">
          <div className="prx-rdp-chead">
            <div className="prx-rdp-label"><span className="prx-rdp-ichip warn">{RdpIcon.grafico}</span>Resultado do dia</div>
          </div>
          <div className={`prx-rdp-stat-value prx-rdp-num ${sobraCls}`}>{fmt(sobraHoje)}</div>
          <div className="prx-rdp-foot">
            <span className="prx-rdp-meta">Saldo líquido do dia</span>
            <span className={`prx-rdp-trend ${sobraCls}`}>
              {sobraHoje<0?'negativo':(sobraHoje>0?'positivo':'neutro')}
            </span>
          </div>
          <div className="prx-rdp-bar">
            <span style={{width:`${pctEntraHoje}%`,background:'var(--rdp-pos)'}}></span>
            <span style={{width:`${pctSaiHoje}%`,background:'var(--rdp-neg)'}}></span>
          </div>
        </div>
      </div>

      {/* ══ BLOCO 3 · PROJEÇÃO — valores projetados + gráfico Entradas × Saídas.
          Ambos os painéis leem a MESMA fatia fcRows de buildSerieProjecao, que reaproveita
          projDataRecebimento e mergeContasComParcelas. Nenhuma regra financeira nova; o
          gráfico mostra o montante POR DIA (não acumulado). ══ */}
      <div className="prx-rdp-section">
        <span className="tk"></span><span className="t">Projeção</span><span className="rule"></span>
      </div>
      <div className="prx-rdp-row prx-rdp-r-split">
        <div className="prx-rdp-card">
          <div className="prx-rdp-proj-head">
            <div>
              <div className="prx-rdp-proj-title">Valores projetados</div>
              <div className="prx-rdp-proj-sub">até {fmtDate(fimHorizonte)}</div>
            </div>
            {segHorizonte}
          </div>
          <div className="prx-rdp-proj-grid">
            <div className="prx-rdp-mini">
              <div className="mh"><span className="idot pos">{RdpIcon.miniBaixo}</span><span className="n">Vai entrar</span></div>
              <div className="v pos prx-rdp-num" title={fmt(fcTotais.entradas)}>{rdpFmt0(fcTotais.entradas)}</div>
              <div className="d">próximos {fcHorizonte} dias</div>
            </div>
            <div className="prx-rdp-mini">
              <div className="mh"><span className="idot neg">{RdpIcon.miniCima}</span><span className="n">Vai sair</span></div>
              <div className="v neg prx-rdp-num" title={fmt(fcTotais.saidas)}>{rdpFmt0(fcTotais.saidas)}</div>
              <div className="d">próximos {fcHorizonte} dias</div>
            </div>
            <div className={`prx-rdp-mini${fcSaldoFim==null?'':(fcSaldoFim<0?' accent-neg':' accent-pos')}`}>
              <div className="mh">
                <span className={`idot ${fcSaldoFim==null?'brand':(fcSaldoFim<0?'neg':'pos')}`}>{RdpIcon.miniGlobo}</span>
                <span className="n">Saldo no fim</span>
              </div>
              <div className={`v prx-rdp-num${fcSaldoFim==null?'':(fcSaldoFim<0?' neg':' pos')}`}
                title={fcSaldoFim==null?'':fmt(fcSaldoFim)}>
                {fcSaldoFim==null?'—':rdpFmt0(fcSaldoFim)}
              </div>
              <div className="d">
                {fcSaldoFim==null?'informe o saldo em conta':`posição em ${fmtDate(fimHorizonte).slice(0,5)}`}
              </div>
            </div>
          </div>
        </div>

        <div className="prx-rdp-card">
          <div className="prx-rdp-chart-head">
            <div>
              <div className="prx-rdp-chart-title">Entradas × Saídas</div>
              <div className="prx-rdp-legend">
                <span className="li"><span className="prx-rdp-dot pos"></span>Entradas
                  <b className="prx-rdp-num">{rdpFmt0(fcTotais.entradas)}</b></span>
                <span className="li"><span className="prx-rdp-dot neg"></span>Saídas
                  <b className="prx-rdp-num">{rdpFmt0(fcTotais.saidas)}</b></span>
              </div>
            </div>
            {segHorizonte}
          </div>
          {fcRows.length===0?(
            <div className="prx-rdp-chart-vazio">Sem movimentos previstos para os próximos dias.</div>
          ):(
            <div className="prx-rdp-canvas"><canvas ref={fcRef}></canvas></div>
          )}
        </div>
      </div>

      {/* ══ BLOCO 4 · RESUMO SEMANAL — agrupamento por semana civil das MESMAS linhas
          verde/vermelha de fcRows. Nenhum valor é recalculado por outra fonte. ══ */}
      <div className="prx-rdp-section">
        <span className="tk"></span>
        {/* O período do título passa a ser o das semanas EXIBIDAS (≤5), não o do horizonte
            inteiro — senão o rótulo anunciaria meses que a tabela deixou de mostrar.
            Mesmo helper de sempre, alimentado com o primeiro e o último dia exibidos. */}
        <span className="t">Resumo semanal{fcSemanas.length?` · ${rdpTituloPeriodo([{data:fcSemanas[0].ini},{data:fcSemanas[fcSemanas.length-1].fim}])}`:''}</span>
        <span className="rule"></span>
      </div>
      <div className="prx-rdp-card prx-rdp-tablecard">
        {fcSemanas.length===0?(
          <div className="prx-rdp-table-vazio">Sem movimentos previstos no período selecionado.</div>
        ):(
          <div className="prx-rdp-tablewrap">
            <table className="prx-rdp-table">
              <thead>
                <tr>
                  <th>Semana e período</th>
                  <th>Entradas</th>
                  <th>Saídas</th>
                  <th>Resultado</th>
                  <th>Situação</th>
                </tr>
              </thead>
              <tbody>
                {fcSemanas.map(s=>(
                  <tr key={s.ini}>
                    <td>
                      <div className="prx-rdp-week">
                        <span className="prx-rdp-wk-ic">S{s.n}</span>
                        <div>
                          <div className="wn">Semana {s.n}</div>
                          <div className="wp">{rdpPeriodo(s.ini,s.fim)}</div>
                        </div>
                      </div>
                    </td>
                    <td className="pos prx-rdp-num">{rdpFmt0(s.entradas)}</td>
                    <td className="neg prx-rdp-num">{rdpFmt0(s.saidas)}</td>
                    <td className={`${s.cls} prx-rdp-num`}>{s.resultado>0?'+':''}{rdpFmt0(s.resultado)}</td>
                    <td><span className={`prx-rdp-pill ${s.cls}`}><span className="pd"></span>{s.situacao}</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {/* ── EDITAR SALDO EM CONTA — reutiliza o mecanismo existente de gravação em
          saldos_caixa_consolidados (salvarSaldo); data_posicao é sempre hoje aqui. ── */}
      {editando&&(
        <Modal title="Atualizar saldo em conta" onClose={()=>{setEditando(false);setAviso(null);}}>
          <div className="form-grid">
            <div className="fg full"><label>Saldo calculado</label><div>{emConta.valor==null?'—':fmt(emConta.valor)}</div></div>
            <div className="fg full"><label>Saldo real em conta</label>
              <input type="text" inputMode="decimal" placeholder="R$ 0,00" value={form.valor}
                onChange={e=>setForm({...form,valor:e.target.value})}/>
            </div>
          </div>
