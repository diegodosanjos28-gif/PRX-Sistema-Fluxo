<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRX — Gestão de Caixa</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --zanon-red:#c0392b;--zanon-red-dark:#a93226;
  --zanon-yellow:#f5c518;
  /* Verde Petronas — destaque visual principal do header e elementos ativos */
  --petronas:#00A19B;--petronas-dark:#008C86;--petronas-soft:rgba(0,161,155,.12);
  /* Cinza chumbo do header (mais claro que preto) */
  --header-charcoal:#2F3437;--header-charcoal-soft:#3A4045;
  --green:#16a34a;--green-light:#f0fdf4;--green-dim:#15803d;--green-mid:#4ade80;
  --amber:#d97706;--amber-light:#fffbeb;--amber-dim:#b45309;
  --red:#dc2626;--red-light:#fef2f2;--red-dim:#b91c1c;
  --blue:#2563eb;--blue-light:#eff6ff;--blue-dim:#1d4ed8;
  --purple:#7c3aed;--purple-light:#f5f3ff;
  --papaya:#E8760A;--papaya-dark:#CF6800;--papaya-soft:rgba(232,118,10,.10);
  --carbon:#1B1C20;--carbon-soft:#272830;
  --ink-900:#0f172a;--ink-800:#1e293b;--ink-700:#334155;
  --ink-500:#64748b;--ink-400:#94a3b8;--ink-300:#cbd5e1;
  --ink-200:#e2e8f0;--ink-100:#f1f5f9;--ink-50:#f8fafc;
  --text-primary:#0f172a;--text-secondary:#475569;--text-muted:#94a3b8;
  --border:#dcdcd6;
  /* Fundo off-white acinzentado McLaren-inspired */
  --bg:#E8E7E3;--surface:#ffffff;--surface-2:#f4f3ef;
  /* Header premium em cinza chumbo (charcoal) */
  --header-bg:#1B1C20;
  --header-border:rgba(255,255,255,.10);
  --header-text:#F0EFEB;
  --header-text-muted:#8E9099;
  --radius:10px;--radius-sm:7px;--radius-xs:5px;
  --shadow-xs:0 1px 2px rgba(15,23,42,0.04);
  --shadow:0 1px 3px rgba(15,23,42,0.06),0 1px 2px rgba(15,23,42,0.04);
  --shadow-md:0 4px 18px rgba(15,23,42,0.08);
  --shadow-lg:0 8px 28px rgba(15,23,42,0.12);
  --shadow-header:0 1px 0 rgba(15,23,42,0.04),0 2px 12px rgba(15,23,42,0.05);
}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text-primary);min-height:100vh;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}

/* APP SHELL */
.app-shell{display:flex;flex-direction:column;min-height:100vh;}

/* TOP HEADER — Carbon premium com acento Papaya */
.app-header{
  background:var(--header-bg);
  height:54px;
  display:flex;
  align-items:center;
  padding:0 28px;
  gap:18px;
  position:sticky;top:0;z-index:100;
  border-bottom:1px solid var(--papaya);
  border-radius:0;
  margin:0;
  width:100%;
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 4px 16px rgba(18,18,20,.14);
}
.hdr-logo{
  display:flex;align-items:center;flex-shrink:0;
  background:#ffffff;
  padding:5px 11px;
  border-radius:7px;
  box-shadow:0 1px 2px rgba(18,18,20,.22),0 0 0 1px rgba(255,255,255,.04);
}
/* Logo exclusiva do cliente Picanhas Grill — proporção própria (emblema ~1.88:1), não usada por outros clientes */
.hdr-logo-picanhas{height:38px;width:auto;max-width:72px;display:block;object-fit:contain;object-position:center;}
/* Container da logo do Picanhas Grill: sem caixa branca — funde ao header escuro (não afeta .hdr-logo padrão dos demais clientes) */
.hdr-logo.hdr-logo-picanhas-wrap{background:transparent;box-shadow:none;}
.hdr-div{width:1px;height:30px;background:var(--header-border);flex-shrink:0;}
.hdr-nav{display:flex;align-items:stretch;gap:2px;flex:1;overflow:hidden;height:100%;}
.hdr-grp{display:flex;align-items:stretch;gap:2px;height:100%;}
.hdr-grp-lbl{
  font-size:9.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--header-text-muted);
  padding:0 7px 0 12px;white-space:nowrap;
  display:flex;align-items:center;
}
.hdr-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:0 13px;height:100%;
  cursor:pointer;
  color:var(--header-text);
  font-size:11.5px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;
  transition:color .15s;
  border:none;background:none;
  font-family:'DM Sans',sans-serif;white-space:nowrap;
  position:relative;
}
.hdr-btn::after{
  content:'';position:absolute;left:13px;right:13px;bottom:0;
  height:2.5px;background:transparent;
  transition:background .15s;
  border-radius:1px;
}
.hdr-btn:hover{color:var(--papaya);}
.hdr-btn.active{color:#ffffff;}
.hdr-btn.active::after{background:var(--papaya);}
.hdr-btn .dot{display:none;}
.hdr-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0;}
.hdr-date{
  font-size:11.5px;color:var(--header-text-muted);white-space:nowrap;
  letter-spacing:.04em;text-transform:capitalize;
}
.hdr-clear{
  display:inline-flex;align-items:center;gap:5px;
  padding:8px 14px;
  font-size:11px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  cursor:pointer;
  border:1px solid var(--header-border);
  background:transparent;
  color:var(--header-text);
  font-family:'DM Sans',sans-serif;
  transition:all .15s;
  border-radius:2px;
}
.hdr-clear:hover{
  background:rgba(255,255,255,.06);
  color:#ffffff;
  border-color:rgba(255,255,255,.20);
}

/* PAGE */
.page-wrap{padding:14px 20px;flex:1;}
.page-hdr{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid rgba(15,23,42,0.08);flex-wrap:wrap;}
.page-hdr-l{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.page-hdr-r{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap;}
.page-hdr-ico{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-xs);}
.page-hdr-title{font-size:16px;font-weight:700;color:var(--text-primary);letter-spacing:-.02em;line-height:1;}
.page-hdr-sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
/* Divisória sutil entre o título e o seletor de meses na linha interna */
.page-hdr-sep{width:1px;height:22px;background:rgba(15,23,42,0.10);flex-shrink:0;margin:0 2px;}
/* Atalho "Projeção" na linha interna do Painel do Dono */
.page-hdr-shortcut{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.04em;cursor:pointer;border:1px solid rgba(232,118,10,.30);background:var(--papaya-soft);color:var(--papaya-dark);font-family:'DM Sans',sans-serif;transition:all .15s;box-shadow:var(--shadow-xs);white-space:nowrap;}
.page-hdr-shortcut:hover{background:rgba(232,118,10,.17);color:var(--papaya-dark);border-color:rgba(232,118,10,.45);}
.page-hdr-shortcut.active{background:var(--papaya);color:#fff;border-color:var(--papaya);}
/* Acesso compacto à aba Projeção, ao lado do ícone de Portfólio no header.
   Chumbo sobre o header carbon: base em --carbon-soft, realces na mesma
   linguagem rgba já usada pelo botão de Portfólio. Classe exclusiva. */
.prx-proj-nav{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:6px;flex-shrink:0;padding:0;cursor:pointer;background:var(--carbon-soft);border:1px solid var(--header-border);color:rgba(255,255,255,.55);transition:all .15s;}
.prx-proj-nav:hover{background:rgba(255,255,255,.13);color:var(--header-text);border-color:rgba(255,255,255,.22);}
.prx-proj-nav.active{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.34);}
.prx-proj-nav:focus-visible{outline:2px solid var(--header-text);outline-offset:2px;}
/* Logo PRX no canto direito da linha interna */
.page-hdr-prx{display:inline-flex;align-items:center;height:30px;opacity:.88;}
.page-hdr-prx img{height:30px;width:auto;display:block;}
/* Variante compacta da month-bar para uso inline no cabeçalho de página */
.month-bar-inline{display:flex;align-items:center;gap:5px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 8px;box-shadow:var(--shadow-xs);}
@media(max-width:780px){
  .page-hdr-r{margin-left:0;width:100%;}
}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .12s;font-family:'DM Sans',sans-serif;}
.btn-primary{background:var(--green);color:white;}
.btn-primary:hover{background:var(--green-dim);}
.btn-secondary{background:var(--surface);color:var(--text-secondary);border:1px solid var(--border);box-shadow:var(--shadow-xs);}
.btn-secondary:hover{background:var(--surface-2);}
.btn-danger{background:var(--red-light);color:var(--red-dim);}
.btn-danger:hover{background:#fecaca;}
.btn-sm{padding:5px 10px;font-size:12px;}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow);}
.card-title{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin-bottom:9px;}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:500;}
.bg{background:var(--green-light);color:var(--green-dim);}
.br{background:var(--red-light);color:var(--red-dim);}
.ba{background:var(--amber-light);color:var(--amber-dim);}
.bb{background:var(--blue-light);color:var(--blue-dim);}
.bp{background:var(--purple-light);color:var(--purple);}

/* TABLE */
.tw{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--surface-2);padding:8px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:8px 12px;border-bottom:1px solid var(--border);color:var(--text-secondary);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--ink-50);}
.row-warn{background:#fffbeb!important;}
.row-danger{background:#fef2f2!important;}

/* FORM */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;}
.fg{display:flex;flex-direction:column;gap:4px;}
.fg.full{grid-column:1/-1;}
label{font-size:12px;font-weight:500;color:var(--text-secondary);}
input,select,textarea{padding:8px 11px;border:1px solid var(--border);border-radius:var(--radius-xs);font-size:13px;font-family:'DM Sans',sans-serif;color:var(--text-primary);background:var(--surface);transition:border-color .12s;outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 2px rgba(22,163,74,.1);}
textarea{resize:vertical;min-height:58px;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px);}
.modal{background:var(--surface);border-radius:var(--radius);padding:18px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);}

/* EMPTY */
.empty{text-align:center;padding:34px 20px;color:var(--text-muted);}
.empty-icon{font-size:24px;margin-bottom:6px;}

/* UTILS */
.flex{display:flex;}.items-center{align-items:center;}.justify-between{justify-content:space-between;}
.gap-2{gap:8px;}.gap-3{gap:12px;}.mb-2{margin-bottom:8px;}.mb-3{margin-bottom:12px;}.mb-4{margin-bottom:16px;}.mt-2{margin-top:8px;}.mt-3{margin-top:12px;}

/* ALERT */
.alert{border-radius:var(--radius-xs);padding:8px 11px;font-size:12px;margin-bottom:8px;display:flex;align-items:flex-start;gap:8px;}
.alert-r{background:var(--red-light);color:#7f1d1d;border-left:3px solid var(--red);}
.alert-a{background:var(--amber-light);color:#78350f;border-left:3px solid var(--amber);}
.alert-g{background:var(--green-light);color:#14532d;border-left:3px solid var(--green);}

/* METRICS */
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px;}
.metric-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow-xs);}
.metric-label{font-size:11px;color:var(--text-muted);font-weight:500;margin-bottom:3px;}
.metric-value{font-size:20px;font-weight:700;color:var(--text-primary);line-height:1.1;letter-spacing:-.03em;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.metric-value.green{color:var(--green);}.metric-value.red{color:var(--red);}.metric-value.amber{color:var(--amber);}
.metric-sub{font-size:11px;color:var(--text-muted);}
/* Variante específica da aba Entradas — cards um pouco maiores, com mais espaço para números */
.metrics-grid.entradas-grid{grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:10px;}
.metrics-grid.entradas-grid .metric-card{padding:14px 17px;}

/* Seletor de categoria — cabeçalho da Agenda do Dia (Contas a Pagar) */
.cat-chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);transition:background .15s,color .15s,border-color .15s;font-family:'DM Sans',sans-serif;}
.cat-chip:hover{background:var(--surface-2);}
.cat-chip.active{background:var(--papaya);border-color:var(--papaya);color:#ffffff;}
.cat-chips-wrap{display:flex;flex-wrap:wrap;gap:5px;}
.metrics-grid.entradas-grid .metric-label{font-size:11.5px;margin-bottom:5px;}
.metrics-grid.entradas-grid .metric-value{font-size:22px;margin-bottom:4px;letter-spacing:-.035em;}
.metrics-grid.entradas-grid .metric-sub{font-size:10.5px;line-height:1.35;white-space:normal;}
.agenda-dia-lista{max-height:360px;overflow-y:auto;padding-right:4px;}
.agenda-dia-lista::-webkit-scrollbar{width:6px;}
.agenda-dia-lista::-webkit-scrollbar-track{background:transparent;}
.agenda-dia-lista::-webkit-scrollbar-thumb{background:var(--ink-200);border-radius:3px;}
.agenda-dia-lista::-webkit-scrollbar-thumb:hover{background:var(--ink-300);}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.section-title{font-size:14px;font-weight:600;}
.exec-reading{background:var(--ink-900);color:white;border-radius:var(--radius);padding:13px 16px;margin-bottom:12px;}
.exec-reading-label{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:6px;}
.exec-reading-text{font-size:13px;line-height:1.6;color:rgba(255,255,255,.85);}
.pressao-bar-bg{height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.pressao-bar{height:100%;border-radius:3px;}
.diag-item{display:flex;gap:9px;padding:9px 12px;border-radius:var(--radius-xs);border:1px solid var(--border);background:var(--surface);margin-bottom:6px;font-size:12px;color:var(--text-secondary);line-height:1.5;}
.action-item{display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:var(--radius-xs);background:var(--surface-2);margin-bottom:4px;font-size:12px;color:var(--text-secondary);}
.action-num{width:17px;height:17px;border-radius:50%;background:var(--green);color:white;font-size:9px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* MONTH BAR */
.month-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:6px 12px;margin-bottom:11px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;box-shadow:var(--shadow-xs);}
.year-sel{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid var(--border);background:var(--surface-2);color:var(--text-secondary);cursor:pointer;font-family:'DM Sans',sans-serif;}
.month-sep{width:1px;height:15px;background:var(--border);flex-shrink:0;}
.mchip{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--text-muted);transition:all .1s;font-family:'DM Sans',sans-serif;}
.mchip:hover{background:var(--papaya-soft);color:var(--papaya-dark);}
.mchip.active{background:var(--papaya);color:white;}

/* PROJEÇÃO — VEREDITO + BLOCOS EXECUTIVOS */
.prj-verdict{display:flex;align-items:center;gap:18px;padding:14px 20px;border-radius:var(--radius);margin-bottom:12px;border:1px solid var(--border);box-shadow:var(--shadow-xs);flex-wrap:wrap;position:relative;overflow:hidden;}
.prj-verdict::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;}
.prj-verdict.ok{background:linear-gradient(90deg,rgba(22,163,74,0.06),var(--surface) 60%);}
.prj-verdict.ok::before{background:#16a34a;}
.prj-verdict.warn{background:linear-gradient(90deg,rgba(245,158,11,0.08),var(--surface) 60%);}
.prj-verdict.warn::before{background:#f59e0b;}
.prj-verdict.danger{background:linear-gradient(90deg,rgba(220,38,38,0.08),var(--surface) 60%);}
.prj-verdict.danger::before{background:#dc2626;}
.prj-verdict-main{flex:1;min-width:280px;padding-left:8px;}
.prj-verdict-tag{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px;}
.prj-verdict-title{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.2;color:var(--text-primary);}
.prj-verdict.ok .prj-verdict-title{color:#15803d;}
.prj-verdict.warn .prj-verdict-title{color:#b45309;}
.prj-verdict.danger .prj-verdict-title{color:#b91c1c;}
.prj-verdict-sub{font-size:12px;color:var(--text-muted);margin-top:3px;}
.prj-kpis{display:flex;gap:18px;flex-wrap:wrap;}
.prj-kpi{min-width:110px;}
.prj-kpi-lbl{font-size:9.5px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:var(--text-muted);margin-bottom:3px;}
.prj-kpi-val{font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--text-primary);line-height:1;}
.prj-kpi-val.neg{color:var(--red);}
.prj-kpi-val.pos{color:var(--green);}
.prj-kpi-sub{font-size:10px;color:var(--text-muted);margin-top:2px;}
.prj-saldo-input{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);}
.prj-saldo-input label{font-size:9.5px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:var(--text-muted);white-space:nowrap;}
.prj-saldo-input input{width:130px;font-weight:600;}
.prj-grid-2c{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
@media(max-width:900px){.prj-grid-2c{grid-template-columns:1fr;}}
.prj-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow-xs);}
.prj-block-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.prj-block-ico{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--surface-2);border:1px solid var(--border);}
.prj-block-title{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary);}
.prj-block-count{margin-left:auto;font-size:10px;color:var(--text-muted);font-weight:600;}
.prj-crit-item{padding:9px 11px;border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:7px;background:var(--surface-2);border-left:3px solid var(--amber);}
.prj-crit-item.danger{border-left-color:var(--red);background:rgba(220,38,38,0.04);}
.prj-crit-item:last-child{margin-bottom:0;}
.prj-crit-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:3px;}
.prj-crit-date{font-size:12px;font-weight:700;color:var(--text-primary);}
.prj-crit-amount{font-size:13px;font-weight:700;color:var(--red);letter-spacing:-.02em;}
.prj-crit-cause{font-size:11px;color:var(--text-muted);line-height:1.4;}
.prj-crit-impact{font-size:10.5px;color:var(--text-secondary);margin-top:3px;font-weight:600;}
.prj-action-item{display:flex;gap:10px;padding:9px 11px;border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:7px;background:var(--surface-2);}
.prj-action-item:last-child{margin-bottom:0;}
.prj-action-num{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--petronas);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.prj-action-body{flex:1;min-width:0;}
.prj-action-text{font-size:12px;color:var(--text-primary);line-height:1.4;font-weight:500;}
.prj-action-impact{font-size:10.5px;color:#15803d;font-weight:700;margin-top:3px;}
.prj-empty{font-size:12px;color:var(--text-muted);text-align:center;padding:14px;font-style:italic;}
.prj-details{margin-top:6px;}
.prj-details>summary{cursor:pointer;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);list-style:none;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-xs);}
.prj-details>summary::-webkit-details-marker{display:none;}
.prj-details>summary::before{content:'▸';transition:transform .15s;font-size:10px;}
.prj-details[open]>summary::before{transform:rotate(90deg);}
.prj-details>summary:hover{background:var(--surface-2);}
.prj-details[open]>summary{margin-bottom:10px;}

/* KPI CARDS */
.painel-kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:7px;}
.painel-kpi-row2{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:11px;}
.painel-kpi-row2>.pc:last-child{grid-column:auto;}
.pc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;box-shadow:var(--shadow-xs);border-top:2px solid transparent;}
.pc-label{font-size:10px;color:var(--text-muted);font-weight:500;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pc-value{font-size:19px;font-weight:700;color:var(--text-primary);letter-spacing:-.03em;line-height:1.1;margin-bottom:3px;}
.pc-value.g{color:var(--green);}.pc-value.r{color:var(--red);}.pc-value.a{color:var(--amber);}
.pc-sub{font-size:10px;color:var(--text-muted);line-height:1.3;}
.pc-t-green{border-top-color:var(--green);}
.pc-t-red{border-top-color:var(--red);}
.pc-t-amber{border-top-color:var(--amber);}
.pc-t-blue{border-top-color:var(--blue);}
.pc-t-slate{border-top-color:var(--ink-200);}
.pc-prog-wrap{margin-top:5px;}
.pc-prog-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-bottom:3px;}
.pc-prog-bg{height:3px;background:var(--ink-100);border-radius:2px;overflow:hidden;}
.pc-prog{height:100%;border-radius:2px;transition:width .4s;}
.saldo-edit{width:100%;padding:3px 6px;font-size:10px;margin-top:5px;border-radius:4px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-muted);outline:none;font-family:'DM Sans',sans-serif;}
.saldo-edit:focus{border-color:var(--green);}
/* SIDE-BY-SIDE row — novo layout: comp-esq | direita-stack */
.painel-duplex{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:11px;align-items:start;}
.painel-layout-3{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:11px;align-items:start;}
.painel-right-stack{display:flex;flex-direction:column;gap:11px;}

/* COMP PANEL — cabeçalho leve com acento verde tifani Mercedes AMG */
.comp-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:0;}
.comp-inner{display:grid;grid-template-columns:repeat(2,1fr);}
.comp-header{
  background:var(--surface);
  padding:9px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  border-bottom:1.5px solid var(--papaya);
  position:relative;
}
.comp-header::before{
  content:'';
  position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--papaya);
}
.comp-header-label{
  display:inline-flex;align-items:center;
  font-size:10px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;
  color:#fff;
  background:var(--carbon);
  padding:5px 10px;
  border-radius:3px;
  margin:0;
  white-space:nowrap;
}
.comp-header-right{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1;}
.comp-header-total{font-size:17px;font-weight:700;color:var(--text-primary);letter-spacing:-.03em;}
.comp-header-sub{font-size:10px;color:var(--text-muted);margin-top:2px;font-weight:500;}
.comp-body{}
.comp-group{border-bottom:1px solid var(--border);padding:10px 15px;}
.comp-group:last-child{border-bottom:none;}
.comp-inner .comp-group:nth-child(odd){border-right:1px solid var(--border);}
.comp-inner .comp-group:nth-last-child(-n+2){border-bottom:none;}
.comp-group-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.comp-group-name{font-size:10px;font-weight:600;color:var(--text-secondary);display:flex;align-items:center;gap:5px;}
.comp-group-dot{width:6px;height:6px;border-radius:2px;flex-shrink:0;}
.comp-group-pct{font-size:9px;color:var(--text-muted);font-weight:400;}
.comp-group-total{font-size:12px;font-weight:700;color:var(--text-primary);letter-spacing:-.02em;}
.comp-prog-bg{height:2px;background:var(--ink-100);border-radius:2px;overflow:hidden;margin-bottom:5px;}
.comp-prog{height:100%;border-radius:2px;}
.comp-item{display:flex;align-items:center;justify-content:space-between;padding:2px 0;}
.comp-item-name{font-size:10.5px;color:var(--text-muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:8px;}
.comp-item-val{font-size:10.5px;font-weight:600;color:var(--text-secondary);white-space:nowrap;}
.comp-expand{font-size:10px;color:var(--text-muted);cursor:pointer;background:none;border:none;padding:2px 0;font-family:'DM Sans',sans-serif;}
.comp-expand:hover{color:var(--papaya);}

/* PAG HOJE → REDISTRIBUIÇÃO */
.redistribuicao{background:#fefce8;border:1px solid #fde68a;border-radius:var(--radius);padding:10px 13px;box-shadow:0 1px 3px rgba(217,119,6,0.06);}
.rd-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px;}
.rd-title-row{display:flex;align-items:center;gap:5px;}
.rd-title{font-size:12px;font-weight:600;color:#92400e;}
.rd-date{font-size:10px;color:#b45309;margin-top:1px;}
.rd-divider{height:1px;background:rgba(217,119,6,.2);margin:6px 0;}
.rd-msg{font-size:12px;color:#78350f;line-height:1.6;}
.rd-msg strong{font-weight:700;color:#b91c1c;}
.rd-msg.ok{color:#166534;}
.rd-msg.ok strong{color:#15803d;}
.rd-msg.neutro{color:#b45309;}
.rd-cap-note{font-size:10px;color:#b45309;background:rgba(217,119,6,.1);padding:4px 8px;border-radius:4px;margin-top:7px;display:flex;align-items:center;gap:5px;}

/* CALENDARIO */
.calendario{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;flex-wrap:wrap;gap:8px;}
.cal-title-wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.cal-title{font-size:13px;font-weight:600;color:var(--text-primary);}
.cal-nav{display:inline-flex;align-items:center;gap:4px;}
.cal-nav-btn{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;line-height:1;font-weight:600;color:var(--text-secondary);background:var(--surface-2);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-family:inherit;padding:0;transition:background .15s,border-color .15s,color .15s;}
.cal-nav-btn:hover{background:var(--ink-50);border-color:var(--ink-200);color:var(--text-primary);}
.cal-nav-btn:active{transform:translateY(1px);}
.cal-nav-today{font-size:10.5px;font-weight:600;color:var(--text-secondary);background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:4px 9px;cursor:pointer;font-family:inherit;letter-spacing:.01em;transition:background .15s,border-color .15s;margin-left:2px;}
.cal-nav-today:hover{background:var(--ink-50);border-color:var(--ink-200);color:var(--text-primary);}
.cal-legend{display:flex;gap:9px;}
.cal-leg{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text-muted);}
.cal-leg-dot{width:8px;height:8px;border-radius:2px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{font-size:9px;font-weight:600;text-align:center;color:var(--text-muted);letter-spacing:.05em;text-transform:uppercase;padding:4px 2px;}
.cal-day{min-height:68px;border-radius:5px;padding:6px 7px;border:1px solid transparent;font-size:9px;}
.cal-day.empty{background:transparent;}
.cal-day-n{font-size:11px;font-weight:600;color:var(--text-secondary);margin-bottom:3px;}
.cal-day-total{font-size:10px;font-weight:700;color:var(--text-secondary);}
.cal-day-items{margin-top:3px;display:flex;flex-direction:column;gap:2px;}
.cal-day-more{font-size:8.5px;color:var(--text-muted);}
.cal-leve{background:var(--ink-50);border-color:var(--border);}
.cal-mod{background:#fef9c3;border-color:#fde68a;}
.cal-pesado{background:#ffedd5;border-color:#fed7aa;}
.cal-critico{background:#fee2e2;border-color:#fca5a5;}
.cal-today{outline:2px solid var(--papaya);outline-offset:-1px;}
.cal-mod .cal-day-total{color:#92400e;}
.cal-pesado .cal-day-total{color:#c2410c;}
.cal-critico .cal-day-total{color:var(--red);}

/* LEITURA EXEC */
.leitura-exec{background:var(--ink-900);color:white;border-radius:var(--radius);padding:12px 15px;}
.le-eye{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:5px;}
.le-resumo{font-size:12.5px;color:rgba(255,255,255,.85);line-height:1.6;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.07);}
.le-bullets{list-style:none;display:flex;flex-direction:column;gap:4px;}
.le-bullets li{display:flex;align-items:flex-start;gap:6px;font-size:10.5px;color:rgba(255,255,255,.55);line-height:1.5;}
.le-dot{width:4px;height:4px;border-radius:50%;background:var(--green-mid);flex-shrink:0;margin-top:5px;}

/* IMPORT MODAL */
.imp-drop{border:2px dashed var(--border);border-radius:var(--radius);padding:24px;text-align:center;cursor:pointer;transition:all .15s;background:var(--surface-2);}
.imp-drop:hover,.imp-drop.drag{border-color:var(--green);background:var(--green-light);}
.imp-drop-icon{font-size:28px;margin-bottom:8px;}
.imp-drop-text{font-size:13px;color:var(--text-secondary);margin-bottom:4px;}
.imp-drop-sub{font-size:11px;color:var(--text-muted);}
.imp-preview{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-top:10px;}
.imp-preview-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:10px;}
.imp-stat{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px;}
.imp-stat:last-child{border-bottom:none;}
.imp-stat-label{color:var(--text-secondary);}
.imp-stat-val{font-weight:700;color:var(--text-primary);}
.imp-stat-val.green{color:var(--green);}
.imp-stat-val.red{color:var(--red);}
.imp-stat-val.amber{color:var(--amber);}
.imp-seg-row{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);padding:2px 0;}
.imp-seg-row strong{color:var(--text-secondary);}
.imp-err-list{max-height:120px;overflow-y:auto;margin-top:6px;}
.imp-err-item{font-size:11px;color:var(--red-dim);padding:3px 0;border-bottom:1px solid var(--border);}
.imp-err-item:last-child{border-bottom:none;}
.imp-success-banner{background:var(--green-light);border:1px solid #bbf7d0;border-radius:var(--radius-xs);padding:9px 12px;font-size:13px;color:var(--green-dim);font-weight:500;}
/* Importador de ENTRADAS — grade dos prazos por modalidade. Prefixo exclusivo impent-;
   reaproveita as classes .imp-* do importador de Contas para o resto e não as altera. */
.impent-prazos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.impent-prazo{display:flex;flex-direction:column;gap:4px;min-width:0;}
.impent-prazo>span{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);}
.impent-prazo>select{font-family:inherit;font-size:13px;font-weight:600;color:var(--text-primary);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;outline:none;}
.impent-prazo>select:focus{border-color:var(--carbon);box-shadow:0 0 0 3px rgba(18,18,20,.08);}
.impent-prazo>select:disabled{background:var(--ink-100);color:var(--text-muted);cursor:not-allowed;}
@media(max-width:480px){.impent-prazos{grid-template-columns:1fr;}}

.painel-kpi-grid{grid-template-columns:repeat(3,1fr);}.painel-kpi-row2{grid-template-columns:repeat(3,1fr);}.comp-inner{grid-template-columns:1fr;}.comp-inner .comp-group:nth-child(odd){border-right:none;}.comp-inner .comp-group:nth-last-child(-n+2){border-bottom:1px solid var(--border);}.comp-inner .comp-group:last-child{border-bottom:none;}}
@media(max-width:900px){.painel-kpi-grid{grid-template-columns:repeat(2,1fr);}.painel-kpi-row2{grid-template-columns:repeat(2,1fr);}.painel-duplex{grid-template-columns:1fr;}.painel-layout-3{grid-template-columns:1fr;}}
@media(max-width:768px){.page-wrap{padding:10px 12px;}.painel-kpi-grid{grid-template-columns:repeat(2,1fr);}.painel-kpi-row2{grid-template-columns:repeat(2,1fr);}.cal-day{min-height:40px;}.app-header{padding:0 10px;}}

/* ── PAINEL DO DONO v9.5 (ajustes visuais) ── */
.painel-kpi-grid.v5{grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:9px;}
.painel-kpi-row2.v5{grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px;}
.painel-kpi-grid.v5 .pc, .painel-kpi-row2.v5 .pc{padding:11px 13px;}
.painel-kpi-grid.v5 .pc-label, .painel-kpi-row2.v5 .pc-label{font-size:10.5px;margin-bottom:5px;}
.painel-kpi-grid.v5 .pc-value, .painel-kpi-row2.v5 .pc-value{font-size:20px;margin-bottom:4px;}
.painel-kpi-grid.v5 .pc-sub, .painel-kpi-row2.v5 .pc-sub{font-size:10.5px;}

/* Composição em largura total + 4 colunas */
.comp-inner-4{display:grid;grid-template-columns:repeat(4,1fr);}
.comp-inner-4 .comp-group{border-bottom:none;border-right:1px solid var(--border);padding:12px 14px;}
.comp-inner-4 .comp-group:last-child{border-right:none;}
.comp-inner-4 .comp-group-name{font-size:10.5px;}
.comp-inner-4 .comp-group-total{font-size:13px;}
.painel-comp-full{margin-bottom:11px;}

/* ── Painel do Dono — Hero banner ── */
.painel-hero-wrap{margin:2px 0 18px;}
.painel-hero{position:relative;border-radius:18px;overflow:hidden;min-height:300px;box-shadow:0 16px 38px rgba(18,18,20,.22),0 3px 10px rgba(18,18,20,.10);}
.painel-hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 56%;}
.painel-hero-shade{position:absolute;inset:0;background:linear-gradient(96deg,rgba(13,12,14,.92) 0%,rgba(13,12,14,.68) 34%,rgba(13,12,14,.32) 60%,rgba(13,12,14,.22) 100%);}
.painel-hero-shade::after{content:'';position:absolute;left:0;right:0;bottom:0;height:64%;background:linear-gradient(to top,rgba(9,9,11,.94),rgba(9,9,11,.30) 55%,transparent);}
.painel-hero-body{position:relative;z-index:2;padding:34px 40px 108px;min-height:300px;display:flex;flex-direction:column;justify-content:flex-start;}
.painel-hero-eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--papaya);margin-bottom:16px;}
.painel-hero-eyebrow::before{content:'';width:28px;height:2px;background:var(--papaya);border-radius:2px;}
.painel-hero-title{font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.03em;color:#fff;max-width:540px;text-wrap:balance;}
.painel-hero-title b{color:var(--papaya);font-weight:800;}
.painel-hero-sub{font-size:13.5px;line-height:1.55;color:rgba(255,255,255,.84);max-width:440px;margin-top:14px;}
.painel-hero-chip{position:absolute;top:30px;right:32px;z-index:3;display:inline-flex;align-items:center;gap:9px;padding:8px 15px;border-radius:30px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.24);backdrop-filter:blur(8px);color:#fff;font-size:12px;font-weight:700;letter-spacing:.01em;text-transform:capitalize;}
.painel-hero-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--papaya);box-shadow:0 0 0 3px rgba(232,118,10,.32);}
.painel-hero-prx{position:absolute;top:74px;right:32px;z-index:3;display:inline-flex;align-items:center;padding:7px 14px;border-radius:12px;background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 18px rgba(13,12,14,.32);}
.painel-hero-prx img{height:19px;width:auto;display:block;}
.painel-hero-kpis{position:relative;z-index:5;margin:-80px 20px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:13px;}
/* ── Painel do Dono — HK KPI cards ── */
.hk{background:#fff;border:1px solid rgba(213,213,208,.9);border-radius:15px;padding:16px 18px 15px;box-shadow:0 12px 28px rgba(18,18,20,.17),0 1px 3px rgba(18,18,20,.08);display:flex;flex-direction:column;min-height:114px;position:relative;}
.hk-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:11px;}
.hk-ico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;flex-shrink:0;line-height:1;}
.hk-ico.g{background:var(--green-light);color:var(--green-dim);}
.hk-ico.r{background:#fef2f2;color:var(--red);}
.hk-ico.s{background:#eef2f6;color:#475569;}
.hk-label{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);line-height:1.3;}
.hk-top .hk-label{margin-top:2px;}
.hk-value{font-size:25px;font-weight:800;letter-spacing:-.035em;line-height:1.04;color:var(--carbon);}
.hk-value.g{color:var(--green-dim);}
.hk-value.r{color:var(--red);}
.hk-sub{font-size:10.5px;color:var(--text-muted);font-weight:500;margin-top:7px;line-height:1.35;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.hk-medias{display:flex;align-items:stretch;gap:0;}
.hk-medias-col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center;padding:0 12px;}
.hk-medias-lbl{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);}
.hk-medias-val{font-size:18px;font-weight:800;letter-spacing:-.03em;line-height:1;}
.hk-medias-val.g{color:var(--green-dim);}
.hk-medias-val.r{color:var(--red);}
.hk-medias-sep{width:1px;align-self:stretch;background:var(--border);flex-shrink:0;}
.hk.hk-meta{background:#212227;border:1.5px solid var(--papaya);box-shadow:0 14px 32px rgba(232,118,10,.26),0 2px 8px rgba(18,18,20,.24);overflow:hidden;}
.hk-meta>*{position:relative;z-index:1;}
.hk-meta::before{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0,rgba(255,255,255,.05) 1px,transparent 1px,transparent 2.5px),repeating-linear-gradient(-45deg,rgba(255,255,255,.05) 0,rgba(255,255,255,.05) 1px,transparent 1px,transparent 2.5px);background-size:3.5px 3.5px;}
.hk-meta .hk-ico{background:var(--papaya);color:#fff;}
.hk-meta .hk-label{color:rgba(255,255,255,.92);}
.hk-meta .hk-value{color:var(--papaya);}
.hk-meta .hk-sub{color:rgba(255,255,255,.74);}
.hk-meta .pc-meta-btn{font-size:9px;font-weight:700;color:#fff;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.30);border-radius:5px;padding:3px 8px;cursor:pointer;font-family:inherit;letter-spacing:.05em;text-transform:uppercase;line-height:1.2;transition:background .15s,border-color .15s;}
.hk-meta .pc-meta-btn:hover{background:var(--papaya);border-color:var(--papaya);}
.hk-meta .pc-meta-badge{display:inline-block;font-size:8px;font-weight:800;letter-spacing:.07em;background:var(--papaya);color:#fff;padding:1px 5px;border-radius:3px;margin-left:6px;vertical-align:middle;text-transform:uppercase;}
.hk-meta .pc-meta-popover{color:var(--text-primary);}
@media(max-width:920px){
  .painel-hero-kpis{grid-template-columns:repeat(2,1fr);margin-top:-66px;}
  .painel-hero-title{font-size:27px;}
  .painel-hero-body{padding:28px 26px 94px;}
}
@media(max-width:600px){
  .painel-hero-kpis{grid-template-columns:1fr;margin:-54px 8px 0;}
  .painel-hero-chip{display:none;}
  .painel-hero-prx{display:none;}
  .painel-hero-title{font-size:23px;}
}
/* ═══ Painel do Dono — forn-pago-compact (PAGO A FORNECEDORES) ═══ */
.forn-pago-compact{background:#FAFAF7;border:1.5px solid var(--carbon);border-radius:var(--radius);padding:14px 22px 14px 28px;position:relative;overflow:hidden;display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:0;align-items:center;box-shadow:0 1px 4px rgba(18,18,20,.06),0 1px 2px rgba(18,18,20,.04);color:var(--text-primary);}
.forn-pago-compact::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--papaya);}
.fpc-main{display:flex;flex-direction:column;gap:3px;padding-right:18px;}
.fpc-label{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);display:flex;align-items:center;gap:5px;}
.fpc-label span{color:var(--papaya);}
.fpc-value{font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--carbon);line-height:1.1;}
.fpc-sub{font-size:10.5px;color:var(--text-muted);font-weight:500;}
.fpc-prog-bg{height:4px;background:rgba(0,0,0,.08);border-radius:3px;overflow:hidden;margin-top:5px;}
.fpc-prog{height:100%;background:var(--papaya);border-radius:3px;transition:width .35s ease;}
.fpc-cell{display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--border);padding:0 16px;}
.fpc-cell-lbl{font-size:8.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted);}
.fpc-cell-val{font-size:15px;font-weight:700;color:var(--text-primary);letter-spacing:-.02em;line-height:1.15;}
.fpc-cell-sub{font-size:9.5px;color:var(--text-muted);font-weight:500;}
@media(max-width:740px){
  .forn-pago-compact{grid-template-columns:1fr 1fr;row-gap:12px;}
  .fpc-main{grid-column:1/3;padding-right:0;}
  .fpc-cell:nth-child(2){border-left:none;padding-left:0;}
}

/* Linha inferior: forn-pago-compact + calendário (full width, stacked) */
/* ═══ Painel do Dono — PLACAR DO MÊS ═══
   Migração fiel do painel `.board` de CALENDÁRIO V4.html. Prefixo exclusivo
   prx-owner-score-; nenhum seletor global e nenhum token :root tocado. Os valores abaixo
   foram lidos do CSS do mockup, não aproximados. Única adaptação deliberada: o
   `margin-bottom:14px` do mockup foi omitido porque .painel-layout-bottom já aplica
   gap:11px — somar os dois deslocaria o calendário para baixo. */
.prx-owner-score{background:#141414;color:#fff;border-radius:16px;padding:18px 22px;display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr auto;gap:20px;align-items:center;line-height:1.4;}
.prx-owner-score h2{font-size:12px;letter-spacing:1px;color:#b9b6b0;font-weight:600;text-transform:uppercase;margin:0;}
.prx-owner-score-sub{font-size:12px;color:#8f8c86;margin-top:2px;}
.prx-owner-score-sub b{color:#cfae8a;font-weight:700;}
.prx-owner-score-lab{font-size:10.5px;letter-spacing:.5px;color:#9b9893;text-transform:uppercase;font-weight:600;}
.prx-owner-score-val{font-size:21px;font-weight:800;margin-top:3px;color:#fff;word-break:break-word;}
.prx-owner-score-val.ok{color:#5fd08a;}
.prx-owner-score-val.warn{color:#f2b84b;}
.prx-owner-score-nav{display:flex;align-items:center;gap:8px;}
.prx-owner-score-nav button{background:rgba(255,106,0,.15);color:#FF6A00;border:1px solid rgba(255,106,0,.4);border-radius:8px;width:30px;height:30px;font-size:16px;font-weight:700;cursor:pointer;line-height:1;font-family:inherit;padding:0;flex-shrink:0;}
.prx-owner-score-nav button:hover{background:rgba(255,106,0,.3);}
.prx-owner-score-nav button:focus-visible{outline:2px solid #FF6A00;outline-offset:2px;}
.prx-owner-score-mlabel{font-weight:700;font-size:14px;min-width:120px;text-align:center;color:#FF6A00;}
@media(max-width:1024px){
  .prx-owner-score{grid-template-columns:1fr 1fr;gap:16px;}
  .prx-owner-score-nav{grid-column:1/-1;justify-content:flex-end;}
}
@media(max-width:560px){
  .prx-owner-score{grid-template-columns:1fr;padding:16px 18px;}
  .prx-owner-score-mlabel{min-width:0;flex:1;}
}

/* ═══ Painel do Dono — CALENDÁRIO INTELIGENTE ═══
   Porte fiel do calendário de CALENDÁRIO V4.html. Prefixo exclusivo prx-owner-cal-;
   as classes genéricas do mockup (.day/.week/.panel/.status/.mini/.badge/.dot…) NÃO são
   usadas, para não colidir com produção. Nenhum seletor global, nenhum token :root tocado.
   Cores do mockup inlined: card #fff · line #e4e1da · muted #8a8781 · ink #1b1b1b ·
   accent #FF6A00 · green #2e9e5b · amber #E0961A · red #D64545 · proj #6b7cff · bg #ECEAE5.
   line-height:1.4 no container reproduz a métrica do body do mockup. */
.prx-owner-cal{line-height:1.4;color:#1b1b1b;}
.prx-owner-cal-controls{display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:#fff;border:1px solid #e4e1da;border-radius:12px;padding:11px 16px;margin-bottom:14px;}
.prx-owner-cal-field{display:flex;align-items:center;gap:10px;font-size:13px;}
.prx-owner-cal-field label{color:#8a8781;font-weight:600;}
.prx-owner-cal-range{width:150px;accent-color:#FF6A00;}
.prx-owner-cal-ratioval{font-weight:800;color:#FF6A00;min-width:44px;}
.prx-owner-cal-hint{font-size:11px;color:#8a8781;}
.prx-owner-cal-legend{display:flex;gap:14px;margin-left:auto;flex-wrap:wrap;}
.prx-owner-cal-legend span{display:flex;align-items:center;gap:6px;font-size:12px;color:#8a8781;}
.prx-owner-cal-dot{width:11px;height:11px;border-radius:3px;display:inline-block;}
.prx-owner-cal-dot.g{background:#2e9e5b;}
.prx-owner-cal-dot.a{background:#E0961A;}
.prx-owner-cal-dot.r{background:#D64545;}
.prx-owner-cal-dot.p{background:#6b7cff;border-radius:50%;}

.prx-owner-cal-head{display:grid;grid-template-columns:repeat(7,1fr) 158px;gap:8px;margin-bottom:8px;}
.prx-owner-cal-head>div{font-size:11px;font-weight:700;color:#8a8781;text-transform:uppercase;letter-spacing:.5px;text-align:center;padding:4px 0;}
.prx-owner-cal-head>div.wk{color:#FF6A00;text-align:right;padding-right:8px;}
.prx-owner-cal-week{display:grid;grid-template-columns:repeat(7,1fr) 158px;gap:8px;margin-bottom:8px;}

/* O dia é <button> por acessibilidade (foco/teclado). O UA stylesheet aplica a shorthand
   `font` e uma cor própria a botões, o que zerava o line-height:1.4 e a cor #1b1b1b do
   mockup — daí os resets explícitos abaixo. */
.prx-owner-cal-day{background:#fff;border:1px solid #e4e1da;border-radius:11px;padding:9px 9px 11px;min-height:132px;cursor:pointer;position:relative;transition:.12s;display:flex;flex-direction:column;text-align:left;font-family:inherit;font-size:inherit;line-height:inherit;color:#1b1b1b;width:100%;}
.prx-owner-cal-day:hover{border-color:#FF6A00;box-shadow:0 3px 12px rgba(0,0,0,.07);transform:translateY(-1px);}
.prx-owner-cal-day:focus-visible{outline:2px solid #FF6A00;outline-offset:2px;}
.prx-owner-cal-day.empty{background:transparent;border:1px dashed #dcd8d0;cursor:default;}
.prx-owner-cal-day.empty:hover{transform:none;box-shadow:none;border-color:#dcd8d0;}
.prx-owner-cal-day.today{outline:2px solid #FF6A00;outline-offset:-2px;}
.prx-owner-cal-drow{display:flex;justify-content:space-between;align-items:center;}
.prx-owner-cal-dnum{font-weight:800;font-size:15px;}
.prx-owner-cal-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;}
.prx-owner-cal-badge.real{background:#eee;color:#666;}
.prx-owner-cal-badge.proj{background:#eaecff;color:#6b7cff;}
.prx-owner-cal-entra{font-size:10.5px;color:#8a8781;margin-top:6px;}
.prx-owner-cal-entra b{color:#2e9e5b;font-weight:800;}
.prx-owner-cal-pgrow{display:flex;justify-content:space-between;gap:5px;margin-top:7px;font-size:9.5px;}
.prx-owner-cal-pgrow .lab{color:#8a8781;display:block;font-size:8px;text-transform:uppercase;letter-spacing:.2px;font-weight:700;}
.prx-owner-cal-pgrow .num{font-weight:400;font-size:9.5px;white-space:nowrap;}
.prx-owner-cal-folga{font-size:9.5px;color:#8a8781;margin-top:5px;}
.prx-owner-cal-folga b{font-weight:400;}
.prx-owner-cal-folga b.pos{color:#2e9e5b;}
.prx-owner-cal-folga b.neg{color:#D64545;}
.prx-owner-cal-barwrap{margin-top:auto;padding-top:9px;}
.prx-owner-cal-bar{height:10px;border-radius:6px;background:#f0ede7;overflow:hidden;position:relative;}
.prx-owner-cal-fill{height:100%;border-radius:6px;}
.prx-owner-cal-fill.g{background:#2e9e5b;}
.prx-owner-cal-fill.a{background:#E0961A;}
.prx-owner-cal-fill.r{background:#D64545;}
.prx-owner-cal-over{position:absolute;top:0;right:0;height:100%;background:repeating-linear-gradient(45deg,#D64545,#D64545 3px,#b03939 3px,#b03939 6px);}
.prx-owner-cal-xchip{position:absolute;right:3px;top:50%;transform:translateY(-50%);font-size:8px;font-weight:800;color:#fff;background:rgba(0,0,0,.35);border-radius:6px;padding:0 4px;}

.prx-owner-cal-wkcard{background:#faf9f6;border:1px solid #e4e1da;border-radius:11px;padding:9px 11px;font-size:11px;display:flex;flex-direction:column;justify-content:center;}
.prx-owner-cal-wkcard .wt{font-size:10px;color:#8a8781;text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:6px;}
.prx-owner-cal-wkcard .li{display:flex;justify-content:space-between;margin:1px 0;}
.prx-owner-cal-wkcard .li span{color:#8a8781;}
.prx-owner-cal-wkcard .li b{font-weight:700;}
.prx-owner-cal-wkcard .folgaw{margin-top:5px;padding-top:5px;border-top:1px dashed #e4e1da;font-weight:800;}
.prx-owner-cal-wkcard .folgaw.ok{color:#2e9e5b;}
.prx-owner-cal-wkcard .folgaw.bad{color:#D64545;}

.prx-owner-cal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:.2s;z-index:40;border:none;padding:0;}
.prx-owner-cal-overlay.on{opacity:1;pointer-events:auto;}
.prx-owner-cal-panel{position:fixed;top:0;right:0;height:100%;width:400px;max-width:93vw;background:#fff;z-index:50;transform:translateX(100%);transition:.24s cubic-bezier(.4,0,.2,1);box-shadow:-8px 0 30px rgba(0,0,0,.15);display:flex;flex-direction:column;line-height:1.4;color:#1b1b1b;}
.prx-owner-cal-panel.on{transform:translateX(0);}
.prx-owner-cal-ph{padding:20px 22px;border-bottom:1px solid #e4e1da;position:relative;}
.prx-owner-cal-ph .close{position:absolute;top:16px;right:18px;font-size:20px;color:#8a8781;cursor:pointer;background:none;border:none;font-family:inherit;line-height:1;padding:0;}
.prx-owner-cal-ph .pdate{font-size:19px;font-weight:800;}
.prx-owner-cal-ph .pweekday{color:#8a8781;font-size:13px;margin-top:1px;}
.prx-owner-cal-pbody{padding:18px 22px;overflow-y:auto;flex:1;}
.prx-owner-cal-status{padding:10px 13px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:16px;}
.prx-owner-cal-status.g{background:#e7f4ec;color:#1e6e3d;}
.prx-owner-cal-status.a{background:#fbf1dc;color:#96650d;}
.prx-owner-cal-status.r{background:#fbe7e7;color:#a52f2f;}
.prx-owner-cal-mini{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px;}
.prx-owner-cal-mini .box{background:#ECEAE5;border-radius:10px;padding:10px 11px;}
.prx-owner-cal-mini .box .l{font-size:10px;color:#8a8781;text-transform:uppercase;letter-spacing:.4px;font-weight:700;}
.prx-owner-cal-mini .box .v{font-size:16px;font-weight:800;margin-top:3px;}
.prx-owner-cal-sec{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#8a8781;font-weight:700;margin:14px 0 8px;}
.prx-owner-cal-expbox{background:#ffe9d7;border:1px solid #f6cfa8;border-radius:10px;padding:6px 12px;margin-bottom:6px;}
.prx-owner-cal-exprow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #f2d3b4;font-size:12.5px;}
.prx-owner-cal-exprow:last-child{border:none;}
.prx-owner-cal-exprow .cat{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:#b5651d;background:#fff;border-radius:5px;padding:1px 5px;margin-left:6px;}
.prx-owner-cal-exprow .who{font-weight:600;}
.prx-owner-cal-exprow .amt{font-weight:700;}
.prx-owner-cal-locknote{font-size:10.5px;color:#b5651d;margin:2px 0 4px;font-weight:600;}
.prx-owner-cal-bol{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #e4e1da;font-size:12.5px;}
.prx-owner-cal-bol:last-child{border:none;}
.prx-owner-cal-bol .who{font-weight:600;}
.prx-owner-cal-bol .amt{font-weight:700;}

/* Abaixo de 1100px a grade de 8 colunas não cabe legível: rola horizontalmente preservando
   a composição, em vez de esmagar os cards. Nenhum breakpoint global é alterado. */
@media(max-width:1100px){
  .prx-owner-cal-scroll{overflow-x:auto;}
  .prx-owner-cal-scroll>div{min-width:1040px;}
}

.painel-layout-bottom{display:flex;flex-direction:column;gap:11px;margin-bottom:11px;}
.painel-layout-bottom>.calendario{display:flex;flex-direction:column;}
.painel-layout-bottom>.calendario .cal-grid{flex:1;}
.painel-bottom-left{display:flex;flex-direction:column;gap:11px;}

/* Painel Fornecedores em Destaque */
.forn-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.forn-header{background:#374151;padding:11px 13px;}
.forn-header-label{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:2px;}
.forn-header-total{font-size:19px;font-weight:700;color:white;letter-spacing:-.03em;}
.forn-header-sub{font-size:10px;color:rgba(255,255,255,.45);margin-top:2px;}
/* Corpo com duas colunas internas lado a lado */
.forn-body{padding:11px 13px;display:grid;grid-template-columns:1fr 1fr;gap:0;}
.forn-col{padding:0 12px;}
.forn-col:first-child{padding-left:0;}
.forn-col:last-child{padding-right:0;border-left:1px solid var(--border);}
.forn-section-title{font-size:9px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.forn-section-title .forn-tag{font-size:8.5px;color:var(--text-muted);font-weight:500;letter-spacing:0;text-transform:none;}
.forn-list{display:flex;flex-direction:column;gap:3px;}
.forn-row{display:flex;flex-direction:column;gap:1px;padding:5px 0;border-bottom:1px solid var(--border);}
.forn-row:last-child{border-bottom:none;}
.forn-row-rank{display:flex;align-items:baseline;gap:6px;}
.forn-row-num{font-size:10px;font-weight:700;color:var(--text-muted);min-width:12px;}
.forn-row-name{font-size:11px;color:var(--text-secondary);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.forn-row-val{font-size:11.5px;font-weight:700;color:var(--text-primary);white-space:nowrap;margin-left:18px;}
.forn-row-meta{font-size:9.5px;color:var(--text-muted);margin-left:18px;margin-top:1px;}
.forn-row-pct{font-size:9.5px;color:var(--text-muted);font-weight:500;}
.forn-empty{font-size:10.5px;color:var(--text-muted);font-style:italic;padding:6px 0;}

/* ── ABA FORNECEDORES ── */
/* Card-hero de destaque: Total Pago a Fornecedores no mês */
.forn-pago-hero{
  background:linear-gradient(135deg,var(--petronas) 0%,var(--petronas-dark) 100%);
  border:2px solid #000000;
  border-radius:var(--radius);
  padding:16px 20px;
  margin-bottom:11px;
  display:grid;
  grid-template-columns:1.4fr 1fr 1fr 1fr;
  gap:18px;
  align-items:center;
  box-shadow:0 2px 12px rgba(0,161,155,.22),0 1px 2px rgba(0,0,0,.10);
  color:#ffffff;
  position:relative;
  overflow:hidden;
}
.forn-pago-hero::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:#000000;
}
.forn-pago-hero-main{display:flex;flex-direction:column;gap:4px;padding-left:6px;}
.forn-pago-hero-label{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:7px;}
.forn-pago-hero-label .forn-pago-ico{font-size:13px;}
.forn-pago-hero-value{font-size:28px;font-weight:800;letter-spacing:-.02em;color:#ffffff;line-height:1.05;}
.forn-pago-hero-sub{font-size:11px;color:rgba(255,255,255,.80);font-weight:500;margin-top:2px;}
.forn-pago-hero-cell{display:flex;flex-direction:column;gap:3px;border-left:1px solid rgba(255,255,255,.18);padding-left:16px;}
.forn-pago-hero-cell-lbl{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.75);}
.forn-pago-hero-cell-val{font-size:15px;font-weight:700;color:#ffffff;letter-spacing:-.02em;}
.forn-pago-hero-cell-sub{font-size:10px;color:rgba(255,255,255,.70);font-weight:500;}
.forn-pago-hero-prog-wrap{margin-top:6px;}
.forn-pago-hero-prog-bg{height:5px;background:rgba(0,0,0,.22);border-radius:3px;overflow:hidden;}
.forn-pago-hero-prog{height:100%;background:#ffffff;border-radius:3px;transition:width .35s ease;}
@media(max-width:980px){
  .forn-pago-hero{grid-template-columns:1fr 1fr;gap:14px;}
  .forn-pago-hero-cell:nth-child(2){border-left:none;padding-left:6px;}
}
@media(max-width:600px){
  .forn-pago-hero{grid-template-columns:1fr;}
  .forn-pago-hero-cell{border-left:none;padding-left:6px;border-top:1px solid rgba(255,255,255,.18);padding-top:10px;}
}

.forn-kpi-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:9px;margin-bottom:14px;}
.forn-row-2col{display:grid;grid-template-columns:1.55fr 1fr;gap:11px;margin-bottom:11px;align-items:start;}
/* Variante 40/60 — Ranking por Volume + Custo por Segmento */
.forn-row-2col.forn-row-4060{grid-template-columns:2fr 3fr;}
@media(max-width:900px){.forn-row-2col.forn-row-4060{grid-template-columns:1fr;}}

/* Painel Custo por Segmento */
.forn-seg-card{overflow:hidden;min-width:0;border-top:2px solid var(--petronas);}
.forn-seg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.forn-seg-total{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1;}
.forn-seg-total-lbl{font-size:9px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:var(--text-muted);}
.forn-seg-total-val{font-size:14px;font-weight:700;color:var(--text-primary);letter-spacing:-.02em;margin-top:2px;}
.forn-seg-list{display:flex;flex-direction:column;gap:8px;}
.forn-seg-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);}
.forn-seg-row:last-child{border-bottom:none;}
.forn-seg-row-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px;}
.forn-seg-name{font-size:12px;font-weight:600;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:7px;}
.forn-seg-rank{font-size:10px;font-weight:700;color:var(--text-muted);min-width:14px;}
.forn-seg-val{font-size:12.5px;font-weight:700;color:var(--text-primary);letter-spacing:-.02em;white-space:nowrap;}
.forn-seg-bar-wrap{display:flex;align-items:center;gap:9px;}
.forn-seg-bar-bg{flex:1;height:6px;background:var(--ink-100);border-radius:3px;overflow:hidden;min-width:0;}
.forn-seg-bar-fill{height:100%;background:linear-gradient(90deg,var(--petronas) 0%,var(--petronas-dark) 100%);border-radius:3px;transition:width .35s ease;}
.forn-seg-pct{font-size:11px;font-weight:700;color:var(--petronas-dark);min-width:38px;text-align:right;white-space:nowrap;}
.forn-seg-cell{display:flex;flex-direction:column;gap:0;min-width:0;width:100%;}

.forn-rank-card{overflow:hidden;min-width:0;}
.forn-evol-card{margin-bottom:11px;}
.forn-table{width:100%;border-collapse:collapse;font-size:11.5px;table-layout:fixed;}
.forn-table thead th{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);padding:6px 6px;border-bottom:1px solid var(--border);text-align:left;background:var(--surface-2);white-space:nowrap;}
.forn-table tbody td{padding:7px 6px;border-bottom:1px solid var(--border);color:var(--text-secondary);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.forn-table tbody tr:last-child td{border-bottom:none;}
.forn-table tbody tr:hover{background:var(--surface-2);}
.forn-rank-num{font-weight:700;color:var(--text-muted);font-size:11px;}
.forn-rank-name{font-weight:600;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.forn-pct-cell{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end;font-weight:600;font-size:11px;color:var(--text-secondary);white-space:nowrap;}
.forn-pct-bar{width:38px;height:5px;background:var(--ink-100);border-radius:3px;overflow:hidden;flex-shrink:0;}
.forn-pct-fill{height:100%;background:linear-gradient(90deg,#c0392b,#dc2626);border-radius:3px;}
.forn-foot-note{font-size:10px;color:var(--text-muted);text-align:right;margin-top:8px;font-style:italic;}
.forn-conc-pill{display:inline-flex;align-self:center;align-items:center;justify-content:center;font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;letter-spacing:.01em;margin-top:4px;white-space:nowrap;}
.forn-conc-pill.g{background:var(--green-light);color:var(--green-dim);border:1px solid #bbf7d0;}
.forn-conc-pill.a{background:var(--amber-light);color:var(--amber-dim);border:1px solid #fde68a;}
.forn-conc-pill.r{background:var(--red-light);color:var(--red-dim);border:1px solid #fecaca;}
.cad-badge{font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:11px;letter-spacing:.04em;display:inline-block;white-space:nowrap;}
.cad-semanal{background:#dcfce7;color:#15803d;}
.cad-quinzenal{background:#dbeafe;color:#1d4ed8;}
.cad-mensal{background:#fef3c7;color:#b45309;}
.cad-eventual{background:#f1f5f9;color:#64748b;}
.forn-empty-state{background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);padding:40px 28px;text-align:center;margin-top:18px;}
.forn-empty-icon{font-size:38px;margin-bottom:10px;opacity:.6;}
.forn-empty-title{font-size:14px;font-weight:700;color:var(--text-primary);margin-bottom:6px;}
.forn-empty-sub{font-size:12px;color:var(--text-muted);max-width:460px;margin:0 auto;line-height:1.5;}
@media(max-width:1100px){.forn-row-2col{grid-template-columns:1fr;}}

/* Calendário — verde suave para dias saudáveis (dentro da capacidade) */
.cal-saudavel{background:#dcfce7;border-color:#bbf7d0;}
.cal-saudavel .cal-day-total{color:#15803d;}
.cal-atencao{background:#fef9c3;border-color:#fde68a;}
.cal-atencao .cal-day-total{color:#92400e;}

/* Calendário — cabeçalho lado direito (legenda + botão) */
.cal-head-right{display:flex;align-items:center;gap:10px;}
.cal-meta-btn{font-size:10.5px;font-weight:600;color:var(--text-secondary);background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:5px 9px;cursor:pointer;font-family:inherit;letter-spacing:.01em;transition:background .15s,border-color .15s;}
.cal-meta-btn:hover{background:var(--ink-50);border-color:var(--ink-200);}

/* Painel Ajustar Meta */
.cal-meta-panel{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 13px;margin-bottom:11px;}
.cal-meta-panel-title{font-size:11px;font-weight:700;color:var(--text-primary);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.cal-meta-panel-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px;}
.cal-meta-input{width:70px;padding:5px 8px;font-size:13px;font-weight:600;border:1px solid var(--border);border-radius:5px;background:var(--surface);color:var(--text-primary);font-family:inherit;outline:none;text-align:center;}
.cal-meta-input:focus{border-color:var(--papaya);}
.cal-meta-pct{font-size:12px;font-weight:600;color:var(--text-secondary);}
.cal-meta-preview{font-size:11px;color:var(--text-secondary);margin-left:auto;}
.cal-meta-preview strong{color:var(--text-primary);font-weight:700;}
.cal-meta-actions{display:flex;gap:6px;flex-wrap:wrap;}
.cal-meta-save,.cal-meta-reset,.cal-meta-cancel{font-size:10.5px;font-weight:600;padding:5px 10px;border-radius:5px;cursor:pointer;font-family:inherit;border:1px solid transparent;}
.cal-meta-save{background:var(--green);color:white;}
.cal-meta-save:hover{filter:brightness(1.08);}
.cal-meta-reset{background:var(--surface);color:var(--text-secondary);border-color:var(--border);}
.cal-meta-reset:hover{background:var(--ink-50);}
.cal-meta-cancel{background:transparent;color:var(--text-muted);border-color:var(--border);}
.cal-meta-cancel:hover{background:var(--ink-50);color:var(--text-secondary);}
.cal-meta-footnote{font-size:9.5px;color:var(--text-muted);margin-top:8px;line-height:1.4;}

/* Card Médias Diárias — duas colunas com divisória elegante */
.pc-medias{display:grid;grid-template-columns:1fr 1px 1fr;align-items:stretch;gap:0;margin:2px 0 6px;}
.pc-medias-col{display:flex;flex-direction:column;justify-content:center;padding:2px 10px;min-width:0;}
.pc-medias-col:first-child{padding-left:0;}
.pc-medias-col:last-child{padding-right:0;text-align:right;align-items:flex-end;}
.pc-medias-sep{background:var(--border);width:1px;align-self:stretch;}
.pc-medias-lbl{font-size:9.5px;font-weight:600;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;}
.pc-medias-val{font-size:17px;font-weight:700;letter-spacing:-.03em;line-height:1.05;color:var(--text-primary);white-space:nowrap;}
.pc-medias-val.g{color:var(--green);}
.pc-medias-val.r{color:var(--red);}

/* Card "Meta Diária de Pagamento" — Verde Petronas com borda preta */
.pc-papaya{
  background:var(--petronas);
  border:2px solid #000000;
  box-shadow:0 1px 2px rgba(0,0,0,.10),0 2px 8px rgba(0,161,155,.18);
  position:relative;
}
.pc-papaya .pc-label{color:#ffffff;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
.pc-papaya .pc-value{color:#ffffff;font-weight:800;}
.pc-papaya .pc-value.a{color:#ffffff;}
.pc-papaya .pc-sub{color:#ffffff;opacity:.85;font-weight:500;}

/* Botão "Manual" + selo + popover do card Meta Diária de Pagamento */
.pc-meta-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:4px;}
.pc-meta-btn{font-size:9.5px;font-weight:700;color:var(--petronas);background:#ffffff;border:1px solid #000000;border-radius:4px;padding:2px 7px;cursor:pointer;font-family:inherit;letter-spacing:.04em;text-transform:uppercase;transition:background .15s,color .15s;line-height:1.2;}
.pc-meta-btn:hover{background:#000000;color:#ffffff;}
.pc-meta-badge{display:inline-block;font-size:8.5px;font-weight:800;letter-spacing:.08em;background:#000000;color:#ffffff;padding:1px 5px;border-radius:3px;margin-left:5px;vertical-align:middle;text-transform:uppercase;}
.pc-meta-popover{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid var(--border);border-radius:7px;box-shadow:0 8px 28px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.06);padding:11px 13px;z-index:30;min-width:268px;}
.pc-meta-popover::before{content:'';position:absolute;top:-6px;right:18px;width:10px;height:10px;background:#fff;border-left:1px solid var(--border);border-top:1px solid var(--border);transform:rotate(45deg);}
.pc-meta-popover-title{font-size:10.5px;font-weight:700;color:var(--text-primary);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.pc-meta-popover-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.pc-meta-input{flex:1;min-width:0;font-size:13px;font-weight:600;padding:6px 9px;border:1px solid var(--border);border-radius:5px;font-family:inherit;color:var(--text-primary);background:#fff;}
.pc-meta-input:focus{outline:none;border-color:var(--petronas);box-shadow:0 0 0 2px var(--petronas-soft);}
.pc-meta-popover-hint{font-size:10px;color:var(--text-muted);margin-bottom:9px;line-height:1.4;}
.pc-meta-popover-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.pc-meta-popover-actions button{font-size:10.5px;font-weight:600;padding:5px 10px;border-radius:5px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-secondary);cursor:pointer;font-family:inherit;}
.pc-meta-popover-actions .pc-meta-save{background:var(--petronas);color:#fff;border-color:var(--petronas);}
.pc-meta-popover-actions .pc-meta-save:hover{background:var(--petronas-dark);border-color:var(--petronas-dark);}
.pc-meta-popover-actions .pc-meta-remove{background:#fff;color:#b91c1c;border-color:#fecaca;}
.pc-meta-popover-actions .pc-meta-remove:hover{background:#fef2f2;}
.pc-meta-popover-actions button:hover{background:var(--ink-50);}
.pc-meta-popover-actions .pc-meta-save:hover{background:var(--petronas-dark);}

@media(max-width:1100px){.comp-inner-4{grid-template-columns:repeat(2,1fr);}.comp-inner-4 .comp-group:nth-child(odd){border-right:1px solid var(--border);}.comp-inner-4 .comp-group:nth-child(even){border-right:none;}.comp-inner-4 .comp-group:nth-child(-n+2){border-bottom:1px solid var(--border);}}
@media(max-width:900px){.painel-kpi-grid.v5{grid-template-columns:repeat(2,1fr);}.painel-kpi-row2.v5{grid-template-columns:repeat(2,1fr);}.painel-layout-bottom{grid-template-columns:1fr;}.forn-body{grid-template-columns:1fr;gap:14px;}.forn-col{padding:0;}.forn-col:last-child{padding:0;border-left:none;border-top:1px solid var(--border);padding-top:12px;}}
@media(max-width:700px){.comp-inner-4{grid-template-columns:1fr;}.comp-inner-4 .comp-group{border-right:none;border-bottom:1px solid var(--border);}.comp-inner-4 .comp-group:last-child{border-bottom:none;}}

/* ── CALENDÁRIO: seleção por arrastar ── */
.cal-day{cursor:pointer;user-select:none;transition:box-shadow .12s,border-color .12s;}
.cal-day.cal-selected{box-shadow:inset 0 0 0 2px var(--papaya);position:relative;}
.cal-day.cal-selected::after{content:'';position:absolute;inset:0;background:var(--papaya-soft);pointer-events:none;border-radius:5px;}
.cal-day.empty{cursor:default;}
.cal-sel-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:9px 13px;margin-bottom:11px;background:var(--surface-2);border-left:3px solid var(--papaya);border-radius:0 var(--radius-xs) var(--radius-xs) 0;font-size:11.5px;animation:calSelFadeIn .18s ease-out;}
@keyframes calSelFadeIn{from{opacity:0;transform:translateY(-2px);}to{opacity:1;transform:translateY(0);}}
.cal-sel-bar-block{display:flex;flex-direction:column;line-height:1.15;}
.cal-sel-bar-lbl{font-size:9px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:var(--text-muted);margin-bottom:2px;}
.cal-sel-bar-val{font-size:14px;font-weight:800;color:var(--text-primary);letter-spacing:-.02em;}
.cal-sel-bar-val.over{color:var(--red-dim);}
.cal-sel-bar-val.under{color:var(--green-dim);}
.cal-sel-bar-div{width:1px;height:26px;background:var(--border);}
.cal-sel-bar-diff{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.02em;}
.cal-sel-bar-diff.over{background:#fef2f2;color:var(--red-dim);}
.cal-sel-bar-diff.under{background:#f0fdf4;color:var(--green-dim);}
.cal-sel-bar-clear{margin-left:auto;font-size:10px;font-weight:600;color:var(--text-muted);background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;text-transform:uppercase;letter-spacing:.06em;padding:4px 8px;border-radius:4px;}
.cal-sel-bar-clear:hover{color:var(--text-primary);background:var(--ink-100);}

/* ── CUSTO POR SEGMENTO (Painel do Dono) ── */
.seg-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;}
.seg-hdr{padding:11px 13px 9px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-shrink:0;flex-wrap:wrap;}
.seg-hdr-meta{display:flex;flex-direction:column;gap:2px;min-width:0;}
.seg-hdr-title{font-size:10px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:var(--text-muted);}
.seg-hdr-period{font-size:12.5px;font-weight:700;color:var(--text-primary);letter-spacing:-.01em;margin-top:1px;}
.seg-hdr-kpis{display:flex;align-items:flex-start;gap:10px;}
.seg-hdr-kpi{display:flex;flex-direction:column;align-items:flex-end;gap:1px;}
.seg-hdr-kpi-lbl{font-size:8.5px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:var(--text-muted);}
.seg-hdr-kpi-val{font-size:13.5px;font-weight:800;color:var(--text-primary);letter-spacing:-.03em;line-height:1.1;}
.seg-hdr-kpi-sub{font-size:9.5px;color:var(--text-muted);}
.seg-hdr-div{width:1px;height:28px;background:var(--border);align-self:center;}
.seg-chart-area{padding:11px 12px 6px;flex-shrink:0;}
.seg-chart-canvas{position:relative;height:140px;}
.seg-insight{margin:0 12px 9px;padding:7px 10px;background:var(--surface-2);border-left:3px solid var(--petronas);border-radius:0 var(--radius-xs) var(--radius-xs) 0;font-size:10.5px;line-height:1.5;color:var(--text-secondary);flex-shrink:0;}
.seg-insight strong{color:var(--text-primary);font-weight:700;}
.seg-list{flex:1;overflow-y:auto;border-top:1px solid var(--border);min-height:0;max-height:240px;}
.seg-list::-webkit-scrollbar{width:4px;}
.seg-list::-webkit-scrollbar-track{background:transparent;}
.seg-list::-webkit-scrollbar-thumb{background:var(--ink-200);border-radius:2px;}
.seg-list::-webkit-scrollbar-thumb:hover{background:var(--ink-300);}
.seg-row{display:grid;grid-template-columns:14px 1fr 78px;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--border);transition:background .1s;}
.seg-row:last-child{border-bottom:none;}
.seg-row:hover{background:var(--ink-50);}
.seg-rank{font-size:9.5px;font-weight:700;color:var(--text-muted);text-align:right;}
.seg-name-wrap{display:flex;align-items:center;gap:6px;min-width:0;}
.seg-dot{width:6px;height:6px;border-radius:2px;flex-shrink:0;}
.seg-name{font-size:11px;font-weight:600;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.seg-val-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:1px;}
.seg-val{font-size:11.5px;font-weight:700;color:var(--text-primary);text-align:right;letter-spacing:-.02em;white-space:nowrap;}
.seg-val-pct{font-size:9px;font-weight:600;color:var(--text-muted);}
.seg-delta{font-size:8.5px;font-weight:700;white-space:nowrap;text-align:right;}
.seg-delta.up{color:var(--red-dim);}
.seg-delta.down{color:var(--green-dim);}
.seg-delta.eq{color:var(--text-muted);}
.seg-empty{padding:30px 20px;text-align:center;color:var(--text-muted);font-size:12px;line-height:1.6;}

/* ── ENTRADAS: card Média Diária por dias corridos ── */
.metric-card-medias .pc-medias{margin:2px 0 6px;}
.metric-card-medias .pc-medias.pc-medias-solo{grid-template-columns:1fr;}
.metric-card-medias .pc-medias.pc-medias-solo .pc-medias-col{padding:0;align-items:flex-start;text-align:left;}
.metric-card-medias .metric-label{margin-bottom:6px;}
.metrics-grid.entradas-grid .metric-card-medias .pc-medias-val{font-size:22px;}
.metric-card-medias .pc-medias-lbl{font-size:9.5px;}
/* ══════════════════════════════════
   ABA PORTFÓLIO — MULTI-UNIDADE
   ══════════════════════════════════ */
.portfolio-wrap{padding:0;}
.portfolio-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.portfolio-toolbar-left{display:flex;align-items:center;gap:10px;}
.portfolio-count{font-size:12px;color:var(--text-muted);font-weight:500;}
.portfolio-count strong{color:var(--text-secondary);font-weight:700;}
.portfolio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:1100px){.portfolio-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:680px){.portfolio-grid{grid-template-columns:1fr;}}

/* ══════════════════════════════════════════════════════
   PORTFÓLIO — VISÃO GERAL (PRIMEIRA CAMADA) — CSS ISOLADO
   Prefixo exclusivo pf-overview-. Nenhuma regra abaixo toca
   classes globais nem a seção "Comparação entre Unidades".
   ══════════════════════════════════════════════════════ */
.pf-overview-grid{
  /* Paleta local da visualização financeira — NÃO altera o accent laranja global. */
  --pfov-blue:#2f6feb;--pfov-blue-soft:rgba(47,111,235,.10);
  --pfov-red:#e05a52;--pfov-red-soft:rgba(224,90,82,.10);
  --pfov-ink:#12161f;
  display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:stretch;margin:18px 0 4px;
}
.pf-overview-chart-panel,.pf-overview-summary-panel{
  background:var(--surface);border:1px solid var(--border);border-radius:18px;
  box-shadow:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.05);
  padding:22px 24px;min-width:0;display:flex;flex-direction:column;
}
/* Acabamento do card do gráfico — override APENAS do painel esquerdo (o painel direito
   permanece com a regra compartilhada acima, inalterado). */
.pf-overview-chart-panel{
  border-radius:24px;padding:20px 26px;
  border:1px solid rgba(213,213,208,.55);
  box-shadow:0 14px 44px rgba(18,18,20,.06),0 2px 8px rgba(18,18,20,.03);
}
.pf-overview-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;}
.pf-overview-titlewrap{display:flex;gap:13px;align-items:flex-start;min-width:0;}
.pf-overview-title-ico{flex-shrink:0;width:38px;height:38px;border-radius:11px;background:var(--surface-2);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;margin-top:2px;}
.pf-overview-title-ico svg{width:17px;height:17px;}
.pf-overview-title{font-size:26px;font-weight:700;letter-spacing:-.03em;color:var(--text-primary);line-height:1.1;margin:0;}
.pf-overview-sub{font-size:13px;color:var(--text-muted);margin:4px 0 0;line-height:1.45;max-width:46ch;}
/* Seletor em pílula: wrapper + select + caret SVG separado */
.pf-overview-pill{position:relative;flex-shrink:0;display:inline-flex;align-items:center;}
.pf-overview-pill-sel{appearance:none;-webkit-appearance:none;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:9px 34px 9px 17px;font:inherit;font-size:13px;font-weight:600;color:var(--text-secondary);cursor:pointer;box-shadow:var(--shadow-xs);outline:none;transition:border-color .15s,box-shadow .15s;}
.pf-overview-pill-sel:hover{border-color:var(--text-muted);}
.pf-overview-pill-sel:focus{border-color:var(--carbon);box-shadow:0 0 0 3px rgba(18,18,20,.08);}
.pf-overview-pill-caret{position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text-muted);}
/* Legenda — acima do gráfico */
.pf-overview-legend{display:flex;gap:18px;margin:12px 0 2px;font-size:12px;font-weight:600;color:var(--text-secondary);}
.pf-overview-legend span{display:inline-flex;align-items:center;gap:7px;}
.pf-overview-sw{width:9px;height:9px;border-radius:999px;display:inline-block;}
/* Área do gráfico + trilhos e marcadores */
.pf-overview-plot{position:relative;flex:1;margin-top:8px;min-height:168px;}
.pf-overview-svg{width:100%;height:100%;display:block;overflow:visible;}
.pf-overview-track{stroke:#EAE9E4;stroke-width:3;stroke-linecap:round;transition:stroke .15s;}
.pf-overview-track.empty{stroke:#F0EFEB;}
.pf-overview-dot{transition:transform .15s;transform-box:fill-box;transform-origin:center;}
.pf-overview-col{cursor:pointer;}
.pf-overview-col:hover .pf-overview-track{stroke:#DEDDD7;}
.pf-overview-col:hover .pf-overview-dot{transform:scale(1.18);}
.pf-overview-col:focus-visible{outline:2px solid var(--carbon);outline-offset:2px;}
.pf-overview-mlab{font-size:10px;font-weight:700;letter-spacing:.01em;font-family:inherit;pointer-events:none;}
/* Tooltip HTML sobreposto ao SVG */
